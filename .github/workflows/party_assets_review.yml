name: Party Asset Review Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/party-asset-layer-v1
    paths:
      - "configs/reference/party_assets_v1.csv"
      - "process/party_assets*.py"
      - "tests/test_party_assets*.py"
      - ".github/workflows/party_assets_review.yml"

concurrency:
  group: party-assets-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate party asset layer
        run: >-
          python -m unittest
          tests.test_party_assets
          tests.test_party_assets_build
          tests.test_party_assets_fetch
          tests.test_party_assets_upload
          -v

      - name: Fetch direct authoritative source assets
        id: fetch
        continue-on-error: true
        run: >-
          python process/party_assets_fetch.py
          --staging-root generated_party_asset_review/sources
          --allow-unresolved
          --output generated_party_asset_review/fetch_report.json

      - name: Build normalized assets and contact sheet
        id: build
        if: always()
        continue-on-error: true
        run: >-
          python process/party_assets_build.py
          --source-root generated_party_asset_review/sources
          --output-root generated_party_asset_review/build

      - name: Summarize review status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          fetch_path = Path("generated_party_asset_review/fetch_report.json")
          if fetch_path.is_file():
              fetch = json.loads(fetch_path.read_text(encoding="utf-8"))
              print(f"Fetched: {fetch.get('fetched_count', 0)}")
              print(f"Fallbacks: {fetch.get('fallback_count', 0)}")
              print("Unresolved:", ", ".join(fetch.get("unresolved_parties", [])) or "none")
              for error in fetch.get("errors", []):
                  print("Fetch error:", error)
          else:
              print("Fetch report missing")

          manifest_path = Path("generated_party_asset_review/build/manifest.json")
          if manifest_path.is_file():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              built = [e["party_key"] for e in manifest.get("entries", []) if e.get("build_status") == "built"]
              print("Built:", ", ".join(built) or "none")
              for error in manifest.get("errors", []):
                  print("Build error:", error)
          else:
              print("Build manifest missing")
          PY

      - name: Package review output
        if: always()
        run: |
          test -f generated_party_asset_review/fetch_report.json
          test -f generated_party_asset_review/build/manifest.json
          test -f generated_party_asset_review/build/contact_sheet.png
          tar -czf party-asset-review.tar.gz generated_party_asset_review
          cp generated_party_asset_review/build/contact_sheet.png party-asset-contact-sheet.png

      - name: Upload packaged review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: party-asset-review-package
          path: party-asset-review.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: party-asset-contact-sheet
          path: party-asset-contact-sheet.png
          if-no-files-found: error
          retention-days: 14

      - name: Fail if fetch or build is incomplete
        if: steps.fetch.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
