name: Party Asset Review Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/party-asset-layer-v1
    paths:
      - "configs/reference/party_assets_v1.csv"
      - "process/party_assets*.py"
      - "tests/test_party_assets*.py"
      - ".github/workflows/party_assets_review.yml"

concurrency:
  group: party-assets-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate party asset layer
        run: >-
          python -m unittest
          tests.test_party_assets
          tests.test_party_assets_build
          tests.test_party_assets_fetch
          tests.test_party_assets_upload
          -v

      - name: Fetch direct authoritative source assets
        id: fetch
        continue-on-error: true
        run: >-
          python process/party_assets_fetch.py
          --staging-root generated_party_asset_review/sources
          --allow-unresolved
          --output generated_party_asset_review/fetch_report.json

      - name: Build normalized assets and contact sheet
        id: build
        if: always()
        continue-on-error: true
        run: >-
          python process/party_assets_build.py
          --source-root generated_party_asset_review/sources
          --output-root generated_party_asset_review/build

      - name: Write review inventory
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("generated_party_asset_review")
          root.mkdir(parents=True, exist_ok=True)
          files = sorted(str(path.relative_to(root)) for path in root.rglob("*") if path.is_file())
          inventory = {
              "fetch_step_outcome": "${{ steps.fetch.outcome }}",
              "build_step_outcome": "${{ steps.build.outcome }}",
              "files": files,
          }
          (root / "review_inventory.json").write_text(
              json.dumps(inventory, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(inventory, indent=2))
          PY

      - name: Package review output
        if: always()
        run: tar -czf party-asset-review.tar.gz generated_party_asset_review

      - name: Upload packaged review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: party-asset-review-package
          path: party-asset-review.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Fail if fetch or build is incomplete
        if: steps.fetch.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
