name: Unified Speech Issue Classifier (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classify-political-issues
  cancel-in-progress: false

jobs:
  luna-recent-100:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'openai>=3.6.0,<4'
      - name: Run core tests
        run: python -m unittest tests.test_oireachtas_speech_issue_classifier -v
      - name: Run 100 recent-speech Luna classifications
        id: sample
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m process.oireachtas_speech_issue_luna_sample \
            --count 100 \
            --cutoff 2026-02-26 \
            --model gpt-5.6-luna \
            --reasoning-effort low \
            --verbosity low \
            --bucket "${S3_BUCKET}" \
            --region "${AWS_REGION}" \
            --report-path speech_issue_luna_sample_100.json
      - name: Build category summary and persist
        if: always()
        run: |
          if [[ -f speech_issue_luna_sample_100.json ]]; then
            python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p = Path('speech_issue_luna_sample_100.json')
          doc = json.loads(p.read_text(encoding='utf-8'))
          counts = Counter(row['issue_label'] for row in doc.get('results', []))
          doc['category_counts'] = dict(sorted(counts.items()))
          doc['none_count'] = counts.get('NONE', 0)
          doc['none_pct'] = round(counts.get('NONE', 0) / max(1, len(doc.get('results', []))) * 100, 1)
          p.write_text(json.dumps(doc, indent=2, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          PY
            mkdir -p diagnostics/speech_classifier
            cp speech_issue_luna_sample_100.json diagnostics/speech_classifier/latest_luna_sample_100.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/speech_classifier/latest_luna_sample_100.json
            git commit -m "Record 100-speech Luna sample" || true
            git push
          fi
      - name: Upload sample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-recent-100-${{ github.run_id }}
          path: speech_issue_luna_sample_100.json
          if-no-files-found: warn
          retention-days: 180
