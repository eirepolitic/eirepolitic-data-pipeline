name: Unified Speech Issue Classifier (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classify-political-issues
  cancel-in-progress: false

jobs:
  guided-luna-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'openai>=3.6.0,<4'
      - name: Run classifier unit tests
        run: |
          set -euo pipefail
          python -m unittest tests.test_oireachtas_speech_issue_classifier tests.test_oireachtas_speech_classifier_wiring -v
      - name: Run guided Luna benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -f diagnostics/speech_classifier/latest_luna_benchmark.json
          python -m process.oireachtas_speech_issue_luna_prompt_benchmark \
            --baseline-report diagnostics/speech_classifier/latest_luna_benchmark.json \
            --model gpt-5.6-luna \
            --bucket "${S3_BUCKET}" \
            --region "${AWS_REGION}" \
            --report-path speech_issue_luna_prompt_benchmark.json
      - name: Persist benchmark
        if: always()
        run: |
          mkdir -p diagnostics/speech_classifier
          cp speech_issue_luna_prompt_benchmark.json diagnostics/speech_classifier/latest_luna_prompt_benchmark.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/speech_classifier/latest_luna_prompt_benchmark.json
          git commit -m "Record guided Luna benchmark" || true
          git push
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-luna-benchmark-${{ github.run_id }}
          path: speech_issue_luna_prompt_benchmark.json
          if-no-files-found: warn
          retention-days: 180
