name: Unified Speech Issue Classifier (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract compact benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('diagnostics/speech_classifier/latest_bulk_cost_1000.json')
          doc = json.loads(src.read_text(encoding='utf-8'))
          keys = [
              'mode','model','reasoning_effort','cutoff_exclusive','concurrency','writes_performed',
              'pending_total_all_dates','pending_recent_after_cutoff','sample_requested','sample_attempted',
              'sample_succeeded','sample_failed','success_pct','wall_seconds','throughput_speeches_per_minute',
              'latency_seconds','attempt_counts','usage','pricing_usd_per_million_tokens',
              'estimated_sample_cost_usd','estimated_cost_per_1000_speeches_usd',
              'estimated_remaining_recent_cost_usd_at_sample_rate','estimated_all_pending_cost_usd_at_sample_rate',
              'average_tokens_per_speech','category_counts','none_count','none_pct','failures'
          ]
          compact = {key: doc.get(key) for key in keys}
          out = Path('diagnostics/speech_classifier/latest_bulk_cost_1000_compact.json')
          out.write_text(json.dumps(compact, indent=2, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(compact, indent=2, ensure_ascii=False, sort_keys=True))
          PY
      - name: Commit compact summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/speech_classifier/latest_bulk_cost_1000_compact.json
          git commit -m "Add compact 1000-speech benchmark summary" || true
          git push
