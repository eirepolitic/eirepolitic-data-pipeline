name: Unified Speech Issue Classifier (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classify-political-issues
  cancel-in-progress: false

jobs:
  production-rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
      OIREACHTAS_BATCH_ID: speech-classifier-backfill-2026-08-31
      OIREACHTAS_PUBLISH_LATEST: 'true'
      OIREACHTAS_PUBLISH_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'openai>=3.6.0,<4'

      - name: Run classifier unit tests
        run: |
          set -euo pipefail
          python -m unittest tests.test_oireachtas_speech_issue_classifier -v

      - name: Detect existing resumable candidate checkpoint
        id: candidate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import boto3
          from botocore.exceptions import ClientError
          from extract.oireachtas.batch import batch_key_for_production_key
          from process.oireachtas_speech_issue_classifier import ENRICHMENT_CSV_KEY
          batch_id = 'speech-classifier-backfill-2026-08-31'
          key = batch_key_for_production_key(ENRICHMENT_CSV_KEY, batch_id)
          s3 = boto3.client('s3', region_name='ca-central-1')
          exists = False
          try:
              s3.head_object(Bucket='eirepolitic-data', Key=key)
              exists = True
          except ClientError as exc:
              if str(exc.response.get('Error', {}).get('Code', '')) not in {'404', 'NoSuchKey', 'NotFound'}:
                  raise
          print(f'checkpoint_exists={str(exists).lower()}')
          print(f'checkpoint_key={key}')
          PY

      - name: Seed candidate from current production
        if: steps.candidate.outputs.checkpoint_exists != 'true'
        run: |
          set -euo pipefail
          OIREACHTAS_PUBLISH_LATEST=false python process/oireachtas_seed_candidate.py \
            --batch-id "${OIREACHTAS_BATCH_ID}" \
            --bucket "${S3_BUCKET}" \
            --region "${AWS_REGION}" \
            | tee speech_classifier_seed.json

      - name: Run resumable full classifier
        run: |
          set -euo pipefail
          success=false
          for pass in 1 2 3 4; do
            echo "=== classifier pass ${pass} ==="
            if python -m process.oireachtas_speech_issue_backfill \
              --model "${OPENAI_MODEL}" \
              --concurrency 4 \
              --checkpoint-every 250 \
              --bucket "${S3_BUCKET}" \
              --region "${AWS_REGION}" \
              --report-path speech_issue_backfill_report.json; then
              success=true
              break
            fi
            echo "Pass ${pass} left failed rows; retrying from checkpoint."
          done
          if [[ "$success" != true ]]; then
            echo 'Classifier did not reach a complete candidate after four resumable passes.' >&2
            exit 1
          fi

      - name: Validate complete speech issue candidate
        run: |
          set -euo pipefail
          python -m process.oireachtas_speech_issue_validate_candidate \
            --bucket "${S3_BUCKET}" \
            --region "${AWS_REGION}" \
            --report-path speech_issue_candidate_validation.json

      - name: Assemble validated candidate manifest
        run: |
          set -euo pipefail
          OIREACHTAS_PUBLISH_LATEST=false python process/oireachtas_batch_control.py \
            --bucket "${S3_BUCKET}" \
            --region "${AWS_REGION}" \
            assemble \
            --batch-id "${OIREACHTAS_BATCH_ID}" \
            --required-table enrichment_speech_issue_labels \
            | tee speech_issue_batch_manifest.json

      - name: Promote candidate to production
        run: |
          set -euo pipefail
          OIREACHTAS_PUBLISH_ENABLED=true OIREACHTAS_PUBLISH_LATEST=true \
            python process/oireachtas_batch_control.py \
              --bucket "${S3_BUCKET}" \
              --region "${AWS_REGION}" \
              promote \
              --batch-id "${OIREACHTAS_BATCH_ID}" \
              | tee speech_issue_promotion.json

      - name: Verify production pointer and production enrichment
        run: |
          set -euo pipefail
          env -u OIREACHTAS_BATCH_ID -u OIREACHTAS_PUBLISH_LATEST -u OIREACHTAS_PUBLISH_ENABLED \
            python - <<'PY'
          import json
          import boto3
          from process.oireachtas_speech_issue_classifier import ENRICHMENT_CSV_KEY, SILVER_SPEECHES_KEY, read_s3_csv
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY
          s3 = boto3.client('s3', region_name='ca-central-1')
          pointer = json.loads(s3.get_object(Bucket='eirepolitic-data', Key=PRODUCTION_POINTER_KEY)['Body'].read())
          assert pointer['batch_id'] == 'speech-classifier-backfill-2026-08-31', pointer
          silver = read_s3_csv(s3, bucket='eirepolitic-data', key=SILVER_SPEECHES_KEY)
          enrich = read_s3_csv(s3, bucket='eirepolitic-data', key=ENRICHMENT_CSV_KEY)
          assert len(silver) == len(enrich), (len(silver), len(enrich))
          assert not enrich['classification_status'].isin(['pending','failed']).any()
          assert enrich['issue_label'].astype(str).str.strip().ne('').all()
          print(json.dumps({
              'production_batch_id': pointer['batch_id'],
              'silver_rows': len(silver),
              'enrichment_rows': len(enrich),
              'max_debate_date': str(enrich['debate_date'].max()),
              'status': 'pass',
          }, indent=2))
          PY

      - name: Persist rollout evidence
        if: always()
        run: |
          mkdir -p diagnostics/speech_classifier/production_rollout
          for file in speech_classifier_seed.json speech_issue_backfill_report.json speech_issue_candidate_validation.json speech_issue_batch_manifest.json speech_issue_promotion.json; do
            [[ -f "$file" ]] && cp "$file" diagnostics/speech_classifier/production_rollout/"$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/speech_classifier/production_rollout
          git commit -m "Record production speech classifier rollout" || true
          git push || true

      - name: Upload rollout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speech-classifier-production-rollout-${{ github.run_id }}
          path: |
            speech_classifier_seed.json
            speech_issue_backfill_report.json
            speech_issue_candidate_validation.json
            speech_issue_batch_manifest.json
            speech_issue_promotion.json
          if-no-files-found: warn
          retention-days: 365
