name: Unified Speech Issue Classifier (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classify-political-issues
  cancel-in-progress: false

jobs:
  luna-bulk-cost-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'openai>=3.6.0,<4'
      - name: Run core classifier tests
        run: |
          set -euo pipefail
          python -m unittest tests.test_oireachtas_speech_issue_classifier -v
      - name: Run 1000-speech Luna cost benchmark
        id: benchmark
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          python -m process.oireachtas_speech_issue_bulk_cost_sample \
            --count 1000 \
            --cutoff 2026-02-26 \
            --model gpt-5.6-luna \
            --concurrency 8 \
            --bucket "${S3_BUCKET}" \
            --region "${AWS_REGION}" \
            --report-path speech_issue_bulk_cost_sample.json \
            2>&1 | tee speech_issue_bulk_cost_console.log
      - name: Persist benchmark evidence
        if: always()
        run: |
          if [[ -f speech_issue_bulk_cost_sample.json ]]; then
            mkdir -p diagnostics/speech_classifier
            cp speech_issue_bulk_cost_sample.json diagnostics/speech_classifier/latest_bulk_cost_1000.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/speech_classifier/latest_bulk_cost_1000.json
            git commit -m "Record 1000-speech Luna bulk cost benchmark" || true
            git push
          fi
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-bulk-cost-1000-${{ github.run_id }}
          path: |
            speech_issue_bulk_cost_sample.json
            speech_issue_bulk_cost_console.log
          if-no-files-found: warn
          retention-days: 180
      - name: Fail if benchmark failed
        if: steps.benchmark.outcome == 'failure'
        run: exit 1
