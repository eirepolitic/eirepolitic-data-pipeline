name: Seed completed polling post 2026-09-06

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: completed-post-archive-eirepolitic-data-pipeline
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUCKET: eirepolitic-data
      PREFIX: instagram/completed-posts/eirepolitic-data-pipeline
      POST_ID: 2026-09-06-ipi-polling-carousel
    steps:
      - name: Check out archive tooling and summary
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
      - name: Check out approved preview assets
        uses: actions/checkout@v4
        with:
          ref: previews/ipi-polling-factory
          path: asset-source
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Prepare archive bundle
        shell: bash
        run: |
          set -euo pipefail
          python tooling/tools/completed_post_archive.py prepare \
            --source-dir asset-source \
            --summary tooling/completed_posts/summaries/2026-09-06-ipi-polling-carousel.json \
            --out-dir archive-bundle \
            --repo Eirepolitic-data-pipeline \
            --post-id "$POST_ID"
      - name: Inspect existing completed archive
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if aws s3 cp "s3://$BUCKET/$PREFIX/$POST_ID/provenance.json" existing-provenance.json --only-show-errors; then
            aws s3 cp "s3://$BUCKET/$PREFIX/$POST_ID/agent-summary.json" existing-summary.json --only-show-errors
            python - <<'PY'
          import json
          expected=json.load(open('archive-bundle/agent-summary.json', encoding='utf-8'))
          existing=json.load(open('existing-summary.json', encoding='utf-8'))
          assert existing == expected, 'completed archive exists with different agent summary'
          print('matching completed archive found; catalog repair is allowed')
          PY
            echo "completed=true" >> "$GITHUB_OUTPUT"
          else
            echo "completed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload recoverable archive content
        if: ${{ steps.existing.outputs.completed != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp archive-bundle "s3://$BUCKET/$PREFIX/$POST_ID/" --recursive --exclude provenance.json --only-show-errors
      - name: Update archive index idempotently
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "s3://$BUCKET/$PREFIX/index.json" index.json --only-show-errors || printf '{"schema_version":1,"posts":[]}\n' > index.json
          python tooling/tools/completed_post_archive.py update-index \
            --index index.json \
            --summary archive-bundle/agent-summary.json \
            --s3-uri "s3://$BUCKET/$PREFIX/$POST_ID/"
          aws s3 cp index.json "s3://$BUCKET/$PREFIX/index.json" --only-show-errors
      - name: Write completion marker
        if: ${{ steps.existing.outputs.completed != 'true' }}
        shell: bash
        run: aws s3 cp archive-bundle/provenance.json "s3://$BUCKET/$PREFIX/$POST_ID/provenance.json" --only-show-errors
      - name: Verify archive and catalog
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "s3://$BUCKET/$PREFIX/$POST_ID/provenance.json" verify-provenance.json --only-show-errors
          aws s3 cp "s3://$BUCKET/$PREFIX/index.json" verify-index.json --only-show-errors
          python - <<'PY'
          import json
          data=json.load(open('verify-index.json', encoding='utf-8'))
          assert any(x['post_id']=='2026-09-06-ipi-polling-carousel' for x in data['posts'])
          print('archive and catalog verified')
          PY
