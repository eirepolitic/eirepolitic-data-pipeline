name: Publish Reviewed Party Assets v1 Once

on:
  workflow_dispatch:

concurrency:
  group: party-assets-v1-publish-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: eirepolitic-data
      PARTY_ASSET_PREFIX: processed/reference/party_assets/v1

    steps:
      - name: Check out reviewed feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/party-asset-layer-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate registry and upload safeguards
        run: >-
          python -m unittest
          tests.test_party_assets
          tests.test_party_assets_upload
          -v

      - name: Build reviewed 11-party bundle
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p review/party_assets_v1/publish_diagnostics
          python -m process.party_assets_finalize --output-root generated_party_assets_v1 \
            2>&1 | tee review/party_assets_v1/publish_diagnostics/latest_build.log

      - name: Persist build diagnostics on failure
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/party_assets_v1/publish_diagnostics/latest_build.log
          if ! git diff --cached --quiet; then
            git commit -m "Record party asset publish build diagnostic [skip ci]"
            git push origin HEAD:feature/party-asset-layer-v1
          fi
          exit 1

      - name: Verify build before S3
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('generated_party_assets_v1')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['success'] is True
          assert manifest['party_count'] == 11
          for p in manifest['parties']:
              d = root / 'assets' / p['party_key']
              source = root / p['source_file']
              assert source.is_file() and source.stat().st_size > 0, source
              for name in ('logo.png', 'logo_clean.png', 'display_square.png'):
                  f = d / name
                  assert f.is_file() and f.stat().st_size > 0, f
          for name in ('manifest.json','party_assets.csv','party_assets.parquet','contact_sheet.png','contact_sheet_green.png'):
              f = root / name
              assert f.is_file() and f.stat().st_size > 0, f
          print('build verified')
          PY

      - name: Dry-run immutable v1 upload
        if: steps.build.outcome == 'success'
        run: >-
          python process/party_assets_upload.py
          --build-root generated_party_assets_v1
          --bucket "${S3_BUCKET}"
          --prefix "${PARTY_ASSET_PREFIX}"
          > generated_party_assets_v1/upload_dry_run.json

      - name: Upload immutable v1 bundle
        if: steps.build.outcome == 'success'
        run: >-
          python process/party_assets_upload.py
          --build-root generated_party_assets_v1
          --bucket "${S3_BUCKET}"
          --prefix "${PARTY_ASSET_PREFIX}"
          --apply
          > generated_party_assets_v1/upload_applied.json

      - name: Verify uploaded objects by known key
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import boto3
          root = Path('generated_party_assets_v1')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          bucket = os.environ['S3_BUCKET']
          prefix = os.environ['PARTY_ASSET_PREFIX'].rstrip('/')
          s3 = boto3.client('s3', region_name=os.getenv('AWS_REGION', 'ca-central-1'))
          keys = [
              f'{prefix}/manifest.json',
              f'{prefix}/party_assets.csv',
              f'{prefix}/party_assets.parquet',
              f'{prefix}/contact_sheet.png',
              f'{prefix}/contact_sheet_green.png',
          ]
          for p in manifest['parties']:
              key = p['party_key']
              keys.extend([
                  f'{prefix}/assets/{key}/logo.png',
                  f'{prefix}/assets/{key}/logo_clean.png',
                  f'{prefix}/assets/{key}/display_square.png',
              ])
          verified = []
          for key in keys:
              head = s3.head_object(Bucket=bucket, Key=key)
              assert head['ContentLength'] > 0, key
              verified.append({'key': key, 'bytes': head['ContentLength'], 'etag': head.get('ETag')})
          report = {'bucket': bucket, 'prefix': prefix, 'verified_count': len(verified), 'objects': verified}
          (root / 'upload_verification.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Upload publication artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: party-assets-v1-publication
          path: |
            generated_party_assets_v1/
            review/party_assets_v1/publish_diagnostics/latest_build.log
          if-no-files-found: warn
          retention-days: 14
