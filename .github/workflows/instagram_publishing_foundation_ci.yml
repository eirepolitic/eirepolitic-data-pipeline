name: Instagram publishing foundation CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'publishing/**'
      - 'infra/publishing/**'
      - 'instagram/factory/publication_handoff.py'
      - 'instagram/factory/render_pipeline.py'
      - 'instagram/caption_templates/**'
      - 'tests/test_instagram_*.py'
      - '.github/workflows/instagram_publish_standard.yml'
      - '.github/workflows/instagram_publishing_foundation_ci.yml'
      - '.github/workflows/deploy_instagram_publisher_lambda.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest boto3 pyyaml pillow cfn-lint

      - name: Compile publishing code and Instagram tests
        run: python -m compileall publishing instagram/factory/publication_handoff.py instagram/factory/render_pipeline.py tests/test_instagram_*.py

      - name: Validate publishing CloudFormation
        run: cfn-lint infra/publishing/*.yml

      - name: Validate caption templates
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('instagram/caption_templates').glob('*.yml'):
              with path.open(encoding='utf-8') as handle:
                  value = yaml.safe_load(handle)
              assert isinstance(value, dict), path
              print(f'validated {path}')
          PY

      - name: Run all Instagram publication tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set +e
          python -m pytest tests/test_instagram_*.py -vv --tb=long --junitxml=pytest-results.xml 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Surface first pytest failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          message = None
          report = Path('pytest-results.xml')
          if report.exists():
              try:
                  root = ET.parse(report).getroot()
                  for case in root.iter('testcase'):
                      problem = case.find('failure') or case.find('error')
                      if problem is not None:
                          node = f"{case.get('classname', '')}::{case.get('name', '')}".strip(':')
                          detail = problem.get('message') or (problem.text or '').strip()
                          message = f"{node}: {detail}" if node else detail
                          break
              except ET.ParseError as exc:
                  message = f"Could not parse pytest-results.xml: {exc}"
          if not message:
              output = Path('pytest-output.txt')
              if output.exists():
                  lines = [line.strip() for line in output.read_text(encoding='utf-8', errors='replace').splitlines() if line.strip()]
                  message = ' | '.join(lines[-12:])
          if not message:
              message = 'Pytest failed without a readable diagnostic.'
          message = message[:3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Instagram publishing pytest failure::{message}')
          PY
