name: Instagram publishing foundation CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'publishing/**'
      - 'infra/publishing/**'
      - 'instagram/caption_templates/**'
      - 'tests/test_instagram_publishing_*.py'
      - 'tests/test_instagram_publication_*.py'
      - 'tests/test_instagram_dynamodb_*.py'
      - '.github/workflows/instagram_publishing_foundation_ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile publication package and tests
        run: python -m compileall publishing tests/test_instagram_publishing_foundation.py tests/test_instagram_publication_control.py tests/test_instagram_dynamodb_ledger.py

      - name: Validate caption templates
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path('instagram/caption_templates').glob('*.yml'):
              with path.open(encoding='utf-8') as handle:
                  value = yaml.safe_load(handle)
              assert isinstance(value, dict), path
              print(f'validated {path}')
          PY

      - name: Run publication tests
        run: python -m pytest tests/test_instagram_publishing_foundation.py tests/test_instagram_publication_control.py tests/test_instagram_dynamodb_ledger.py -q
