name: Bill content snapshot

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Bills per proposed Instagram carousel"
        required: false
        default: "6"

permissions:
  contents: read

concurrency:
  group: bill-content-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run focused tests
        run: |
          python -m unittest tests.political_metrics.test_bill_content_snapshot

      - name: Build read-only Bill content snapshot
        run: |
          python process/build_bill_content_snapshot.py \
            --batch-size "${{ inputs.batch_size || '6' }}" \
            --output-dir artifacts/bill-content-snapshot

      - name: Add series plan to workflow summary
        run: cat artifacts/bill-content-snapshot/series_plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshot package
        uses: actions/upload-artifact@v4
        with:
          name: bill-content-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/bill-content-snapshot/
          if-no-files-found: error
          retention-days: 90
