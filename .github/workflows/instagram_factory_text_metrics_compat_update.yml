name: Fix text metrics compatibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-content-factory-party-project
          fetch-depth: 0
      - name: Update validator field names
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path("instagram/factory/generic_tests.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("element_metrics=result.element_metrics", "text_metrics=result.text_metrics")
          text = text.replace('"element_metrics": result.element_metrics', '"text_metrics": result.text_metrics')
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/factory/generic_tests.py
          git commit -m "fix(instagram): align validator with text metrics contract"
          git push origin HEAD:feature/instagram-content-factory-party-project
