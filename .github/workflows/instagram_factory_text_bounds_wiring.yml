name: Wire measured text bounds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-content-factory-party-project
          fetch-depth: 0
      - name: Update generic validator and tests
        shell: python
        run: |
          from pathlib import Path

          path = Path("instagram/factory/generic_tests.py")
          text = path.read_text(encoding="utf-8")
          old = '''            layout_quality = validate_slide_layout(
                template=layout,
                bindings=bindings,
                output_path=output_path,
            )
'''
          new = '''            layout_quality = validate_slide_layout(
                template=layout,
                bindings=bindings,
                output_path=output_path,
                element_metrics=result.element_metrics,
            )
'''
          if old not in text:
              raise SystemExit("layout quality call marker not found")
          text = text.replace(old, new, 1)

          old = '''                "warnings": [],
                "layout_quality": layout_quality,
                "visual_quality": visual_quality,
'''
          new = '''                "warnings": [],
                "element_metrics": result.element_metrics,
                "layout_quality": layout_quality,
                "visual_quality": visual_quality,
'''
          if old not in text:
              raise SystemExit("rendered slide marker not found")
          text = text.replace(old, new, 1)

          old = '''            "visual_plot_utilization": True,
            "historical_real_data_fallback": True,
'''
          new = '''            "visual_plot_utilization": True,
            "direct_text_bounds": True,
            "dynamic_label_sizing": True,
            "historical_real_data_fallback": True,
'''
          if old not in text:
              raise SystemExit("quality gate marker not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          for test_path in (
              Path("tests/test_instagram_factory_party_project.py"),
              Path("tests/test_instagram_factory_constituency_project.py"),
          ):
              test = test_path.read_text(encoding="utf-8")
              marker = '                        self.assertTrue(slide["layout_quality"]["success"])\n'
              addition = '''                        self.assertTrue(slide["layout_quality"]["success"])
                        for text_metric in slide["layout_quality"].get("text", []):
                            self.assertFalse(text_metric["clipped"])
                            self.assertFalse(text_metric["truncated"])
                            self.assertGreaterEqual(text_metric["final_font_size"], 42)
'''
              if marker in test and addition not in test:
                  test = test.replace(marker, addition, 1)
              visual_marker = '                            self.assertLessEqual(quality["metrics"]["max_value_label_x_ratio"], 0.93)\n'
              visual_addition = '''                            self.assertLessEqual(quality["metrics"]["max_value_label_x_ratio"], 0.98)
                            self.assertEqual(quality["metrics"]["category_text_clipped_count"], 0)
                            self.assertEqual(quality["metrics"]["value_text_clipped_count"], 0)
                            self.assertEqual(quality["metrics"]["truncated_label_count"], 0)
'''
              if visual_marker in test:
                  test = test.replace(visual_marker, visual_addition, 1)
              test_path.write_text(test, encoding="utf-8")
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/factory/generic_tests.py tests/test_instagram_factory_party_project.py tests/test_instagram_factory_constituency_project.py
          git commit -m "feat(instagram): enforce measured text bounds in validation"
          git push origin HEAD:feature/instagram-content-factory-party-project
