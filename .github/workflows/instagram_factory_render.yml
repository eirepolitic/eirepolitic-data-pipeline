name: Instagram factory render (generic)
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_ID: bill_tracker_factory_v1
      PERIOD_INPUT: post1
      PREVIEW_SLUG: bill-tracker-production-post1-diagnostic
      FACTORY_REF: 386b933
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas pyyaml pillow boto3 matplotlib
      - name: Prepare factory
        run: |
          set -euo pipefail
          git fetch origin feature/instagram-monthly-post-framework
          git worktree add /tmp/factory "$FACTORY_REF"
          cp -R "instagram/projects/${PROJECT_ID}" /tmp/factory/instagram/projects/
          cp instagram/factory/contract.py instagram/factory/normalize.py instagram/factory/qa.py instagram/factory/review_page.py instagram/factory/publication_handoff.py instagram/factory/render_pipeline.py /tmp/factory/instagram/factory/
      - name: Render and capture diagnostic
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          cd /tmp/factory
          python - <<'PY'
          import json, os, sys, traceback
          from pathlib import Path
          sys.path.insert(0, os.getcwd())
          ws=Path(os.environ['GITHUB_WORKSPACE'])
          rd=ws/'factory_web_review'; rd.mkdir(parents=True, exist_ok=True)
          status={'run_id':os.environ['GITHUB_RUN_ID'],'project_id':os.environ['PROJECT_ID'],'period':os.environ['PERIOD_INPUT']}
          try:
              from instagram.factory.render_pipeline import run_and_normalize
              from instagram.factory.review_page import build_review_html, stage_review_assets
              r=run_and_normalize(os.environ['PROJECT_ID'],period=os.environ['PERIOD_INPUT'],output_root=ws/'generated_render')
              status.update({'ok':True,'source_batch_id':r.source_batch_id,'slide_count':len(r.slides),'qa_all_passed':r.qa.all_passed,'qa_checks':[{'name':c.name,'passed':c.passed,'detail':c.detail} for c in r.qa.checks]})
              s=stage_review_assets(r,rd)
              (rd/'index.html').write_text(build_review_html(s,project_label='Bill Tracker Factory V1 · Post 1 diagnostic'),encoding='utf-8')
          except Exception as exc:
              status.update({'ok':False,'error':repr(exc),'traceback':traceback.format_exc()})
              (rd/'index.html').write_text('<html><body><h1>Bill Tracker render diagnostic</h1><pre>'+status['traceback'].replace('&','&amp;').replace('<','&lt;').replace('>','&gt;')+'</pre></body></html>',encoding='utf-8')
          (rd/'render_summary.json').write_text(json.dumps(status,indent=2,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Publish hosted diagnostic
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          cd factory_web_review
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "preview: ${PREVIEW_SLUG} ${GITHUB_RUN_ID}"
          git branch -M "previews/${PREVIEW_SLUG}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:refs/heads/previews/${PREVIEW_SLUG}"
