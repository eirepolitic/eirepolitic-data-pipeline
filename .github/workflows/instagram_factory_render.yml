name: Instagram factory render (generic)
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_ID: bill_tracker_factory_v1
      PERIOD_INPUT: post1
      PREVIEW_SLUG: bill-tracker-production-post1
      FACTORY_REF: 386b933
      SESSION_ID: 2026-09-27-bill-tracker-finalisation
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas pyyaml pillow boto3 matplotlib
      - name: Prepare factory
        run: |
          set -euo pipefail
          git fetch origin feature/instagram-monthly-post-framework
          git worktree add /tmp/factory "$FACTORY_REF"
          cp -R "instagram/projects/${PROJECT_ID}" /tmp/factory/instagram/projects/
          cp instagram/factory/contract.py instagram/factory/normalize.py instagram/factory/qa.py instagram/factory/review_page.py instagram/factory/publication_handoff.py instagram/factory/render_pipeline.py /tmp/factory/instagram/factory/
      - name: Render and stage review
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          cd /tmp/factory
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, os.getcwd())
          from instagram.factory.render_pipeline import run_and_normalize
          from instagram.factory.review_page import build_review_html, stage_review_assets
          ws=Path(os.environ['GITHUB_WORKSPACE'])
          r=run_and_normalize(os.environ['PROJECT_ID'],period=os.environ['PERIOD_INPUT'],output_root=ws/'generated_render')
          if not r.qa.all_passed: raise SystemExit(1)
          rd=ws/'factory_web_review'; s=stage_review_assets(r,rd)
          (rd/'index.html').write_text(build_review_html(s,project_label='Bill Tracker Factory V1 · Post 1'),encoding='utf-8')
          (rd/'render_summary.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'project_id':r.project_id,'period':r.period_key,'source_batch_id':r.source_batch_id,'slide_count':len(r.slides),'qa_all_passed':r.qa.all_passed,'qa_checks':[{'name':c.name,'passed':c.passed,'detail':c.detail} for c in r.qa.checks]},indent=2),encoding='utf-8')
          PY
      - name: Publish hosted review
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          cd factory_web_review
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "preview: ${PREVIEW_SLUG} ${GITHUB_RUN_ID}"
          git branch -M "previews/${PREVIEW_SLUG}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:refs/heads/previews/${PREVIEW_SLUG}"
      - name: Record Director run
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          URL="https://raw.githack.com/${GITHUB_REPOSITORY}/previews/${PREVIEW_SLUG}/index.html"
          RECORD=$(python - <<PY
          import json
          print(json.dumps({'run_id':'${GITHUB_RUN_ID}','review_url':'$URL','commit':'${GITHUB_SHA}','period':'${PERIOD_INPUT}','approval_state':'pending_human_review'}))
          PY
          )
          B64=$(printf '%s' "$RECORD" | base64 -w0)
          curl -fsS -X PUT -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/director/sessions/${SESSION_ID}/runs/${GITHUB_RUN_ID}.json" -d "{\"message\":\"Record render ${GITHUB_RUN_ID}\",\"content\":\"${B64}\",\"branch\":\"sly/session/${SESSION_ID}\"}"
      - uses: actions/upload-artifact@v4
        with: {name: 'bill-tracker-post1-${{ github.run_id }}', path: generated_render/, retention-days: 30}
