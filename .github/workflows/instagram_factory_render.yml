name: Instagram factory render (generic)
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_ID: bill_tracker_factory_v1
      PERIOD_INPUT: post2
      PREVIEW_SLUG: bill-tracker-publication-post2
      FACTORY_REF: 386b933
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml pillow boto3 matplotlib
      - name: Prepare approved factory worktree
        run: |
          set -euo pipefail
          git fetch origin feature/instagram-monthly-post-framework
          git worktree add /tmp/approved-instagram-factory "$FACTORY_REF"
          cp -R "instagram/projects/${PROJECT_ID}" /tmp/approved-instagram-factory/instagram/projects/
          cp instagram/factory/contract.py instagram/factory/normalize.py instagram/factory/qa.py instagram/factory/review_page.py instagram/factory/publication_handoff.py instagram/factory/render_pipeline.py /tmp/approved-instagram-factory/instagram/factory/
      - name: Render exact publication artifact
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          cd /tmp/approved-instagram-factory
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, os.getcwd())
          from instagram.factory.render_pipeline import run_and_normalize
          from instagram.factory.review_page import build_review_html, stage_review_assets
          ws=Path(os.environ['GITHUB_WORKSPACE'])
          r=run_and_normalize(os.environ['PROJECT_ID'],period=os.environ['PERIOD_INPUT'],output_root=ws/'generated_render')
          assert r.qa.all_passed
          summary={'run_id':os.environ['GITHUB_RUN_ID'],'project_id':r.project_id,'period_key':r.period_key,'source_batch_id':r.source_batch_id,'slide_count':len(r.slides),'qa_all_passed':r.qa.all_passed}
          (ws/'render_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          review=ws/'factory_web_review'; staged=stage_review_assets(r,review)
          (review/'index.html').write_text(build_review_html(staged,project_label='Bill Tracker · Publication Post 2'),encoding='utf-8')
          PY
      - name: Publish review branch
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          cp render_summary.json factory_web_review/render_summary.json
          cd factory_web_review
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "preview: ${PREVIEW_SLUG} ${GITHUB_RUN_ID}"
          git branch -M "previews/${PREVIEW_SLUG}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:refs/heads/previews/${PREVIEW_SLUG}"
      - uses: actions/upload-artifact@v4
        with:
          name: instagram-factory-render-post2-${{ github.run_id }}
          path: generated_render/
          if-no-files-found: error
          retention-days: 30
