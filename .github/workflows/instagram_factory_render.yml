name: Instagram factory render (generic)
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_ID: bill_tracker_factory_v1
      PERIOD_INPUT: post1
      FACTORY_REF: 386b933
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas pyyaml pillow boto3 matplotlib
      - name: Prepare approved factory worktree
        run: |
          set -euo pipefail
          git fetch origin feature/instagram-monthly-post-framework
          git worktree add /tmp/approved-instagram-factory "$FACTORY_REF"
          cp -R "instagram/projects/${PROJECT_ID}" /tmp/approved-instagram-factory/instagram/projects/
          cp instagram/factory/contract.py instagram/factory/normalize.py instagram/factory/qa.py instagram/factory/review_page.py instagram/factory/publication_handoff.py instagram/factory/render_pipeline.py /tmp/approved-instagram-factory/instagram/factory/
      - name: Capture generic-render failure
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set +e
          cd /tmp/approved-instagram-factory
          python - <<'PY' > "$GITHUB_WORKSPACE/bill_tracker_render_error.txt" 2>&1
          import os, sys, traceback
          from pathlib import Path
          sys.path.insert(0, os.getcwd())
          from instagram.factory.render_pipeline import run_and_normalize
          try:
              result=run_and_normalize(os.environ['PROJECT_ID'],period=os.environ['PERIOD_INPUT'],output_root=Path(os.environ['GITHUB_WORKSPACE'])/'generated_render')
              print('SUCCESS', result)
          except Exception:
              traceback.print_exc()
          PY
          cat "$GITHUB_WORKSPACE/bill_tracker_render_error.txt"
          exit 0
      - name: Publish diagnostic
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/diag && cp bill_tracker_render_error.txt /tmp/diag/
          cd /tmp/diag
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "diagnostic: Bill Tracker render ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-diagnostic
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-diagnostic
