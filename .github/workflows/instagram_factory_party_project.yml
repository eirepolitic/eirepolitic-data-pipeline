name: Instagram Content Factory party project validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/instagram-content-factory-party-project
    paths:
      - "instagram/factory/**"
      - "instagram/renderer/template_renderer.py"
      - "instagram/catalogues/metrics.yml"
      - "instagram/visuals/data_mappings/party_issue_counts.yml"
      - "instagram/visuals/renderers/horizontal_bar.py"
      - "instagram/visuals/templates/horizontal_bar_draft_v1.yml"
      - "instagram/templates/layouts/title_text_media_v1.json"
      - "instagram/projects/party_issue_profile_v1/**"
      - "instagram/projects/constituency_issue_profile_v1/**"
      - "tests/test_instagram_factory_generic_core.py"
      - "tests/test_instagram_factory_party_project.py"
      - "tests/test_instagram_factory_constituency_project.py"
      - "tests/test_instagram_factory_historical_fallback.py"
      - ".github/workflows/instagram_factory_party_project.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Validate catalogues and projects
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_profile_v1/project.yml
          python process/instagram_factory.py validate-project --project instagram/projects/constituency_issue_profile_v1/project.yml
      - name: Run generic core tests
        run: python -m unittest tests.test_instagram_factory_generic_core -v
      - name: Run historical fallback tests
        run: python -m unittest tests.test_instagram_factory_historical_fallback -v
      - name: Run constituency project tests
        run: python -m unittest tests.test_instagram_factory_constituency_project -v
      - name: Run party project tests
        run: python -m unittest tests.test_instagram_factory_party_project -v
      - name: Validate live party scenarios
        id: live_render
        shell: bash
        continue-on-error: true
        run: |
          set +e
          python process/instagram_factory.py render-tests \
            --project instagram/projects/party_issue_profile_v1/project.yml \
            --data-source s3 \
            --output-root generated_party_live_tests \
            > party-live-validation.json 2>&1
          status=$?
          cat party-live-validation.json
          python <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          text = Path("party-live-validation.json").read_text(encoding="utf-8", errors="replace")
          summary = "unknown"
          try:
              payload = json.loads(text)
              errors = payload.get("errors") or []
              if errors:
                  summary = str(errors[0])
              elif payload.get("success") is True:
                  summary = "success"
          except Exception:
              lines = [line.strip() for line in text.splitlines() if line.strip()]
              if lines:
                  summary = lines[-1]
          safe = re.sub(r"[^A-Za-z0-9._-]+", "-", summary).strip("-")[:120] or "unknown"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"summary={safe}\n")
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload live-render diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: live-render-${{ steps.live_render.outputs.status }}-${{ steps.live_render.outputs.summary }}
          path: party-live-validation.json
          if-no-files-found: error
      - name: Rebuild and export full contact sheet from returned output root
        if: steps.live_render.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          import shutil
          from pathlib import Path
          from PIL import Image
          from instagram.factory.validation_contact_sheet import build_validation_contact_sheet

          report = json.loads(Path("party-live-validation.json").read_text(encoding="utf-8"))
          root = Path(report["output_root"])
          sheet = build_validation_contact_sheet(
              root=root,
              project_id=str(report["project_id"]),
              scenario_manifests=report["scenario_manifests"],
              scenario_order=report["required_scenarios"],
          )
          primary = root / "validation_contact_sheet.png"
          full = sheet.get("full") or {}
          represented = set(full.get("scenario_rows") or []) | set(full.get("waived_scenarios") or [])
          required = {name for name in report["required_scenarios"] if name not in {"minimum", "maximum"}}
          if represented != required:
              raise SystemExit(f"Scenario mismatch: missing={sorted(required - represented)} unexpected={sorted(represented - required)}")
          with Image.open(primary) as image:
              dimensions = image.size
          export = Path("contact_sheet_export")
          export.mkdir(parents=True, exist_ok=True)
          shutil.copy2(primary, export / "validation_contact_sheet.png")
          (export / "contact-sheet-verification.json").write_text(
              json.dumps({
                  "source_output_root": str(root),
                  "image_dimensions": list(dimensions),
                  "represented_scenarios": sorted(represented),
                  "verification_success": True,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload verified standalone full contact sheet
        if: steps.live_render.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: verified-standalone-full-contact-sheet-${{ github.run_id }}
          path: contact_sheet_export/
          if-no-files-found: error
      - name: Enforce live render success
        shell: bash
        run: |
          test "${{ steps.live_render.outputs.status }}" = "0"
