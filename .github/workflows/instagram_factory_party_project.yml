name: Instagram Content Factory party project validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/instagram-content-factory-party-project
    paths:
      - "instagram/factory/**"
      - "instagram/renderer/template_renderer.py"
      - "instagram/catalogues/metrics.yml"
      - "instagram/visuals/data_mappings/party_issue_counts.yml"
      - "instagram/visuals/renderers/horizontal_bar.py"
      - "instagram/visuals/templates/horizontal_bar_draft_v1.yml"
      - "instagram/templates/layouts/title_text_media_v1.json"
      - "instagram/projects/party_issue_profile_v1/**"
      - "instagram/projects/constituency_issue_profile_v1/**"
      - "tests/test_instagram_factory_generic_core.py"
      - "tests/test_instagram_factory_party_project.py"
      - "tests/test_instagram_factory_constituency_project.py"
      - "tests/test_instagram_factory_historical_fallback.py"
      - ".github/workflows/instagram_factory_party_project.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Validate catalogues and projects
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_profile_v1/project.yml
          python process/instagram_factory.py validate-project --project instagram/projects/constituency_issue_profile_v1/project.yml
      - name: Run generic core tests
        run: python -m unittest tests.test_instagram_factory_generic_core -v
      - name: Run historical fallback tests
        run: python -m unittest tests.test_instagram_factory_historical_fallback -v
      - name: Run constituency project tests
        run: python -m unittest tests.test_instagram_factory_constituency_project -v
      - name: Run party project tests
        run: python -m unittest tests.test_instagram_factory_party_project -v
      - name: Validate live party scenarios
        run: |
          python process/instagram_factory.py render-tests \
            --project instagram/projects/party_issue_profile_v1/project.yml \
            --data-source s3 \
            --output-root generated_party_live_tests \
            | tee party-live-validation.json
      - name: Stage contact sheets from reported output root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p contact_sheet_delivery
          python <<'PY'
          import json
          import shutil
          from pathlib import Path

          report = json.loads(Path('party-live-validation.json').read_text(encoding='utf-8'))
          output_root = Path(report['output_root'])
          if not output_root.is_absolute():
              output_root = (Path.cwd() / output_root).resolve()

          delivery = Path('contact_sheet_delivery')
          candidates = {
              'primary': output_root / 'validation_contact_sheet.png',
              'summary': output_root / 'validation_summary_contact_sheet.png',
              'manifest': output_root / 'validation_contact_sheet_manifest.json',
              'project_manifest': output_root / 'project_validation_manifest.json',
          }
          audit_candidates = sorted(output_root.glob('validation_audit_contact_sheet*.png'))

          discovery = {
              'reported_output_root': str(output_root),
              'reported_output_root_exists': output_root.exists(),
              'candidate_paths': {name: str(path) for name, path in candidates.items()},
              'candidate_exists': {name: path.is_file() for name, path in candidates.items()},
              'audit_candidates': [str(path) for path in audit_candidates],
          }

          if candidates['primary'].is_file():
              shutil.copy2(candidates['primary'], delivery / 'validation_contact_sheet.png')
          if candidates['summary'].is_file():
              shutil.copy2(candidates['summary'], delivery / 'validation_summary_contact_sheet.png')
          if candidates['manifest'].is_file():
              shutil.copy2(candidates['manifest'], delivery / 'validation_contact_sheet_manifest.json')
              manifest = json.loads(candidates['manifest'].read_text(encoding='utf-8'))
              full = manifest.get('full') or {}
              discovery['layout'] = manifest.get('layout')
              discovery['rendered_scenarios'] = full.get('scenario_rows') or []
              discovery['waived_scenarios'] = full.get('waived_scenarios') or []
          if candidates['project_manifest'].is_file():
              shutil.copy2(candidates['project_manifest'], delivery / 'project_validation_manifest.json')
          for index, path in enumerate(audit_candidates, start=1):
              shutil.copy2(path, delivery / f'validation_audit_contact_sheet_{index:02d}.png')

          discovery['output_root_files'] = sorted(
              str(path.relative_to(output_root))
              for path in output_root.rglob('*')
              if path.is_file()
          ) if output_root.exists() else []
          (delivery / 'contact-sheet-discovery.json').write_text(
              json.dumps(discovery, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(discovery, indent=2, sort_keys=True))
          PY
          ls -lah contact_sheet_delivery
      - name: Upload contact sheet delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: party-contact-sheet-delivery-${{ github.run_id }}
          path: contact_sheet_delivery/
          if-no-files-found: error
      - name: Upload complete validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: party-project-validation-${{ github.run_id }}
          path: |
            generated_party_live_tests/
            party-live-validation.json
          if-no-files-found: warn
      - name: Enforce primary contact sheet delivery
        shell: bash
        run: |
          test -f contact_sheet_delivery/validation_contact_sheet.png
          test -f contact_sheet_delivery/validation_contact_sheet_manifest.json
