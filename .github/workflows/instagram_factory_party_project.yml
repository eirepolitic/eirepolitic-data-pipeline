name: Instagram January Party Over-Index Commissioning

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-january-overindex:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Validate
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_share_overindex_jan2026/project.yml
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_per_td_overindex_jan2026/project.yml
      - name: Generate share batch and capture report
        shell: bash
        run: |
          set +e
          python process/instagram_factory.py generate-batch \
            --project instagram/projects/party_issue_share_overindex_jan2026/project.yml \
            --data-source s3 \
            --output-root generated_january_share_overindex \
            --git-sha "$(git rev-parse HEAD)" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            > january-share-report.json
          code=$?
          set -e
          mkdir -p instagram/commissioning/diagnostics
          cp january-share-report.json instagram/commissioning/diagnostics/january-share-report.json
          python <<'PY'
          import json
          from pathlib import Path
          p=Path('january-share-report.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          compact={
              'state':data.get('state'),
              'run_id':data.get('run_id'),
              'expected_item_count':data.get('expected_item_count'),
              'succeeded_item_count':data.get('succeeded_item_count'),
              'failed_item_count':data.get('failed_item_count'),
              'source_manifest':data.get('source_manifest'),
              'join_manifest':data.get('join_manifest'),
              'items':[{
                  'item_slug':i.get('item_slug'),
                  'item_label':i.get('item_label'),
                  'status':i.get('status'),
                  'errors':i.get('errors'),
                  'warnings':i.get('warnings'),
              } for i in data.get('items',[])],
          }
          Path('instagram/commissioning/diagnostics/january-share-compact.json').write_text(json.dumps(compact,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/commissioning/diagnostics/january-share-report.json instagram/commissioning/diagnostics/january-share-compact.json
          git commit -m "Record January share over-index diagnostics" || true
          git push
          exit "$code"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: january-share-diagnostics-${{ github.run_id }}
          path: |
            january-share-report.json
            generated_january_share_overindex/
          if-no-files-found: warn
