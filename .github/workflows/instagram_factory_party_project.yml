name: Instagram Party Chart Variant Review

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart-variant-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out commissioning branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pillow pyyaml matplotlib requests

      - name: Recover and render chart variants
        shell: bash
        run: |
          set -euo pipefail
          OUT="instagram/commissioning/output/chart-variant-review-2026-09-03"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # Variant A: exact original Matplotlib renderer from Aug 31 diagnostic run.
          git worktree add --detach /tmp/chart-variant-a 296c395022fddd0302aad80859466365013e518d
          (
            cd /tmp/chart-variant-a
            export PYTHONPATH="$PWD"
            python process/instagram_factory.py generate-batch \
              --project instagram/projects/party_issue_share_overindex_jan2026/project.yml \
              --data-source s3 \
              --output-root /tmp/chart-variant-a-output \
              --git-sha 296c395022fddd0302aad80859466365013e518d \
              --workflow-run-id "$GITHUB_RUN_ID" \
              >/tmp/chart-variant-a-report.json
          )
          A_SRC="$(find /tmp/chart-variant-a-output -path '*/fianna-fail/slides/02_issue_profile.png' -print -quit)"
          test -n "$A_SRC"
          cp "$A_SRC" "$OUT/variant-a-matplotlib-original-2line.png"

          # Variant B: committed hardened Matplotlib output (3-line taxonomy labels).
          git show 7f10fb0454d0da6d58b4c5c5b2e5aacc39844052:instagram/commissioning/output/january-overindex-2026/share/parties/fianna-fail/slides/02_issue_profile.png \
            > "$OUT/variant-b-matplotlib-hardened-3line.png"

          # Variant C: Sept 1 Pillow monthly-profile treatment with left-aligned metadata/support copy.
          git show 668b7dafc525f39f6c4ce9adeda72d0c7cb68265:instagram/commissioning/output/party_issue_monthly_profile_v1/period=2026-07/parties/fianna-fail/slides/02_most_discussed_issues.png \
            > "$OUT/variant-c-pillow-left-aligned.png"

          # Variant D: Sept 1 Pillow treatment after metadata/support copy was centered.
          git show 09d84565f83fec5a9ecb04bdf76e44fa3132bfc7:instagram/commissioning/output/party_issue_monthly_profile_v1/period=2026-07/parties/fianna-fail/slides/02_most_discussed_issues.png \
            > "$OUT/variant-d-pillow-centered.png"

          # Variant E: later v2/post-processed chart state that triggered the current review.
          git show f4fe682610131d1379c067ff785e8f49c06497a3:instagram/commissioning/output/party_issue_monthly_profile_v2/period=2026-07/parties/fianna-fail/slides/02_most_discussed_issues.png \
            > "$OUT/variant-e-v2-later-state.png"

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import json

          root = Path('instagram/commissioning/output/chart-variant-review-2026-09-03')
          variants = [
              ('A', 'Matplotlib original — 2-line labels', 'variant-a-matplotlib-original-2line.png', '296c3950', '2026-08-31'),
              ('B', 'Matplotlib hardened — 3-line labels', 'variant-b-matplotlib-hardened-3line.png', '7f10fb04', '2026-08-31'),
              ('C', 'Pillow monthly profile — left-aligned header', 'variant-c-pillow-left-aligned.png', '668b7daf', '2026-09-01'),
              ('D', 'Pillow monthly profile — centered header', 'variant-d-pillow-centered.png', '09d84565', '2026-09-01'),
              ('E', 'Later v2 chart state', 'variant-e-v2-later-state.png', 'f4fe6826', '2026-09-03'),
          ]
          font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 28)
          small = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 20)
          cards = []
          manifest = []
          for key, label, filename, commit, date in variants:
              path = root / filename
              with Image.open(path) as im:
                  im.load()
                  rgb = im.convert('RGB')
                  size = rgb.size
                  thumb = rgb.copy()
                  thumb.thumbnail((480, 600), Image.Resampling.LANCZOS)
              card = Image.new('RGB', (540, 700), 'white')
              x = (540 - thumb.width) // 2
              card.paste(thumb, (x, 20))
              draw = ImageDraw.Draw(card)
              draw.text((270, 635), f'{key}. {label}', fill='black', font=font, anchor='mm')
              draw.text((270, 674), f'{date} · {commit} · {size[0]}×{size[1]}', fill='black', font=small, anchor='mm')
              cards.append(card)
              manifest.append({'variant': key, 'label': label, 'file': filename, 'source_commit': commit, 'date': date, 'dimensions': list(size)})

          sheet = Image.new('RGB', (1080, 2100), 'white')
          for i, card in enumerate(cards):
              row, col = divmod(i, 2)
              sheet.paste(card, (col * 540, row * 700))
          sheet.save(root / 'all-chart-variants-contact-sheet.jpg', quality=92)
          (root / 'variant-manifest.json').write_text(json.dumps({'variants': manifest}, indent=2), encoding='utf-8')
          PY

          cd instagram/commissioning/output
          rm -f chart-variant-review-2026-09-03.zip
          zip -r chart-variant-review-2026-09-03.zip chart-variant-review-2026-09-03

      - name: Commit chart variant review pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/commissioning/output/chart-variant-review-2026-09-03
          git add instagram/commissioning/output/chart-variant-review-2026-09-03.zip
          git commit -m "Add recent party chart variant review pack" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: chart-variant-review-${{ github.run_id }}
          path: |
            instagram/commissioning/output/chart-variant-review-2026-09-03/
            instagram/commissioning/output/chart-variant-review-2026-09-03.zip
          if-no-files-found: error
