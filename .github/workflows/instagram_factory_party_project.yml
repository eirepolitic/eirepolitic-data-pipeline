name: Instagram Party Monthly Profile v2 Commissioning

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  all-party-cover-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out v2 commissioning branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pillow pyyaml

      - name: Promote user-approved Social Democrats logo
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          from pathlib import Path

          import boto3
          from PIL import Image

          bucket = 'eirepolitic-data'
          key = 'processed/reference/party_assets/v1/assets/social-democrats/logo.png'
          source = Path('instagram/commissioning/input/social-democrats-approved-logo.b64')

          encoded = source.read_text(encoding='utf-8').strip()
          print(f'Staged base64 characters: {len(encoded)}')
          raw = base64.b64decode(encoded, validate=True)
          print(f'Decoded source bytes: {len(raw)}')

          with Image.open(io.BytesIO(raw)) as im:
              im.load()
              print(f'Approved supplied source: {im.format} {im.size} {im.mode}')
              rgb = im.convert('RGB').resize((1600, 1600), Image.Resampling.LANCZOS)
              out = io.BytesIO()
              rgb.save(out, format='PNG')
              approved_png = out.getvalue()

          approved_sha = hashlib.sha256(approved_png).hexdigest()
          s3 = boto3.client('s3', region_name='ca-central-1')
          s3.put_object(
              Bucket=bucket,
              Key=key,
              Body=approved_png,
              ContentType='image/png',
          )

          promoted = s3.get_object(Bucket=bucket, Key=key)['Body'].read()
          promoted_sha = hashlib.sha256(promoted).hexdigest()
          if promoted_sha != approved_sha:
              raise RuntimeError('S3 read-back hash does not match uploaded approved logo')
          with Image.open(io.BytesIO(promoted)) as im:
              im.load()
              if im.format != 'PNG' or im.size != (1600, 1600):
                  raise RuntimeError(f'Canonical logo failed contract: {im.format} {im.size}')

          print(f'PROMOTED=s3://{bucket}/{key}')
          print(f'SHA256={approved_sha}')
          PY

      - name: Render all-party July 2026 v2 cover review
        run: python -m instagram.commissioning.render_party_logo_cover_v2

      - name: Validate rendered review package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('instagram/commissioning/output/party-logo-cover-v2-review')
          manifest = json.loads((root / 'review-manifest.json').read_text(encoding='utf-8'))
          assert manifest['party_count'] == 11
          assert manifest['cover_title'] == 'Party Speech Breakdown'
          covers = sorted(root.glob('*-cover.png'))
          lineage = sorted(root.glob('*-cover-lineage.json'))
          assert len(covers) == 11
          assert len(lineage) == 11
          for p in covers:
              with Image.open(p) as im:
                  assert im.size == (1080, 1350), (p, im.size)
          with Image.open(root / 'all-party-covers-contact-sheet.png') as im:
              assert im.size[0] > 0 and im.size[1] > 0
          for item in manifest['covers']:
              assert item['party_asset_registry'] == 'configs/reference/party_assets_v1.csv'
              asset = item['party_asset']
              assert asset['dimensions'] == [1600, 1600]
              assert asset['logo_s3_uri'].endswith(f"/{item['party_key']}/logo.png")
          print('PASS: title, 11 covers, registry-backed 1600x1600 logos, contact sheet present')
          PY

      - name: Commit review outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/commissioning/output/party-logo-cover-v2-review
          git commit -m "Render July 2026 party speech breakdown cover review" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: party-logo-cover-v2-review-${{ github.run_id }}
          path: instagram/commissioning/output/party-logo-cover-v2-review/
          if-no-files-found: error
