name: Instagram Content Factory party project validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-v4-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Apply v4 visual treatment
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("instagram/visuals/renderers/horizontal_bar.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('ax.set_facecolor(palette["panel"])', 'ax.set_facecolor(palette["background"])', 1)
          marker = '''    for spine in ax.spines.values():\n        spine.set_visible(False)\n'''
          replacement = '''    for spine in ax.spines.values():\n        spine.set_visible(False)\n    ax.axvline(0, color=palette["accent"], linewidth=1.4, alpha=0.75)\n'''
          if marker in text and 'ax.axvline(0, color=palette["accent"]' not in text:
              text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding="utf-8")

          path = Path("instagram/factory/party_adapter.py")
          text = path.read_text(encoding="utf-8")
          start = text.index('def _write_party_cover(')
          end = text.index('\ndef render_party_assets(', start)
          replacement = '''def _write_party_cover(path: Path, context: dict[str, Any]) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    image = Image.new("RGB", (1032, 1210), "#0f2f24")\n    draw = ImageDraw.Draw(image)\n    try:\n        number_font = ImageFont.truetype("DejaVuSans-Bold.ttf", 92)\n        label_font = ImageFont.truetype("DejaVuSans-Bold.ttf", 30)\n        party_font = ImageFont.truetype("DejaVuSans-Bold.ttf", 68)\n        small_font = ImageFont.truetype("DejaVuSans.ttf", 25)\n    except OSError:\n        number_font = ImageFont.load_default()\n        label_font = ImageFont.load_default()\n        party_font = ImageFont.load_default()\n        small_font = ImageFont.load_default()\n\n    cx, cy, radius = 516, 430, 225\n    draw.ellipse((cx - radius, cy - radius, cx + radius, cy + radius), outline="#d8b45f", width=10)\n    party = str(context.get("party") or "").strip()\n    if party == "Fianna Fáil":\n        party_lines = ["FIANNA", "FÁIL"]\n    else:\n        words = party.split()\n        split = max(1, len(words) // 2)\n        party_lines = [" ".join(words[:split]), " ".join(words[split:])] if len(words) > 1 else [party]\n    if len(party_lines) == 1:\n        draw.text((cx, cy), party_lines[0], font=party_font, fill="#f4ead7", anchor="mm")\n    else:\n        draw.text((cx, cy - 46), party_lines[0], font=party_font, fill="#f4ead7", anchor="mm")\n        draw.text((cx, cy + 46), party_lines[1], font=party_font, fill="#f4ead7", anchor="mm")\n\n    draw.text((270, 820), f"{int(context.get('member_count', 0)):,}", font=number_font, fill="#f4ead7", anchor="mm")\n    draw.text((270, 895), "CURRENT TDS", font=label_font, fill="#d8b45f", anchor="mm")\n    draw.text((762, 820), f"{int(context.get('speech_count', 0)):,}", font=number_font, fill="#f4ead7", anchor="mm")\n    draw.text((762, 895), "CLASSIFIED SPEECHES", font=label_font, fill="#d8b45f", anchor="mm")\n\n    draw.line((215, 980, 817, 980), fill="#d8b45f", width=3)\n    draw.text((516, 1035), "DEBATE COVERAGE", font=label_font, fill="#d8b45f", anchor="mm")\n    period = f"{context.get('period_start', '')} – {context.get('period_end', '')}"\n    draw.text((516, 1083), period, font=small_font, fill="#f4ead7", anchor="mm")\n    image.save(path, format="PNG")\n\n'''
          text = text[:start] + replacement + text[end+1:]
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/visuals/renderers/horizontal_bar.py instagram/factory/party_adapter.py
          git commit -m "Flatten party profile visuals and rebalance cover" || true
          git push
      - name: Generate v4 live batch
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_profile_v1/project.yml
          python process/instagram_factory.py generate-batch \
            --project instagram/projects/party_issue_profile_v1/project.yml \
            --data-source s3 \
            --output-root generated_party_v4 \
            --git-sha "$(git rev-parse HEAD)" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            > commissioning-v4-report.json
      - name: Export selected v4 for review
        shell: bash
        run: |
          set -euo pipefail
          src="generated_party_v4/generated/fianna-fail"
          out="instagram/commissioning/output/fianna-fail/v4-review"
          rm -rf "$out"
          mkdir -p "$out/slides" "$out/review_previews" "$out/metadata"
          cp "$src"/slides/*.png "$out/slides/"
          cp "$src"/item_manifest.json "$out/metadata/item_manifest.json"
          cp "$src"/manifests/visual_manifest.json "$out/metadata/visual_manifest.json"
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('instagram/commissioning/output/fianna-fail/v4-review')
          for src in sorted((root / 'slides').glob('*.png')):
              im = Image.open(src).convert('RGB')
              im.thumbnail((540, 675), Image.Resampling.LANCZOS)
              im.save(root / 'review_previews' / f'{src.stem}.jpg', 'JPEG', quality=82, optimize=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          git commit -m "Add Fianna Fail v4 visual review candidate" || true
          git push
      - name: Upload v4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-party-v4-${{ github.run_id }}
          path: |
            generated_party_v4/
            commissioning-v4-report.json
          if-no-files-found: warn
