name: Instagram Party Monthly Profile Commissioning

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Completed month to render (YYYY-MM or last_completed_month)"
        required: true
        default: "2026-07"

permissions:
  contents: write

concurrency:
  group: instagram-party-monthly-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out commissioning branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pillow pyyaml

      - name: Render and QA five-slide monthly party batch
        run: |
          python -m instagram.factory.party_monthly_profile --period "${{ inputs.period }}"

      - name: Show run summary
        run: |
          cat "instagram/commissioning/output/party_issue_monthly_profile_v1/period=${{ inputs.period }}/run_manifest.json"

      - name: Commit review outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "instagram/commissioning/output/party_issue_monthly_profile_v1/period=${{ inputs.period }}"
          git commit -m "Render party monthly profile for ${{ inputs.period }}" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: party-monthly-profile-${{ inputs.period }}-${{ github.run_id }}
          path: instagram/commissioning/output/party_issue_monthly_profile_v1/period=${{ inputs.period }}/
          if-no-files-found: error
