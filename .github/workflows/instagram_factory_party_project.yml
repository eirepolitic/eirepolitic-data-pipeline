name: Instagram Content Factory party project validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-v6-final:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Apply final chart centering
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('instagram/visuals/renderers/horizontal_bar.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('PLOT_BOTTOM = 0.12', 'PLOT_BOTTOM = 0.14', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/visuals/renderers/horizontal_bar.py
          git commit -m "Center party issue chart vertically for v6" || true
          git push
      - name: Validate and generate final all-party batch
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_profile_v1/project.yml
          python process/instagram_factory.py generate-batch \
            --project instagram/projects/party_issue_profile_v1/project.yml \
            --data-source s3 \
            --output-root generated_party_v6 \
            --git-sha "$(git rev-parse HEAD)" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            > commissioning-v6-report.json
          python process/instagram_factory.py build-review-index \
            --run-root generated_party_v6 \
            > commissioning-v6-review-index.json
      - name: Export all party review sets and contact sheets
        run: |
          python <<'PY'
          import json, math, shutil
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          src_root = Path('generated_party_v6')
          out_root = Path('instagram/commissioning/output/all-parties/v6-final')
          if out_root.exists():
              shutil.rmtree(out_root)
          parties_root = out_root / 'parties'
          parties_root.mkdir(parents=True, exist_ok=True)

          run = json.loads((src_root/'run_manifest.json').read_text(encoding='utf-8'))
          records = []
          for slug in run['item_order']:
              src = src_root/'generated'/slug
              dst = parties_root/slug
              (dst/'slides').mkdir(parents=True, exist_ok=True)
              (dst/'metadata').mkdir(parents=True, exist_ok=True)
              for png in sorted((src/'slides').glob('*.png')):
                  shutil.copy2(png, dst/'slides'/png.name)
              shutil.copy2(src/'item_manifest.json', dst/'metadata'/'item_manifest.json')
              if (src/'manifests'/'visual_manifest.json').exists():
                  shutil.copy2(src/'manifests'/'visual_manifest.json', dst/'metadata'/'visual_manifest.json')
              manifest = json.loads((src/'item_manifest.json').read_text(encoding='utf-8'))
              records.append({'slug':slug,'label':manifest.get('item_label'),'status':manifest.get('status')})

          shutil.copy2(src_root/'run_manifest.json', out_root/'run_manifest.json')
          shutil.copy2('commissioning-v6-review-index.json', out_root/'review_index.json')
          summary = {
              'version':'v6-final',
              'project_id':run.get('project_id'),
              'source_batch_id':run.get('source_batch_id'),
              'expected_item_count':run.get('expected_item_count'),
              'succeeded_item_count':run.get('succeeded_item_count'),
              'failed_item_count':run.get('failed_item_count'),
              'parties':records,
              'publishing_allowed':False,
              'note':'Commissioning closeout batch using stale classified speech coverage; not for publication.'
          }
          (out_root/'summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          font = ImageFont.load_default()
          def sheet(slide_name, output_name):
              thumbs=[]
              for rec in records:
                  p=parties_root/rec['slug']/'slides'/slide_name
                  if not p.exists():
                      continue
                  im=Image.open(p).convert('RGB')
                  im.thumbnail((270,338),Image.Resampling.LANCZOS)
                  canvas=Image.new('RGB',(300,390),'white')
                  canvas.paste(im,((300-im.width)//2,8))
                  d=ImageDraw.Draw(canvas)
                  d.text((150,355),str(rec['label']),font=font,fill='black',anchor='ma',align='center')
                  thumbs.append(canvas)
              cols=3
              rows=math.ceil(len(thumbs)/cols)
              sheet=Image.new('RGB',(cols*300,rows*390),'white')
              for i,im in enumerate(thumbs):
                  sheet.paste(im,((i%cols)*300,(i//cols)*390))
              sheet.save(out_root/output_name,'JPEG',quality=88,optimize=True)
          sheet('01_cover.png','contact_sheet_covers.jpg')
          sheet('02_issue_profile.png','contact_sheet_top_issues.jpg')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/commissioning/output/all-parties/v6-final
          git commit -m "Add final all-party Instagram commissioning batch" || true
          git push
      - name: Upload final commissioning evidence
        uses: actions/upload-artifact@v4
        with:
          name: instagram-party-v6-final-${{ github.run_id }}
          path: |
            generated_party_v6/
            commissioning-v6-report.json
            commissioning-v6-review-index.json
          if-no-files-found: error
