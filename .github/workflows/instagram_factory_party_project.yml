name: Instagram Party Monthly Profile v2 Commissioning

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  all-party-cover-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out v2 commissioning branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pillow pyyaml

      - name: Repair canonical Social Democrats logo
        run: |
          mkdir -p instagram/commissioning/output/party-logo-cover-v2-review
          python -m instagram.commissioning.repair_social_democrats_logo \
            | tee instagram/commissioning/output/party-logo-cover-v2-review/social-democrats-logo-repair.json

      - name: Render all-party July 2026 v2 cover review
        run: python -m instagram.commissioning.render_party_logo_cover_v2

      - name: Validate rendered review package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml
          from PIL import Image

          from instagram.commissioning import render_party_logo_cover_v2 as renderer
          from instagram.factory import party_monthly_profile as profile

          root = Path('instagram/commissioning/output/party-logo-cover-v2-review')
          manifest = json.loads((root / 'review-manifest.json').read_text(encoding='utf-8'))
          project = yaml.safe_load(Path('instagram/projects/party_issue_monthly_profile_v2/project.yml').read_text(encoding='utf-8'))
          repair = json.loads((root / 'social-democrats-logo-repair.json').read_text(encoding='utf-8'))

          expected_keys = {
              '100-rdr',
              'aontu',
              'fianna-fail',
              'fine-gael',
              'green-party',
              'independent-ireland',
              'independent',
              'labour-party',
              'people-before-profit-solidarity',
              'sinn-fein',
              'social-democrats',
          }
          canonical_social = 's3://eirepolitic-data/processed/reference/party_assets/v1/assets/social-democrats/logo.png'
          expected_scales = {
              'fine-gael': 1.10,
              'independent-ireland': 1.10,
              'labour-party': 1.10,
          }

          assert repair['status'] == 'PASS'
          assert repair['s3_uri'] == canonical_social
          assert repair['dimensions'] == [1600, 1600]
          assert repair['remaining_unwanted_neutral_pixels'] == 0
          assert repair['corrected_sha256'] != repair['parent_sha256']

          assert manifest['party_count'] == 11
          assert manifest['period'] == '2026-07'
          assert manifest['cover_title'] == 'Party Speech Breakdown'
          assert manifest['party_asset_registry'] == 'configs/reference/party_assets_v1.csv'
          assert manifest['publication_enabled'] is False
          assert manifest['review_state'] == 'review_requested'
          assert manifest['cover_logo_geometry']['square_size'] == [500, 500]
          assert manifest['cover_logo_geometry']['top'] == 300
          assert manifest['cover_logo_geometry']['border']['color'] == '#d8b45f'
          assert manifest['cover_logo_geometry']['border']['width_px'] == 6
          assert manifest['cover_logo_geometry']['border']['position'] == 'inside_square'
          assert manifest['cover_logo_geometry']['artwork_scale_overrides'] == expected_scales
          assert renderer.LOGO_SIZE == 500
          assert renderer.LOGO_TOP == 300
          assert renderer.LOGO_BORDER_WIDTH == 6
          assert profile.ACCENT == '#d8b45f'
          assert project['publication']['enabled'] is False
          assert project['publication']['review_state'] == 'pending_human_review'

          covers = sorted(root.glob('*-cover.png'))
          lineage_paths = sorted(root.glob('*-cover-lineage.json'))
          assert len(covers) == 11
          assert len(lineage_paths) == 11
          assert {p.name.removesuffix('-cover.png') for p in covers} == expected_keys
          assert {p.name.removesuffix('-cover-lineage.json') for p in lineage_paths} == expected_keys

          for path in covers:
              with Image.open(path) as image:
                  image.load()
                  assert image.format == 'PNG'
                  assert image.size == (1080, 1350), (path, image.size)

          contact = root / 'all-party-covers-contact-sheet.png'
          with Image.open(contact) as image:
              image.load()
              assert image.format == 'PNG'
              assert image.size[0] > 0 and image.size[1] > 0

          by_key = {item['party_key']: item for item in manifest['covers']}
          assert set(by_key) == expected_keys
          for party_key, item in by_key.items():
              assert item['cover_title'] == 'Party Speech Breakdown'
              assert item['cover_title_period'] == 'July 2026'
              assert item['period'] == '2026-07'
              assert item['party_asset_registry'] == 'configs/reference/party_assets_v1.csv'
              assert item['publication_enabled'] is False
              assert item['logo_geometry']['square_size'] == [500, 500]
              assert item['logo_geometry']['top'] == 300
              assert item['logo_geometry']['border']['color'] == '#d8b45f'
              assert item['logo_geometry']['border']['width_px'] == 6
              expected_scale = expected_scales.get(party_key, 1.0)
              assert item['logo_geometry']['artwork_scale'] == expected_scale
              asset = item['party_asset']
              assert asset['dimensions'] == [1600, 1600]
              assert asset['logo_s3_uri'].endswith(f'/{party_key}/logo.png')

          assert by_key['independent']['display_party_name'] == 'Independents'
          assert by_key['social-democrats']['party_asset']['logo_s3_uri'] == canonical_social

          social_cover = root / 'social-democrats-cover.png'
          with Image.open(social_cover) as image:
              rgb = image.convert('RGB')
              logo_left = (1080 - 500) // 2
              interior = rgb.crop((logo_left + 6, 300 + 6, logo_left + 494, 300 + 494))
              unwanted = 0
              for pixel in interior.getdata():
                  low = min(pixel)
                  high = max(pixel)
                  if high <= 244 and (high - low) <= 18:
                      unwanted += 1
              assert unwanted == 0, f'Social Democrats rendered logo still contains {unwanted} neutral black/gray fringe pixels'

          print('PASS: 11 covers + lineage, July/title, registry assets, canonical Social Democrats repair, halo-free render, gold border, scale overrides, publication disabled')
          PY

      - name: Commit review outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/commissioning/output/party-logo-cover-v2-review
          git commit -m "Refresh July 2026 party speech breakdown cover review" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: party-logo-cover-v2-review-${{ github.run_id }}
          path: instagram/commissioning/output/party-logo-cover-v2-review/
          if-no-files-found: error
