name: Instagram Content Factory party project validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/instagram-content-factory-party-project
    paths:
      - "instagram/factory/**"
      - "instagram/renderer/template_renderer.py"
      - "instagram/catalogues/metrics.yml"
      - "instagram/visuals/data_mappings/party_issue_counts.yml"
      - "instagram/visuals/renderers/horizontal_bar.py"
      - "instagram/visuals/templates/horizontal_bar_draft_v1.yml"
      - "instagram/templates/layouts/title_text_media_v1.json"
      - "instagram/projects/party_issue_profile_v1/**"
      - "instagram/projects/constituency_issue_profile_v1/**"
      - "tests/test_instagram_factory_generic_core.py"
      - "tests/test_instagram_factory_party_project.py"
      - "tests/test_instagram_factory_constituency_project.py"
      - "tests/test_instagram_factory_historical_fallback.py"
      - ".github/workflows/instagram_factory_party_project.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Validate catalogues and projects
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_profile_v1/project.yml
          python process/instagram_factory.py validate-project --project instagram/projects/constituency_issue_profile_v1/project.yml
      - name: Run generic core tests
        run: python -m unittest tests.test_instagram_factory_generic_core -v
      - name: Run historical fallback tests
        run: python -m unittest tests.test_instagram_factory_historical_fallback -v
      - name: Run constituency project tests
        run: python -m unittest tests.test_instagram_factory_constituency_project -v
      - name: Run party project tests
        run: python -m unittest tests.test_instagram_factory_party_project -v
      - name: Validate live party scenarios
        run: |
          python process/instagram_factory.py render-tests \
            --project instagram/projects/party_issue_profile_v1/project.yml \
            --data-source s3 \
            --output-root generated_party_live_tests \
            | tee party-live-validation.json
      - name: Discover and stage contact sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p contact_sheet_delivery
          find . -type f \( -name '*contact_sheet*.png' -o -name 'validation_contact_sheet_manifest.json' -o -name 'project_validation_manifest.json' \) -print | sort | tee contact_sheet_delivery/discovered-files.txt
          python <<'PY'
          import json
          import shutil
          from pathlib import Path

          workspace = Path('.')
          delivery = Path('contact_sheet_delivery')
          primary_candidates = sorted(workspace.rglob('validation_contact_sheet.png'))
          summary_candidates = sorted(workspace.rglob('validation_summary_contact_sheet.png'))
          audit_candidates = sorted(workspace.rglob('validation_audit_contact_sheet*.png'))
          sheet_manifests = sorted(workspace.rglob('validation_contact_sheet_manifest.json'))
          project_manifests = sorted(workspace.rglob('project_validation_manifest.json'))

          report = {
              'primary_candidates': [str(path) for path in primary_candidates],
              'summary_candidates': [str(path) for path in summary_candidates],
              'audit_candidates': [str(path) for path in audit_candidates],
              'sheet_manifests': [str(path) for path in sheet_manifests],
              'project_manifests': [str(path) for path in project_manifests],
          }

          if primary_candidates:
              primary = primary_candidates[0]
              shutil.copy2(primary, delivery / 'validation_contact_sheet.png')
              report['selected_primary'] = str(primary)
          if summary_candidates:
              shutil.copy2(summary_candidates[0], delivery / 'validation_summary_contact_sheet.png')
          for index, path in enumerate(audit_candidates, start=1):
              shutil.copy2(path, delivery / f'validation_audit_contact_sheet_{index:02d}.png')

          if sheet_manifests:
              manifest = json.loads(sheet_manifests[0].read_text(encoding='utf-8'))
              full = manifest.get('full') or {}
              report['layout'] = manifest.get('layout')
              report['rendered_scenarios'] = full.get('scenario_rows') or []
              report['waived_scenarios'] = full.get('waived_scenarios') or []
              report['represented_scenario_count'] = len(set(report['rendered_scenarios']) | set(report['waived_scenarios']))
              shutil.copy2(sheet_manifests[0], delivery / 'validation_contact_sheet_manifest.json')

          (delivery / 'contact-sheet-discovery.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          ls -lah contact_sheet_delivery
      - name: Upload discovered contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: party-contact-sheet-delivery-${{ github.run_id }}
          path: contact_sheet_delivery/
          if-no-files-found: error
      - name: Upload complete validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: party-project-validation-${{ github.run_id }}
          path: |
            generated_party_live_tests/
            party-live-validation.json
          if-no-files-found: warn
      - name: Enforce primary contact sheet delivery
        shell: bash
        run: |
          test -f contact_sheet_delivery/validation_contact_sheet.png
          python <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('contact_sheet_delivery/contact-sheet-discovery.json').read_text(encoding='utf-8'))
          if report.get('layout') != 'full_review_plus_deduplicated_summary_plus_complete_audit':
              raise SystemExit(f"Unexpected contact sheet layout: {report.get('layout')}")
          if not report.get('rendered_scenarios') and not report.get('waived_scenarios'):
              raise SystemExit('No scenarios were represented in the primary contact sheet manifest')
          PY
