name: Instagram Content Factory party project validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/instagram-content-factory-party-project
    paths:
      - "instagram/factory/**"
      - "instagram/renderer/template_renderer.py"
      - "instagram/catalogues/metrics.yml"
      - "instagram/visuals/data_mappings/party_issue_counts.yml"
      - "instagram/visuals/renderers/horizontal_bar.py"
      - "instagram/visuals/templates/horizontal_bar_draft_v1.yml"
      - "instagram/templates/layouts/title_text_media_v1.json"
      - "instagram/projects/party_issue_profile_v1/**"
      - "instagram/projects/constituency_issue_profile_v1/**"
      - "tests/test_instagram_factory_generic_core.py"
      - "tests/test_instagram_factory_party_project.py"
      - "tests/test_instagram_factory_constituency_project.py"
      - "tests/test_instagram_factory_historical_fallback.py"
      - ".github/workflows/instagram_factory_party_project.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Validate catalogues and projects
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_profile_v1/project.yml
          python process/instagram_factory.py validate-project --project instagram/projects/constituency_issue_profile_v1/project.yml
      - name: Run generic core tests
        run: python -m unittest tests.test_instagram_factory_generic_core -v
      - name: Run historical fallback tests
        run: python -m unittest tests.test_instagram_factory_historical_fallback -v
      - name: Run constituency project tests
        run: python -m unittest tests.test_instagram_factory_constituency_project -v
      - name: Run party project tests
        run: python -m unittest tests.test_instagram_factory_party_project -v
      - name: Validate live party scenarios
        run: |
          python process/instagram_factory.py render-tests \
            --project instagram/projects/party_issue_profile_v1/project.yml \
            --data-source s3 \
            --output-root generated_party_live_tests \
            | tee party-live-validation.json
      - name: Verify contact sheet outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f generated_party_live_tests/validation_contact_sheet.png
          test -f generated_party_live_tests/validation_summary_contact_sheet.png
          test -f generated_party_live_tests/validation_contact_sheet_manifest.json
          python <<'PY'
          import json
          from pathlib import Path

          root = Path("generated_party_live_tests")
          manifest = json.loads((root / "validation_contact_sheet_manifest.json").read_text(encoding="utf-8"))
          project = json.loads((root / "project_validation_manifest.json").read_text(encoding="utf-8"))

          if manifest.get("layout") != "full_review_plus_deduplicated_summary_plus_complete_audit":
              raise SystemExit(f"Unexpected contact sheet layout: {manifest.get('layout')}")

          full = manifest.get("full") or {}
          rendered = set(full.get("scenario_rows") or [])
          waived = set(full.get("waived_scenarios") or [])
          represented = rendered | waived
          required = {
              name
              for name in project.get("required_scenarios") or []
              if name not in {"minimum", "maximum"}
          }
          if represented != required:
              missing = sorted(required - represented)
              unexpected = sorted(represented - required)
              raise SystemExit(f"Primary contact sheet scenario mismatch; missing={missing}; unexpected={unexpected}")

          evidence = {
              "primary_file": "validation_contact_sheet.png",
              "primary_exists": (root / "validation_contact_sheet.png").is_file(),
              "rendered_scenarios": sorted(rendered),
              "waived_scenarios": sorted(waived),
              "represented_scenario_count": len(represented),
              "required_scenario_count": len(required),
          }
          (root / "contact-sheet-verification.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
          ls -lah generated_party_live_tests/validation* generated_party_live_tests/contact-sheet-verification.json
      - name: Upload full primary contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: party-full-contact-sheet-${{ github.run_id }}
          path: |
            generated_party_live_tests/validation_contact_sheet.png
            generated_party_live_tests/contact-sheet-verification.json
          if-no-files-found: error
      - name: Upload deduplicated summary contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: party-summary-contact-sheet-${{ github.run_id }}
          path: generated_party_live_tests/validation_summary_contact_sheet.png
          if-no-files-found: error
      - name: Upload audit contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: party-audit-contact-sheets-${{ github.run_id }}
          path: generated_party_live_tests/validation_audit_contact_sheet*.png
          if-no-files-found: error
      - name: Upload complete validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: party-project-validation-${{ github.run_id }}
          path: |
            generated_party_live_tests/
            party-live-validation.json
          if-no-files-found: error
