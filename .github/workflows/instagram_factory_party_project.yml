name: Instagram Party Monthly Profile v2 Commissioning

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-july-v2-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out v2 commissioning branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pillow pyyaml

      - name: Verify canonical Social Democrats logo remains corrected
        run: python -m instagram.commissioning.repair_social_democrats_logo

      - name: Generate full July 2026 v2 party profile batch
        run: |
          rm -rf instagram/commissioning/output/party_issue_monthly_profile_v2/period=2026-07
          python -m instagram.commissioning.render_party_monthly_profile_v2

      - name: Validate full 55-slide batch
        run: python -m instagram.commissioning.validate_party_monthly_profile_v2

      - name: Commit full v2 commissioning outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/commissioning/output/party_issue_monthly_profile_v2/period=2026-07
          git commit -m "Generate July 2026 party monthly profile v2 full batch" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload full batch artifact
        uses: actions/upload-artifact@v4
        with:
          name: party-monthly-profile-v2-july-2026-${{ github.run_id }}
          path: instagram/commissioning/output/party_issue_monthly_profile_v2/period=2026-07/
          if-no-files-found: error
