name: Instagram Content Factory party project validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/instagram-content-factory-party-project
    paths:
      - "instagram/factory/**"
      - "instagram/catalogues/metrics.yml"
      - "instagram/visuals/data_mappings/party_issue_counts.yml"
      - "instagram/visuals/renderers/horizontal_bar.py"
      - "instagram/visuals/templates/horizontal_bar_draft_v1.yml"
      - "instagram/templates/layouts/title_text_media_v1.json"
      - "instagram/projects/party_issue_profile_v1/**"
      - "instagram/projects/constituency_issue_profile_v1/**"
      - "tests/test_instagram_factory_generic_core.py"
      - "tests/test_instagram_factory_party_project.py"
      - "tests/test_instagram_factory_historical_fallback.py"
      - ".github/workflows/instagram_factory_party_project.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Validate catalogues and party project
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_profile_v1/project.yml
      - name: Diagnose generic batch phase
        id: generic_batch_diag
        shell: bash
        run: |
          python <<'PY'
          import os
          import re
          import traceback
          from pathlib import Path
          from tempfile import TemporaryDirectory

          status = "success"
          error = "none"
          case = None
          try:
              from tests.test_instagram_factory_generic_core import GenericFactoryCoreTest
              from instagram.factory.generic_batch import generate_project_batch
              case = GenericFactoryCoreTest("test_batch_and_scenarios_support_national_grain")
              case.setUp()
              with TemporaryDirectory() as temp_dir:
                  root = Path(temp_dir)
                  project = case._project(root)
                  result = generate_project_batch(project, data_source="local", output_root=root / "batch", git_sha="generic")
                  assert result["expected_item_count"] == 1
          except Exception as exc:
              status = "failure"
              error = f"{type(exc).__name__}-{exc}"
              traceback.print_exc()
          finally:
              if case is not None:
                  try:
                      case.tearDown()
                  except Exception:
                      pass
          error = re.sub(r"[^A-Za-z0-9._-]+", "-", error).strip("-")[:160] or "unknown"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"status={status}\n")
              handle.write(f"error={error}\n")
          Path("generic-batch-diagnostic.txt").write_text(f"status={status}\nerror={error}\n", encoding="utf-8")
          PY
      - name: Upload generic batch diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: generic-batch-${{ steps.generic_batch_diag.outputs.status }}-${{ steps.generic_batch_diag.outputs.error }}
          path: generic-batch-diagnostic.txt
      - name: Stop on generic batch failure
        if: steps.generic_batch_diag.outputs.status != 'success'
        run: exit 1
      - name: Run generic core tests
        run: python -m unittest tests.test_instagram_factory_generic_core -v
      - name: Run historical fallback tests
        run: python -m unittest tests.test_instagram_factory_historical_fallback -v
      - name: Run party project tests
        run: python -m unittest tests.test_instagram_factory_party_project -v
      - name: Validate live party scenarios
        run: |
          python process/instagram_factory.py render-tests \
            --project instagram/projects/party_issue_profile_v1/project.yml \
            --data-source s3 \
            --output-root generated_party_live_tests \
            | tee party-live-validation.json
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: party-project-validation-${{ github.run_id }}
          path: |
            generated_party_live_tests/
            party-live-validation.json
          if-no-files-found: error
