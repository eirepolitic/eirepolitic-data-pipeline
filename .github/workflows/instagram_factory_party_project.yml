name: Instagram Content Factory party project validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commission:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Validate and generate live batch
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_profile_v1/project.yml
          python process/instagram_factory.py generate-batch \
            --project instagram/projects/party_issue_profile_v1/project.yml \
            --data-source s3 \
            --output-root generated_party_commissioning \
            --git-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            > commissioning-batch-report.json
          python process/instagram_factory.py build-review-index \
            --run-root generated_party_commissioning \
            > commissioning-review-index.json
      - name: Expose selected v0 baseline
        shell: bash
        run: |
          set -euo pipefail
          src="generated_party_commissioning/generated/fianna-fail"
          out="instagram/commissioning/output/fianna-fail/v0-baseline"
          rm -rf "$out"
          mkdir -p "$out/slides" "$out/metadata"
          cp "$src"/slides/*.png "$out/slides/"
          cp -R "$src"/slides/metadata "$out/metadata/slide_metadata"
          cp "$src"/item_manifest.json "$out/item_manifest.json"
          cp generated_party_commissioning/run_manifest.json "$out/run_manifest.json"
          cp generated_party_commissioning/review/review_state.json "$out/review_state.json"
          cp commissioning-review-index.json "$out/review_index.json"
          python <<'PY'
          import json
          from pathlib import Path
          out = Path("instagram/commissioning/output/fianna-fail/v0-baseline")
          summary = {
              "version": "v0-baseline",
              "selection_reason": "Largest classified-speech sample among named parties in the frozen production batch.",
              "content_period": {"start": "2024-12-18", "end": "2026-02-26"},
              "source_batch_id": "scheduled-weekly-33310991798-1",
              "post_status": "draft_review",
              "publication_allowed": False,
          }
          (out / "commissioning_summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          git commit -m "Expose Fianna Fail Instagram v0 baseline" || true
          git push
      - name: Upload commissioning evidence
        uses: actions/upload-artifact@v4
        with:
          name: instagram-party-v0-${{ github.run_id }}
          path: |
            generated_party_commissioning/
            commissioning-batch-report.json
            commissioning-review-index.json
          if-no-files-found: error
