name: Instagram Content Factory party project validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/instagram-content-factory-party-project
    paths:
      - "instagram/factory/**"
      - "instagram/catalogues/metrics.yml"
      - "instagram/visuals/data_mappings/party_issue_counts.yml"
      - "instagram/visuals/renderers/horizontal_bar.py"
      - "instagram/visuals/templates/horizontal_bar_draft_v1.yml"
      - "instagram/templates/layouts/title_text_media_v1.json"
      - "instagram/projects/party_issue_profile_v1/**"
      - "instagram/projects/constituency_issue_profile_v1/**"
      - "tests/test_instagram_factory_generic_core.py"
      - "tests/test_instagram_factory_party_project.py"
      - "tests/test_instagram_factory_historical_fallback.py"
      - ".github/workflows/instagram_factory_party_project.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Validate catalogues and party project
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_profile_v1/project.yml
      - name: Run generic core tests
        run: python -m unittest tests.test_instagram_factory_generic_core -v
      - name: Run historical fallback tests
        run: python -m unittest tests.test_instagram_factory_historical_fallback -v
      - name: Run party project tests
        run: python -m unittest tests.test_instagram_factory_party_project -v
      - name: Validate live party scenarios
        run: |
          python process/instagram_factory.py render-tests \
            --project instagram/projects/party_issue_profile_v1/project.yml \
            --data-source s3 \
            --output-root generated_party_live_tests \
            | tee party-live-validation.json
      - name: Summarize historical validation
        id: history_summary
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          manifest_path = Path("generated_party_live_tests/project_validation_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          history = manifest.get("historical_search", {})
          summary = {
              "loaded_batch_count": int(history.get("loaded_batch_count", 0) or 0),
              "available_batch_count": int(history.get("available_batch_count", 0) or 0),
              "replacement_count": int(history.get("replacement_count", 0) or 0),
              "replacement_scenarios": history.get("replacement_scenarios", []),
              "waived_scenario_count": int(manifest.get("waived_scenario_count", 0) or 0),
              "rendered_scenario_count": int(manifest.get("rendered_scenario_count", 0) or 0),
              "historical_status": history.get("status"),
          }
          Path("generated_party_live_tests/historical-validation-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"loaded={summary['loaded_batch_count']}\n")
              handle.write(f"replacements={summary['replacement_count']}\n")
              handle.write(f"waivers={summary['waived_scenario_count']}\n")
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: party-project-validation-${{ github.run_id }}-history-${{ steps.history_summary.outputs.loaded }}-replacements-${{ steps.history_summary.outputs.replacements }}-waivers-${{ steps.history_summary.outputs.waivers }}
          path: |
            generated_party_live_tests/
            party-live-validation.json
          if-no-files-found: error
