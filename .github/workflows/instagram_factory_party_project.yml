name: Instagram Party Chart Variant Review

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  chart-variant-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out commissioning branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image dependency
        run: pip install pillow

      - name: Recover historical rendered variants
        shell: bash
        run: |
          set -euo pipefail
          OUT="instagram/commissioning/output/chart-variant-review-2026-09-03"
          TMP="/tmp/chart-variant-runs"
          rm -rf "$OUT" "$TMP"
          mkdir -p "$OUT/candidates" "$TMP"

          # Successful chart-related workflow runs from Aug 31 through Sep 3.
          # The script extracts one common Fianna Fail chart from each artifact.
          RUNS=(
            33446672597
            33446842291
            33447051080
            33448590338
            33464254093
            33464602238
            33464994257
            33679523899
            33680998844
            33681142839
            33681694228
            33731887273
            33780442539
          )

          for run_id in "${RUNS[@]}"; do
            run_dir="$TMP/$run_id"
            mkdir -p "$run_dir"
            echo "Downloading run $run_id"
            if ! gh run download "$run_id" -D "$run_dir"; then
              echo "No downloadable artifact for run $run_id; skipping"
              continue
            fi

            candidate="$(find "$run_dir" -type f \( \
              -path '*/fianna-fail/slides/02_issue_profile.png' -o \
              -path '*/fianna-fail/slides/02_most_discussed_issues.png' \
            \) -print | head -n 1 || true)"

            if [ -z "$candidate" ]; then
              echo "No Fianna Fail chart candidate found in run $run_id"
              find "$run_dir" -type f -name '*.png' | head -n 20 || true
              continue
            fi
            cp "$candidate" "$OUT/candidates/run-${run_id}.png"
          done

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageChops

          root = Path('instagram/commissioning/output/chart-variant-review-2026-09-03')
          candidates = root / 'candidates'

          run_meta = {
              '33446672597': {'run_number': 200, 'date': '2026-08-31', 'family': 'Matplotlib original diagnostic'},
              '33446842291': {'run_number': 201, 'date': '2026-08-31', 'family': 'Matplotlib 2-line label hardening'},
              '33447051080': {'run_number': 202, 'date': '2026-08-31', 'family': 'Matplotlib 3-line label hardening'},
              '33448590338': {'run_number': 203, 'date': '2026-08-31', 'family': 'Matplotlib final January commissioning'},
              '33464254093': {'run_number': 212, 'date': '2026-09-01', 'family': 'Pillow monthly profile early'},
              '33464602238': {'run_number': 213, 'date': '2026-09-01', 'family': 'Pillow monthly profile left-aligned'},
              '33464994257': {'run_number': 214, 'date': '2026-09-01', 'family': 'Pillow monthly profile centered'},
              '33679523899': {'run_number': 215, 'date': '2026-09-02', 'family': 'Pillow monthly profile v2 commissioning'},
              '33680998844': {'run_number': 216, 'date': '2026-09-02', 'family': 'Pillow monthly profile v2 revision'},
              '33681142839': {'run_number': 218, 'date': '2026-09-02', 'family': 'Pillow monthly profile v2 revision'},
              '33681694228': {'run_number': 219, 'date': '2026-09-02', 'family': 'Pillow monthly profile v2 revision'},
              '33731887273': {'run_number': 236, 'date': '2026-09-03', 'family': 'Full v2 batch before chart rollback'},
              '33780442539': {'run_number': 239, 'date': '2026-09-03', 'family': 'Full v2 batch after chart rollback'},
          }

          records = []
          for path in sorted(candidates.glob('run-*.png')):
              run_id = path.stem.removeprefix('run-')
              raw = path.read_bytes()
              sha = hashlib.sha256(raw).hexdigest()
              with Image.open(path) as im:
                  im.load()
                  size = im.size
              records.append({
                  'run_id': run_id,
                  'sha256': sha,
                  'dimensions': list(size),
                  **run_meta.get(run_id, {}),
                  'candidate_file': str(path.relative_to(root)),
              })

          # Group exact duplicate PNGs by hash. Each unique hash is one real rendered variant.
          groups: dict[str, list[dict]] = {}
          for rec in records:
              groups.setdefault(rec['sha256'], []).append(rec)

          variants = []
          for index, (sha, group) in enumerate(groups.items(), start=1):
              representative = group[0]
              src = root / representative['candidate_file']
              filename = f"variant-{index:02d}-run-{representative['run_number']}-{representative['run_id']}.png"
              dst = root / filename
              dst.write_bytes(src.read_bytes())
              variants.append({
                  'variant': index,
                  'file': filename,
                  'sha256': sha,
                  'dimensions': representative['dimensions'],
                  'representative_run_id': representative['run_id'],
                  'representative_run_number': representative.get('run_number'),
                  'date': representative.get('date'),
                  'family': representative.get('family'),
                  'identical_runs': [item['run_id'] for item in group],
                  'identical_run_numbers': [item.get('run_number') for item in group],
              })

          # Extra visual dedupe check in case PNG metadata differs but pixels are identical.
          pixel_unique = []
          for variant in variants:
              path = root / variant['file']
              with Image.open(path) as im:
                  rgb = im.convert('RGB')
                  duplicate_of = None
                  for kept in pixel_unique:
                      with Image.open(root / kept['file']) as prior:
                          prior_rgb = prior.convert('RGB')
                          if rgb.size == prior_rgb.size and ImageChops.difference(rgb, prior_rgb).getbbox() is None:
                              duplicate_of = kept['variant']
                              break
                  if duplicate_of is None:
                      pixel_unique.append(variant)
                  else:
                      variant['pixel_duplicate_of_variant'] = duplicate_of

          true_variants = [v for v in variants if 'pixel_duplicate_of_variant' not in v]

          bold = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 24)
          regular = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 18)
          title_font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 34)

          card_w, card_h = 540, 700
          cols = 2
          rows = (len(true_variants) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * card_w, max(1, rows) * card_h + 90), 'white')
          draw_sheet = ImageDraw.Draw(sheet)
          draw_sheet.text((sheet.width // 2, 42), 'Recent Party Chart Variants — Fianna Fáil Example', fill='black', font=title_font, anchor='mm')

          for i, variant in enumerate(true_variants):
              with Image.open(root / variant['file']) as im:
                  thumb = im.convert('RGB')
                  thumb.thumbnail((480, 570), Image.Resampling.LANCZOS)
              card = Image.new('RGB', (card_w, card_h), 'white')
              x = (card_w - thumb.width) // 2
              card.paste(thumb, (x, 10))
              d = ImageDraw.Draw(card)
              y = 600
              d.text((card_w // 2, y), f"Variant {variant['variant']}: {variant['family']}", fill='black', font=bold, anchor='mm')
              d.text((card_w // 2, y + 34), f"Run #{variant['representative_run_number']} · {variant['date']}", fill='black', font=regular, anchor='mm')
              runs = ', '.join(f"#{n}" for n in variant['identical_run_numbers'] if n is not None)
              d.text((card_w // 2, y + 64), f"Same PNG in: {runs}", fill='black', font=regular, anchor='mm')
              row, col = divmod(i, cols)
              sheet.paste(card, (col * card_w, 90 + row * card_h))

          sheet.save(root / 'all-chart-variants-contact-sheet.jpg', quality=94)
          manifest = {
              'window': '2026-08-31 through 2026-09-03',
              'comparison_party': 'Fianna Fáil',
              'candidate_runs': records,
              'hash_groups': variants,
              'distinct_pixel_variants': true_variants,
              'distinct_variant_count': len(true_variants),
          }
          (root / 'variant-manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print(json.dumps({'distinct_variant_count': len(true_variants), 'variants': true_variants}, indent=2))
          PY

          rm -rf "$OUT/candidates"
          cd instagram/commissioning/output
          rm -f chart-variant-review-2026-09-03.zip
          zip -r chart-variant-review-2026-09-03.zip chart-variant-review-2026-09-03

      - name: Commit chart variant review pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/commissioning/output/chart-variant-review-2026-09-03
          git add instagram/commissioning/output/chart-variant-review-2026-09-03.zip
          git commit -m "Add artifact-derived recent chart variant review pack" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: chart-variant-review-${{ github.run_id }}
          path: |
            instagram/commissioning/output/chart-variant-review-2026-09-03/
            instagram/commissioning/output/chart-variant-review-2026-09-03.zip
          if-no-files-found: error
