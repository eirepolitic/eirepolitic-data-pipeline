name: Instagram Content Factory party project validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commission:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Apply strict visual-quality repairs
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # Give long taxonomy labels enough width to wrap at real word boundaries.
          path = Path("instagram/visuals/renderers/horizontal_bar.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("MAX_PLOT_LEFT = 0.36", "MAX_PLOT_LEFT = 0.40", 1)
          path.write_text(text, encoding="utf-8")

          # Propagate visual renderer warnings into the batch generation gate.
          path = Path("instagram/factory/generic_batch.py")
          text = path.read_text(encoding="utf-8")
          old = '''            asset_result = adapter.render_assets(item_dir, context, project)\n            visual_manifest = asset_result.get("visual_manifest")\n            for slide in sorted(project["slides"], key=lambda value: value["order"]):\n'''
          new = '''            asset_result = adapter.render_assets(item_dir, context, project)\n            visual_manifest = asset_result.get("visual_manifest")\n            visual_warnings = list((visual_manifest or {}).get("warnings") or [])\n            if visual_warnings:\n                raise ValueError(f"Visual warnings for {item_label}: {visual_warnings}")\n            for slide in sorted(project["slides"], key=lambda value: value["order"]):\n'''
          if old not in text:
              raise SystemExit("generic_batch visual warning insertion point not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/visuals/renderers/horizontal_bar.py instagram/factory/generic_batch.py
          git commit -m "Fail batch items on visual warnings and widen labels" || true
          git push
      - name: Validate and generate strict v2 batch
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_profile_v1/project.yml
          python process/instagram_factory.py generate-batch \
            --project instagram/projects/party_issue_profile_v1/project.yml \
            --data-source s3 \
            --output-root generated_party_commissioning \
            --git-sha "$(git rev-parse HEAD)" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            > commissioning-batch-report.json
          python process/instagram_factory.py build-review-index \
            --run-root generated_party_commissioning \
            > commissioning-review-index.json
      - name: Expose Fianna Fail v2 candidate
        shell: bash
        run: |
          set -euo pipefail
          src="generated_party_commissioning/generated/fianna-fail"
          out="instagram/commissioning/output/fianna-fail/v2-candidate"
          rm -rf "$out"
          mkdir -p "$out/slides" "$out/metadata"
          cp "$src"/slides/*.png "$out/slides/"
          cp -R "$src"/slides/metadata "$out/metadata/slide_metadata"
          cp "$src"/item_manifest.json "$out/item_manifest.json"
          cp "$src"/manifests/visual_manifest.json "$out/metadata/visual_manifest.json"
          cp "$src"/metadata/visual.json "$out/metadata/visual.json"
          cp generated_party_commissioning/run_manifest.json "$out/run_manifest.json"
          cp generated_party_commissioning/review/review_state.json "$out/review_state.json"
          cp commissioning-review-index.json "$out/review_index.json"
          python <<'PY'
          import json
          from pathlib import Path
          out = Path("instagram/commissioning/output/fianna-fail/v2-candidate")
          manifest = json.loads((out / "metadata/visual_manifest.json").read_text(encoding="utf-8"))
          summary = {
              "version": "v2-candidate",
              "strict_visual_warning_gate": True,
              "visual_warnings": manifest.get("warnings", []),
              "content_period": {"start": "2024-12-18", "end": "2026-02-26"},
              "source_batch_id": "scheduled-weekly-33310991798-1",
              "post_status": "draft_review",
              "publication_allowed": False,
          }
          (out / "commissioning_summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          git commit -m "Expose Fianna Fail Instagram v2 candidate" || true
          git push
      - name: Upload commissioning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-party-v2-${{ github.run_id }}
          path: |
            generated_party_commissioning/
            commissioning-batch-report.json
            commissioning-review-index.json
          if-no-files-found: warn
