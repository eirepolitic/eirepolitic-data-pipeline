name: Instagram Content Factory party project validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/instagram-content-factory-party-project
    paths:
      - "instagram/factory/**"
      - "instagram/renderer/template_renderer.py"
      - "instagram/catalogues/metrics.yml"
      - "instagram/visuals/data_mappings/party_issue_counts.yml"
      - "instagram/visuals/renderers/horizontal_bar.py"
      - "instagram/visuals/templates/horizontal_bar_draft_v1.yml"
      - "instagram/templates/layouts/title_text_media_v1.json"
      - "instagram/projects/party_issue_profile_v1/**"
      - "instagram/projects/constituency_issue_profile_v1/**"
      - "tests/fixtures/instagram/**"
      - "tests/test_instagram_factory_generic_core.py"
      - "tests/test_instagram_factory_party_project.py"
      - "tests/test_instagram_factory_constituency_project.py"
      - "tests/test_instagram_factory_historical_fallback.py"
      - ".github/workflows/instagram_factory_party_project.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Validate catalogues and projects
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_profile_v1/project.yml
          python process/instagram_factory.py validate-project --project instagram/projects/constituency_issue_profile_v1/project.yml
      - name: Run generic core tests
        run: python -m unittest tests.test_instagram_factory_generic_core -v
      - name: Run historical fallback tests
        run: python -m unittest tests.test_instagram_factory_historical_fallback -v
      - name: Run constituency project tests
        id: constituency
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_instagram_factory_constituency_project -v > constituency-two-column-test.txt 2>&1
          status=$?
          cat constituency-two-column-test.txt
          python <<'PY'
          import os, re
          from pathlib import Path
          raw = Path("constituency-two-column-test.txt").read_text(encoding="utf-8", errors="replace")
          candidates = [line.strip() for line in raw.splitlines() if any(token in line for token in ("AssertionError", "ValueError:", "TypeError:", "KeyError:"))]
          summary = candidates[-1] if candidates else next((line.strip() for line in reversed(raw.splitlines()) if line.strip()), "unknown")
          slug = re.sub(r"[^A-Za-z0-9._-]+", "-", summary).strip("-")[:140] or "unknown"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"status={os.environ.get('STATUS','')}\n")
              handle.write(f"error_slug={slug}\n")
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload constituency two-column diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constituency-two-column-${{ steps.constituency.outputs.status || 'unknown' }}-${{ steps.constituency.outputs.error_slug || 'unknown' }}-${{ github.run_id }}
          path: constituency-two-column-test.txt
          if-no-files-found: error
      - name: Enforce constituency project tests
        run: test "${{ steps.constituency.outputs.status }}" = "0"
      - name: Run party project tests
        run: python -m unittest tests.test_instagram_factory_party_project -v
      - name: Validate live party scenarios
        run: |
          python process/instagram_factory.py render-tests \
            --project instagram/projects/party_issue_profile_v1/project.yml \
            --data-source s3 \
            --output-root generated_party_live_tests \
            > party-live-validation.json
      - name: Verify and export dense full contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json, shutil
          from pathlib import Path
          from PIL import Image
          from instagram.factory.validation_contact_sheet import build_validation_contact_sheet

          report = json.loads(Path("party-live-validation.json").read_text(encoding="utf-8"))
          root = Path(report["output_root"])
          density = report.get("density_validation") or {}
          if not density.get("success"):
              raise SystemExit(f"Density validation failed: {density}")
          if int(density["metrics"]["item_count_max"]["displayed_item_count"]) < 6:
              raise SystemExit(f"Dense maximum missing: {density}")
          if int(density["metrics"]["real_example"]["displayed_item_count"]) < 5:
              raise SystemExit(f"Dense representative missing: {density}")
          sheet = build_validation_contact_sheet(root=root, project_id=str(report["project_id"]), scenario_manifests=report["scenario_manifests"], scenario_order=report["required_scenarios"])
          primary = root / "validation_contact_sheet.png"
          if not primary.is_file():
              raise SystemExit(f"Primary contact sheet was not created: {primary}")
          full = sheet.get("full") or {}
          rendered = set(full.get("scenario_rows") or [])
          waived = set(full.get("waived_scenarios") or [])
          represented = rendered | waived
          required = {name for name in report["required_scenarios"] if name not in {"minimum", "maximum"}}
          if represented != required:
              raise SystemExit(f"Scenario mismatch: missing={sorted(required - represented)}; unexpected={sorted(represented - required)}")
          with Image.open(primary) as image:
              dimensions = image.size
          export = Path("contact_sheet_export")
          export.mkdir(parents=True, exist_ok=True)
          shutil.copy2(primary, export / "validation_contact_sheet.png")
          (export / "contact-sheet-verification.json").write_text(json.dumps({"source_output_root": str(root), "image_dimensions": list(dimensions), "rendered_scenarios": sorted(rendered), "waived_scenarios": sorted(waived), "density_validation": density, "verification_success": True}, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload verified dense full contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: verified-dense-full-contact-sheet-${{ github.run_id }}
          path: contact_sheet_export/
          if-no-files-found: error
