name: Instagram Content Factory party project validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commission:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Validate project
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_profile_v1/project.yml
      - name: Generate live commissioning batch and preserve diagnostics
        shell: bash
        run: |
          set +e
          python process/instagram_factory.py generate-batch \
            --project instagram/projects/party_issue_profile_v1/project.yml \
            --data-source s3 \
            --output-root generated_party_commissioning \
            --git-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            > commissioning-batch-report.json
          code=$?
          set -e
          echo "$code" > commissioning-generate-exit-code.txt
          cat commissioning-batch-report.json
      - name: Build compact diagnostic summary
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          from instagram.factory.party_adapter import load_party_records
          from instagram.factory.constituency_pilot import load_source_rows

          root = Path("generated_party_commissioning")
          cli_report = json.loads(Path("commissioning-batch-report.json").read_text(encoding="utf-8"))
          records, source_manifest, join_manifest = load_party_records("s3")
          _, speeches, _ = load_source_rows("s3")
          speech_fields = sorted({str(k) for row in speeches[:100] for k in row.keys()})
          date_fields = [
              field for field in speech_fields
              if any(token in field.lower() for token in ("date", "time", "sitting", "debate"))
          ]
          date_samples = {}
          for field in date_fields:
              values = [str(row.get(field) or "").strip() for row in speeches if str(row.get(field) or "").strip()]
              date_samples[field] = {
                  "non_empty_count": len(values),
                  "sample": values[:5],
                  "lexicographic_min": min(values) if values else None,
                  "lexicographic_max": max(values) if values else None,
              }

          summary = {
              "generate_exit_code": int(Path("commissioning-generate-exit-code.txt").read_text().strip()),
              "cli_success": cli_report.get("success"),
              "cli_errors": cli_report.get("errors"),
              "source_manifest": source_manifest,
              "join_manifest": join_manifest,
              "speech_fields": speech_fields,
              "date_field_diagnostics": date_samples,
              "party_records": [
                  {
                      "party": r.get("party"),
                      "party_key": r.get("party_key"),
                      "member_count": r.get("member_count"),
                      "speech_count": r.get("speech_count"),
                      "issue_count": r.get("issue_count"),
                      "top_issues": (r.get("issue_rows") or [])[:7],
                      "data_origin": r.get("data_origin"),
                      "source_batch_id": r.get("source_batch_id"),
                  }
                  for r in records
              ],
          }
          run_path = root / "run_manifest.json"
          if run_path.exists():
              run = json.loads(run_path.read_text(encoding="utf-8"))
              summary["run"] = {
                  "project_id": run.get("project_id"),
                  "run_id": run.get("run_id"),
                  "git_sha": run.get("git_sha"),
                  "source_batch_id": run.get("source_batch_id"),
                  "state": run.get("state"),
                  "expected_item_count": run.get("expected_item_count"),
                  "succeeded_item_count": run.get("succeeded_item_count"),
                  "failed_item_count": run.get("failed_item_count"),
                  "failures": run.get("failures"),
              }
              item_errors = []
              for slug in run.get("item_order", []):
                  item_ref = (run.get("items") or {}).get(slug) or {}
                  manifest_path = root / str(item_ref.get("manifest") or "")
                  if not manifest_path.is_file():
                      continue
                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                  item = {
                      "slug": slug,
                      "label": manifest.get("item_label"),
                      "status": manifest.get("status"),
                      "errors": manifest.get("errors"),
                      "slide_count": len(manifest.get("slides") or []),
                  }
                  if manifest.get("status") == "failed":
                      render_metrics = []
                      metrics_root = root / "generated" / slug / "slides" / "metadata" / "manifests"
                      if metrics_root.exists():
                          for path in sorted(metrics_root.glob("*.render_manifest.json")):
                              doc = json.loads(path.read_text(encoding="utf-8"))
                              render_metrics.append({
                                  "file": path.name,
                                  "warnings": doc.get("warnings"),
                                  "text_metrics": doc.get("text_metrics"),
                              })
                      item["render_metrics"] = render_metrics
                  item_errors.append(item)
              summary["items"] = item_errors
          out = Path("instagram/commissioning")
          out.mkdir(parents=True, exist_ok=True)
          path = out / "party_e2e_trial_compact.json"
          path.write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Commit compact diagnostic summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/commissioning/party_e2e_trial_compact.json
          git commit -m "Record detailed Instagram commissioning diagnostics" || true
          git push
      - name: Build review index when batch exists
        if: ${{ hashFiles('generated_party_commissioning/run_manifest.json') != '' }}
        run: |
          python process/instagram_factory.py build-review-index \
            --run-root generated_party_commissioning \
            > commissioning-review-index.json || true
      - name: Upload commissioning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-party-commissioning-${{ github.run_id }}
          path: |
            generated_party_commissioning/
            commissioning-batch-report.json
            commissioning-review-index.json
            commissioning-generate-exit-code.txt
            instagram/commissioning/party_e2e_trial_compact.json
          if-no-files-found: warn
      - name: Fail if generation failed
        shell: bash
        run: |
          code=$(cat commissioning-generate-exit-code.txt)
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
