name: Instagram January Party Over-Index Commissioning

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-january-overindex:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Validate
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_share_overindex_jan2026/project.yml
      - name: Generate share batch and preserve raw report
        shell: bash
        run: |
          set +e
          python process/instagram_factory.py generate-batch \
            --project instagram/projects/party_issue_share_overindex_jan2026/project.yml \
            --data-source s3 \
            --output-root generated_january_share_overindex \
            --git-sha "$(git rev-parse HEAD)" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            > january-share-report.txt 2>&1
          code=$?
          set -e
          mkdir -p instagram/commissioning/diagnostics
          cp january-share-report.txt instagram/commissioning/diagnostics/january-share-report.txt
          printf '%s\n' "$code" > instagram/commissioning/diagnostics/january-share-exit-code.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/commissioning/diagnostics/january-share-report.txt instagram/commissioning/diagnostics/january-share-exit-code.txt
          git commit -m "Record raw January share over-index diagnostic" || true
          git push
          echo "generation_exit_code=$code"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: january-share-diagnostics-${{ github.run_id }}
          path: |
            january-share-report.txt
            generated_january_share_overindex/
          if-no-files-found: warn
