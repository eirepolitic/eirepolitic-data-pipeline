name: Instagram Party Monthly Profile v2 Commissioning

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  all-party-cover-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out v2 commissioning branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pillow pyyaml

      - name: Promote approved Social Democrats boxed-purple logo
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          from datetime import datetime, timezone

          import boto3
          from PIL import Image

          bucket = 'eirepolitic-data'
          prefix = 'processed/reference/party_assets/'
          canonical_key = 'processed/reference/party_assets/v1/assets/social-democrats/logo.png'
          s3 = boto3.client('s3', region_name='ca-central-1')

          candidates = []
          paginator = s3.get_paginator('list_objects_v2')
          for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
              for obj in page.get('Contents', []):
                  key = obj['Key']
                  low = key.lower()
                  party_match = 'social-democrat' in low or 'social_democrat' in low
                  variant_match = (
                      'boxed_purple_selected' in low
                      or 'boxed-purple-selected' in low
                      or 'sd_boxed_purple_selected' in low
                  )
                  if party_match and variant_match and key != canonical_key:
                      candidates.append(key)

          candidates = sorted(set(candidates))
          print('Approved Social Democrats candidate matches:')
          for key in candidates:
              print(f'  {key}')
          if len(candidates) != 1:
              raise RuntimeError(
                  f'Expected exactly one archived boxed-purple-selected Social Democrats asset; found {len(candidates)}'
              )

          selected_key = candidates[0]
          selected = s3.get_object(Bucket=bucket, Key=selected_key)['Body'].read()
          with Image.open(io.BytesIO(selected)) as im:
              im.load()
              print(f'Selected candidate image: {im.format} {im.size} {im.mode}')
              if im.format != 'PNG':
                  raise RuntimeError(f'Approved candidate must be PNG, found {im.format}')
              if im.size != (1600, 1600):
                  raise RuntimeError(f'Approved candidate must already satisfy 1600x1600 contract, found {im.size}')

          # Preserve the current canonical object before replacement.
          try:
              current = s3.get_object(Bucket=bucket, Key=canonical_key)['Body'].read()
          except s3.exceptions.NoSuchKey:
              current = None
          if current:
              current_sha = hashlib.sha256(current).hexdigest()
              backup_key = (
                  'processed/reference/party_assets/v1/history/social-democrats/'
                  f'logo-before-boxed-purple-selected-{current_sha[:12]}.png'
              )
              s3.put_object(
                  Bucket=bucket,
                  Key=backup_key,
                  Body=current,
                  ContentType='image/png',
                  Metadata={'reason': 'pre-user-approved-boxed-purple-selected-backup'},
              )
              print(f'Backed up previous canonical asset to s3://{bucket}/{backup_key}')

          selected_sha = hashlib.sha256(selected).hexdigest()
          s3.put_object(
              Bucket=bucket,
              Key=canonical_key,
              Body=selected,
              ContentType='image/png',
              Metadata={
                  'approved-variant': 'sd_boxed_purple_selected_v1',
                  'source-key': selected_key,
                  'sha256': selected_sha,
                  'approval': 'user-confirmed',
                  'promoted-at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              },
          )

          promoted = s3.get_object(Bucket=bucket, Key=canonical_key)['Body'].read()
          if hashlib.sha256(promoted).hexdigest() != selected_sha:
              raise RuntimeError('Canonical Social Democrats logo hash does not match approved candidate after upload')
          with Image.open(io.BytesIO(promoted)) as im:
              if im.format != 'PNG' or im.size != (1600, 1600):
                  raise RuntimeError(f'Promoted canonical asset failed PNG/1600x1600 validation: {im.format} {im.size}')

          print(f'PROMOTED_SOCIAL_DEMOCRATS_SOURCE=s3://{bucket}/{selected_key}')
          print(f'PROMOTED_SOCIAL_DEMOCRATS_CANONICAL=s3://{bucket}/{canonical_key}')
          print(f'PROMOTED_SOCIAL_DEMOCRATS_SHA256={selected_sha}')
          PY

      - name: Render all-party July 2026 v2 cover review
        run: python -m instagram.commissioning.render_party_logo_cover_v2

      - name: Validate rendered review package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('instagram/commissioning/output/party-logo-cover-v2-review')
          manifest = json.loads((root / 'review-manifest.json').read_text(encoding='utf-8'))
          assert manifest['party_count'] == 11, manifest['party_count']
          assert manifest['cover_title'] == 'Party Speech Breakdown', manifest.get('cover_title')
          covers = sorted(root.glob('*-cover.png'))
          lineage = sorted(root.glob('*-cover-lineage.json'))
          assert len(covers) == 11, len(covers)
          assert len(lineage) == 11, len(lineage)
          for p in covers:
              with Image.open(p) as im:
                  assert im.size == (1080, 1350), (p, im.size)
          sheet = root / 'all-party-covers-contact-sheet.png'
          with Image.open(sheet) as im:
              assert im.size[0] > 0 and im.size[1] > 0, im.size
          for item in manifest['covers']:
              assert item['party_asset_registry'] == 'configs/reference/party_assets_v1.csv'
              asset = item['party_asset']
              assert asset['dimensions'] == [1600, 1600], asset
              assert asset['logo_s3_uri'].endswith(f"/{item['party_key']}/logo.png"), asset['logo_s3_uri']
          print('PASS: title, 11 covers, registry-backed 1600x1600 logos, contact sheet present')
          PY

      - name: Commit review outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/commissioning/output/party-logo-cover-v2-review
          git commit -m "Render July 2026 party speech breakdown cover review" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: party-logo-cover-v2-review-${{ github.run_id }}
          path: instagram/commissioning/output/party-logo-cover-v2-review/
          if-no-files-found: error
