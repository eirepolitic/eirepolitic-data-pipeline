name: Instagram Party Monthly Profile Commissioning

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Completed month to render (YYYY-MM or last_completed_month)"
        required: true
        default: "2026-07"

permissions:
  contents: write

concurrency:
  group: instagram-party-monthly-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      PYTHONPATH: ${{ github.workspace }}
      OUTPUT_DIR: instagram/commissioning/output/party_issue_monthly_profile_v1/period=${{ inputs.period }}
    steps:
      - name: Check out commissioning branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pillow pyyaml

      - name: Render and QA five-slide monthly party batch
        id: render_batch
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$OUTPUT_DIR"
          set -o pipefail
          python -m instagram.factory.party_monthly_profile --period "${{ inputs.period }}" 2>&1 | tee "$OUTPUT_DIR/run.log"

      - name: Show run summary when available
        if: always()
        run: |
          if [ -f "$OUTPUT_DIR/run_manifest.json" ]; then
            cat "$OUTPUT_DIR/run_manifest.json"
          else
            cat "$OUTPUT_DIR/run.log"
          fi

      - name: Commit review outputs and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_DIR"
          git commit -m "Render party monthly profile for ${{ inputs.period }}" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: party-monthly-profile-${{ inputs.period }}-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error

      - name: Enforce render result
        if: steps.render_batch.outcome != 'success'
        run: exit 1
