name: Instagram Content Factory party project validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/instagram-content-factory-party-project
    paths:
      - "instagram/factory/**"
      - "instagram/renderer/template_renderer.py"
      - "instagram/catalogues/metrics.yml"
      - "instagram/visuals/data_mappings/party_issue_counts.yml"
      - "instagram/visuals/renderers/horizontal_bar.py"
      - "instagram/visuals/templates/horizontal_bar_draft_v1.yml"
      - "instagram/templates/layouts/title_text_media_v1.json"
      - "instagram/projects/party_issue_profile_v1/**"
      - "instagram/projects/constituency_issue_profile_v1/**"
      - "tests/test_instagram_factory_generic_core.py"
      - "tests/test_instagram_factory_party_project.py"
      - "tests/test_instagram_factory_constituency_project.py"
      - "tests/test_instagram_factory_historical_fallback.py"
      - ".github/workflows/instagram_factory_party_project.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Validate catalogues and projects
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_profile_v1/project.yml
          python process/instagram_factory.py validate-project --project instagram/projects/constituency_issue_profile_v1/project.yml
      - name: Run generic core tests
        run: python -m unittest tests.test_instagram_factory_generic_core -v
      - name: Run historical fallback tests
        run: python -m unittest tests.test_instagram_factory_historical_fallback -v
      - name: Run constituency project tests
        run: python -m unittest tests.test_instagram_factory_constituency_project -v
      - name: Run party project tests
        run: python -m unittest tests.test_instagram_factory_party_project -v
      - name: Validate live party scenarios
        run: |
          python process/instagram_factory.py render-tests \
            --project instagram/projects/party_issue_profile_v1/project.yml \
            --data-source s3 \
            --output-root generated_party_live_tests \
            | tee party-live-validation.json
      - name: Locate, verify, and export contact sheets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf exported_contact_sheets
          mkdir -p exported_contact_sheets
          python <<'PY'
          import json
          import shutil
          from pathlib import Path

          candidates = sorted(Path(".").rglob("validation_contact_sheet_manifest.json"))
          selected = None
          project_manifest = None
          contact_manifest = None
          for candidate in candidates:
              root = candidate.parent
              project_path = root / "project_validation_manifest.json"
              if not project_path.is_file():
                  continue
              project = json.loads(project_path.read_text(encoding="utf-8"))
              contact = json.loads(candidate.read_text(encoding="utf-8"))
              if project.get("project_id") == "party_issue_profile_v1":
                  selected = root
                  project_manifest = project
                  contact_manifest = contact
                  break

          if selected is None or project_manifest is None or contact_manifest is None:
              raise SystemExit(
                  "No party_issue_profile_v1 validation_contact_sheet_manifest.json was found. "
                  f"Candidates: {[str(path) for path in candidates]}"
              )

          full = contact_manifest.get("full") or {}
          rendered = set(full.get("scenario_rows") or [])
          waived = set(full.get("waived_scenarios") or [])
          represented = rendered | waived
          required = {
              name
              for name in project_manifest.get("required_scenarios") or []
              if name not in {"minimum", "maximum"}
          }

          expected_layout = "full_review_plus_deduplicated_summary_plus_complete_audit"
          if contact_manifest.get("layout") != expected_layout:
              raise SystemExit(
                  f"Unexpected layout {contact_manifest.get('layout')!r}; expected {expected_layout!r}"
              )
          if represented != required:
              raise SystemExit(
                  "Primary contact sheet scenario mismatch: "
                  f"missing={sorted(required - represented)}, "
                  f"unexpected={sorted(represented - required)}"
              )

          primary = selected / "validation_contact_sheet.png"
          summary = selected / "validation_summary_contact_sheet.png"
          audit_files = sorted(selected.glob("validation_audit_contact_sheet*.png"))
          missing = [str(path) for path in (primary, summary) if not path.is_file()]
          if missing or not audit_files:
              raise SystemExit(
                  f"Generated contact-sheet files missing. missing={missing}, "
                  f"audit_files={[str(path) for path in audit_files]}, selected_root={selected}"
              )

          export_root = Path("exported_contact_sheets")
          shutil.copy2(primary, export_root / "validation_contact_sheet.png")
          shutil.copy2(summary, export_root / "validation_summary_contact_sheet.png")
          for path in audit_files:
              shutil.copy2(path, export_root / path.name)

          evidence = {
              "selected_root": str(selected),
              "layout": contact_manifest.get("layout"),
              "primary_file": "validation_contact_sheet.png",
              "rendered_scenarios": sorted(rendered),
              "waived_scenarios": sorted(waived),
              "required_scenarios": sorted(required),
              "represented_scenario_count": len(represented),
              "required_scenario_count": len(required),
              "verification_success": True,
          }
          (export_root / "contact-sheet-verification.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
          ls -lah exported_contact_sheets
      - name: Upload verified full primary contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: party-full-contact-sheet-${{ github.run_id }}
          path: |
            exported_contact_sheets/validation_contact_sheet.png
            exported_contact_sheets/contact-sheet-verification.json
          if-no-files-found: error
      - name: Upload verified summary contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: party-summary-contact-sheet-${{ github.run_id }}
          path: exported_contact_sheets/validation_summary_contact_sheet.png
          if-no-files-found: error
      - name: Upload verified audit contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: party-audit-contact-sheets-${{ github.run_id }}
          path: exported_contact_sheets/validation_audit_contact_sheet*.png
          if-no-files-found: error
      - name: Upload complete validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: party-project-validation-${{ github.run_id }}
          path: |
            generated_party_live_tests/
            party-live-validation.json
            exported_contact_sheets/
          if-no-files-found: error
