name: Instagram Content Factory party project validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-review-previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: pip install pillow
      - name: Create compact review previews
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64

          root = Path('instagram/commissioning/output/fianna-fail/v3-publication-candidate')
          out = root / 'review_previews'
          out.mkdir(parents=True, exist_ok=True)
          for src in sorted((root / 'slides').glob('*.png')):
              im = Image.open(src).convert('RGB')
              im.thumbnail((480, 600), Image.Resampling.LANCZOS)
              jpg = out / f'{src.stem}.jpg'
              im.save(jpg, 'JPEG', quality=72, optimize=True)
              b64 = base64.b64encode(jpg.read_bytes()).decode('ascii')
              (out / f'{src.stem}.b64.txt').write_text(b64, encoding='ascii')
          PY
      - name: Commit review previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/commissioning/output/fianna-fail/v3-publication-candidate/review_previews
          git commit -m "Add compact review previews" || true
          git push
