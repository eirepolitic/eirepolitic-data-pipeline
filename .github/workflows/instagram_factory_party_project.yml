name: Instagram Content Factory party project validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/instagram-content-factory-party-project
    paths:
      - "instagram/factory/**"
      - "instagram/catalogues/metrics.yml"
      - "instagram/visuals/data_mappings/party_issue_counts.yml"
      - "instagram/visuals/renderers/horizontal_bar.py"
      - "instagram/visuals/templates/horizontal_bar_draft_v1.yml"
      - "instagram/templates/layouts/title_text_media_v1.json"
      - "instagram/projects/party_issue_profile_v1/**"
      - "instagram/projects/constituency_issue_profile_v1/**"
      - "tests/test_instagram_factory_generic_core.py"
      - "tests/test_instagram_factory_party_project.py"
      - "tests/test_instagram_factory_constituency_project.py"
      - "tests/test_instagram_factory_historical_fallback.py"
      - ".github/workflows/instagram_factory_party_project.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-content-factory-party-project
          fetch-depth: 0
      - name: Apply measured text-bound wiring
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("instagram/factory/generic_tests.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '''            layout_quality = validate_slide_layout(
                template=layout,
                bindings=bindings,
                output_path=output_path,
            )
''',
              '''            layout_quality = validate_slide_layout(
                template=layout,
                bindings=bindings,
                output_path=output_path,
                element_metrics=result.element_metrics,
            )
''',
              1,
          )
          text = text.replace(
              '''                "warnings": [],
                "layout_quality": layout_quality,
                "visual_quality": visual_quality,
''',
              '''                "warnings": [],
                "element_metrics": result.element_metrics,
                "layout_quality": layout_quality,
                "visual_quality": visual_quality,
''',
              1,
          )
          text = text.replace(
              '''            "visual_plot_utilization": True,
            "historical_real_data_fallback": True,
''',
              '''            "visual_plot_utilization": True,
            "title_text_bounds": True,
            "chart_text_bounds": True,
            "dynamic_text_sizing": True,
            "historical_real_data_fallback": True,
''',
              1,
          )
          path.write_text(text, encoding="utf-8")

          party_path = Path("tests/test_instagram_factory_party_project.py")
          party = party_path.read_text(encoding="utf-8")
          marker = '                        self.assertTrue(slide["layout_quality"]["success"])\n'
          addition = '''                        self.assertTrue(slide["layout_quality"]["success"])
                        for text_metric in slide["layout_quality"].get("text", {}).values():
                            self.assertFalse(text_metric["clipped"])
                            self.assertFalse(text_metric["truncated"])
                            self.assertGreaterEqual(text_metric["final_font_size"], 42)
'''
          if marker in party and addition not in party:
              party = party.replace(marker, addition, 1)
          party = party.replace(
              '                            self.assertLessEqual(quality["metrics"]["max_value_label_x_ratio"], 0.93)\n',
              '''                            self.assertLessEqual(quality["metrics"]["max_value_label_x_ratio"], 0.98)
                            self.assertEqual(quality["metrics"]["category_text_clipped_count"], 0)
                            self.assertEqual(quality["metrics"]["value_text_clipped_count"], 0)
                            self.assertEqual(quality["metrics"]["truncated_label_count"], 0)
''',
              1,
          )
          party_path.write_text(party, encoding="utf-8")

          constituency_path = Path("tests/test_instagram_factory_constituency_project.py")
          constituency = constituency_path.read_text(encoding="utf-8")
          if marker in constituency and addition not in constituency:
              constituency = constituency.replace(marker, addition, 1)
          constituency_path.write_text(constituency, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/factory/generic_tests.py tests/test_instagram_factory_party_project.py tests/test_instagram_factory_constituency_project.py
          git commit -m "feat(instagram): enforce measured text bounds in validation" || true
          git push origin HEAD:feature/instagram-content-factory-party-project
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow matplotlib boto3 requests
      - name: Validate catalogues and projects
        run: |
          python process/instagram_factory.py validate-catalogues
          python process/instagram_factory.py validate-project --project instagram/projects/party_issue_profile_v1/project.yml
          python process/instagram_factory.py validate-project --project instagram/projects/constituency_issue_profile_v1/project.yml
      - name: Run generic core tests
        run: python -m unittest tests.test_instagram_factory_generic_core -v
      - name: Run historical fallback tests
        run: python -m unittest tests.test_instagram_factory_historical_fallback -v
      - name: Run constituency project tests
        run: python -m unittest tests.test_instagram_factory_constituency_project -v
      - name: Run party project tests
        run: python -m unittest tests.test_instagram_factory_party_project -v
      - name: Validate live party scenarios
        run: |
          python process/instagram_factory.py render-tests \
            --project instagram/projects/party_issue_profile_v1/project.yml \
            --data-source s3 \
            --output-root generated_party_live_tests \
            | tee party-live-validation.json
      - name: Summarize historical validation
        id: history_summary
        shell: bash
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path

          candidates = list(Path(".").glob("**/project_validation_manifest.json"))
          if not candidates:
              raise SystemExit("project_validation_manifest.json was not generated")
          manifest_path = next((path for path in candidates if "generated_party_live_tests" in path.parts), candidates[0])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          history = manifest.get("historical_search") or {}
          summary = {
              "manifest_path": str(manifest_path),
              "loaded_batch_count": int(history.get("loaded_batch_count", 0) or 0),
              "available_batch_count": int(history.get("available_batch_count", 0) or 0),
              "replacement_count": int(history.get("replacement_count", 0) or 0),
              "replacement_scenarios": history.get("replacement_scenarios") or [],
              "waived_scenario_count": int(manifest.get("waived_scenario_count", 0) or 0),
              "rendered_scenario_count": int(manifest.get("rendered_scenario_count", 0) or 0),
              "historical_status": history.get("status"),
          }
          output_dir = manifest_path.parent
          (output_dir / "historical-validation-summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"loaded={summary['loaded_batch_count']}\n")
              handle.write(f"replacements={summary['replacement_count']}\n")
              handle.write(f"waivers={summary['waived_scenario_count']}\n")
          PY
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: party-project-validation-${{ github.run_id }}-history-${{ steps.history_summary.outputs.loaded || 'unknown' }}-replacements-${{ steps.history_summary.outputs.replacements || 'unknown' }}-waivers-${{ steps.history_summary.outputs.waivers || 'unknown' }}
          path: |
            generated_party_live_tests/
            party-live-validation.json
          if-no-files-found: warn
