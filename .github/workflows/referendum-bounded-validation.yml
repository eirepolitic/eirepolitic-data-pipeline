name: Temporary referendum bounded validation

on:
  workflow_dispatch:
  push:
    branches:
      - docs/referendum-data-validation-20260903
    paths:
      - .github/workflows/referendum-bounded-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/referendum-data-validation-20260903

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate four referendum resources through CKAN datastore
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          RESOURCES={
              '1986':'9680852f-a565-4e7c-a3d2-bcda06b3aeb4',
              '1992':'393fd6af-58fc-4cfb-9a18-e86b4c2c2129',
              '2015':'b09cbfc7-944c-468d-a742-573d2337c9fb',
              '2018':'fc638461-6f69-463d-b330-ed05fd1de549',
          }
          UA='Mozilla/5.0 EirePolitic research validation'
          out=[]; sets={}; schemas={}

          def fetch_json(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))

          def n(v):
              s=str(v or '').strip().replace(',','').replace('%','')
              return None if s=='' else float(s)

          def pick(keys,*needles):
              for k in keys:
                  low=' '.join(k.lower().replace('_',' ').replace('-',' ').split())
                  if all(x in low for x in needles): return k
              return None

          for year,rid in RESOURCES.items():
              url='https://opendata.housing.gov.ie/api/3/action/datastore_search?'+urllib.parse.urlencode({'resource_id':rid,'limit':5000})
              obj=fetch_json(url); result=obj['result']; rows=result['records']; fields=[f['id'] for f in result['fields'] if f['id']!='_id']
              schemas[year]=fields
              con=pick(fields,'constituency'); electorate=pick(fields,'electorate'); poll=pick(fields,'total','poll'); pct=pick(fields,'percentage','poll'); favour=pick(fields,'favour') or pick(fields,'favor'); against=pick(fields,'against'); spoilt=pick(fields,'spoilt') or pick(fields,'invalid')
              out += [f'[{year}]',f'resource_id={rid}',f'rows={len(rows)}','fields='+'|'.join(fields),f'constituency_field={con}',f'electorate_field={electorate}',f'total_poll_field={poll}',f'percentage_field={pct}',f'favour_field={favour}',f'against_field={against}',f'spoilt_field={spoilt}']
              cons=[str(r.get(con,'')).strip() for r in rows]; sets[year]=set(cons)
              out += [f'constituencies={len(sets[year])}',f'duplicate_constituency_rows={len(cons)-len(sets[year])}','constituency_sample='+'|'.join(cons[:12])]
              for f in fields:
                  out.append(f'missing_{f}={sum(str(r.get(f,"" )).strip()=="" for r in rows)}')

              vote_bad=[]; turnout_bad=[]; negative=[]; parse_bad=[]
              for idx,r in enumerate(rows,start=1):
                  try:
                      vals={'electorate':n(r[electorate]),'poll':n(r[poll]),'pct':n(r[pct]),'for':n(r[favour]),'against':n(r[against]),'spoilt':n(r[spoilt])}
                      if any(v is None for v in vals.values()):
                          parse_bad.append((idx,r.get(con),vals)); continue
                      if any(v<0 for v in vals.values()): negative.append((idx,r.get(con),vals))
                      if abs(vals['poll']-(vals['for']+vals['against']+vals['spoilt']))>0.000001:
                          vote_bad.append((idx,r.get(con),vals))
                      calc=100*vals['poll']/vals['electorate'] if vals['electorate'] else None
                      if calc is not None and abs(calc-vals['pct'])>0.11:
                          turnout_bad.append((idx,r.get(con),vals['pct'],calc))
                  except Exception as e:
                      parse_bad.append((idx,r.get(con),type(e).__name__,str(e)))
              out += [f'negative_rows={len(negative)}',f'vote_total_mismatches={len(vote_bad)}',f'turnout_mismatches_gt_0_11pp={len(turnout_bad)}',f'parse_or_missing_rows={len(parse_bad)}']
              for x in vote_bad[:10]: out.append('vote_total_mismatch_detail='+repr(x))
              for x in turnout_bad[:10]: out.append('turnout_mismatch_detail='+repr(x))
              for x in parse_bad[:10]: out.append('parse_missing_detail='+repr(x))
              out.append('')

          out.append('[cross_year]')
          def canon(fields):
              vals=[]
              for f in fields:
                  x=' '.join(f.lower().replace('_',' ').replace('-',' ').split())
                  x=x.replace('total electorate','electorate')
                  vals.append(x)
              return vals
          ys=list(RESOURCES)
          for a,b in zip(ys,ys[1:]):
              out += [f'headers_exact_equal_{a}_{b}={schemas[a]==schemas[b]}',f'headers_canonical_equal_{a}_{b}={canon(schemas[a])==canon(schemas[b])}',f'constituencies_only_{a}_vs_{b}='+'|'.join(sorted(sets[a]-sets[b])),f'constituencies_only_{b}_vs_{a}='+'|'.join(sorted(sets[b]-sets[a]))]

          path=Path('tmp/referendum_datastore_validation.txt')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text('\n'.join(out)+'\n',encoding='utf-8')
          print(path.read_text())
          PY

      - name: Commit temporary datastore report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/referendum_datastore_validation.txt
          git commit -m 'research: record referendum datastore diagnostics' || exit 0
          git push