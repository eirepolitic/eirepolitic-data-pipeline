name: Temporary election count bounded validation

on:
  workflow_dispatch:
  push:
    branches:
      - docs/election-count-data-validation-20260903
    paths:
      - .github/workflows/election-count-bounded-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/election-count-data-validation-20260903

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook reader
        run: python -m pip install --quiet openpyxl

      - name: Summarise 2024 constituency sheet layout
        run: |
          python - <<'PY'
          import traceback, urllib.request
          from pathlib import Path
          from openpyxl import load_workbook

          out=[]
          try:
              url='https://opendata.housing.gov.ie/dataset/7ca52e7b-dd4d-4edd-b159-6ae111bbe538/resource/fb8a1f97-2683-4515-bac4-e2617222b20d/download/2024-dail-general-election-results.xlsx'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 EirePolitic research validation'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  body=r.read()
              p=Path('/tmp/election2024.xlsx'); p.write_bytes(body)
              wb=load_workbook(p,data_only=True,read_only=True)
              out += [f'sheet_count={len(wb.sheetnames)}','sheet_names='+'|'.join(wb.sheetnames)]

              # Pick representative constituency sheets dynamically to avoid naming assumptions.
              candidates=[s for s in wb.sheetnames if s not in {'Notes','General Statistics'}]
              targets=[]
              if candidates:
                  targets.append(candidates[0])
                  targets.append(candidates[len(candidates)//2])
                  targets.append(candidates[-1])
              seen=[]
              for title in targets:
                  if title in seen: continue
                  seen.append(title)
                  try:
                      ws=wb[title]
                      out += ['',f'[{title}]',f'dimensions={ws.max_row}x{ws.max_column}']
                      nonempty=[]
                      for rownum,row in enumerate(ws.iter_rows(values_only=True),start=1):
                          vals=['' if v is None else str(v).replace('\n',' ').strip() for v in row]
                          if any(vals):
                              while vals and vals[-1]=='': vals.pop()
                              nonempty.append((rownum,vals))
                      out.append(f'nonempty_rows={len(nonempty)}')
                      selected=nonempty[:16]+nonempty[-6:]
                      done=set()
                      for rownum,vals in selected:
                          if rownum in done: continue
                          done.add(rownum)
                          out.append('row='+str(rownum)+'|'+' || '.join(vals[:28]))
                  except Exception as e:
                      out.append(f'sheet_error={title}|{type(e).__name__}:{e}')

              if 'General Statistics' in wb.sheetnames:
                  try:
                      ws=wb['General Statistics']
                      out += ['', '[General Statistics]', f'dimensions={ws.max_row}x{ws.max_column}']
                      shown=0
                      for rownum,row in enumerate(ws.iter_rows(values_only=True),start=1):
                          vals=['' if v is None else str(v).replace('\n',' ').strip() for v in row]
                          if any(vals):
                              while vals and vals[-1]=='': vals.pop()
                              out.append('row='+str(rownum)+'|'+' || '.join(vals[:14]))
                              shown += 1
                              if shown >= 12: break
                  except Exception as e:
                      out.append(f'general_stats_error={type(e).__name__}:{e}')
          except Exception as e:
              out += [f'top_level_error={type(e).__name__}:{e}', traceback.format_exc().replace('\n',' || ')]

          path=Path('tmp/election_2024_structure_summary.txt')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text('\n'.join(out)+'\n',encoding='utf-8')
          print(path.read_text())
          PY

      - name: Commit temporary summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/election_2024_structure_summary.txt
          git commit -m 'research: record compact 2024 election structure' || exit 0
          git push