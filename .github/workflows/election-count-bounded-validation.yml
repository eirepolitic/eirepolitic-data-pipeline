name: Temporary election count bounded validation

on:
  workflow_dispatch:
  push:
    branches:
      - docs/election-count-data-validation-20260903
    paths:
      - .github/workflows/election-count-bounded-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/election-count-data-validation-20260903

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook reader
        run: python -m pip install --quiet openpyxl

      - name: Inspect 2024 constituency workbook layout
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          from openpyxl import load_workbook

          URL="https://opendata.housing.gov.ie/dataset/7ca52e7b-dd4d-4edd-b159-6ae111bbe538/resource/fb8a1f97-2683-4515-bac4-e2617222b20d/download/2024-dail-general-election-results.xlsx"
          req=urllib.request.Request(URL,headers={"User-Agent":"Mozilla/5.0 EirePolitic research validation"})
          with urllib.request.urlopen(req,timeout=60) as r: body=r.read()
          p=Path('/tmp/election2024.xlsx'); p.write_bytes(body)
          wb_formula=load_workbook(p,data_only=False,read_only=False)
          wb_values=load_workbook(p,data_only=True,read_only=False)

          out=[]
          for title in ["Carlow-Kilkenny","Cavan-Monaghan","Wicklow-Wexford"]:
              wsf=wb_formula[title]; wsv=wb_values[title]
              out += [f"[{title}]",f"dimensions={wsf.max_row}x{wsf.max_column}","merged="+"|".join(str(x) for x in list(wsf.merged_cells.ranges)[:30])]
              for rownum in range(1,93):
                  vals=[]
                  for col in range(1,min(wsf.max_column,42)+1):
                      vf=wsf.cell(rownum,col).value
                      vv=wsv.cell(rownum,col).value
                      if vf is None and vv is None:
                          vals.append("")
                      elif isinstance(vf,str) and vf.startswith('='):
                          vals.append(f"FORMULA:{vf}=>{vv}")
                      else:
                          vals.append(str(vv if vv is not None else vf).replace('\n',' ').strip())
                  if any(vals):
                      # Keep meaningful rows, trim trailing empties.
                      while vals and vals[-1]=='': vals.pop()
                      out.append(f"row={rownum}|"+" || ".join(vals))
              out.append("")

          path=Path('tmp/election_2024_constituency_detail.txt'); path.parent.mkdir(parents=True,exist_ok=True); path.write_text('\n'.join(out)+'\n',encoding='utf-8'); print(path.read_text())
          PY

      - name: Commit temporary constituency detail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/election_2024_constituency_detail.txt
          git commit -m "research: record 2024 constituency sheet detail" || exit 0
          git push
