name: Fine Gael Colored Logo Review

on:
  workflow_dispatch:
  push:
    branches:
      - feature/party-asset-layer-v1
    paths:
      - "process/fine_gael_color_review.py"
      - ".github/workflows/fine_gael_color_review.yml"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install review dependencies
        run: pip install requests pillow pymupdf

      - name: Build Fine Gael colored contact sheet
        run: python -m process.fine_gael_color_review

      - name: Commit browser-accessible review files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/party_assets_v1/fine_gael_color
          if git diff --cached --quiet; then
            echo "Fine Gael color review unchanged."
          else
            git commit -m "Update Fine Gael colored logo review [skip ci]"
            git push origin HEAD:feature/party-asset-layer-v1
          fi
