name: Director catalogue drift check

on:
  push:
    branches: [main]
    paths:
      - "director/workflows.yml"
      - "director/projects.yml"
      - "instagram/projects/**/project.yml"
      - ".github/workflows/**"
      - "process/build_director_catalogue.py"
  pull_request:
    paths:
      - "director/workflows.yml"
      - "director/projects.yml"
      - "instagram/projects/**/project.yml"
      - ".github/workflows/**"
      - "process/build_director_catalogue.py"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate director catalogue
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python process/build_director_catalogue.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add director/workflows.yml director/projects.yml
          git diff --cached --quiet || git commit -m "chore: regenerate Director catalogue"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Check director/ AUTO-GENERATED sections match live GitHub state
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python process/build_director_catalogue.py --check
