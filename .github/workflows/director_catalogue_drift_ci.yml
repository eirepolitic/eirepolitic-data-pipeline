name: Director catalogue drift check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Generate clean catalogue-sync branch from main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B fix/director-catalogue-sync origin/main
          python process/build_director_catalogue.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director/workflows.yml director/projects.yml
          if git diff --cached --quiet; then
            echo 'No catalogue changes required.'
          else
            git commit -m 'chore: sync Director catalogue with live GitHub state'
            git push --force origin HEAD:refs/heads/fix/director-catalogue-sync
          fi
