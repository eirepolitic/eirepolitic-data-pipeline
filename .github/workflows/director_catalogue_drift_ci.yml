name: Director catalogue drift check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Restore normal drift workflow before catalogue generation
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/director_catalogue_drift_ci.yml > .github/workflows/director_catalogue_drift_ci.yml

      - name: Regenerate Director catalogue from live GitHub state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python process/build_director_catalogue.py

      - name: Commit regenerated catalogue and restored workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director/workflows.yml director/projects.yml .github/workflows/director_catalogue_drift_ci.yml
          if git diff --cached --quiet; then
            echo 'No catalogue changes required'
          else
            git commit -m 'chore: regenerate Director catalogue'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
