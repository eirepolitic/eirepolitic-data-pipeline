name: Fianna Fail Exhaustive Logo Review

on:
  workflow_dispatch:
  push:
    branches:
      - feature/party-asset-layer-v1
    paths:
      - "configs/reference/fianna_fail_search_candidates_v1.csv"
      - "process/fianna_fail_exhaustive_review.py"
      - "process/party_assets_discover.py"
      - ".github/workflows/fianna_fail_exhaustive_review.yml"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install review dependencies
        run: pip install requests pillow cairosvg boto3

      - name: Build exhaustive Fianna Fail contact sheet
        run: python -m process.fianna_fail_exhaustive_review

      - name: Commit browser-accessible review files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/party_assets_v1/fianna_fail
          if git diff --cached --quiet; then
            echo "Fianna Fail review unchanged."
          else
            git commit -m "Update Fianna Fail exhaustive logo review [skip ci]"
            git push origin HEAD:feature/party-asset-layer-v1
          fi
