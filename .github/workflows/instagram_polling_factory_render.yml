name: Instagram polling factory render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-second-stage-visual-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Create review-only corner ornaments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          out=Path('instagram/templates/assets'); out.mkdir(parents=True,exist_ok=True)
          gold='#d8b45f'
          base=Image.new('RGBA',(155,155),(0,0,0,0)); d=ImageDraw.Draw(base)
          d.line((18,0,18,78),fill=gold,width=3); d.line((0,18,78,18),fill=gold,width=3)
          d.arc((18,18,112,112),180,270,fill=gold,width=3); d.ellipse((66,66,74,74),fill=gold)
          base.save(out/'corner_tl.png')
          base.transpose(Image.Transpose.FLIP_LEFT_RIGHT).save(out/'corner_tr.png')
          base.transpose(Image.Transpose.FLIP_TOP_BOTTOM).save(out/'corner_bl.png')
          base.transpose(Image.Transpose.ROTATE_180).save(out/'corner_br.png')
          PY
      - name: Patch review geometry
        run: python process/tmp_patch_second_stage_review.py
      - name: Render Second Stage review
        run: python process/tmp_render_second_stage_review.py
      - name: Validate rendered files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('artifacts/bill-tracker-second-stage-review')
          names=['00-cover.png','01-anti-shrinkflation.png','02-broadcasting-explainer.png','03-broadcasting-decision.png','04-carers.png','05-process-glossary.png','06-second-stage-explainer.png','contact-sheet.png']
          missing=[n for n in names if not (p/n).is_file()]
          if missing: raise SystemExit(f'missing files: {missing}')
          for n in names[:-1]:
              if Image.open(p/n).size != (1080,1350): raise SystemExit(f'bad dimensions: {n}')
          print('validated')
          PY
      - name: Build hosted review
        shell: bash
        run: |
          set -euo pipefail
          REVIEW=second_stage_review_web
          rm -rf "$REVIEW" && mkdir -p "$REVIEW"
          cp artifacts/bill-tracker-second-stage-review/*.png "$REVIEW/"
          cat > "$REVIEW/index.html" <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Tracker · Second Stage review</title><style>body{margin:0;background:#0f2f24;color:#f4ead7;font-family:Arial,sans-serif}main{max-width:1500px;margin:auto;padding:24px}.meta{color:#c8bda8;line-height:1.5}.sheet{width:100%;height:auto;display:block;margin:22px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid img{width:100%;height:auto;display:block}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Bill Tracker · Second Stage · Format Review</h1><div class="meta">Seven-slide review: cover, three Bill explainers, one recorded-decision treatment, process glossary and Second Stage explainer. Party bars are intentionally deferred until the vote-date affiliation join is revalidated.</div><img class="sheet" src="contact-sheet.png"><div class="grid"><img src="00-cover.png"><img src="01-anti-shrinkflation.png"><img src="02-broadcasting-explainer.png"><img src="03-broadcasting-decision.png"><img src="04-carers.png"><img src="05-process-glossary.png"><img src="06-second-stage-explainer.png"></div></main></body></html>
          HTML
      - name: Publish preview branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd second_stage_review_web
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "preview: Second Stage format ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-review
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-review
