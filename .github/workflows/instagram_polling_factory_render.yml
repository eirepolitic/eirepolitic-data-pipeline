name: Instagram polling factory render
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-vote-visual-options
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pandas pillow
      - name: Download canonical artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11010749005/zip" -o /tmp/canonical.zip
          mkdir -p /tmp/canonical && unzip -q /tmp/canonical.zip -d /tmp/canonical
      - name: Extract corners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          c=[]
          for p in Path('/tmp/canonical').rglob('*.png'):
              try:
                  with Image.open(p) as im:
                      if im.size==(1080,1350): c.append(p)
              except Exception: pass
          src=Image.open(c[0]).convert('RGBA'); out=Path('instagram/templates/assets'); out.mkdir(parents=True,exist_ok=True)
          for n,b in {'corner_tl.png':(0,0,155,155),'corner_tr.png':(925,0,1080,155),'corner_bl.png':(0,1195,155,1350),'corner_br.png':(925,1195,1080,1350)}.items(): src.crop(b).save(out/n)
          PY
      - name: Render and capture
        shell: bash
        run: |
          set +e
          python process/tmp_render_all_second_stage_posts.py > render.log 2>&1
          echo $? > render.exit
          cat render.log
          exit 0
      - name: Publish diagnostics
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir diag && cp render.log render.exit diag/
          cd diag
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "analysis: bulk render diagnostic ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-all-diagnostics
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-all-diagnostics
