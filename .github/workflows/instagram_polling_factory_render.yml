name: Instagram polling factory render
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-vote-visual-options
      - name: Download enrichment dataset
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://raw.githubusercontent.com/eirepolitic/Eirepolitic-data-pipeline/previews/bill-tracker-second-stage-enrichment/copy.json" -o /tmp/copy.json
      - name: Build compact high-confidence sample
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/copy.json').read_text(encoding='utf-8'))
          highs=[r for r in d['rows'] if r['confidence']=='high']
          sample={'summary':{k:d[k] for k in ('count','high','medium','low')},'sample':highs[:16]}
          Path('sample.json').write_text(json.dumps(sample,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Publish sample
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir out && cp sample.json out/
          cd out
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "analysis: high-confidence enrichment sample ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-enrichment-sample
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-enrichment-sample
