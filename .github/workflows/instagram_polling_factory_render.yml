name: Instagram polling factory render
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-second-stage-visual-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Create review-only corner ornaments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          out=Path('instagram/templates/assets'); out.mkdir(parents=True,exist_ok=True)
          gold='#d8b45f'; base=Image.new('RGBA',(155,155),(0,0,0,0)); d=ImageDraw.Draw(base)
          d.line((18,0,18,78),fill=gold,width=3); d.line((0,18,78,18),fill=gold,width=3); d.arc((18,18,112,112),180,270,fill=gold,width=3); d.ellipse((66,66,74,74),fill=gold)
          base.save(out/'corner_tl.png'); base.transpose(Image.Transpose.FLIP_LEFT_RIGHT).save(out/'corner_tr.png'); base.transpose(Image.Transpose.FLIP_TOP_BOTTOM).save(out/'corner_bl.png'); base.transpose(Image.Transpose.ROTATE_180).save(out/'corner_br.png')
          PY
      - run: python process/tmp_patch_second_stage_review.py
      - name: Render and capture
        shell: bash
        run: |
          set +e
          python process/tmp_render_second_stage_review.py > render.log 2>&1
          echo $? > render.exit
          cat render.log
          exit 0
      - name: Publish diagnostic
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir out
          cp render.log render.exit out/
          cp artifacts/bill-tracker-second-stage-review/*.png out/ 2>/dev/null || true
          cd out
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "preview: Second Stage diagnostic ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-review
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-review
