name: Instagram polling factory render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-vote-visual-options
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python process/tmp_patch_bill_tracker_review.py
      - name: Capture renderer error
        shell: bash
        run: |
          set +e
          python process/tmp_publish_bill_tracker_full_post_contacts_patched.py >render-out.txt 2>render-err.txt
          echo $? >render-code.txt
          cat render-err.txt
          exit 0
      - name: Publish diagnostic
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir diag && cp render-*.txt diag/
          cd diag
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "diag: renderer ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-render-diag
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-render-diag
