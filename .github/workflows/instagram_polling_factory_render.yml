name: Instagram polling factory render
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-second-stage-visual-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pandas
      - name: Run count and always capture output
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/second-stage-count
          python process/tmp_count_second_stage_current_term.py > artifacts/second-stage-count/run.log 2>&1
          code=$?
          echo "$code" > artifacts/second-stage-count/exit_code.txt
          if [ ! -f artifacts/second-stage-count/summary.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/second-stage-count')
          p.joinpath('summary.json').write_text(json.dumps({'ok':False,'error':'script_failed_before_summary','log':p.joinpath('run.log').read_text(encoding='utf-8',errors='replace')},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          fi
          cat artifacts/second-stage-count/run.log
          exit 0
      - name: Publish count
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir out
          cp artifacts/second-stage-count/summary.json out/
          cp artifacts/second-stage-count/run.log out/
          cp artifacts/second-stage-count/exit_code.txt out/
          cd out
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "analysis: Second Stage current-term count ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-count
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-count
