name: Instagram polling factory render

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-polling-factory-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install factory dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml pillow boto3 matplotlib

      - name: Check out exact approved July factory
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/instagram-monthly-post-framework
          git cat-file -e 386b933^{commit}
          git worktree add /tmp/approved-instagram-factory 386b933
          test "$(git -C /tmp/approved-instagram-factory rev-parse --short=7 HEAD)" = "386b933"
          test "$(git -C /tmp/approved-instagram-factory hash-object instagram/templates/assets/corner_tl.png)" = "c2d2378c55cdc20fdd1f6e7a2f910a6fb156b5d1"
          test "$(git -C /tmp/approved-instagram-factory hash-object instagram/templates/assets/corner_tr.png)" = "b81188dd14bf1423c5f450d0857701a043cf9b07"
          test "$(git -C /tmp/approved-instagram-factory hash-object instagram/templates/assets/corner_bl.png)" = "434bd940e6bc2365835a74edd58e2e1260eb4669"
          test "$(git -C /tmp/approved-instagram-factory hash-object instagram/templates/assets/corner_br.png)" = "9b920e6c3bdfbb1049865aac4f5de782f423bb1e"

      - name: Inject raw polling project into approved factory
        shell: bash
        run: |
          set -euo pipefail
          cp -R instagram/projects/ipi_polling_factory_v1 /tmp/approved-instagram-factory/instagram/projects/

      - name: Run approved July recurring factory against live raw IPI polls
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          cd /tmp/approved-instagram-factory
          python -m instagram.factory.recurring \
            --project-id ipi_polling_factory_v1 \
            --period latest \
            --output-root "$GITHUB_WORKSPACE/generated_factory_live"

      - name: Validate live raw-poll package
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          PERIOD_ROOT="$(find generated_factory_live -mindepth 1 -maxdepth 1 -type d -name 'period=*' | sort | tail -1)"
          test -n "$PERIOD_ROOT"
          for file in \
            "$PERIOD_ROOT/slides/01_latest_poll.png" \
            "$PERIOD_ROOT/slides/02_change_same_pollster.png" \
            "$PERIOD_ROOT/slides/03_six_month_polling.png" \
            "$PERIOD_ROOT/slides/04_about_polling.png" \
            "$PERIOD_ROOT/contact_sheets/four_slide_overview.jpg" \
            "$PERIOD_ROOT/metadata/manifest.json" \
            "$PERIOD_ROOT/ipi_polling_factory_review.zip"; do
            test -s "$file"
          done
          python - "$PERIOD_ROOT" <<'PY'
          import json
          import sys
          from pathlib import Path
          from PIL import Image
          root=Path(sys.argv[1])
          manifest=json.loads((root/'metadata/manifest.json').read_text(encoding='utf-8'))
          assert manifest['factory_reference_commit']=='386b933'
          assert manifest['factory_reference_workflow_run']==33894430571
          assert manifest['data_mode']=='raw_polls_only'
          assert manifest['review_state']=='pending_human_review'
          assert manifest['publication_enabled'] is False
          assert manifest['qa']['actual_slide_count']==4
          assert manifest['qa']['model_data_used'] is False
          assert manifest['qa']['same_pollster_only'] is True
          assert manifest['qa']['comparison_and_trend_windows_independent'] is True
          assert 28 <= manifest['comparison_days'] <= 45
          assert manifest['trend_window_days']==183
          assert manifest['trend_legend_default']=='single_row'
          assert manifest['trend_wave_count'] >= 2
          assert len(manifest['trend_waves'])==manifest['trend_wave_count']
          assert {wave['pollster'] for wave in manifest['trend_waves']}=={manifest['pollster']}
          assert manifest['trend_end_date']==manifest['latest_poll']['publication_date']
          for path in manifest['slides']:
              with Image.open(path) as image:
                  assert image.size==(1080,1350)
          trend=json.loads((root/'metadata/03_trend_visual_manifest.json').read_text(encoding='utf-8'))
          assert trend['legend_variant']=='single_row'
          print(json.dumps({
              'pollster': manifest['pollster'],
              'latest_poll': manifest['latest_poll'],
              'previous_poll': manifest['previous_poll'],
              'comparison_days': manifest['comparison_days'],
              'trend_window_days': manifest['trend_window_days'],
              'trend_start_date': manifest['trend_start_date'],
              'trend_end_date': manifest['trend_end_date'],
              'trend_actual_span_days': manifest['trend_actual_span_days'],
              'trend_wave_count': manifest['trend_wave_count'],
              'factory_commit': manifest['factory_reference_commit'],
          }, indent=2))
          PY
          echo "period_root=$PERIOD_ROOT" >> "$GITHUB_OUTPUT"

      - name: Build browser review page
        shell: bash
        env:
          PERIOD_ROOT: ${{ steps.validate.outputs.period_root }}
        run: |
          set -euo pipefail
          REVIEW_DIR="$GITHUB_WORKSPACE/factory_web_review"
          rm -rf "$REVIEW_DIR"
          mkdir -p "$REVIEW_DIR"
          cp "$PERIOD_ROOT/contact_sheets/four_slide_overview.jpg" "$REVIEW_DIR/contact-sheet.jpg"
          cp "$PERIOD_ROOT/slides/01_latest_poll.png" "$REVIEW_DIR/slide-01.png"
          cp "$PERIOD_ROOT/slides/02_change_same_pollster.png" "$REVIEW_DIR/slide-02.png"
          cp "$PERIOD_ROOT/slides/03_six_month_polling.png" "$REVIEW_DIR/slide-03.png"
          cp "$PERIOD_ROOT/slides/04_about_polling.png" "$REVIEW_DIR/slide-04.png"
          cp "$PERIOD_ROOT/caption.txt" "$REVIEW_DIR/caption.txt"
          cp "$PERIOD_ROOT/metadata/manifest.json" "$REVIEW_DIR/manifest.json"
          python - <<'PY'
          from pathlib import Path
          import html
          import json
          root=Path('factory_web_review')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          caption=html.escape((root/'caption.txt').read_text(encoding='utf-8'))
          latest=manifest['latest_poll']
          previous=manifest['previous_poll']
          page=f'''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raw polling · six-month review</title><style>body{{margin:0;background:#0f2f24;color:#f4ead7;font-family:Arial,sans-serif}}main{{max-width:1500px;margin:auto;padding:24px}}h1{{margin-bottom:8px}}.meta{{color:#cbbf9f;margin-bottom:22px;line-height:1.55}}.sheet{{width:100%;height:auto;display:block;margin:0 0 28px}}.slides{{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}}.slides img{{width:100%;height:auto}}pre{{white-space:pre-wrap;background:#173d30;padding:18px;border-radius:8px}}@media(max-width:1000px){{.slides{{grid-template-columns:repeat(2,1fr)}}}}@media(max-width:650px){{.slides{{grid-template-columns:1fr}}}}</style></head><body><main><h1>Raw polling · six-month same-pollster review</h1><div class="meta">Pollster: {html.escape(manifest['pollster'])}<br>Slide 2 comparison: {html.escape(previous['publication_date'])} → {html.escape(latest['publication_date'])} · {manifest['comparison_days']} days<br>Slide 3 trend: {html.escape(manifest['trend_start_date'])} → {html.escape(manifest['trend_end_date'])} · {manifest['trend_wave_count']} actual poll waves · configured window {manifest['trend_window_days']} days<br>Latest poll sample: n={latest['sample_size']:,} · Fieldwork {html.escape(latest['fieldwork_start'])} to {html.escape(latest['fieldwork_end'])}<br>Data mode: raw polls only · no IPI daily model used</div><img class="sheet" src="contact-sheet.jpg" alt="Four-slide raw polling contact sheet"><div class="slides"><img src="slide-01.png" alt="Latest polling percentages"><img src="slide-02.png" alt="Who is up and down"><img src="slide-03.png" alt="Six months of polling"><img src="slide-04.png" alt="About this polling"></div><h2>Caption</h2><pre>{caption}</pre></main></body></html>'''
          (root/'index.html').write_text(page, encoding='utf-8')
          PY

      - name: Publish web review to preview branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd factory_web_review
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "preview: raw IPI polling review ${GITHUB_RUN_ID}"
          git branch -M previews/ipi-polling-factory
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/ipi-polling-factory
          URL="https://raw.githack.com/${GITHUB_REPOSITORY}/previews/ipi-polling-factory/index.html"
          echo "FACTORY_REVIEW_URL=$URL"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '## Raw polling · six-month review\n\n[Open web-hosted review page](%s)\n' "$URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload backup package
        uses: actions/upload-artifact@v4
        with:
          name: ipi-raw-poll-factory-${{ github.run_id }}
          path: generated_factory_live/
          if-no-files-found: error
          retention-days: 30
