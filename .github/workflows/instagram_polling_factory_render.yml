name: Instagram polling factory render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-second-stage-visual-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Render and capture diagnostics
        shell: bash
        run: |
          set +e
          python process/tmp_render_second_stage_review.py > render.log 2>&1
          echo $? > render.exit
          cat render.log
          exit 0
      - name: Publish diagnostics and any rendered images
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REVIEW=second_stage_review_web
          rm -rf "$REVIEW" && mkdir -p "$REVIEW"
          cp render.log render.exit "$REVIEW/"
          if [ -d artifacts/bill-tracker-second-stage-review ]; then cp artifacts/bill-tracker-second-stage-review/*.png "$REVIEW/" 2>/dev/null || true; fi
          cd "$REVIEW"
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "preview: Second Stage diagnostics ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-review
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-review
