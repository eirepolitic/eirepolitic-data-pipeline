name: Instagram polling factory render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-vote-visual-options
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe pharmacy Bill decision transcript
        run: python process/tmp_probe_pharmacy_dail_decision.py
      - name: Publish audit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir audit-web
          cp pharmacy-dail-procedure-audit.json audit-web/pharmacy-dail-procedure-audit.json
          cd audit-web
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "analysis: pharmacy Dail procedure ${GITHUB_RUN_ID}"
          git branch -M previews/pharmacy-dail-procedure-audit
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/pharmacy-dail-procedure-audit
