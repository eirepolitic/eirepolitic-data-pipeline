name: Instagram polling factory render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-vote-visual-options
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Generate next Bill slide
        run: python process/tmp_publish_next_bill_slide.py
      - name: Build hosted review
        shell: bash
        run: |
          set -euo pipefail
          REVIEW=bill_next_slide_web
          rm -rf "$REVIEW" && mkdir -p "$REVIEW"
          cp artifacts/bill-next-slide/slide-02-services-amendment.png "$REVIEW/slide-02-services-amendment.png"
          cp artifacts/bill-next-slide/contact-sheet.png "$REVIEW/contact-sheet.png"
          cat > "$REVIEW/index.html" <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Tracker · Next slide</title><style>body{margin:0;background:#0f2f24;color:#f4ead7;font-family:Arial,sans-serif}main{max-width:1200px;margin:auto;padding:24px}.meta{color:#c8bda8;line-height:1.5}.sheet,.slide{width:100%;height:auto;display:block;margin:22px 0;background:white}</style></head><body><main><h1>Bill Tracker · Next slide</h1><div class="meta">Israeli Settlements Bill · amendment No. 16 on services · 7 July 2026<br>Analysis preview · not publication enabled</div><img class="sheet" src="contact-sheet.png"><img class="slide" src="slide-02-services-amendment.png"></main></body></html>
          HTML
      - name: Publish preview branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd bill_next_slide_web
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "preview: next Bill slide ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-next-slide
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-next-slide
