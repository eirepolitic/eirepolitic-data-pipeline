name: Instagram polling factory render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/bill-content-snapshot-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas pyyaml pillow boto3 matplotlib
      - name: Check out approved factory
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/instagram-monthly-post-framework
          git worktree add /tmp/approved-instagram-factory 386b933
          test "$(git -C /tmp/approved-instagram-factory hash-object instagram/templates/assets/corner_tl.png)" = "c2d2378c55cdc20fdd1f6e7a2f910a6fb156b5d1"
          test "$(git -C /tmp/approved-instagram-factory hash-object instagram/templates/assets/corner_tr.png)" = "b81188dd14bf1423c5f450d0857701a043cf9b07"
          test "$(git -C /tmp/approved-instagram-factory hash-object instagram/templates/assets/corner_bl.png)" = "434bd940e6bc2365835a74edd58e2e1260eb4669"
          test "$(git -C /tmp/approved-instagram-factory hash-object instagram/templates/assets/corner_br.png)" = "9b920e6c3bdfbb1049865aac4f5de782f423bb1e"
      - run: cp -R instagram/projects/bill_tracker_factory_v1 /tmp/approved-instagram-factory/instagram/projects/
      - name: Render
        run: |
          cd /tmp/approved-instagram-factory
          python -m instagram.factory.recurring --project-id bill_tracker_factory_v1 --period latest --output-root "$GITHUB_WORKSPACE/generated_bill_tracker"
      - name: Validate and build review
        shell: bash
        run: |
          set -euo pipefail
          PERIOD_ROOT="$(find generated_bill_tracker -mindepth 1 -maxdepth 1 -type d -name 'period=*' | sort | tail -1)"
          python - "$PERIOD_ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          from PIL import Image
          root=Path(sys.argv[1]); m=json.loads((root/'metadata/manifest.json').read_text())
          assert m['factory_reference_commit']=='386b933'
          assert m['review_state']=='pending_human_review'
          assert m['qa']['actual_slide_count']==8
          cover=m['media_manifests']['cover']
          assert cover['renderer']=='bill_tracker_cover_list_media_v2'
          assert len(cover['bill_list'])==6
          assert all(row['lines']<=3 and row['font_size']>=17 for row in cover['bill_list'])
          for p in m['slides']:
              with Image.open(p) as im: assert im.size==(1080,1350)
          print(json.dumps(cover,indent=2))
          PY
          REVIEW=bill_tracker_web_review
          rm -rf "$REVIEW" && mkdir -p "$REVIEW"
          cp "$PERIOD_ROOT/contact_sheets/eight_slide_overview.jpg" "$REVIEW/contact-sheet.jpg"
          i=1; for src in "$PERIOD_ROOT"/slides/*.png; do cp "$src" "$REVIEW/slide-$(printf '%02d' "$i").png"; i=$((i+1)); done
          cp "$PERIOD_ROOT/caption.txt" "$REVIEW/caption.txt"
          cp "$PERIOD_ROOT/metadata/manifest.json" "$REVIEW/manifest.json"
          python - <<'PY'
          from pathlib import Path
          import html
          r=Path('bill_tracker_web_review'); cap=html.escape((r/'caption.txt').read_text())
          imgs=''.join(f'<img src="slide-{i:02d}.png">' for i in range(1,9))
          (r/'index.html').write_text(f'''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Tracker review</title><style>body{{margin:0;background:#0f2f24;color:#f4ead7;font-family:Arial}}main{{max-width:1500px;margin:auto;padding:24px}}.sheet{{width:100%}}.slides{{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}}.slides img{{width:100%}}pre{{white-space:pre-wrap;background:#173d30;padding:18px}}@media(max-width:900px){{.slides{{grid-template-columns:repeat(2,1fr)}}}}@media(max-width:600px){{.slides{{grid-template-columns:1fr}}}}</style></head><body><main><h1>Bills of the Current Session · Enacted Part 1</h1><img class="sheet" src="contact-sheet.jpg"><div class="slides">{imgs}</div><h2>Caption</h2><pre>{cap}</pre></main></body></html>''',encoding='utf-8')
          PY
      - name: Publish review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd bill_tracker_web_review
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "preview: Bill Tracker cover list ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-factory-v1
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-factory-v1
