name: Instagram polling factory render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: analysis/bill-vote-visual-options
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas pyyaml pillow boto3 matplotlib
      - name: Check out approved factory
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/instagram-monthly-post-framework
          git worktree add /tmp/approved-instagram-factory 386b933
      - name: Inject vote comparison project
        run: cp -R instagram/projects/bill_tracker_vote_options_v1 /tmp/approved-instagram-factory/instagram/projects/
      - name: Render and capture diagnostics
        shell: bash
        run: |
          mkdir -p diagnostics/bill-vote-render
          set +e
          cd /tmp/approved-instagram-factory
          python -m instagram.factory.recurring --project-id bill_tracker_vote_options_v1 --period sample --output-root "$GITHUB_WORKSPACE/generated_vote_options" > "$GITHUB_WORKSPACE/diagnostics/bill-vote-render/render.log" 2>&1
          echo $? > "$GITHUB_WORKSPACE/diagnostics/bill-vote-render/exit_code.txt"
          set -e
      - name: Persist diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/bill-vote-render
          git commit -m "analysis: persist Bill Tracker vote render diagnostics" || exit 0
          git push origin HEAD:analysis/bill-vote-visual-options
