name: Instagram polling factory render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-vote-visual-options

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pillow

      - name: Generate party-layout variants
        run: python process/tmp_publish_bill_party_variants.py

      - name: Build browser review page
        shell: bash
        run: |
          set -euo pipefail
          REVIEW=bill_party_variants_web
          rm -rf "$REVIEW"
          mkdir -p "$REVIEW"
          cp artifacts/bill-party-variants/contact-sheet.png "$REVIEW/contact-sheet.png"
          cp artifacts/bill-party-variants/variant-b1.png "$REVIEW/variant-b1.png"
          cp artifacts/bill-party-variants/variant-b2.png "$REVIEW/variant-b2.png"
          cp artifacts/bill-party-variants/variant-b3.png "$REVIEW/variant-b3.png"
          cat > "$REVIEW/index.html" <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Bill Tracker · Option B variants</title>
          <style>
          body{margin:0;background:#0f2f24;color:#f4ead7;font-family:Arial,sans-serif}
          main{max-width:1500px;margin:auto;padding:24px}
          .meta{color:#c8bda8;line-height:1.5;margin-bottom:20px}
          .sheet{width:100%;height:auto;display:block;margin-bottom:28px;background:white}
          .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
          .grid img{width:100%;height:auto;display:block}
          h2{color:#d8b45f;margin-bottom:8px}
          p{color:#c8bda8}
          @media(max-width:1000px){.grid{grid-template-columns:1fr}}
          </style></head>
          <body><main>
          <h1>Bill Tracker · Option B variants</h1>
          <div class="meta">Strategic Gas Reserve Bill · sample party-vote layouts<br>90 Tá · 57 Níl · 0 abstentions · 27 no recorded vote</div>
          <img class="sheet" src="contact-sheet.png" alt="Contact sheet of Bill Tracker party-vote variants">
          <div class="grid">
            <div><h2>B1 · Larger rows</h2><p>Top parties individually; smaller groups combined.</p><img src="variant-b1.png"></div>
            <div><h2>B2 · Two columns</h2><p>Uses horizontal space to show more parties while keeping rows larger.</p><img src="variant-b2.png"></div>
            <div><h2>B3 · Simplified rows</h2><p>Most compact; faster to scan with less detailed labels.</p><img src="variant-b3.png"></div>
          </div>
          </main></body></html>
          HTML

      - name: Publish hosted review
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd bill_party_variants_web
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "preview: Bill Tracker party variants ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-party-variants
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-party-variants
