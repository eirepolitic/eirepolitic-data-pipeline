name: Instagram polling factory render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/bill-content-snapshot-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas pyyaml pillow boto3 matplotlib
      - name: Check out approved factory
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/instagram-monthly-post-framework
          git worktree add /tmp/approved-instagram-factory 386b933
      - run: cp -R instagram/projects/bill_tracker_factory_v1 /tmp/approved-instagram-factory/instagram/projects/
      - name: Render and capture result
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics/bill-tracker-cover-list
          cd /tmp/approved-instagram-factory
          python -m instagram.factory.recurring --project-id bill_tracker_factory_v1 --period latest --output-root "$GITHUB_WORKSPACE/generated_bill_tracker" > "$GITHUB_WORKSPACE/diagnostics/bill-tracker-cover-list/render.log" 2>&1
          code=$?
          echo "$code" > "$GITHUB_WORKSPACE/diagnostics/bill-tracker-cover-list/exit_code.txt"
          set -e
      - name: Persist diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/bill-tracker-cover-list
          git commit -m "test: persist Bill Tracker cover-list render diagnostic" || exit 0
          git push origin HEAD:feature/bill-content-snapshot-v1
