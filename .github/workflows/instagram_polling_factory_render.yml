name: Instagram polling factory render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-vote-visual-options
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Apply review renderer patch
        run: python process/tmp_patch_bill_tracker_review.py
      - name: Generate corrected review sheets
        run: python process/tmp_publish_bill_tracker_full_post_contacts_patched.py
      - name: Validate slides
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('artifacts/bill-tracker-full-posts-review')
          for p in sorted(root.glob('post*_*.png')):
              if p.name.endswith('contact_sheet.png'):
                  continue
              assert Image.open(p).size==(1080,1350),(p,Image.open(p).size)
          print('slide dimensions OK')
          PY
      - name: Build hosted review
        shell: bash
        run: |
          set -euo pipefail
          REVIEW=bill_tracker_full_posts_review_web
          rm -rf "$REVIEW" && mkdir -p "$REVIEW"
          cp artifacts/bill-tracker-full-posts-review/*.png "$REVIEW/"
          cat > "$REVIEW/index.html" <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Tracker · Full review</title><style>body{margin:0;background:#0f2f24;color:#f4ead7;font-family:Arial,sans-serif}main{max-width:1500px;margin:auto;padding:24px}.meta{color:#c8bda8;line-height:1.5}.sheet{width:100%;height:auto;display:block;margin:22px 0;background:white}</style></head><body><main><h1>Bill Tracker · Full Review</h1><div class="meta">Glossary definition cards now share one fitted body size. The parliamentary process strip highlights the current stage: ENACTED.</div><h2>Post 1</h2><img class="sheet" src="post1_contact_sheet.png"><h2>Post 2</h2><img class="sheet" src="post2_contact_sheet.png"></main></body></html>
          HTML
      - name: Publish preview branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd bill_tracker_full_posts_review_web
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "preview: glossary fitting and active stage ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-full-posts-review
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-full-posts-review
