name: Instagram polling factory render

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-second-stage-visual-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Download canonical Bill Tracker factory artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11010749005/zip" \
            -o /tmp/canonical.zip
          mkdir -p /tmp/canonical
          unzip -q /tmp/canonical.zip -d /tmp/canonical
          find /tmp/canonical -maxdepth 3 -type f -print
      - name: Extract exact canonical corner accents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('/tmp/canonical')
          # Prefer a rendered 1080x1350 slide from the approved factory artifact.
          candidates=[]
          for p in root.rglob('*.png'):
              try:
                  with Image.open(p) as im:
                      if im.size == (1080,1350): candidates.append(p)
              except Exception:
                  pass
          if not candidates:
              raise SystemExit('No 1080x1350 canonical slide found in approved factory artifact')
          src=Image.open(candidates[0]).convert('RGBA')
          print('using canonical slide', candidates[0])
          out=Path('instagram/templates/assets'); out.mkdir(parents=True,exist_ok=True)
          crops={
            'corner_tl.png':(0,0,155,155),
            'corner_tr.png':(925,0,1080,155),
            'corner_bl.png':(0,1195,155,1350),
            'corner_br.png':(925,1195,1080,1350),
          }
          for name,box in crops.items(): src.crop(box).save(out/name)
          print('canonical corner accents extracted from approved factory artifact')
          PY
      - name: Render both Second Stage posts
        run: python process/tmp_render_second_stage_posts.py
      - name: Validate renders
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('artifacts/bill-tracker-second-stage-posts')
          for post in ('post1','post2'):
              p=root/post
              names=['00-cover.png','01-bill.png','02-bill.png','03-bill.png','04-process-glossary.png','05-second-stage-explainer.png','contact-sheet.png']
              missing=[n for n in names if not (p/n).is_file()]
              if missing: raise SystemExit(f'{post} missing {missing}')
              for n in names[:-1]:
                  if Image.open(p/n).size!=(1080,1350): raise SystemExit(f'{post}/{n} bad dimensions')
          print('all Second Stage renders validated')
          PY
      - name: Build hosted review
        shell: bash
        run: |
          set -euo pipefail
          REVIEW=second_stage_posts_web
          rm -rf "$REVIEW" && mkdir -p "$REVIEW/post1" "$REVIEW/post2"
          cp artifacts/bill-tracker-second-stage-posts/post1/*.png "$REVIEW/post1/"
          cp artifacts/bill-tracker-second-stage-posts/post2/*.png "$REVIEW/post2/"
          cat > "$REVIEW/index.html" <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Tracker · Second Stage posts</title><style>body{margin:0;background:#0f2f24;color:#f4ead7;font-family:Arial,sans-serif}main{max-width:1500px;margin:auto;padding:24px}a{color:#d8b45f}.sheet{width:100%;height:auto;display:block;margin:20px 0 44px}.meta{color:#c8bda8;line-height:1.5}</style></head><body><main><h1>Bill Tracker · Second Stage</h1><div class="meta">Two review carousels using the canonical Bill Tracker corner accents extracted from the approved Enacted factory artifact.</div><h2>Post 1</h2><p><a href="post1/index.html">Open Post 1 individual-slide review</a></p><img class="sheet" src="post1/contact-sheet.png"><h2>Post 2</h2><p><a href="post2/index.html">Open Post 2 individual-slide review</a></p><img class="sheet" src="post2/contact-sheet.png"></main></body></html>
          HTML
          for P in post1 post2; do
            cat > "$REVIEW/$P/index.html" <<HTML
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Second Stage · $P</title><style>body{margin:0;background:#0f2f24;color:#f4ead7;font-family:Arial,sans-serif}main{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid img{width:100%;height:auto}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Second Stage · $P</h1><div class="grid"><img src="00-cover.png"><img src="01-bill.png"><img src="02-bill.png"><img src="03-bill.png"><img src="04-process-glossary.png"><img src="05-second-stage-explainer.png"></div></main></body></html>
          HTML
          done
      - name: Publish preview branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd second_stage_posts_web
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "preview: complete Second Stage posts ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-posts
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-posts
