name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-bill-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas pyarrow pyyaml boto3 pytest
      - name: Compile changed Python
        run: |
          python -m py_compile political_metrics/legislation_context.py
          python -m py_compile process/political_metrics_bill_debate_sections_candidate.py
          python -m py_compile process/political_metrics_materialize_candidate.py
      - name: Run focused regression tests
        run: pytest -q tests/political_metrics/test_legislation_context.py tests/political_metrics/test_downstream_contracts.py tests/political_metrics/test_candidate_materialization.py
