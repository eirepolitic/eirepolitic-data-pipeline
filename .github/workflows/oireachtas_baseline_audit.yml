name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact heading stability digest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('analysis/oral_section_heading_stability.json').read_text())
          out={
            'production_batch_id':src.get('production_batch_id'),
            'heading_count':src.get('heading_count'),
            'repeated_heading_count':src.get('repeated_heading_count'),
            'headings_5plus_exchanges':src.get('headings_5plus_exchanges'),
            'headings_10plus_exchanges':src.get('headings_10plus_exchanges'),
            'headings_used_both_years':src.get('headings_used_both_years'),
            'recipient_concentration':src.get('recipient_concentration'),
            'recipient_drift':src.get('recipient_drift'),
            'public_filter_candidate_rule':src.get('public_filter_candidate_rule'),
            'generic_or_cross_portfolio_candidates':src.get('generic_or_cross_portfolio_candidates',[])[:12],
            'recipient_drift_candidates':src.get('recipient_drift_candidates',[])[:15],
            'highly_stable_heading_candidates':src.get('highly_stable_heading_candidates',[])[:20],
          }
          Path('analysis/oral_section_heading_stability_digest.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/oral_section_heading_stability_digest.json
          git commit -m "Summarize oral heading stability ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
