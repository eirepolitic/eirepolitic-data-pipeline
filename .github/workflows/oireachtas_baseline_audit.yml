name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas
      - name: Investigate deterministic speech context links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os, re
          from collections import Counter, defaultdict
          from pathlib import Path
          import boto3
          import pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY, read_json_required, resolve_production_key

          bucket=os.environ['S3_BUCKET']
          s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)

          def read(logical):
              key=resolve_production_key(s3,bucket=bucket,production_key=logical)
              frame=pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=key)['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
              return frame,key

          speeches,skey=read('processed/oireachtas_unified/latest/csv/silver_speeches.csv')
          sections,seckey=read('processed/oireachtas_unified/latest/csv/silver_debate_sections.csv')
          debates,dkey=read('processed/oireachtas_unified/latest/csv/silver_debate_records.csv')
          bills,bkey=read('processed/oireachtas_unified/latest/csv/silver_bill_debates.csv')
          sqc,qkey=read('processed/oireachtas_unified/latest/metrics/event/speech_question_context/csv/speech_question_context.csv')

          def s(frame,col):
              if col not in frame.columns:
                  return pd.Series(['']*len(frame),index=frame.index,dtype='object')
              return frame[col].fillna('').astype(str).str.strip()

          for c in ['speech_id','debate_id','debate_section_id','debate_date']:
              speeches[c]=s(speeches,c)
          for c in ['debate_section_id','debate_id','section_eid','section_uri','heading','show_as','parent_section_id']:
              sections[c]=s(sections,c)
          for c in ['debate_id','debate_uri','debate_date','show_as','source_xml_uri','source_xml_url']:
              debates[c]=s(debates,c)
          for c in ['bill_debate_id','bill_id','debate_id','debate_uri','debate_date','debate_show_as','debate_section_id']:
              bills[c]=s(bills,c)
          for c in ['speech_id','speech_context','debate_section_id']:
              sqc[c]=s(sqc,c)

          sections['section_heading']=sections['show_as'].where(sections['show_as'].ne(''),sections['heading'])
          sec_heading=sections.drop_duplicates('debate_section_id',keep='last').set_index('debate_section_id')['section_heading'].to_dict()
          speeches['section_heading']=speeches['debate_section_id'].map(sec_heading).fillna('')

          speech_debate_ids=set(x for x in speeches.debate_id if x)
          speech_section_ids=set(x for x in speeches.debate_section_id if x)
          debate_ids=set(x for x in debates.debate_id if x)
          debate_uris=set(x for x in debates.debate_uri if x)
          bill_debate_ids=set(x for x in bills.debate_id if x)
          bill_debate_uris=set(x for x in bills.debate_uri if x)
          bill_section_ids=set(x for x in bills.debate_section_id if x)

          direct_debate_id_overlap=bill_debate_ids & speech_debate_ids
          exact_uri_overlap=bill_debate_uris & debate_uris
          bill_section_to_speech_id=bill_section_ids & speech_section_ids
          bill_section_to_section_id=bill_section_ids & set(x for x in sections.debate_section_id if x)
          bill_section_to_section_uri=bill_section_ids & set(x for x in sections.section_uri if x)
          bill_section_to_section_eid=bill_section_ids & set(x for x in sections.section_eid if x)

          debate_uri_to_ids=defaultdict(set)
          for r in debates.itertuples(index=False):
              if r.debate_uri and r.debate_id:
                  debate_uri_to_ids[r.debate_uri].add(r.debate_id)
          mapped_debate_ids=set()
          for uri in exact_uri_overlap:
              mapped_debate_ids.update(debate_uri_to_ids.get(uri,set()))
          uri_bridge_speeches=speeches[speeches.debate_id.isin(mapped_debate_ids)].copy()

          uri_grain=[]
          for uri in sorted(exact_uri_overlap):
              ids=debate_uri_to_ids.get(uri,set())
              g=speeches[speeches.debate_id.isin(ids)]
              uri_grain.append({'debate_uri':uri,'debate_ids':sorted(ids),'speech_count':int(len(g)),'section_count':int(g.debate_section_id.nunique()),'headings':g.section_heading.value_counts().head(25).to_dict()})
          uri_grain=sorted(uri_grain,key=lambda x:(-x['section_count'],-x['speech_count'],x['debate_uri']))

          heading_matches=[]
          unique_heading_pairs=set()
          for r in bills.itertuples(index=False):
              mapped_ids=set()
              if r.debate_id in debate_ids:
                  mapped_ids.add(r.debate_id)
              if r.debate_uri in debate_uri_to_ids:
                  mapped_ids.update(debate_uri_to_ids[r.debate_uri])
              if not mapped_ids or not r.debate_show_as:
                  continue
              candidate_sections=sections[sections.debate_id.isin(mapped_ids)]
              exact=candidate_sections[candidate_sections.section_heading.eq(r.debate_show_as)]
              if len(exact)==1:
                  sid=str(exact.iloc[0].debate_section_id)
                  unique_heading_pairs.add((str(r.bill_id),sid))
                  heading_matches.append({'bill_id':str(r.bill_id),'bill_debate_id':str(r.bill_debate_id),'debate_uri':str(r.debate_uri),'debate_show_as':str(r.debate_show_as),'matched_debate_section_id':sid,'speech_count':int((speeches.debate_section_id==sid).sum())})

          unique_bill_section_ids=set(sid for _,sid in unique_heading_pairs)
          unique_heading_speeches=speeches[speeches.debate_section_id.isin(unique_bill_section_ids)]

          h=speeches.section_heading.fillna('').astype(str)
          leaders=h.str.contains(r"leaders['’]? questions|ceisteanna\s+ó\s+cheannairí",case=False,regex=True,na=False)
          statements=h.str.contains(r"\bstatements?\b|\bráitis\b|\bráiteas\b",case=False,regex=True,na=False)
          motions=h.str.contains(r"(?:^|:)\s*motions?(?:\s|$|\[|\()|\brún\b|\brúin\b",case=False,regex=True,na=False)
          procedural=h.str.contains(r"order of business|an tord gnó|questions on promised legislation|ceisteanna ar reachtaíocht a gealladh|business of the dáil|business of the house|sittings and business",case=False,regex=True,na=False)
          oral=sqc.set_index('speech_id').speech_context.reindex(speeches.speech_id).fillna('').eq('oral_question_exchange').to_numpy()

          def profile(mask):
              g=speeches[mask].copy()
              return {'speech_count':int(len(g)),'section_count':int(g.debate_section_id.nunique()),'years':{str(k):int(v) for k,v in g.assign(year=pd.to_datetime(g.debate_date,errors='coerce').dt.year).year.value_counts().sort_index().items() if pd.notna(k)},'headings':g.section_heading.value_counts().head(100).to_dict(),'sample_sections':g.groupby(['debate_section_id','debate_date','section_heading'],dropna=False).size().reset_index(name='speech_count').sort_values('speech_count',ascending=False).head(30).to_dict(orient='records')}

          candidate_masks={'oral_question_exchange':pd.Series(oral,index=speeches.index),'leaders_questions':leaders,'motions':motions,'statements':statements,'procedural_business':procedural}
          overlaps=[]
          names=list(candidate_masks)
          for i,a in enumerate(names):
              for b in names[i+1:]:
                  m=candidate_masks[a] & candidate_masks[b]
                  if int(m.sum()):
                      overlaps.append({'context_a':a,'context_b':b,'speech_overlap':int(m.sum()),'examples':speeches.loc[m,['speech_id','debate_date','debate_section_id','section_heading']].head(12).to_dict(orient='records')})

          heading_counts=speeches.section_heading.value_counts()
          discover={'statement_terms':heading_counts[heading_counts.index.to_series().str.contains(r'statement|ráitis|ráiteas',case=False,regex=True,na=False)].head(150).to_dict(),'motion_terms':heading_counts[heading_counts.index.to_series().str.contains(r'motion|rún|rúin',case=False,regex=True,na=False)].head(150).to_dict(),'business_terms':heading_counts[heading_counts.index.to_series().str.contains(r'business|gnó|promised legislation|reachtaíocht a gealladh',case=False,regex=True,na=False)].head(150).to_dict(),'bill_stage_terms':heading_counts[heading_counts.index.to_series().str.contains(r'\bbill\b|\bbille\b|second stage|committee stage|report stage|final stage',case=False,regex=True,na=False)].head(200).to_dict()}

          bill_samples=[]
          for r in bills.head(100).itertuples(index=False):
              mapped_ids=sorted((set([r.debate_id]) if r.debate_id in debate_ids else set()) | debate_uri_to_ids.get(r.debate_uri,set()))
              cand=speeches[speeches.debate_id.isin(mapped_ids)]
              bill_samples.append({'bill_id':str(r.bill_id),'bill_debate_id':str(r.bill_debate_id),'debate_date':str(r.debate_date),'debate_show_as':str(r.debate_show_as),'bill_debate_id_value':str(r.debate_id),'debate_uri':str(r.debate_uri),'bill_debate_section_id':str(r.debate_section_id),'mapped_debate_ids':mapped_ids,'mapped_debate_speech_count':int(len(cand)),'mapped_debate_section_count':int(cand.debate_section_id.nunique()),'mapped_headings':cand.section_heading.value_counts().head(20).to_dict()})

          out={'production_batch_id':str(pointer.get('batch_id') or pointer.get('mode')),'resolved_keys':{'speeches':skey,'sections':seckey,'debate_records':dkey,'bill_debates':bkey,'speech_question_context':qkey},'source_columns':{'speeches':list(speeches.columns),'sections':list(sections.columns),'debate_records':list(debates.columns),'bill_debates':list(bills.columns)},'bill_link_diagnostics':{'bill_rows':int(len(bills)),'distinct_bill_ids':int(bills.bill_id.nunique()),'distinct_bill_debate_ids':int(len(bill_debate_ids)),'distinct_bill_debate_uris':int(len(bill_debate_uris)),'distinct_bill_section_ids':int(len(bill_section_ids)),'direct_bill_debate_id_to_speech_debate_id_overlap':int(len(direct_debate_id_overlap)),'bill_debate_uri_to_debate_record_uri_overlap':int(len(exact_uri_overlap)),'uri_bridge_debate_id_count':int(len(mapped_debate_ids)),'uri_bridge_speech_count':int(len(uri_bridge_speeches)),'uri_bridge_section_count':int(uri_bridge_speeches.debate_section_id.nunique()),'bill_section_to_speech_section_id_overlap':int(len(bill_section_to_speech_id)),'bill_section_to_silver_section_id_overlap':int(len(bill_section_to_section_id)),'bill_section_to_silver_section_uri_overlap':int(len(bill_section_to_section_uri)),'bill_section_to_silver_section_eid_overlap':int(len(bill_section_to_section_eid)),'unique_same_debate_show_as_section_matches':int(len(unique_bill_section_ids)),'unique_same_debate_show_as_linked_speeches':int(len(unique_heading_speeches))},'uri_grain_profiles':uri_grain[:60],'unique_same_debate_show_as_matches':heading_matches[:100],'bill_samples':bill_samples[:60],'candidate_profiles':{k:profile(v) for k,v in candidate_masks.items()},'overlaps':overlaps,'heading_discovery':discover,'guardrails':['silver_speeches exposes debate_id and debate_section_id, not source_debate_uri; URI analysis must bridge through silver_debate_records.','A bill debate URI that maps to a whole sitting/debate cannot by itself label every speech in that debate as legislation.','Exact same-debate heading matches are diagnostics until source semantics and false positives are manually reviewed.','Heading term matches are diagnostics only; ambiguous cases remain other.']}
          Path('analysis').mkdir(exist_ok=True)
          Path('analysis/broader_speech_context_link_diagnostics.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/broader_speech_context_link_diagnostics.json
          git commit -m "Capture broader speech context diagnostics ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
