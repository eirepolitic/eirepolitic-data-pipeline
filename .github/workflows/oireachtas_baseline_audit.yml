name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas pyyaml
      - name: Inspect residual role anomalies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io,json,os,re
          from pathlib import Path
          import boto3,pandas as pd
          from extract.oireachtas.batch import resolve_production_key

          bucket=os.environ['S3_BUCKET']; s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          keys={'questions':'processed/oireachtas_unified/latest/csv/silver_questions.csv','speeches':'processed/oireachtas_unified/latest/csv/silver_speeches.csv','speech_context':'processed/oireachtas_unified/latest/metrics/event/speech_question_context/csv/speech_question_context.csv','offices':'processed/oireachtas_unified/latest/csv/silver_member_offices.csv'}
          F={}
          for n,k in keys.items():
              r=resolve_production_key(s3,bucket=bucket,production_key=k)
              F[n]=pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=r)['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
          s=F['speeches']; sc=F['speech_context']; offices=F['offices']
          s['debate_date']=pd.to_datetime(s.debate_date,errors='coerce'); offices['office_start']=pd.to_datetime(offices.office_start,errors='coerce'); offices['office_end']=pd.to_datetime(offices.office_end,errors='coerce')
          related=set(sc.loc[sc.speech_context.astype(str).eq('oral_question_exchange'),'speech_id'].astype(str)); rs=s[s.speech_id.astype(str).isin(related)].copy()
          rs['speaker_member_code']=rs.speaker_member_code.fillna('').astype(str); rs['speaker_name']=rs.speaker_name.fillna('').astype(str); rs['debate_section_id']=rs.debate_section_id.astype(str)
          chair_re=re.compile(r'ceann comhairle|leas-cheann comhairle|cathaoirleach|acting chair(?:man|person)?|chairman|chairperson',re.I); minister_re=re.compile(r'\bminister\b|\btaoiseach\b|\btánaiste\b|attorney general',re.I)
          cache={}
          def role(code,date,name):
              if chair_re.search(str(name)): return 'chair'
              if minister_re.search(str(name)): return 'ministerial'
              key=(str(code),pd.Timestamp(date) if pd.notna(date) else pd.NaT)
              if key not in cache:
                  g=offices[offices.member_code.astype(str).eq(str(code))]
                  if g.empty: cache[key]='ordinary_member' if code else 'unmatched'
                  else:
                      mask=(g.office_start.isna()|g.office_start.le(key[1]))&(g.office_end.isna()|g.office_end.gt(key[1])); names=' '.join(g.loc[mask,'office_name'].dropna().astype(str))
                      if chair_re.search(names): cache[key]='chair'
                      elif minister_re.search(names): cache[key]='ministerial'
                      else: cache[key]='ordinary_member' if code else 'unmatched'
              return cache[key]
          rs['role_bucket']=[role(r.speaker_member_code,r.debate_date,r.speaker_name) for r in rs.itertuples(index=False)]
          rs['participant_key']=rs.speaker_member_code.where(rs.speaker_member_code.ne(''),'name:'+rs.speaker_name.astype(str))
          multi=[]
          for (sid,pkey),g in rs.groupby(['debate_section_id','participant_key']):
              roles=sorted(set(g.role_bucket.astype(str)))
              if len(roles)>1:
                  multi.append({'debate_section_id':sid,'participant_key':pkey,'roles':roles,'rows':[{'date':str(r.debate_date.date()) if pd.notna(r.debate_date) else None,'speaker_name':str(r.speaker_name),'member_code':str(r.speaker_member_code),'role':str(r.role_bucket),'speech_text':str(r.speech_text)[:400]} for r in g.itertuples(index=False)]})
          unmatched=rs[rs.role_bucket.eq('unmatched')]
          out={'multi_role_participants':multi,'unmatched_speeches':[{'debate_section_id':str(r.debate_section_id),'date':str(r.debate_date.date()) if pd.notna(r.debate_date) else None,'speaker_name':str(r.speaker_name),'speaker_role':str(getattr(r,'speaker_role','')),'speech_text':str(r.speech_text)[:400]} for r in unmatched.itertuples(index=False)]}
          Path('analysis').mkdir(exist_ok=True); Path('analysis/oral_exchange_role_anomalies.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n'); print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist anomaly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/oral_exchange_role_anomalies.json
          git commit -m "Capture oral exchange role anomalies ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
