name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  validate-contextual-monthly-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas pyarrow pyyaml pytest
      - name: Run focused tests
        run: python -m pytest -q tests/political_metrics/test_contextual_monthly_results.py tests/political_metrics/test_candidate_materialization.py tests/political_metrics/test_catalogue_materialization.py
      - name: Re-run candidate updater against failed candidate batch
        run: |
          python process/political_metrics_contextual_monthly_candidate.py \
            --batch-id contextual-monthly-voting-20260904-1 \
            --report-path contextual_monthly_fix_validation.json
