name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  probe-written-main-xml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests lxml
      - name: Probe daily Written Answers XML
        run: |
          python - <<'PY'
          import json,requests
          from lxml import etree
          dates=['2025-01-22','2025-07-29','2026-07-28']
          out=[]
          for d in dates:
              url=f'https://data.oireachtas.ie/akn/ie/debateRecord/dail/{d}/writtens/mul@/main.xml'
              try:
                  r=requests.get(url,timeout=(5,20),headers={'User-Agent':'EirePolitic research audit/1.0'})
                  rec={'date':d,'url':url,'status':r.status_code,'bytes':len(r.content)}
                  if r.ok:
                      root=etree.fromstring(r.content)
                      local=lambda t:t.split('}',1)[-1] if '}' in t else t
                      sections=[el for el in root.iter() if local(el.tag)=='debateSection']
                      rec['debate_sections']=len(sections)
                      rec['written_answer_sections']=sum(1 for el in sections if any((k.split('}',1)[-1] if '}' in k else k)=='name' and v=='writtenAnswer' for k,v in el.attrib.items()))
                  out.append(rec)
              except Exception as e:
                  out.append({'date':d,'url':url,'error':f'{type(e).__name__}: {e}'})
          print(json.dumps(out,indent=2))
          PY
