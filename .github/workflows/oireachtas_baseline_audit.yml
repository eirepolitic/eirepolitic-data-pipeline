name: Oral exchange participant candidate validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_BATCH_ID: oral-exchange-participants-33655165749-1
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Seed exact production snapshot
        run: |
          set -euo pipefail
          python process/oireachtas_seed_candidate.py \
            --batch-id "${OIREACHTAS_BATCH_ID}" --bucket "${S3_BUCKET}" --region "${AWS_REGION}" \
            | tee candidate_seed.json
      - name: Materialize revised political metrics
        run: |
          set -euo pipefail
          python process/political_metrics_materialize_candidate.py \
            --batch-id "${OIREACHTAS_BATCH_ID}" --bucket "${S3_BUCKET}" --region "${AWS_REGION}" \
            --report-path political_metrics_candidate_report.json
      - name: Verify exchange and participant reconciliation
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, os
          import boto3, pandas as pd
          from extract.oireachtas.batch import batch_key_for_production_key

          bucket=os.environ['S3_BUCKET']; batch=os.environ['OIREACHTAS_BATCH_ID']; s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          def read(logical):
              key=batch_key_for_production_key(logical,batch)
              return pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=key)['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
          q=read('processed/oireachtas_unified/latest/csv/silver_questions.csv')
          s=read('processed/oireachtas_unified/latest/csv/silver_speeches.csv')
          sections=read('processed/oireachtas_unified/latest/metrics/event/oral_question_sections/csv/oral_question_sections.csv')
          participants=read('processed/oireachtas_unified/latest/metrics/event/oral_question_exchange_participants/csv/oral_question_exchange_participants.csv')
          oral=q[q.question_type.fillna('').astype(str).str.strip().str.lower().eq('oral')]
          oral_ids=set(oral.debate_section_id.dropna().astype(str))
          related=s[s.debate_section_id.astype(str).isin(oral_ids)].copy()
          related['word_count_num']=pd.to_numeric(related.word_count,errors='raise')
          sections['related_speech_count']=pd.to_numeric(sections.related_speech_count,errors='raise')
          sections['related_speech_word_count']=pd.to_numeric(sections.related_speech_word_count,errors='raise')
          participants['intervention_count']=pd.to_numeric(participants.intervention_count,errors='raise')
          participants['word_count']=pd.to_numeric(participants.word_count,errors='raise')
          assert sections.debate_section_id.is_unique
          assert not participants.duplicated(['debate_section_id','participant_key','participant_role']).any()
          assert set(participants.participant_role).issubset({'ministerial','chair','ordinary_member','collective_or_unidentified'})
          assert int(sections.related_speech_count.sum()) == int(related.speech_id.nunique())
          assert int(participants.intervention_count.sum()) == int(related.speech_id.nunique())
          assert int(sections.related_speech_word_count.sum()) == int(related.word_count_num.sum())
          assert int(participants.word_count.sum()) == int(related.word_count_num.sum())
          collective=participants[participants.participant_role.eq('collective_or_unidentified')]
          assert collective.member_code.fillna('').astype(str).str.strip().eq('').all()
          print({
              'oral_question_sections':len(sections),
              'participant_rows':len(participants),
              'related_speeches':int(related.speech_id.nunique()),
              'related_words':int(related.word_count_num.sum()),
              'collective_or_unidentified_rows':len(collective),
              'question_classifier_calls':0,
          })
          PY
      - name: Assemble eight-dataset political metrics manifest
        run: |
          set -euo pipefail
          python process/oireachtas_batch_control.py --bucket "${S3_BUCKET}" --region "${AWS_REGION}" assemble \
            --batch-id "${OIREACHTAS_BATCH_ID}" \
            --required-table political_metrics_daily_activity_components \
            --required-table political_metrics_daily_issue_activity \
            --required-table political_metrics_division_party_vote_components \
            --required-table political_metrics_daily_question_dimensions \
            --required-table political_metrics_oral_question_sections \
            --required-table political_metrics_oral_question_exchange_participants \
            --required-table political_metrics_speech_question_context \
            --required-table political_metrics_monthly_metric_results \
            | tee candidate_manifest.json
      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: oral-exchange-participant-candidate-build-${{ github.run_id }}
          path: |
            candidate_seed.json
            political_metrics_candidate_report.json
            candidate_manifest.json
          if-no-files-found: error
          retention-days: 30

  validate-candidate:
    needs: build-candidate
    uses: ./.github/workflows/oireachtas_validation_reusable.yml
    with:
      batch_id: oral-exchange-participants-33655165749-1
      run_consumers: true
    secrets: inherit
