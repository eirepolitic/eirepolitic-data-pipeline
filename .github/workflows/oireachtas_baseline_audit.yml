name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_BATCH_ID: scheduled-weekly-33530737534-1
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run source fallback regression tests
        run: python -m unittest tests.test_oireachtas_stage_downstream_contracts
      - name: Run exact candidate staging command
        run: |
          set -euo pipefail
          python process/oireachtas_stage_downstream_contracts.py \
            --bucket "$S3_BUCKET" \
            --region "$AWS_REGION" \
            --batch-id "$OIREACHTAS_BATCH_ID" \
            | tee oireachtas_enrichment_staging.json
