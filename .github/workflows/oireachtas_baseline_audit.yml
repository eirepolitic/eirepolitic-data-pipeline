name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas pyyaml
      - name: Run source inspection and capture traceback
        shell: bash
        run: |
          mkdir -p diagnostics/question-order-source
          set +e
          python - <<'PY' > diagnostics/question-order-source/stdout.txt 2> diagnostics/question-order-source/stderr.txt
          import io,json,os
          from pathlib import Path
          import boto3,pandas as pd
          from extract.oireachtas.batch import resolve_production_key
          bucket=os.environ['S3_BUCKET']; s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          def read(key):
              r=resolve_production_key(s3,bucket=bucket,production_key=key)
              return pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=r)['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
          s=read('processed/oireachtas_unified/latest/csv/silver_speeches.csv')
          q=read('processed/oireachtas_unified/latest/csv/silver_questions.csv')
          dig=json.loads(Path('analysis/question_taking_order_exceptions_digest.json').read_text())
          print('speech cols',list(s.columns))
          for ex in dig['exceptions']:
              qq=q[(q.question_type.fillna('').astype(str).str.lower().eq('oral')) & (q.question_date.astype(str).str.startswith(ex['date']))]
              secs=set(qq[qq.asked_by_member_code.astype(str).isin(ex['submitters'])].debate_section_id.dropna().astype(str))
              ss=s[(s.debate_date.astype(str).str.startswith(ex['date'])) & (s.debate_section_id.astype(str).isin(secs))].copy()
              print(ex['date'],ex['heading'],len(ss),sorted(secs))
          PY
          echo $? > diagnostics/question-order-source/exit_code.txt
      - name: Persist diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diagnostics/question-order-source
          git commit -m "Capture question order source diagnostics ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
