name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oireachtas-baseline-audit
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
      POLITICAL_METRICS_PERIOD: '2026-07'
      POLITICAL_METRICS_ISSUE_PERIOD_START: '2026-07-01'
      POLITICAL_METRICS_ISSUE_PERIOD_END: '2026-07-31'
      POLITICAL_METRICS_ISSUE_AUDIT_DIR: artifacts/political-metrics-issue-audit
      POLITICAL_METRICS_ISSUE_COMMISSION_DIR: artifacts/political-metrics-issue-commission
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install boto3 pandas
      - name: Test political metrics foundation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/political_metrics -p 'test_*.py'
      - name: Create read-only inventory
        shell: bash
        run: |
          set -euo pipefail
          python process/oireachtas_audit_inventory.py
      - name: Audit promoted issue classifications
        shell: bash
        run: |
          set -euo pipefail
          python process/political_metrics_issue_audit.py
      - name: Commission July 2026 issue metrics
        shell: bash
        run: |
          set -euo pipefail
          python process/political_metrics_issue_commission.py
      - name: Publish compact issue commissioning results
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/political-metrics-issue-commission/summary.md ]; then
            cat artifacts/political-metrics-issue-commission/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/political-metrics-issue-commission/report.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/political-metrics-issue-commission/report.json').read_text())
          print(f"::notice title=Issue commission totals::period={r['period']['start']}..{r['period']['end']}; dail_policy={r['classification']['policy_labelled_rows']}; td_policy={r['td_policy_speech_count']}; gate={r['classification']['ready']}")
          top=' | '.join(f"{x['issue_label']}:{x['issue_speech_count']} ({x['issue_share']*100:.1f}%)" for x in r['top_national_issues'])
          party=' | '.join(f"{x['party_name']}→{x['issue_label']}:{x['issue_share']*100:.1f}% ({x['share_vs_td_national_pp']:+.1f}pp)" for x in r['party_strongest_emphasis'])
          members=' | '.join(f"{x['member_name']}→{x['issue_label']}:{x['issue_share']*100:.1f}%" for x in r['member_main_issues'])
          const=' | '.join(f"{x['constituency_name']}→{x['issue_label']}:{x['issue_share']*100:.1f}%" for x in r['constituency_main_issues'])
          print(f"::notice title=Top Dáil issues::{top}")
          print(f"::notice title=Strongest party emphasis::{party}")
          print(f"::notice title=High-activity TD main issues::{members}")
          print(f"::notice title=High-activity constituency main issues::{const}")
          PY
          fi
      - name: Upload issue commissioning artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: political-metrics-issue-commission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/oireachtas-baseline-audit/
            artifacts/political-metrics-issue-audit/
            artifacts/political-metrics-issue-commission/
          if-no-files-found: error
          retention-days: 30
