name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact digest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('analysis/question_taking_audit.json').read_text())
          out={
            'exchange_count':src.get('exchange_count'),
            'oral_question_count':src.get('oral_question_count'),
            'exchange_status_counts':src.get('exchange_status_counts'),
            'question_status_counts':src.get('question_status_counts'),
            'certified_single_question_substitute_candidates':src.get('certified_single_question_substitute_candidates'),
            'first_ordinary_is_submitter_when_submitter_present':src.get('first_ordinary_is_submitter_when_submitter_present'),
            'methodological_rule':src.get('methodological_rule'),
            'explicit_substitute_examples':src.get('explicit_substitute_examples',[])[:6],
            'unresolved_examples':src.get('unresolved_examples',[])[:8],
            'candidate_question_relationships':src.get('candidate_question_relationships',[])[:20],
          }
          Path('analysis/question_taking_audit_digest.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/question_taking_audit_digest.json
          git commit -m "Summarize question-taking audit ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
