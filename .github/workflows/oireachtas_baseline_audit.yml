name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas numpy pyyaml
      - name: Refine exchange participant roles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os
          from pathlib import Path
          import boto3
          import pandas as pd
          from extract.oireachtas.batch import resolve_production_key

          bucket=os.environ['S3_BUCKET']; s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          keys={
            'questions':'processed/oireachtas_unified/latest/csv/silver_questions.csv',
            'speeches':'processed/oireachtas_unified/latest/csv/silver_speeches.csv',
            'oral_sections':'processed/oireachtas_unified/latest/metrics/event/oral_question_sections/csv/oral_question_sections.csv',
            'speech_context':'processed/oireachtas_unified/latest/metrics/event/speech_question_context/csv/speech_question_context.csv',
            'offices':'processed/oireachtas_unified/latest/csv/silver_member_offices.csv',
          }
          frames={}
          for name,key in keys.items():
              r=resolve_production_key(s3,bucket=bucket,production_key=key)
              obj=s3.get_object(Bucket=bucket,Key=r)
              frames[name]=pd.read_csv(io.BytesIO(obj['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])

          q=frames['questions']; s=frames['speeches']; oq=frames['oral_sections']; sc=frames['speech_context']; offices=frames['offices']
          q['question_date']=pd.to_datetime(q['question_date'],errors='coerce')
          s['debate_date']=pd.to_datetime(s['debate_date'],errors='coerce'); s['word_count']=pd.to_numeric(s['word_count'],errors='coerce').fillna(0).astype(int)
          oq['debate_date']=pd.to_datetime(oq['debate_date'],errors='coerce')
          offices['office_start']=pd.to_datetime(offices['office_start'],errors='coerce'); offices['office_end']=pd.to_datetime(offices['office_end'],errors='coerce')

          oral=q[q.question_type.fillna('').astype(str).str.strip().str.lower().eq('oral')].copy(); oral['debate_section_id']=oral.debate_section_id.astype(str)
          related=set(sc.loc[sc.speech_context.astype(str).eq('oral_question_exchange'),'speech_id'].astype(str))
          rs=s[s.speech_id.astype(str).isin(related)].copy(); rs['debate_section_id']=rs.debate_section_id.astype(str); rs['speaker_member_code']=rs.speaker_member_code.fillna('').astype(str); rs['speaker_name']=rs.speaker_name.fillna('').astype(str)

          def role_class(name):
              t='' if pd.isna(name) else str(name).strip().lower()
              if 'ceann comhairle' in t or 'leas-cheann comhairle' in t or 'cathaoirleach' in t: return 'chair'
              if 'taoiseach' in t or 'tánaiste' in t or 'minister' in t or 'attorney general' in t: return 'ministerial'
              return None
          offices['role_class']=offices.office_name.map(role_class)

          cache={}
          def role_for(code,date,name):
              key=(str(code),pd.Timestamp(date) if pd.notna(date) else pd.NaT)
              if key not in cache:
                  g=offices[offices.member_code.astype(str).eq(str(code))]
                  if len(g):
                      mask=(g.office_start.isna()|g.office_start.le(key[1]))&(g.office_end.isna()|g.office_end.gt(key[1]))
                      cache[key]=set(g.loc[mask,'role_class'].dropna().astype(str))
                  else: cache[key]=set()
              roles=cache[key]; lname=str(name).lower()
              if 'chair' in roles or 'ceann comhairle' in lname or 'leas-cheann comhairle' in lname: return 'chair'
              if 'ministerial' in roles: return 'ministerial'
              return 'ordinary_member' if str(code) else 'unmatched'
          rs['role_bucket']=[role_for(r.speaker_member_code,r.debate_date,r.speaker_name) for r in rs.itertuples(index=False)]

          records=[]; absent_examples=[]
          for sid,row in oq.drop_duplicates('debate_section_id').set_index('debate_section_id').iterrows():
              qg=oral[oral.debate_section_id.eq(str(sid))]; sg=rs[rs.debate_section_id.eq(str(sid))].copy()
              askers=set(x for x in qg.asked_by_member_code.dropna().astype(str) if x)
              speakers=set(x for x in sg.speaker_member_code.astype(str) if x)
              participating=askers&speakers
              ordinary_other=set(sg.loc[(sg.role_bucket=='ordinary_member') & (~sg.speaker_member_code.isin(askers)),'speaker_member_code'].astype(str))
              role_counts=sg.role_bucket.value_counts().to_dict(); total_words=int(sg.word_count.sum())
              ordinary_other_words=int(sg.loc[(sg.role_bucket=='ordinary_member') & (~sg.speaker_member_code.isin(askers)),'word_count'].sum())
              rec={
                'debate_section_id':str(sid),'date':str(pd.Timestamp(row.debate_date).date()) if pd.notna(row.debate_date) else None,'heading':str(row.section_heading),
                'question_count':int(row.oral_question_count),'asker_count':len(askers),'participating_asker_count':len(participating),
                'asker_participation_share':len(participating)/len(askers) if askers else None,
                'ordinary_non_submitter_td_count':len(ordinary_other),'ordinary_non_submitter_interventions':int(((sg.role_bucket=='ordinary_member') & (~sg.speaker_member_code.isin(askers))).sum()),
                'ordinary_non_submitter_words':ordinary_other_words,'ordinary_non_submitter_word_share':ordinary_other_words/total_words if total_words else None,
                'ministerial_interventions':int(role_counts.get('ministerial',0)),'chair_interventions':int(role_counts.get('chair',0)),
                'speech_interventions':int(len(sg)),'total_words':total_words,
                'recipients':sorted(set(qg.to_minister_or_department.dropna().astype(str))) if 'to_minister_or_department' in qg.columns else [],
              }
              records.append(rec)
              if askers and not participating and len(absent_examples)<40:
                  absent_examples.append({**rec,
                    'askers':sorted(askers),
                    'question_texts':[str(x)[:450] for x in qg.question_text.dropna().astype(str).head(5)],
                    'speech_speakers':[{'code':str(r.speaker_member_code),'name':str(r.speaker_name),'role':str(r.role_bucket),'words':int(r.word_count),'text':str(r.speech_text)[:300]} for r in sg.head(12).itertuples(index=False)]
                  })
          ex=pd.DataFrame(records)
          single=ex[ex.question_count.eq(1)]; grouped=ex[ex.question_count.gt(1)]
          def cohort(df):
              return {
                'exchange_count':int(len(df)),
                'share_with_any_ordinary_non_submitter_td':float(df.ordinary_non_submitter_td_count.gt(0).mean()) if len(df) else None,
                'median_ordinary_non_submitter_td_count':float(df.ordinary_non_submitter_td_count.median()) if len(df) else None,
                'median_ordinary_non_submitter_word_share':float(df.ordinary_non_submitter_word_share.median()) if len(df) else None,
                'share_no_submitter_in_transcript':float(df.asker_participation_share.eq(0).mean()) if len(df) else None,
                'share_all_submitters_in_transcript':float(df.asker_participation_share.eq(1).mean()) if len(df) else None,
              }
          # Counts by role across all exchange speech rows.
          role_summary=[]
          for role,g in rs.groupby('role_bucket'):
              role_summary.append({'role':role,'interventions':int(len(g)),'words':int(g.word_count.sum()),'intervention_share':float(len(g)/len(rs)),'word_share':float(g.word_count.sum()/rs.word_count.sum()) if rs.word_count.sum() else None,'distinct_speakers':int(g.speaker_member_code.replace('',pd.NA).nunique())})
          role_summary=sorted(role_summary,key=lambda x:-x['words'])

          # No-submitter cases by recipient and heading frequency.
          absent=ex[ex.asker_participation_share.eq(0)]
          absent_rec=[]
          exploded=[]
          for r in absent.to_dict(orient='records'):
              for rec in r['recipients']: exploded.append({'recipient':rec,'section':r['debate_section_id']})
          if exploded:
              adf=pd.DataFrame(exploded); absent_rec=adf.groupby('recipient').section.nunique().sort_values(ascending=False).head(20).rename('exchange_count').reset_index().to_dict(orient='records')
          absent_head=absent.heading.value_counts().head(20).rename_axis('heading').reset_index(name='exchange_count').to_dict(orient='records')

          out={
            'exchange_count':int(len(ex)),
            'role_summary_all_oral_exchange_speeches':role_summary,
            'single_question':cohort(single),
            'grouped_questions':cohort(grouped),
            'all':cohort(ex),
            'no_submitter_exchange_count':int(len(absent)),
            'no_submitter_top_recipients':absent_rec,
            'no_submitter_top_headings':absent_head,
            'no_submitter_examples':absent_examples[:15],
            'largest_ordinary_non_submitter_participation':ex.sort_values(['ordinary_non_submitter_td_count','ordinary_non_submitter_words'],ascending=False).head(20).to_dict(orient='records'),
          }
          Path('analysis').mkdir(exist_ok=True); Path('analysis/oral_exchange_participant_roles_corrected.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/oral_exchange_participant_roles_corrected.json
          git commit -m "Refine oral exchange participant roles ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
