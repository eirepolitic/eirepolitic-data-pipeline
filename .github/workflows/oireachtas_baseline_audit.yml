name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact contextual voting digest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('analysis/contextual_voting_profile.json').read_text())
          out={
            'production_batch_id':d['production_batch_id'],
            'row_counts':d['row_counts'],
            'division_context_counts':d['division_context_counts'],
            'bill_division_count':d['bill_division_count'],
            'nonbill_division_count':d['nonbill_division_count'],
            'by_context':d['by_context'],
            'bill_profile':d['bill_profile'],
            'nonbill_profile':d['nonbill_profile'],
            'closest_divisions':d['closest_divisions'][:15],
            'bill_division_samples':d['bill_division_samples'][:20],
            'context_samples':{k:v[:8] for k,v in d['context_samples'].items()},
            'bill_stage_history_samples':dict(list(d['bill_stage_history_samples'].items())[:10]),
            'guardrails':d['guardrails'],
          }
          Path('analysis/contextual_voting_digest.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/contextual_voting_digest.json
          git commit -m "Add contextual voting digest ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
