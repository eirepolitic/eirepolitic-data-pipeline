name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oireachtas-baseline-audit
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
      POLITICAL_METRICS_AUDIT_DIR: artifacts/political-metrics-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install boto3 pandas
      - name: Test political metrics foundation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/political_metrics -p 'test_*.py'
      - name: Create read-only inventory
        shell: bash
        run: |
          set -euo pipefail
          python process/oireachtas_audit_inventory.py
      - name: Run read-only political metrics audit
        shell: bash
        run: |
          set -euo pipefail
          python process/political_metrics_audit.py
      - name: Publish compact audit result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/political-metrics-audit/report.json').read_text())
          a = r['speech_temporal_attribution']
          s = r['speech_reconciliation']
          c = r['certification']
          d = r['speech_date_range']
          h = r['history_coverage']
          message = (
              f"ready={c['ready_for_historical_public_speech_metrics']}; "
              f"speech_dates={d['min']}..{d['max']}; "
              f"eligible_td_speeches={a['eligible_td_speech_rows']}; "
              f"out_of_scope_identified={a['out_of_scope_identified_speech_rows']}; "
              f"membership_gaps={a['membership_gap_speech_rows']}; "
              f"party_coverage={a['party_attribution_coverage']:.6f}; "
              f"constituency_coverage={a['constituency_attribution_coverage']:.6f}; "
              f"identified_speaker_coverage={s['member_attribution_coverage']:.6f}; "
              f"membership_start={h['silver_member_memberships']['min_start']}; "
              f"party_start={h['silver_member_parties']['min_start']}; "
              f"constituency_start={h['silver_member_constituencies']['min_start']}; "
              f"failed_checks={[k for k,v in c['checks'].items() if not v]}"
          )
          print(f"::notice title=Political metrics historical audit::{message}")
          diagnostic = {
              'party_overlap_examples': h['silver_member_parties'].get('overlap_examples', [])[:10],
              'membership_gap_examples': a.get('membership_gap_speech_examples', [])[:10],
              'out_of_scope_identified_examples': a.get('out_of_scope_identified_speech_examples', [])[:10],
              'party_unmatched_examples': a.get('party_unmatched_examples', [])[:10],
              'constituency_unmatched_examples': a.get('constituency_unmatched_examples', [])[:10],
          }
          print(f"::notice title=Political metrics audit diagnostics::{json.dumps(diagnostic, separators=(',', ':'))}")
          PY
      - name: Add political metrics summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/political-metrics-audit/summary.md ]; then
            cat artifacts/political-metrics-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload baseline audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oireachtas-baseline-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/oireachtas-baseline-audit/
            artifacts/political-metrics-audit/
          if-no-files-found: error
          retention-days: 30
