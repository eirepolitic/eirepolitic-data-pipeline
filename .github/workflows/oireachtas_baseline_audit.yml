name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas pyyaml
      - name: Analyze promoted parliamentary questions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os
          from pathlib import Path
          import boto3
          import pandas as pd
          from extract.oireachtas.batch import resolve_production_key
          from political_metrics.calculators.questions import prepare_eligible_td_questions

          bucket=os.environ['S3_BUCKET']
          s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          keys={
            'questions':'processed/oireachtas_unified/latest/csv/silver_questions.csv',
            'memberships':'processed/oireachtas_unified/latest/csv/silver_member_memberships.csv',
            'parties':'processed/oireachtas_unified/latest/csv/silver_member_parties.csv',
            'constituencies':'processed/oireachtas_unified/latest/csv/silver_member_constituencies.csv',
            'monthly':'processed/oireachtas_unified/latest/metrics/completed_month/monthly_metric_results/csv/monthly_metric_results.csv',
          }
          frames={}; resolved={}
          for name,key in keys.items():
              r=resolve_production_key(s3,bucket=bucket,production_key=key)
              resolved[name]=r
              obj=s3.get_object(Bucket=bucket,Key=r)
              frames[name]=pd.read_csv(io.BytesIO(obj['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])

          q=prepare_eligible_td_questions(frames['questions'],frames['memberships'],frames['parties'],frames['constituencies'])
          q['question_date']=pd.to_datetime(q['question_date'],errors='coerce')
          monthly=frames['monthly'].copy()
          monthly['period_end']=pd.to_datetime(monthly['period_end'],errors='coerce')
          monthly['value_num']=pd.to_numeric(monthly['value'],errors='coerce')

          member_names={}
          m=monthly[(monthly['grain']=='member') & monthly['entity_id'].notna() & monthly['entity_name'].notna())]
          for r in m[['entity_id','entity_name']].drop_duplicates('entity_id').itertuples(index=False):
              member_names[str(r.entity_id)]=str(r.entity_name)
          party_names={}
          p=monthly[(monthly['grain']=='party') & monthly['entity_id'].notna() & monthly['entity_name'].notna())]
          for r in p[['entity_id','entity_name']].drop_duplicates('entity_id').itertuples(index=False):
              party_names[str(r.entity_id)]=str(r.entity_name)
          constituency_names={}
          c=monthly[(monthly['grain']=='constituency') & monthly['entity_id'].notna() & monthly['entity_name'].notna())]
          for r in c[['entity_id','entity_name']].drop_duplicates('entity_id').itertuples(index=False):
              constituency_names[str(r.entity_id)]=str(r.entity_name)

          latest_normal=pd.Timestamp('2026-07-31')
          month=q[(q['question_date']>=pd.Timestamp('2026-07-01'))&(q['question_date']<=latest_normal)].copy()

          # Volume concentration by member.
          member_counts=(month.groupby('member_code').size().rename('question_count').reset_index())
          member_counts['member_name']=member_counts['member_code'].astype(str).map(member_names).fillna(member_counts['member_code'].astype(str))
          member_counts=member_counts.sort_values('question_count',ascending=False)
          total=int(member_counts.question_count.sum())
          top10_share=float(member_counts.head(10).question_count.sum()/total) if total else None
          top20n=max(1,int(len(member_counts)*0.20+0.999999))
          top20_share=float(member_counts.head(top20n).question_count.sum()/total) if total else None

          # Question-day breadth per member.
          member_days=(month.groupby('member_code')['question_date'].nunique().rename('question_days').reset_index())
          member_profile=member_counts.merge(member_days,on='member_code',how='left')
          member_profile['questions_per_question_day']=member_profile['question_count']/member_profile['question_days'].replace({0:pd.NA})

          # Party volume and oral/written mix. No per-TD normalization introduced here.
          party_counts=(month.groupby('party_uri').size().rename('question_count').reset_index())
          party_counts['party_name']=party_counts['party_uri'].astype(str).map(party_names).fillna(party_counts['party_uri'].astype(str))
          party_counts=party_counts.sort_values('question_count',ascending=False)

          qtype_col='question_type' if 'question_type' in month.columns else None
          if qtype_col:
              party_type=(month.groupby(['party_uri',qtype_col]).size().rename('count').reset_index())
              party_type['party_name']=party_type['party_uri'].astype(str).map(party_names).fillna(party_type['party_uri'].astype(str))
              totals=party_type.groupby('party_uri')['count'].transform('sum')
              party_type['share']=party_type['count']/totals
          else:
              party_type=pd.DataFrame()

          # Recipient concentration and member specialisation.
          rec_col='to_minister_or_department' if 'to_minister_or_department' in month.columns else None
          recipient_counts=[]; member_specialisation=[]; party_recipient=[]; constituency_recipient=[]
          if rec_col:
              rc=(month.dropna(subset=[rec_col]).groupby(rec_col).size().rename('question_count').reset_index().sort_values('question_count',ascending=False))
              rc['share']=rc['question_count']/rc['question_count'].sum() if rc['question_count'].sum() else 0
              recipient_counts=rc.to_dict(orient='records')

              mr=(month.dropna(subset=[rec_col]).groupby(['member_code',rec_col]).size().rename('count').reset_index())
              mt=mr.groupby('member_code')['count'].transform('sum')
              mr['share_of_member_questions']=mr['count']/mt
              mr['member_name']=mr['member_code'].astype(str).map(member_names).fillna(mr['member_code'].astype(str))
              member_specialisation=(mr[mr['count']>=10].sort_values(['share_of_member_questions','count'],ascending=False).head(60).to_dict(orient='records'))

              pr=(month.dropna(subset=[rec_col]).groupby(['party_uri',rec_col]).size().rename('count').reset_index())
              pt=pr.groupby('party_uri')['count'].transform('sum')
              pr['share_of_party_questions']=pr['count']/pt
              pr['party_name']=pr['party_uri'].astype(str).map(party_names).fillna(pr['party_uri'].astype(str))
              party_recipient=pr.sort_values(['share_of_party_questions','count'],ascending=False).head(80).to_dict(orient='records')

              cr=(month.dropna(subset=[rec_col]).groupby(['constituency_uri',rec_col]).size().rename('count').reset_index())
              ct=cr.groupby('constituency_uri')['count'].transform('sum')
              cr['share_of_constituency_questions']=cr['count']/ct
              cr['constituency_name']=cr['constituency_uri'].astype(str).map(constituency_names).fillna(cr['constituency_uri'].astype(str))
              constituency_recipient=cr[cr['count']>=10].sort_values(['share_of_constituency_questions','count'],ascending=False).head(80).to_dict(orient='records')

          # Recurring monthly recipient trends from raw eligible questions.
          q['month']=q['question_date'].dt.to_period('M').astype(str)
          recipient_monthly=[]
          if rec_col:
              rm=(q.dropna(subset=[rec_col]).groupby(['month',rec_col]).size().rename('count').reset_index())
              rmt=rm.groupby('month')['count'].transform('sum')
              rm['share']=rm['count']/rmt
              latest_months=sorted(rm['month'].dropna().unique())[-12:]
              recipient_monthly=rm[rm['month'].isin(latest_months)].sort_values(['month','count'],ascending=[True,False]).to_dict(orient='records')

          # Constituency volume, deliberately raw only.
          const_counts=(month.groupby('constituency_uri').size().rename('question_count').reset_index())
          const_counts['constituency_name']=const_counts['constituency_uri'].astype(str).map(constituency_names).fillna(const_counts['constituency_uri'].astype(str))
          const_counts=const_counts.sort_values('question_count',ascending=False)

          report={
            'resolved_keys':resolved,
            'question_columns':list(frames['questions'].columns),
            'eligible_question_rows':int(len(q)),
            'analysis_period':'2026-07',
            'analysis_month_question_count':int(len(month)),
            'analysis_month_member_count':int(member_counts['member_code'].nunique()),
            'top10_member_question_share':top10_share,
            'top20_percent_member_question_share':top20_share,
            'top_members_by_question_count':member_profile.head(30).to_dict(orient='records'),
            'widest_question_day_coverage':member_profile.sort_values(['question_days','question_count'],ascending=False).head(30).to_dict(orient='records'),
            'highest_questions_per_question_day_min_3_days':member_profile[member_profile['question_days']>=3].sort_values('questions_per_question_day',ascending=False).head(30).to_dict(orient='records'),
            'party_question_counts':party_counts.to_dict(orient='records'),
            'party_question_type_mix':party_type.to_dict(orient='records') if not party_type.empty else [],
            'recipient_counts':recipient_counts,
            'member_recipient_specialisation':member_specialisation,
            'party_recipient_specialisation':party_recipient,
            'constituency_recipient_specialisation':constituency_recipient,
            'constituency_question_counts':const_counts.head(30).to_dict(orient='records'),
            'recipient_monthly_latest_12':recipient_monthly,
          }
          Path('analysis').mkdir(exist_ok=True)
          with open('analysis/question_opportunities.json','w') as fp:
              json.dump(report,fp,indent=2,sort_keys=True,default=str)
          print(json.dumps(report,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist analysis on temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/question_opportunities.json
          git commit -m "Capture promoted parliamentary question opportunity analysis ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
