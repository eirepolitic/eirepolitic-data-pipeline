name: Promote oral exchange participant candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oireachtas-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_BATCH_ID: structure-oral-exchange-participants-20260902-1
      OIREACHTAS_PUBLISH_ENABLED: 'true'
      OIREACHTAS_PUBLISH_LATEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Promote exact validated candidate
        run: |
          set -euo pipefail
          python process/oireachtas_batch_control.py --bucket "${S3_BUCKET}" --region "${AWS_REGION}" promote --batch-id "${OIREACHTAS_BATCH_ID}" | tee promotion.json
      - name: Verify production pointer and eight metric paths
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, os
          import boto3, pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY, read_json_required, resolve_production_key
          bucket=os.environ['S3_BUCKET']; batch=os.environ['OIREACHTAS_BATCH_ID']; s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          assert str(pointer.get('batch_id') or pointer.get('mode')) == batch, pointer
          paths=[
            'processed/oireachtas_unified/latest/metrics/daily/daily_activity_components/csv/daily_activity_components.csv',
            'processed/oireachtas_unified/latest/metrics/daily/daily_issue_activity/csv/daily_issue_activity.csv',
            'processed/oireachtas_unified/latest/metrics/event/division_party_vote_components/csv/division_party_vote_components.csv',
            'processed/oireachtas_unified/latest/metrics/daily/daily_question_dimensions/csv/daily_question_dimensions.csv',
            'processed/oireachtas_unified/latest/metrics/event/oral_question_sections/csv/oral_question_sections.csv',
            'processed/oireachtas_unified/latest/metrics/event/oral_question_exchange_participants/csv/oral_question_exchange_participants.csv',
            'processed/oireachtas_unified/latest/metrics/event/speech_question_context/csv/speech_question_context.csv',
            'processed/oireachtas_unified/latest/metrics/completed_month/monthly_metric_results/csv/monthly_metric_results.csv',
          ]
          resolved={p:resolve_production_key(s3,bucket=bucket,production_key=p) for p in paths}
          for logical,key in resolved.items():
              assert f'/batches/{batch}/' in key, (logical,key)
          participant_key=resolved['processed/oireachtas_unified/latest/metrics/event/oral_question_exchange_participants/csv/oral_question_exchange_participants.csv']
          obj=s3.get_object(Bucket=bucket,Key=participant_key)
          pt=pd.read_csv(io.BytesIO(obj['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
          assert not pt.duplicated(['debate_section_id','participant_key','participant_role']).any()
          assert set(pt.participant_role).issubset({'ministerial','chair','ordinary_member','collective_or_unidentified'})
          collective=pt[pt.participant_role.eq('collective_or_unidentified')]
          assert collective.member_code.fillna('').astype(str).str.strip().eq('').all()
          print({'production_batch':batch,'metric_paths_verified':len(resolved),'participant_rows':len(pt),'allowed_roles':sorted(set(pt.participant_role)),'question_classifier_calls':0})
          PY
      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oral-exchange-participant-promotion-${{ github.run_id }}
          path: promotion.json
          if-no-files-found: warn
          retention-days: 90
