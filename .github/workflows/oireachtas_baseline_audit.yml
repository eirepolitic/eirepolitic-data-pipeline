name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pyyaml
      - name: Audit production and logical auxiliary keys
        run: |
          python - <<'PY'
          import json, os
          import boto3
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY, resolve_production_key
          from extract.oireachtas.contracts import load_contract_config

          s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          bucket=os.environ['S3_BUCKET']
          contracts,_=load_contract_config()
          selected=['member_photo_urls','member_summaries','constituency_images','debate_issue_labels']
          try:
              obj=s3.get_object(Bucket=bucket,Key=PRODUCTION_POINTER_KEY)
              pointer=json.loads(obj['Body'].read().decode('utf-8'))
          except Exception as exc:
              pointer={'error':f'{type(exc).__name__}: {exc}'}
          report={'production_pointer':pointer,'contracts':{}}
          for name in selected:
              logical=contracts[name].logical_key
              try:
                  resolved=resolve_production_key(s3,bucket=bucket,production_key=logical)
              except Exception as exc:
                  resolved=None
                  resolve_error=f'{type(exc).__name__}: {exc}'
              else:
                  resolve_error=None
              item={'logical_key':logical,'resolved_key':resolved,'resolve_error':resolve_error}
              for label,key in [('resolved',resolved),('logical',logical)]:
                  if not key:
                      item[label]={'exists':False}
                      continue
                  try:
                      head=s3.head_object(Bucket=bucket,Key=key)
                      item[label]={'exists':True,'size':head.get('ContentLength'),'last_modified':head.get('LastModified').isoformat() if head.get('LastModified') else None}
                  except Exception as exc:
                      code=getattr(exc,'response',{}).get('Error',{}).get('Code') if hasattr(exc,'response') else None
                      item[label]={'exists':False,'error_code':code or type(exc).__name__}
              report['contracts'][name]=item
          os.makedirs('diagnostics',exist_ok=True)
          with open('diagnostics/aux_source_audit.json','w') as f:
              json.dump(report,f,indent=2,sort_keys=True)
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - name: Persist audit on temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/aux_source_audit.json
          git commit -m "Capture auxiliary source audit ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
