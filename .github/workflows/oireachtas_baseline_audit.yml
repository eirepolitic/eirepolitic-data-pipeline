name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact legislation digest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('analysis/legislation_relationships_profile_v2.json').read_text())
          out={
            'production_batch_id':d['production_batch_id'],
            'row_counts':d['row_counts'],
            'bill_coverage':d['bill_coverage'],
            'bill_section_bridge':{k:v for k,v in d['bill_section_bridge'].items() if not k.startswith('sample_')},
            'division_links':{k:v for k,v in d['division_links'].items() if k!='sample'},
            'stage_profile':d['stage_profile'],
            'sponsor_profile':{k:v for k,v in d['sponsor_profile'].items() if not k.startswith('sample_')},
            'guardrails':d['guardrails'],
            'samples':{
              'bill_matches':d['bill_section_bridge'].get('sample_matches',[])[:10],
              'bill_misses':d['bill_section_bridge'].get('sample_misses',[])[:10],
              'disagreements':d['bill_section_bridge'].get('sample_disagreements',[])[:10],
              'divisions':d['division_links'].get('sample',[])[:12],
              'sponsor_member_links':d['sponsor_profile'].get('sample_member_links',[])[:10],
              'empty_sponsors':d['sponsor_profile'].get('sample_empty_sponsors',[])[:10],
            }
          }
          Path('analysis/legislation_relationships_digest.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/legislation_relationships_digest.json
          git commit -m "Add compact legislation diagnostics ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
