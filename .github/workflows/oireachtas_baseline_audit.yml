name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  written-pq-cheap-routing-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas pyyaml openai
      - name: Compile research runners
        run: |
          python -m py_compile process/written_pq_semantic_pilot.py
          python -m py_compile process/written_pq_semantic_pilot_compat.py
          python -m py_compile process/written_pq_semantic_pilot_cheap.py
          python -m py_compile process/written_pq_semantic_pilot_compare.py
      - name: Run lower-token 25-section routing pilot
        run: |
          rm -rf analysis/written_pq_semantic_pilot_cheap
          python process/written_pq_semantic_pilot_cheap.py \
            --sample-size 300 \
            --max-calls 25 \
            --output-dir analysis/written_pq_semantic_pilot_cheap
          python process/written_pq_semantic_pilot_compare.py
      - name: Persist research artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/written_pq_semantic_pilot_cheap || true
          git commit -m "Capture lower-token Written PQ routing pilot ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
