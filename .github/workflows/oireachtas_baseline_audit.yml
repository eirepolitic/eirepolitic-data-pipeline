name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas
      - name: Reprofile deterministic speech context with live legislation bridge
        run: |
          python - <<'PY'
          import io,json,os,re
          from pathlib import Path
          import boto3,pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY,read_json_required,resolve_production_key

          s3=boto3.client('s3',region_name=os.environ['AWS_REGION']); bucket=os.environ['S3_BUCKET']
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          def read(p):
              k=resolve_production_key(s3,bucket=bucket,production_key=p)
              d=pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=k)['Body'].read()),dtype=str,keep_default_na=False)
              for c in d.columns:d[c]=d[c].fillna('').astype(str).str.strip()
              return d
          sp=read('processed/oireachtas_unified/latest/csv/silver_speeches.csv')
          sec=read('processed/oireachtas_unified/latest/csv/silver_debate_sections.csv')
          sqc=read('processed/oireachtas_unified/latest/metrics/event/speech_question_context/csv/speech_question_context.csv')
          bills=read('processed/oireachtas_unified/latest/metrics/event/bill_debate_sections/csv/bill_debate_sections.csv')
          sec['section_heading']=sec.show_as.where(sec.show_as.ne(''),sec.heading)
          heading=sec.drop_duplicates('debate_section_id').set_index('debate_section_id').section_heading.to_dict()
          sp['section_heading']=sp.debate_section_id.map(heading).fillna('')

          oral_sections=set(sqc.loc[sqc.speech_context.eq('oral_question_exchange'),'debate_section_id'])
          bill_sections=set(bills.debate_section_id)
          leaders_headings={"Ceisteanna ó Cheannairí - Leaders' Questions","Ceisteanna ó Cheannairí (Atógáil) - Leaders' Questions (Resumed)"}
          leaders_sections=set(sec.loc[sec.section_heading.isin(leaders_headings),'debate_section_id'])

          # Diagnostic heading families. Exact-heading certification decisions are made after manual review.
          statement_candidates=sorted(set(sec.loc[sec.section_heading.str.contains(r'\bStatements?\b|\bRáitis\b|\bRáiteas\b',case=False,regex=True,na=False),'section_heading']))
          procedural_candidates=sorted(set(sec.loc[sec.section_heading.str.contains(r'Order of Business|An tOrd Gnó|Questions on Promised Legislation|Ceisteanna ar Reachtaíocht a Gealladh|Business of Dáil|Gnó na Dála|Business of the Dáil|Business of the House|Sittings and Business',case=False,regex=True,na=False),'section_heading']))
          motion_candidates=sorted(set(sec.loc[sec.section_heading.str.contains(r'\bMotion\b|\bMotions\b|\bRún\b|\bRúin\b',case=False,regex=True,na=False),'section_heading']))

          def sections_for(headings): return set(sec.loc[sec.section_heading.isin(headings),'debate_section_id'])
          candidate_sets={
              'oral_question_exchange':oral_sections,
              'bill_or_legislation':bill_sections,
              'leaders_questions':leaders_sections,
              'statement_candidate':sections_for(statement_candidates),
              'procedural_candidate':sections_for(procedural_candidates),
              'motion_candidate':sections_for(motion_candidates),
          }
          def prof(name,sections_set):
              g=sp[sp.debate_section_id.isin(sections_set)]
              yrs=pd.to_datetime(g.debate_date,errors='coerce').dt.year.value_counts().sort_index().to_dict()
              return {'section_count':len(sections_set),'speech_count':int(len(g)),'years':yrs,'top_headings':g.section_heading.value_counts().head(50).to_dict()}
          profiles={k:prof(k,v) for k,v in candidate_sets.items()}
          overlaps=[]
          names=list(candidate_sets)
          for i,a in enumerate(names):
              for b in names[i+1:]:
                  x=candidate_sets[a]&candidate_sets[b]
                  if x:
                      sample=sec[sec.debate_section_id.isin(x)][['debate_section_id','debate_date','section_heading']].drop_duplicates().head(20).to_dict(orient='records')
                      overlaps.append({'a':a,'b':b,'section_overlap':len(x),'speech_overlap':int(sp.debate_section_id.isin(x).sum()),'examples':sample})

          # Exact heading counts for manual certification review.
          heading_counts=sp.section_heading.value_counts().to_dict()
          statement_detail=[{'heading':h,'speech_count':int(heading_counts.get(h,0)),'section_count':int(sec.loc[sec.section_heading.eq(h),'debate_section_id'].nunique())} for h in statement_candidates]
          procedural_detail=[{'heading':h,'speech_count':int(heading_counts.get(h,0)),'section_count':int(sec.loc[sec.section_heading.eq(h),'debate_section_id'].nunique())} for h in procedural_candidates]
          motion_detail=[{'heading':h,'speech_count':int(heading_counts.get(h,0)),'section_count':int(sec.loc[sec.section_heading.eq(h),'debate_section_id'].nunique())} for h in motion_candidates]

          out={
            'production_batch_id':pointer.get('batch_id') or pointer.get('mode'),
            'row_counts':{'speeches':len(sp),'sections':len(sec),'bill_debate_sections':len(bills)},
            'profiles':profiles,
            'overlaps':overlaps,
            'statement_heading_detail':statement_detail,
            'procedural_heading_detail':procedural_detail,
            'motion_heading_detail':motion_detail,
            'guardrails':[
              'Oral-question context uses certified speech_question_context relationships.',
              'Bill context uses only live certified bill_debate_sections.',
              'Leaders Questions uses only the two previously certified exact headings.',
              'Statement, procedural and motion heading families remain diagnostic until manually reviewed for scope and false positives.',
              'Ambiguous sections remain other.'
            ]
          }
          Path('analysis').mkdir(exist_ok=True)
          Path('analysis/broader_speech_context_v2_digest.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/broader_speech_context_v2_digest.json
          git commit -m "Capture broader speech context v2 diagnostics ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
