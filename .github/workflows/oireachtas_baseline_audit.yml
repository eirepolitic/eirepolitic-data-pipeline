name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  written-pq-semantic-gold-set:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas
      - name: Build blind 100-section review set
        run: |
          python -m py_compile process/written_pq_semantic_gold_set.py
          rm -rf analysis/written_pq_semantic_gold_set
          python process/written_pq_semantic_gold_set.py \
            --target-sections 100 \
            --output-dir analysis/written_pq_semantic_gold_set
      - name: Persist review set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/written_pq_semantic_gold_set
          git commit -m "Create Written PQ semantic gold review set ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
