name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact digest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('analysis/unresolved_question_substitution_patterns.json').read_text())
          out={
            'high_match_unresolved_case_count':src.get('high_match_unresolved_case_count'),
            'candidate_phrase_hit_counts':src.get('candidate_phrase_hit_counts'),
            'guardrail':src.get('guardrail'),
            'cases':src.get('cases',[])[:12],
          }
          Path('analysis/unresolved_question_substitution_patterns_digest.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/unresolved_question_substitution_patterns_digest.json
          git commit -m "Summarize unresolved substitution patterns ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
