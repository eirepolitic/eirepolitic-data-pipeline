name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  recover-semantic-benchmark-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: '34006240512'
    steps:
      - uses: actions/checkout@v4
      - name: Recover benchmark summary from logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/written_pq_semantic_benchmark_recovered logs
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/logs" > logs.zip
          unzip -q logs.zip -d logs
          STEP_LOG="$(find logs -type f -name '*300-section semantic benchmark*' | head -n 1)"
          cp "$STEP_LOG" analysis/written_pq_semantic_benchmark_recovered/benchmark_step.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('analysis/written_pq_semantic_benchmark_recovered/benchmark_step.log')
          text=p.read_text(encoding='utf-8',errors='replace')
          # Strip GitHub timestamp prefixes so the emitted pretty JSON becomes parseable.
          clean='\n'.join(line.split('Z ',1)[1] if 'Z ' in line else line for line in text.splitlines())
          decoder=json.JSONDecoder(); found=[]
          for i,ch in enumerate(clean):
              if ch!='{': continue
              try:
                  obj,end=decoder.raw_decode(clean[i:])
              except Exception:
                  continue
              if isinstance(obj,dict) and 'pilot_version' in obj and 'attempted_sections' in obj:
                  found.append(obj)
          if not found:
              raise SystemExit('No benchmark summary JSON found in logs')
          summary=found[-1]
          Path('analysis/written_pq_semantic_benchmark_recovered/summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,ensure_ascii=False,sort_keys=True))
          PY
      - name: Persist recovered benchmark evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/written_pq_semantic_benchmark_recovered
          git commit -m "Recover 300-section semantic benchmark summary ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
