name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      POLITICAL_METRICS_AUDIT_DIR: diagnostics/question-context-audit
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run relationship audit and retain diagnostics
        shell: bash
        run: |
          mkdir -p diagnostics/question-context-audit
          set +e
          python process/political_metrics_question_context_audit.py > diagnostics/question-context-audit/stdout.txt 2> diagnostics/question-context-audit/stderr.txt
          code=$?
          echo "$code" > diagnostics/question-context-audit/exit_code.txt
          exit 0
      - name: Persist diagnostics on temporary feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diagnostics/question-context-audit
          git commit -m "Capture question context audit diagnostics ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
