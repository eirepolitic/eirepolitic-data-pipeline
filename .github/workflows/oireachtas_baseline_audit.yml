name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Summarize exception cases
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          src=json.loads(Path('analysis/question_taking_order_exceptions.json').read_text())
          rows=[]
          for ex in src['exceptions']:
              seq=ex.get('speech_sequence',[])
              first=seq[0] if seq else {}
              submit_pos=ex.get('first_actual_submitter_position')
              first_text=first.get('text','')
              note=[]
              if ex.get('question_count',0)>1: note.append('grouped')
              if len(first_text.split())<=35: note.append('short_first_intervention')
              if submit_pos is not None and submit_pos<=2: note.append('submitter_appears_immediately')
              if re.search(r'on behalf|covering for|thar ceann|faoi choinne|á tógáil ag',first_text,re.I): note.append('proxy_language')
              rows.append({
                'date':ex.get('date'),'heading':ex.get('heading'),'question_count':ex.get('question_count'),'submitter_count':ex.get('submitter_count'),
                'submitters':ex.get('submitters'),'first_ordinary_member_code':ex.get('first_ordinary_member_code'),'first_ordinary_speaker_name':ex.get('first_ordinary_speaker_name'),
                'first_actual_submitter_position':submit_pos,'first_speaker_text':first_text[:260],'second_speaker':seq[1].get('speaker_name') if len(seq)>1 else None,
                'second_is_submitter':seq[1].get('is_submitter') if len(seq)>1 else None,'third_speaker':seq[2].get('speaker_name') if len(seq)>2 else None,
                'third_is_submitter':seq[2].get('is_submitter') if len(seq)>2 else None,'clues':note,
              })
          out={'exception_count':src.get('exception_count'),'exceptions':rows}
          Path('analysis/question_taking_order_exceptions_digest.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/question_taking_order_exceptions_digest.json
          git commit -m "Summarize question taker ordering exceptions ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
