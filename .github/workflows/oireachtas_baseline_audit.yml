name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas
      - name: Build party constituency and member question-channel profiles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io,json,os
          from pathlib import Path
          import boto3,pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY,read_json_required,resolve_production_key
          bucket=os.environ['S3_BUCKET']; s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          logical='processed/oireachtas_unified/latest/metrics/daily/daily_question_dimensions/csv/daily_question_dimensions.csv'
          key=resolve_production_key(s3,bucket=bucket,production_key=logical)
          dims=pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=key)['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
          dims['question_count_num']=pd.to_numeric(dims.question_count,errors='coerce').fillna(0)
          dims['dimension_name_norm']=dims.dimension_name.fillna('').astype(str).str.strip().str.casefold()
          dims['dimension_value_norm']=dims.dimension_value.fillna('').astype(str).str.strip().str.casefold()
          inventory={
            'dimension_names':dims.dimension_name.value_counts().to_dict(),
            'question_type_raw_values':dims.loc[dims.dimension_name_norm.eq('question_type'),'dimension_value'].value_counts().to_dict(),
            'grains':dims.grain.value_counts().to_dict(),
          }
          qt=dims[dims.dimension_name_norm.eq('question_type') & dims.dimension_value_norm.isin(['oral','written'])].copy()
          qt['channel']=qt.dimension_value_norm.map({'oral':'Oral','written':'Written'})
          profiles={}
          for grain in ['party','constituency','member','national']:
              g=qt[qt.grain.astype(str).str.casefold().eq(grain)]
              if g.empty: continue
              p=g.groupby(['entity_id','channel']).question_count_num.sum().unstack(fill_value=0)
              for c in ['Oral','Written']:
                  if c not in p.columns:p[c]=0
              p['Total']=p.Oral+p.Written;p['oral_share']=p.Oral/p.Total.replace(0,pd.NA);p['written_to_oral_ratio']=p.Written/p.Oral.replace(0,pd.NA)
              p=p.sort_values('Total',ascending=False).reset_index()
              profiles[grain]=p.to_dict(orient='records')
          # Compact comparisons; no ranking interpretation beyond channel mix.
          summary={}
          for grain,rows in profiles.items():
              d=pd.DataFrame(rows)
              summary[grain]={
                'entity_count':len(d),
                'top_by_volume':d.head(20).to_dict(orient='records'),
                'highest_oral_share_min50':d[d.Total.ge(50)].sort_values(['oral_share','Oral'],ascending=[False,False]).head(15).to_dict(orient='records'),
                'lowest_oral_share_min50':d[d.Total.ge(50)].sort_values(['oral_share','Written'],ascending=[True,False]).head(15).to_dict(orient='records'),
              }
          out={'production_batch_id':str(pointer.get('batch_id') or pointer.get('mode')),'resolved_key':key,'inventory':inventory,'profiles':summary,'guardrails':['Profiles use event-date attribution already certified in daily_question_dimensions.','Channel share is descriptive and is not a measure of effectiveness.','Entities with fewer than 50 total questions are excluded from oral-share extremes.']}
          Path('analysis').mkdir(exist_ok=True); Path('analysis/oral_vs_written_grain_profiles.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n'); print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/oral_vs_written_grain_profiles.json
          git commit -m "Capture Oral versus Written grain profiles ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
