name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  question-answer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas
      - name: Audit live question submitters and answer availability
        run: |
          python - <<'PY'
          import io,json,os
          from pathlib import Path
          import boto3,pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY,read_json_required,resolve_production_key
          s3=boto3.client('s3',region_name=os.environ['AWS_REGION']); bucket=os.environ['S3_BUCKET']
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          key=resolve_production_key(s3,bucket=bucket,production_key='processed/oireachtas_unified/latest/csv/silver_questions.csv')
          q=pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=key)['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
          out={
            'production_batch_id':pointer.get('batch_id') or pointer.get('mode'),
            'rows':int(len(q)),
            'asked_by_member_code_populated':int(q['asked_by_member_code'].notna().sum()),
            'asked_by_name_populated':int(q['asked_by_name'].notna().sum()),
            'unique_asker_member_codes':int(q['asked_by_member_code'].dropna().nunique()),
            'recipient_populated':int(q['to_minister_or_department'].notna().sum()),
            'answer_text_populated':int(q['answer_text'].notna().sum()),
            'source_xml_uri_populated':int(q['source_xml_uri'].notna().sum()),
            'source_pdf_uri_populated':int(q['source_pdf_uri'].notna().sum()),
            'question_type_counts':{k:int(v) for k,v in q['question_type'].value_counts(dropna=False).to_dict().items()},
          }
          Path('analysis').mkdir(exist_ok=True)
          Path('analysis/question_answer_audit.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/question_answer_audit.json
          git commit -m "Capture question answer audit ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
