name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  diagnose-contextual-monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas pyarrow pyyaml
      - name: Re-run failed candidate updater with captured traceback
        shell: bash
        run: |
          set +e
          mkdir -p analysis
          python process/political_metrics_contextual_monthly_candidate.py \
            --batch-id contextual-monthly-voting-20260904-1 \
            --report-path analysis/contextual_monthly_candidate_report.json \
            > analysis/contextual_monthly_diagnostic.txt 2>&1
          status=$?
          cat analysis/contextual_monthly_diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/contextual_monthly_diagnostic.txt
          if [ -f analysis/contextual_monthly_candidate_report.json ]; then git add analysis/contextual_monthly_candidate_report.json; fi
          git commit -m "Capture contextual monthly diagnostic ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
          exit $status
