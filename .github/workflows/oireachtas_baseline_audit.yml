name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  validate-written-pq-answer-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
      BATCH_ID: written-pq-answer-validation-20260905-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas pyarrow pyyaml requests lxml pytest
      - name: Compile changed Python
        run: |
          python -m py_compile political_metrics/written_question_answers.py
          python -m py_compile process/political_metrics_written_question_answers_candidate.py
      - name: Run focused tests
        run: python -m pytest -q tests/political_metrics/test_written_question_answers.py tests/political_metrics/test_candidate_materialization.py
      - name: Seed only silver_questions into validation candidate
        run: |
          python - <<'PY'
          import os,boto3
          from extract.oireachtas.batch import batch_key_for_production_key,resolve_production_key
          bucket=os.environ['S3_BUCKET']; batch=os.environ['BATCH_ID']; s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          logical='processed/oireachtas_unified/latest/csv/silver_questions.csv'
          src=resolve_production_key(s3,bucket=bucket,production_key=logical)
          dst=batch_key_for_production_key(logical,batch)
          s3.copy_object(Bucket=bucket,CopySource={'Bucket':bucket,'Key':src},Key=dst)
          print({'source':src,'candidate':dst})
          PY
      - name: Measure scale and run real 100-section dry-run with diagnostic capture
        shell: bash
        run: |
          set +e
          mkdir -p analysis
          {
            python - <<'PY'
          import io,json,os
          import boto3,pandas as pd
          from extract.oireachtas.batch import batch_key_for_production_key
          s3=boto3.client('s3',region_name=os.environ['AWS_REGION']); bucket=os.environ['S3_BUCKET']; batch=os.environ['BATCH_ID']
          logical='processed/oireachtas_unified/latest/csv/silver_questions.csv'
          key=batch_key_for_production_key(logical,batch)
          q=pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=key)['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
          w=q[q['question_type'].fillna('').astype(str).str.strip().str.lower().eq('written')].copy()
          print(json.dumps({
            'written_questions':int(len(w)),
            'unique_debate_sections':int(w['debate_section_id'].nunique(dropna=True)),
            'unique_source_xml_urls':int(w['source_xml_url'].nunique(dropna=True)),
            'duplicate_question_ids':int(w.duplicated(['question_id']).sum()),
          },indent=2,sort_keys=True))
          PY
            python process/political_metrics_written_question_answers_candidate.py \
              --batch-id "$BATCH_ID" \
              --max-sections 100 \
              --dry-run \
              --workers 8 \
              --report-path analysis/written_pq_answer_validation_report.json
          } > analysis/written_pq_answer_validation_diagnostic.txt 2>&1
          status=$?
          cat analysis/written_pq_answer_validation_diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/written_pq_answer_validation_diagnostic.txt
          if [ -f analysis/written_pq_answer_validation_report.json ]; then git add analysis/written_pq_answer_validation_report.json; fi
          git commit -m "Capture Written PQ answer validation ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
          exit $status
