name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-semantic-gold-answer-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Split answer review into retrievable chunks
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          src=Path('analysis/written_pq_semantic_gold_set/answer_review.csv')
          out=Path('analysis/written_pq_semantic_gold_set/chunks')
          out.mkdir(parents=True, exist_ok=True)
          with src.open(newline='', encoding='utf-8') as f:
              rows=list(csv.reader(f))
          header, data=rows[0], rows[1:]
          size=25
          for i in range(0,len(data),size):
              p=out/f'answer_review_{i//size+1:02d}.csv'
              with p.open('w',newline='',encoding='utf-8') as f:
                  w=csv.writer(f); w.writerow(header); w.writerows(data[i:i+size])
          PY
      - name: Persist chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/written_pq_semantic_gold_set/chunks
          git commit -m "Split semantic gold answer review for workbook export ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
