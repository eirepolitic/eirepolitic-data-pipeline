name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grain:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas
      - name: Check certified Bill-section grain
        run: |
          python - <<'PY'
          import io,json,os
          from collections import defaultdict
          from pathlib import Path
          import boto3,pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY,read_json_required,resolve_production_key
          s3=boto3.client('s3',region_name=os.environ['AWS_REGION']); bucket=os.environ['S3_BUCKET']
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          def read(p):
              k=resolve_production_key(s3,bucket=bucket,production_key=p)
              d=pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=k)['Body'].read()),dtype=str,keep_default_na=False)
              for c in d.columns:d[c]=d[c].fillna('').astype(str).str.strip()
              return d
          bd=read('processed/oireachtas_unified/latest/csv/silver_bill_debates.csv')
          sec=read('processed/oireachtas_unified/latest/csv/silver_debate_sections.csv')
          sp=read('processed/oireachtas_unified/latest/csv/silver_speeches.csv')
          dv=read('processed/oireachtas_unified/latest/csv/silver_divisions.csv')
          sec['heading2']=sec.show_as.where(sec.show_as.ne(''),sec.heading)
          by_key={(r.debate_id,r.section_eid):(r.debate_section_id,r.heading2) for r in sec.itertuples(index=False) if r.debate_id and r.section_eid}
          by_heading=defaultdict(list)
          for r in sec.itertuples(index=False):
              if r.debate_id and r.heading2: by_heading[(r.debate_id,r.heading2)].append((r.debate_section_id,r.section_eid))
          agreed=[]
          for r in bd.itertuples(index=False):
              comp=by_key.get((r.debate_id,r.debate_section_id))
              hm=by_heading.get((r.debate_id,r.debate_show_as),[]) if r.debate_id and r.debate_show_as else []
              if comp and len(hm)==1 and comp[0]==hm[0][0]:
                  agreed.append({'bill_debate_id':r.bill_debate_id,'bill_id':r.bill_id,'debate_id':r.debate_id,'debate_section_id':comp[0],'source_section_eid':r.debate_section_id,'debate_show_as':r.debate_show_as,'debate_date':r.debate_date,'debate_uri':r.debate_uri})
          a=pd.DataFrame(agreed)
          # exclude sections linked to >1 bill
          sec_bill_counts=a.groupby('debate_section_id').bill_id.nunique()
          multi=set(sec_bill_counts[sec_bill_counts>1].index)
          cert=a[~a.debate_section_id.isin(multi)].copy()
          pair_counts=cert.groupby(['bill_id','debate_section_id']).size().reset_index(name='source_row_count')
          dup_pairs=pair_counts[pair_counts.source_row_count>1]
          cert_pairs=cert.drop_duplicates(['bill_id','debate_section_id'])
          speech_counts=sp.groupby('debate_section_id').size().to_dict()
          div_counts=dv.groupby('debate_section_id').size().to_dict()
          cert_pairs['speech_count']=cert_pairs.debate_section_id.map(speech_counts).fillna(0).astype(int)
          cert_pairs['division_count']=cert_pairs.debate_section_id.map(div_counts).fillna(0).astype(int)
          details=[]
          for r in dup_pairs.itertuples(index=False):
              rows=cert[(cert.bill_id==r.bill_id)&(cert.debate_section_id==r.debate_section_id)]
              details.append({'bill_id':r.bill_id,'debate_section_id':r.debate_section_id,'source_row_count':int(r.source_row_count),'rows':rows.to_dict(orient='records')})
          out={
             'production_batch_id':pointer.get('batch_id') or pointer.get('mode'),
             'certified_source_rows':int(len(cert)),
             'certified_unique_bill_section_pairs':int(len(cert_pairs)),
             'certified_unique_sections':int(cert_pairs.debate_section_id.nunique()),
             'duplicate_same_bill_section_pairs':int(len(dup_pairs)),
             'duplicate_source_rows_above_pair_grain':int(len(cert)-len(cert_pairs)),
             'bill_section_pairs_with_speeches':int((cert_pairs.speech_count>0).sum()),
             'bill_section_pair_speech_total_if_joined_once':int(cert_pairs.speech_count.sum()),
             'bill_section_pairs_with_divisions':int((cert_pairs.division_count>0).sum()),
             'bill_section_pair_division_total_if_joined_once':int(cert_pairs.division_count.sum()),
             'duplicate_details':details,
             'recommended_grain':'one row per (bill_id, debate_section_id), aggregating source bill_debate_id provenance, because multiple source Bill-debate records can represent the same certified Bill-section relationship.'
          }
          Path('analysis').mkdir(exist_ok=True)
          Path('analysis/legislation_bridge_grain_digest.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/legislation_bridge_grain_digest.json
          git commit -m "Add legislation bridge grain digest ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
