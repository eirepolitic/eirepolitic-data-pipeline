name: Oral exchange participant merged-main candidate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      REVIEW_OUTPUT_ROOT: oireachtas_review_output
      OIREACHTAS_BATCH_ID: structure-oral-exchange-participants-20260902-1
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Seed exact production snapshot
        run: |
          set -euo pipefail
          OIREACHTAS_PUBLISH_LATEST=false python process/oireachtas_seed_candidate.py --batch-id "${OIREACHTAS_BATCH_ID}" --bucket "${S3_BUCKET}" --region "${AWS_REGION}" | tee candidate_seed.json
      - name: Materialize merged-main political metrics
        run: |
          set -euo pipefail
          OIREACHTAS_PUBLISH_LATEST=false python process/political_metrics_materialize_candidate.py --batch-id "${OIREACHTAS_BATCH_ID}" --bucket "${S3_BUCKET}" --region "${AWS_REGION}" --report-path political_metrics_candidate_report.json
      - name: Reconcile exchange and participant foundations
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, os
          import boto3, pandas as pd
          from extract.oireachtas.batch import batch_key_for_production_key
          bucket=os.environ['S3_BUCKET']; batch=os.environ['OIREACHTAS_BATCH_ID']; s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          def read(logical):
              key=batch_key_for_production_key(logical,batch)
              return pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=key)['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
          q=read('processed/oireachtas_unified/latest/csv/silver_questions.csv')
          s=read('processed/oireachtas_unified/latest/csv/silver_speeches.csv')
          sections=read('processed/oireachtas_unified/latest/metrics/event/oral_question_sections/csv/oral_question_sections.csv')
          participants=read('processed/oireachtas_unified/latest/metrics/event/oral_question_exchange_participants/csv/oral_question_exchange_participants.csv')
          oral=q[q.question_type.fillna('').astype(str).str.strip().str.lower().eq('oral')]
          oral_ids=set(oral.debate_section_id.dropna().astype(str))
          related=s[s.debate_section_id.astype(str).isin(oral_ids)].copy(); related['word_count_num']=pd.to_numeric(related.word_count,errors='raise')
          sections['related_speech_count']=pd.to_numeric(sections.related_speech_count,errors='raise'); sections['related_speech_word_count']=pd.to_numeric(sections.related_speech_word_count,errors='raise')
          participants['intervention_count']=pd.to_numeric(participants.intervention_count,errors='raise'); participants['word_count']=pd.to_numeric(participants.word_count,errors='raise')
          assert sections.debate_section_id.is_unique
          assert not participants.duplicated(['debate_section_id','participant_key','participant_role']).any()
          assert set(participants.participant_role).issubset({'ministerial','chair','ordinary_member','collective_or_unidentified'})
          assert int(sections.related_speech_count.sum()) == int(related.speech_id.nunique())
          assert int(participants.intervention_count.sum()) == int(related.speech_id.nunique())
          assert int(sections.related_speech_word_count.sum()) == int(related.word_count_num.sum())
          assert int(participants.word_count.sum()) == int(related.word_count_num.sum())
          collective=participants[participants.participant_role.eq('collective_or_unidentified')]
          assert collective.member_code.fillna('').astype(str).str.strip().eq('').all()
          print({'sections':len(sections),'participants':len(participants),'speeches':int(related.speech_id.nunique()),'words':int(related.word_count_num.sum()),'question_classifier_calls':0})
          PY
      - name: Assemble eight-dataset manifest
        run: |
          set -euo pipefail
          OIREACHTAS_PUBLISH_LATEST=false python process/oireachtas_batch_control.py --bucket "${S3_BUCKET}" --region "${AWS_REGION}" assemble --batch-id "${OIREACHTAS_BATCH_ID}" \
            --required-table political_metrics_daily_activity_components \
            --required-table political_metrics_daily_issue_activity \
            --required-table political_metrics_division_party_vote_components \
            --required-table political_metrics_daily_question_dimensions \
            --required-table political_metrics_oral_question_sections \
            --required-table political_metrics_oral_question_exchange_participants \
            --required-table political_metrics_speech_question_context \
            --required-table political_metrics_monthly_metric_results | tee candidate_manifest.json
      - name: Build candidate-local auxiliary enrichments
        run: |
          set -euo pipefail
          python -m extract.oireachtas.enrichment_member_photo_urls | tee oireachtas_member_photo_enrichment.log
          python -m extract.oireachtas.enrichment_member_summaries | tee oireachtas_member_summaries_enrichment.log
          python -m extract.oireachtas.enrichment_constituency_images | tee oireachtas_constituency_images_enrichment.log
      - name: Stage fresh enrichment contracts into candidate batch
        run: |
          set -euo pipefail
          python process/oireachtas_stage_downstream_contracts.py --bucket "${S3_BUCKET}" --region "${AWS_REGION}" --batch-id "${OIREACHTAS_BATCH_ID}" | tee oireachtas_enrichment_staging.json
      - name: Build candidate compatibility adapters
        run: |
          set -euo pipefail
          python -m extract.oireachtas.downstream_compat | tee oireachtas_compat_adapters.log
      - name: Validate candidate downstream contracts
        run: |
          set -euo pipefail
          python process/oireachtas_validate_downstream_contracts.py --bucket "${S3_BUCKET}" --region "${AWS_REGION}" --contract members_compat --contract member_votes_compat --contract member_photo_urls --contract member_summaries --contract constituency_images --contract debate_issue_labels --output oireachtas_downstream_contracts.json
      - name: Run strict compatibility and mismatch validation
        run: |
          set -euo pipefail
          python -m extract.oireachtas.compat_comparison | tee oireachtas_compat_comparison.log
          python -m extract.oireachtas.mismatch_review | tee oireachtas_mismatch_review.log
      - name: Build year-aware member metrics
        run: |
          set -euo pipefail
          export TARGET_YEAR="$(date -u -d '1 year ago' +%Y)"
          python process/build_member_profile_metrics.py | tee member_profile_metrics.json
          echo "TARGET_YEAR=${TARGET_YEAR}" >> "${GITHUB_ENV}"
      - name: Run candidate-only Instagram HTML smoke test
        run: |
          set -euo pipefail
          python process/oireachtas_consumer_smoke.py --batch-id "${OIREACHTAS_BATCH_ID}" --target-year "${TARGET_YEAR}" --bucket "${S3_BUCKET}" --region "${AWS_REGION}" --output consumer_smoke | tee oireachtas_consumer_smoke.log
      - name: Reassemble final candidate manifest
        run: |
          set -euo pipefail
          OIREACHTAS_PUBLISH_LATEST=false python process/oireachtas_reassemble_candidate.py --batch-id "${OIREACHTAS_BATCH_ID}" --bucket "${S3_BUCKET}" --region "${AWS_REGION}" --require compat_downstream_adapters | tee oireachtas_final_batch_manifest.json
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oral-exchange-participant-merged-main-${{ github.run_id }}
          path: |
            candidate_seed.json
            political_metrics_candidate_report.json
            candidate_manifest.json
            oireachtas_review_output/**
            oireachtas_member_photo_enrichment.log
            oireachtas_member_summaries_enrichment.log
            oireachtas_constituency_images_enrichment.log
            oireachtas_enrichment_staging.json
            oireachtas_downstream_contracts.json
            oireachtas_compat_adapters.log
            oireachtas_compat_comparison.log
            oireachtas_mismatch_review.log
            member_profile_metrics.json
            oireachtas_consumer_smoke.log
            consumer_smoke/**
            oireachtas_final_batch_manifest.json
          if-no-files-found: warn
          retention-days: 90
