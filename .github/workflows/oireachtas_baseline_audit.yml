name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas
      - name: Investigate Bill URI joins and statement headings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io,json,os,re
          from pathlib import Path
          import boto3,pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY,read_json_required,resolve_production_key

          bucket=os.environ['S3_BUCKET']; s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          def read(logical):
              key=resolve_production_key(s3,bucket=bucket,production_key=logical)
              return pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=key)['Body'].read()),dtype=str,keep_default_na=False,na_values=['']),key
          speeches,skey=read('processed/oireachtas_unified/latest/csv/silver_speeches.csv')
          sections,seckey=read('processed/oireachtas_unified/latest/csv/silver_debate_sections.csv')
          bills,bkey=read('processed/oireachtas_unified/latest/csv/silver_bill_debates.csv')

          for c in ['speech_id','debate_section_id','source_debate_uri','source_xml_url']:
              speeches[c]=speeches[c].fillna('').astype(str)
          sections['debate_section_id']=sections.debate_section_id.fillna('').astype(str)
          hcol=next((c for c in ['show_as','heading','title','section_heading'] if c in sections.columns),None)
          sections['heading']=sections[hcol].fillna('').astype(str).str.strip() if hcol else ''
          secmap=sections.drop_duplicates('debate_section_id').set_index('debate_section_id').heading.to_dict()
          speeches['heading']=speeches.debate_section_id.map(secmap).fillna('')
          bills['debate_uri']=bills.debate_uri.fillna('').astype(str)
          bills['debate_section_id']=bills.debate_section_id.fillna('').astype(str)
          bills['debate_show_as']=bills.debate_show_as.fillna('').astype(str)

          # Candidate Bill joins.
          bill_uris=set(x for x in bills.debate_uri if x)
          speech_uris=set(x for x in speeches.source_debate_uri if x)
          exact_uri_overlap=bill_uris & speech_uris
          uri_linked=speeches[speeches.source_debate_uri.isin(exact_uri_overlap)].copy()

          # Some debate URIs may differ by suffix / debate section; inspect normalized path roots.
          def normuri(x):
              x=str(x or '').strip().rstrip('/')
              x=re.sub(r'/debate/dbsect_\d+$','',x)
              x=re.sub(r'/debate$','',x)
              return x
          bills['debate_uri_norm']=bills.debate_uri.map(normuri)
          speeches['source_debate_uri_norm']=speeches.source_debate_uri.map(normuri)
          norm_bill=set(x for x in bills.debate_uri_norm if x)
          norm_speech=set(x for x in speeches.source_debate_uri_norm if x)
          norm_overlap=norm_bill & norm_speech
          norm_linked=speeches[speeches.source_debate_uri_norm.isin(norm_overlap)].copy()

          # Date + show_as/heading comparison as diagnostic only.
          bills['debate_date_dt']=pd.to_datetime(bills.debate_date,errors='coerce')
          speeches['debate_date_dt']=pd.to_datetime(speeches.debate_date,errors='coerce')

          # Headings containing likely statement terms.
          heading_counts=speeches.heading.value_counts()
          statement_like=heading_counts[heading_counts.index.to_series().str.contains(r'statement|ráitis|ráiteas',case=False,regex=True,na=False)]
          bill_like=heading_counts[heading_counts.index.to_series().str.contains(r'\bbill\b|bille|second stage|committee stage|report stage|final stage',case=False,regex=True,na=False)]
          motion_like=heading_counts[heading_counts.index.to_series().str.contains(r'\bmotion\b|rún',case=False,regex=True,na=False)]

          # Map each source debate URI to distinct headings and sections to see whether URI is debate-day-wide or narrower.
          uri_profiles=[]
          for uri,g in speeches[speeches.source_debate_uri.ne('')].groupby('source_debate_uri'):
              if uri in exact_uri_overlap or normuri(uri) in norm_overlap:
                  uri_profiles.append({'source_debate_uri':uri,'speech_count':int(len(g)),'section_count':int(g.debate_section_id.nunique()),'headings':g.heading.value_counts().head(20).to_dict()})
          uri_profiles=sorted(uri_profiles,key=lambda x:-x['speech_count'])

          # Bill debate rows sampled with potential speech URI matches.
          bill_samples=[]
          for r in bills.head(80).itertuples(index=False):
              exact_count=int((speeches.source_debate_uri==r.debate_uri).sum()) if r.debate_uri else 0
              norm_count=int((speeches.source_debate_uri_norm==r.debate_uri_norm).sum()) if r.debate_uri_norm else 0
              bill_samples.append({'bill_id':str(r.bill_id),'debate_date':str(r.debate_date),'debate_show_as':str(r.debate_show_as),'debate_uri':str(r.debate_uri),'debate_section_id':str(r.debate_section_id),'exact_uri_speech_count':exact_count,'normalized_uri_speech_count':norm_count})

          out={
            'production_batch_id':str(pointer.get('batch_id') or pointer.get('mode')),
            'resolved_keys':{'speeches':skey,'sections':seckey,'bill_debates':bkey},
            'bill_link_diagnostics':{
              'bill_rows':int(len(bills)),'distinct_bill_debate_uris':int(len(bill_uris)),'distinct_speech_source_debate_uris':int(len(speech_uris)),
              'exact_uri_overlap_count':int(len(exact_uri_overlap)),'exact_uri_linked_speech_count':int(len(uri_linked)),'exact_uri_linked_section_count':int(uri_linked.debate_section_id.nunique()),
              'normalized_uri_overlap_count':int(len(norm_overlap)),'normalized_uri_linked_speech_count':int(len(norm_linked)),'normalized_uri_linked_section_count':int(norm_linked.debate_section_id.nunique()),
            },
            'statement_like_headings':statement_like.head(80).to_dict(),
            'bill_like_headings':bill_like.head(80).to_dict(),
            'motion_like_headings':motion_like.head(50).to_dict(),
            'linked_uri_profiles':uri_profiles[:30],
            'bill_samples':bill_samples[:40],
            'guardrails':[
              'URI joins are diagnostics until we establish the URI grain; a debate-day URI must not cause all sections on that day to be labelled Bill debate.',
              'Heading matches are evidence-discovery only and are not production context rules by themselves.'
            ]
          }
          Path('analysis').mkdir(exist_ok=True); Path('analysis/broader_speech_context_link_diagnostics.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n'); print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/broader_speech_context_link_diagnostics.json
          git commit -m "Capture speech context link diagnostics ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
