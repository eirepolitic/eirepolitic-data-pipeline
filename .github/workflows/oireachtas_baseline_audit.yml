name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas
      - name: Profile heading stability and recipient drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io,json,math,os
          from pathlib import Path
          import boto3,pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY,read_json_required,resolve_production_key
          bucket=os.environ['S3_BUCKET']; s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          def read(logical):
              key=resolve_production_key(s3,bucket=bucket,production_key=logical)
              return pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=key)['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
          sec=read('processed/oireachtas_unified/latest/metrics/event/oral_question_sections/csv/oral_question_sections.csv')
          q=read('processed/oireachtas_unified/latest/csv/silver_questions.csv')
          sec['debate_date_dt']=pd.to_datetime(sec.debate_date,errors='coerce'); sec['year']=sec.debate_date_dt.dt.year
          sec['section_heading']=sec.section_heading.fillna('').astype(str).str.strip(); sec['question_count']=pd.to_numeric(sec.oral_question_count,errors='coerce').fillna(0).astype(int)
          q=q[q.question_type.fillna('').astype(str).str.strip().str.lower().eq('oral')].copy(); q['debate_section_id']=q.debate_section_id.astype(str)
          rc=next((c for c in ['to_minister_or_department','recipient','question_recipient'] if c in q.columns),None)
          q['recipient']=q[rc].fillna('').astype(str).str.strip() if rc else ''
          joined=sec[['debate_section_id','section_heading','year']].merge(q[['debate_section_id','recipient']],on='debate_section_id',how='left')

          profiles=[]
          for h,sg in sec.groupby('section_heading'):
              qg=joined[joined.section_heading.eq(h)]
              rec=qg.recipient.replace('',pd.NA).dropna().value_counts()
              total=int(rec.sum()); distinct=int(len(rec))
              top_share=float(rec.iloc[0]/total) if total else None
              probs=[x/total for x in rec.values] if total else []
              entropy=-sum(p*math.log2(p) for p in probs if p>0) if probs else None
              year_tops={}
              for y,yg in qg.groupby('year'):
                  vc=yg.recipient.replace('',pd.NA).dropna().value_counts()
                  if len(vc): year_tops[str(int(y))]={'top_recipient':str(vc.index[0]),'top_share':float(vc.iloc[0]/vc.sum()),'distinct_recipients':int(len(vc)),'question_count':int(vc.sum())}
              top_changed=len({v['top_recipient'] for v in year_tops.values()})>1
              profiles.append({
                'heading':h,'exchange_count':int(len(sg)),'question_records':total,'distinct_recipients':distinct,'top_recipient':str(rec.index[0]) if total else None,'top_recipient_share':top_share,'recipient_entropy_bits':entropy,
                'years':sorted(int(x) for x in sg.year.dropna().unique()),'top_recipient_changed_between_years':top_changed,'year_profiles':year_tops,
                'grouped_share':float((sg.question_count>1).mean()),'median_questions_per_exchange':float(sg.question_count.median()),
              })
          p=pd.DataFrame(profiles)

          repeated=p[p.exchange_count.gt(1)].copy()
          stable5=p[p.exchange_count.ge(5)].copy()
          stable10=p[p.exchange_count.ge(10)].copy()
          both=p[p.years.map(lambda ys:2025 in ys and 2026 in ys)].copy()

          summary={
            'production_batch_id':str(pointer.get('batch_id') or pointer.get('mode')),
            'heading_count':int(len(p)),
            'repeated_heading_count':int(len(repeated)),
            'headings_5plus_exchanges':int(len(stable5)),
            'headings_10plus_exchanges':int(len(stable10)),
            'headings_used_both_years':int(len(both)),
            'recipient_concentration':{
              'all_single_recipient_heading_share':float(p.distinct_recipients.eq(1).mean()),
              'repeated_single_recipient_heading_share':float(repeated.distinct_recipients.eq(1).mean()),
              '5plus_top_recipient_90pct_share':float(stable5.top_recipient_share.fillna(0).ge(.9).mean()),
              '10plus_top_recipient_90pct_share':float(stable10.top_recipient_share.fillna(0).ge(.9).mean()),
              '5plus_top_recipient_75pct_share':float(stable5.top_recipient_share.fillna(0).ge(.75).mean()),
            },
            'recipient_drift':{
              'headings_both_years_top_recipient_changed':int(both.top_recipient_changed_between_years.sum()),
              'share_both_years_changed':float(both.top_recipient_changed_between_years.mean()) if len(both) else None,
            },
            'generic_or_cross_portfolio_candidates':stable5.sort_values(['distinct_recipients','recipient_entropy_bits','exchange_count'],ascending=[False,False,False]).head(30).to_dict(orient='records'),
            'recipient_drift_candidates':both[both.top_recipient_changed_between_years].sort_values('exchange_count',ascending=False).head(40).to_dict(orient='records'),
            'highly_stable_heading_candidates':stable5[(stable5.top_recipient_share.fillna(0).ge(.9)) & stable5.years.map(lambda ys:2025 in ys and 2026 in ys)].sort_values('exchange_count',ascending=False).head(60).to_dict(orient='records'),
            'public_filter_candidate_rule':{
              'source_heading_can_be_used_raw':True,
              'safe_normalization_needed':False,
              'recommended_public_label':'Oireachtas section heading',
              'not_issue_taxonomy':True,
              'recipient_should_remain_separate_dimension':True
            }
          }
          Path('analysis').mkdir(exist_ok=True); Path('analysis/oral_section_heading_stability.json').write_text(json.dumps(summary,indent=2,sort_keys=True,default=str)+'\n'); print(json.dumps(summary,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/oral_section_heading_stability.json
          git commit -m "Capture oral section heading stability ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
