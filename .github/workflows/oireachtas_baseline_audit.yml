name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact digest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('analysis/question_structure_content_summary.json').read_text())
          examples=[]
          for e in src.get('representative_july_exchange_examples',[])[:3]:
              examples.append({
                  'date':e.get('date'),
                  'heading':e.get('heading'),
                  'oral_question_count':e.get('oral_question_count'),
                  'related_speech_count':e.get('related_speech_count'),
                  'related_speaker_count':e.get('related_speaker_count'),
                  'recipients':e.get('recipients'),
                  'questions':e.get('questions',[])[:4],
                  'speech_sample':e.get('speech_sample',[])[:6],
              })
          out={
              'question_type_distribution':src.get('question_type_distribution'),
              'question_counts_by_year_and_type':src.get('question_counts_by_year_and_type'),
              'oral_section_structure':src.get('oral_section_structure'),
              'largest_sections_by_question_count':src.get('largest_sections_by_question_count',[])[:5],
              'largest_sections_by_speech_count':src.get('largest_sections_by_speech_count',[])[:5],
              'highest_speeches_per_question_sections':src.get('highest_speeches_per_question_sections',[])[:5],
              'most_reused_oral_section_headings':src.get('most_reused_oral_section_headings',[])[:10],
              'top_speakers_inside_oral_question_exchanges':src.get('top_speakers_inside_oral_question_exchanges',[])[:10],
              'representative_july_exchange_examples':examples,
          }
          Path('analysis/question_structure_content_digest.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/question_structure_content_digest.json
          git commit -m "Summarize question structure analysis ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
