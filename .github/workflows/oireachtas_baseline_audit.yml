name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas
      - name: Certify narrow speech-context rules
        run: |
          python - <<'PY'
          import io,json,os,re
          from pathlib import Path
          import boto3,pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY,read_json_required,resolve_production_key
          s3=boto3.client('s3',region_name=os.environ['AWS_REGION']); bucket=os.environ['S3_BUCKET']
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          def read(p):
              k=resolve_production_key(s3,bucket=bucket,production_key=p)
              d=pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=k)['Body'].read()),dtype=str,keep_default_na=False)
              for c in d.columns:d[c]=d[c].fillna('').astype(str).str.strip()
              return d
          sp=read('processed/oireachtas_unified/latest/csv/silver_speeches.csv')
          sec=read('processed/oireachtas_unified/latest/csv/silver_debate_sections.csv')
          sqc=read('processed/oireachtas_unified/latest/metrics/event/speech_question_context/csv/speech_question_context.csv')
          bills=read('processed/oireachtas_unified/latest/metrics/event/bill_debate_sections/csv/bill_debate_sections.csv')
          sec['section_heading']=sec['show_as'].where(sec['show_as'].ne(''),sec['heading'])
          hmap=sec.drop_duplicates('debate_section_id').set_index('debate_section_id')['section_heading'].to_dict()
          sp['section_heading']=sp['debate_section_id'].map(hmap).fillna('')

          oral=set(sqc.loc[sqc['speech_context'].eq('oral_question_exchange'),'debate_section_id'])
          bill=set(bills['debate_section_id'])
          leaders_headings={"Ceisteanna ó Cheannairí - Leaders' Questions","Ceisteanna ó Cheannairí (Atógáil) - Leaders' Questions (Resumed)"}
          leaders=set(sec.loc[sec['section_heading'].isin(leaders_headings),'debate_section_id'])
          statement_mask=sec['section_heading'].str.contains(r': Statements(?: \(Resumed\))?$|: Ráitis(?: \(Atógáil\))?$',case=False,regex=True,na=False)
          statements=set(sec.loc[statement_mask,'debate_section_id'])
          procedural_headings={
            'An tOrd Gnó - Order of Business',
            'An tOrd Gnó - Order of Business (Resumed)',
            'An tOrd Gnó (Atógáil) - Order of Business (Resumed)',
            'Ceisteanna ar Reachtaíocht a Gealladh - Questions on Promised Legislation',
            'Gnó na Dála - Business of Dáil',
          }
          procedural=set(sec.loc[sec['section_heading'].isin(procedural_headings),'debate_section_id'])
          motion_mask=sec['section_heading'].str.contains(r': Motions?(?: \(Resumed\))?(?: \[Private Members\])?$',case=False,regex=True,na=False)
          motions=set(sec.loc[motion_mask,'debate_section_id'])
          sets={'oral_question_exchange':oral,'bill_or_legislation':bill,'leaders_questions':leaders,'statements':statements,'procedural_business':procedural,'motion_proceeding':motions}
          overlaps=[]; names=list(sets)
          for i,a in enumerate(names):
              for b in names[i+1:]:
                  x=sets[a]&sets[b]
                  if x: overlaps.append({'a':a,'b':b,'section_overlap':len(x),'speech_overlap':int(sp['debate_section_id'].isin(x).sum()),'headings':sorted(set(sec.loc[sec['debate_section_id'].isin(x),'section_heading']))})
          # Precedence only matters if overlaps exist; preserve relationship-backed rules first.
          precedence=['oral_question_exchange','bill_or_legislation','leaders_questions','statements','procedural_business','motion_proceeding']
          assigned={};
          for name in precedence:
              for sid in sets[name]:
                  assigned.setdefault(sid,name)
          sp['context']=sp['debate_section_id'].map(assigned).fillna('other')
          counts=sp['context'].value_counts().to_dict()
          section_counts={name:len(ss) for name,ss in sets.items()}
          section_counts['other']=int(sec.loc[~sec['debate_section_id'].isin(set(assigned)),'debate_section_id'].nunique())
          years={}
          for name in precedence+['other']:
              g=sp[sp['context'].eq(name)]
              years[name]={str(k):int(v) for k,v in pd.to_datetime(g['debate_date'],errors='coerce').dt.year.value_counts().sort_index().items() if pd.notna(k)}
          out={'production_batch_id':pointer.get('batch_id') or pointer.get('mode'),'rules':{'leaders_headings':sorted(leaders_headings),'procedural_headings':sorted(procedural_headings),'statement_rule':'exact source heading suffix : Statements / : Statements (Resumed) / : Ráitis / : Ráitis (Atógáil)','motion_rule':'exact source heading suffix : Motion(s), optional (Resumed), optional [Private Members]; interpret as parliamentary proceeding form, not substantive topic'},'precedence':precedence+['other'],'overlaps':overlaps,'speech_counts':{k:int(v) for k,v in counts.items()},'section_counts':section_counts,'years':years,'total_speeches':len(sp),'classified_non_other_speeches':int((sp['context']!='other').sum()),'other_speeches':int((sp['context']=='other').sum()),'coverage_share':float((sp['context']!='other').mean())}
          Path('analysis').mkdir(exist_ok=True)
          Path('analysis/broader_speech_context_certification_digest.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/broader_speech_context_certification_digest.json
          git commit -m "Capture speech context certification diagnostics ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
