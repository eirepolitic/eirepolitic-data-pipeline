name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oireachtas-baseline-audit
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
      POLITICAL_METRICS_PERIOD: '2026-07'
      POLITICAL_METRICS_MATERIALIZATION_DIR: artifacts/political-metrics-materialization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install boto3 pandas pyarrow pyyaml
      - name: Test political metrics foundation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/political_metrics -p 'test_*.py'
      - name: Create read-only inventory
        shell: bash
        run: |
          set -euo pipefail
          python process/oireachtas_audit_inventory.py
      - name: Commission Option A materialization
        shell: bash
        run: |
          set -euo pipefail
          python process/political_metrics_materialization_commission.py
      - name: Publish materialization summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/political-metrics-materialization/summary.md ]; then
            cat artifacts/political-metrics-materialization/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/political-metrics-materialization/commission_report.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/political-metrics-materialization/commission_report.json').read_text())
          datasets=' | '.join(f"{k}:{v['rows']}" for k,v in r['datasets'].items())
          print(f"::notice title=Option A materialization::batch={r['source_batch_id']}; period={r['period']['start']}..{r['period']['end']}; datasets={datasets}; monthly_metrics={len(r['monthly_metric_ids'])}; monthly_rows={r['monthly_metric_row_count']}; s3_writes={r['s3_writes_performed']}")
          PY
          fi
      - name: Upload materialization artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: political-metrics-materialization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/oireachtas-baseline-audit/
            artifacts/political-metrics-materialization/
          if-no-files-found: error
          retention-days: 30
