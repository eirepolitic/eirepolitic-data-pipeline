name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  written-pq-semantic-pilot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install review dependency
        run: python -m pip install pandas
      - name: Review saved 25-section pilot
        run: python process/written_pq_semantic_pilot_review.py
      - name: Persist review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/written_pq_semantic_pilot/review_summary.json
          git commit -m "Review Written PQ semantic pilot ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
