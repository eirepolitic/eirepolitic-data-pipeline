name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  written-pq-xml-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas lxml requests
      - name: Inspect Written PQ section XML structure
        run: |
          python - <<'PY'
          import io,json,os,re
          from pathlib import Path
          import boto3,pandas as pd,requests
          from lxml import etree
          from extract.oireachtas.batch import resolve_production_key

          s3=boto3.client('s3',region_name=os.environ['AWS_REGION']); bucket=os.environ['S3_BUCKET']
          key=resolve_production_key(s3,bucket=bucket,production_key='processed/oireachtas_unified/latest/csv/silver_questions.csv')
          q=pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=key)['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
          w=q[q['question_type'].fillna('').astype(str).str.strip().str.lower().eq('written')].copy()
          w=w.sort_values(['question_date','question_id']).reset_index(drop=True)
          sample=w.sample(n=12,random_state=20260905).sort_values(['question_date','question_id'])

          def local(tag): return tag.split('}',1)[-1] if isinstance(tag,str) and '}' in tag else str(tag)
          def text(el): return re.sub(r'\s+',' ',' '.join(el.itertext())).strip()
          def short(v,n=300): return v[:n]
          examples=[]
          suffix_match=0; question_elements_total=0
          answer_candidate_tag_counts={}; section_element_match=0
          for r in sample.to_dict('records'):
              url=str(r.get('source_xml_url') or '')
              xml=requests.get(url,timeout=(4,15),headers={'User-Agent':'EirePolitic research audit/1.0'}).content
              root=etree.fromstring(xml)
              ds_suffix=str(r.get('debate_section_id') or '').rstrip('/').split('/')[-1]
              q_suffix=str(r.get('question_id') or '').rstrip('/').split('/')[-1]
              elems=[]; local_id_matches=[]
              for el in root.iter():
                  attrs={local(k):str(v) for k,v in el.attrib.items()}
                  eid=attrs.get('eId','') or attrs.get('id','') or attrs.get('xml:id','')
                  if eid:
                      elems.append({'tag':local(el.tag),'eId':eid,'text_preview':short(text(el),180)})
                  if ds_suffix and ds_suffix in attrs.values(): local_id_matches.append({'kind':'section','tag':local(el.tag),'attrs':attrs})
                  if q_suffix and q_suffix in attrs.values(): local_id_matches.append({'kind':'question','tag':local(el.tag),'attrs':attrs})
              if any(m['kind']=='section' for m in local_id_matches): section_element_match+=1
              if any(m['kind']=='question' for m in local_id_matches): suffix_match+=1
              qels=[el for el in root.iter() if local(el.tag)=='question']
              question_elements_total+=len(qels)
              # Candidate answer elements are non-question blocks/speeches with substantive text.
              candidates=[]
              for el in root.iter():
                  tag=local(el.tag); t=text(el)
                  if tag in {'speech','answer','p','block'} and len(t)>80:
                      candidates.append({'tag':tag,'eId':next((str(v) for k,v in el.attrib.items() if local(k)=='eId'),''),'text_preview':short(t,300)})
                      answer_candidate_tag_counts[tag]=answer_candidate_tag_counts.get(tag,0)+1
              examples.append({
                  'question_id':r.get('question_id'),'question_no':r.get('question_no'),'date':r.get('question_date'),
                  'asked_by':r.get('asked_by_name'),'recipient':r.get('to_minister_or_department'),
                  'debate_section_id':r.get('debate_section_id'),'source_xml_url':url,
                  'root_tag':local(root.tag),'local_id_matches':local_id_matches,
                  'question_elements':[{'attrs':{local(k):str(v) for k,v in el.attrib.items()},'text_preview':short(text(el),300)} for el in qels],
                  'identified_elements':elems[:30],
                  'answer_candidates':candidates[:12],
                  'all_tag_counts':{tag:sum(1 for el in root.iter() if local(el.tag)==tag) for tag in sorted(set(local(el.tag) for el in root.iter()))},
              })
          out={'sample_size':len(examples),'question_suffix_match_documents':suffix_match,'section_suffix_match_documents':section_element_match,
               'question_elements_total':question_elements_total,'answer_candidate_tag_counts':answer_candidate_tag_counts,'examples':examples}
          Path('analysis').mkdir(exist_ok=True)
          Path('analysis/written_pq_xml_structure.json').write_text(json.dumps(out,indent=2,ensure_ascii=False,sort_keys=True)+'\n')
          print(json.dumps({'sample_size':len(examples),'question_suffix_match_documents':suffix_match,'section_suffix_match_documents':section_element_match,
                            'question_elements_total':question_elements_total,'answer_candidate_tag_counts':answer_candidate_tag_counts},indent=2))
          PY
      - name: Persist structure audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/written_pq_xml_structure.json
          git commit -m "Capture Written PQ XML structure ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
