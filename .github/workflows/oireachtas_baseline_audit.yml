name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  validate-contextual-monthly-votes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas pyarrow pyyaml boto3 pytest
      - name: Compile changed Python
        run: |
          python -m py_compile political_metrics/contextual_monthly_results.py
          python -m py_compile process/political_metrics_contextual_monthly_candidate.py
          python -m py_compile process/political_metrics_materialize_candidate.py
      - name: Run focused tests
        run: python -m pytest -q tests/political_metrics/test_contextual_monthly_results.py tests/political_metrics/test_catalogue_materialization.py tests/political_metrics/test_candidate_materialization.py tests/political_metrics/test_downstream_contracts.py
