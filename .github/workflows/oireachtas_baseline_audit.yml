name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_BATCH_ID: structure-question-context-33550915907-1
      OIREACHTAS_PUBLISH_ENABLED: 'true'
      OIREACHTAS_PUBLISH_LATEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Promote validated candidate
        run: |
          python process/oireachtas_batch_control.py \
            --bucket "$S3_BUCKET" --region "$AWS_REGION" \
            promote --batch-id "$OIREACHTAS_BATCH_ID" \
            | tee promotion.json
      - name: Verify production pointer and seven metric datasets
        run: |
          python - <<'PY'
          import io, json, os
          import boto3, pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY, resolve_production_key

          s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          bucket=os.environ['S3_BUCKET']; batch=os.environ['OIREACHTAS_BATCH_ID']
          pointer=json.loads(s3.get_object(Bucket=bucket,Key=PRODUCTION_POINTER_KEY)['Body'].read().decode('utf-8'))
          assert pointer.get('batch_id')==batch, pointer

          keys=[
            'processed/oireachtas_unified/latest/metrics/daily/daily_activity_components/csv/daily_activity_components.csv',
            'processed/oireachtas_unified/latest/metrics/daily/daily_issue_activity/csv/daily_issue_activity.csv',
            'processed/oireachtas_unified/latest/metrics/event/division_party_vote_components/csv/division_party_vote_components.csv',
            'processed/oireachtas_unified/latest/metrics/daily/daily_question_dimensions/csv/daily_question_dimensions.csv',
            'processed/oireachtas_unified/latest/metrics/event/oral_question_sections/csv/oral_question_sections.csv',
            'processed/oireachtas_unified/latest/metrics/event/speech_question_context/csv/speech_question_context.csv',
            'processed/oireachtas_unified/latest/metrics/completed_month/monthly_metric_results/csv/monthly_metric_results.csv',
          ]
          verified=[]
          for logical in keys:
              resolved=resolve_production_key(s3,bucket=bucket,production_key=logical)
              head=s3.head_object(Bucket=bucket,Key=resolved)
              assert f'/batches/{batch}/' in resolved, (logical,resolved)
              verified.append({'logical':logical,'resolved':resolved,'bytes':head.get('ContentLength')})

          oq_key=resolve_production_key(s3,bucket=bucket,production_key=keys[4])
          sc_key=resolve_production_key(s3,bucket=bucket,production_key=keys[5])
          oq=pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=oq_key)['Body'].read()),dtype=str,keep_default_na=False)
          sc=pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=sc_key)['Body'].read()),dtype=str,keep_default_na=False)
          assert oq['debate_section_id'].is_unique
          assert sc['speech_id'].is_unique
          contexts=set(sc['speech_context'].astype(str))
          assert contexts <= {'oral_question_exchange','other'}, contexts
          report={
            'production_batch_id':batch,
            'oral_question_sections':int(len(oq)),
            'speech_context_rows':int(len(sc)),
            'speech_context_values':sorted(contexts),
            'question_classifier_calls':0,
            'verified_datasets':verified,
          }
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
