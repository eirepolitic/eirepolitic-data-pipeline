name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose-semantic-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: '34006240512'
    steps:
      - uses: actions/checkout@v4
      - name: Download failed benchmark logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/semantic_benchmark_diagnostic logs
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/logs" > logs.zip
          unzip -q logs.zip -d logs
          grep -RniE "Traceback|Error|Exception|failed|failure|completed.*target|validation|rate.limit|timeout|429|500|502|503|504" logs \
            > analysis/semantic_benchmark_diagnostic/error_lines.txt || true
          tail -n 250 "$(find logs -type f | sort | tail -n 1)" \
            > analysis/semantic_benchmark_diagnostic/log_tail.txt || true
      - name: Persist diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/semantic_benchmark_diagnostic
          git commit -m "Capture semantic benchmark failure diagnostic ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
