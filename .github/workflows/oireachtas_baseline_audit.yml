name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas
      - name: Profile deterministic speech contexts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io,json,os,re
          from collections import defaultdict
          from pathlib import Path
          import boto3,pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY,read_json_required,resolve_production_key

          bucket=os.environ['S3_BUCKET']; s3=boto3.client('s3',region_name=os.environ['AWS_REGION'])
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          def read(logical):
              key=resolve_production_key(s3,bucket=bucket,production_key=logical)
              return pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=key)['Body'].read()),dtype=str,keep_default_na=False,na_values=['']),key

          speeches,skey=read('processed/oireachtas_unified/latest/csv/silver_speeches.csv')
          sections,seckey=read('processed/oireachtas_unified/latest/csv/silver_debate_sections.csv')
          billdeb,bkey=read('processed/oireachtas_unified/latest/csv/silver_bill_debates.csv')
          speechq,qctxkey=read('processed/oireachtas_unified/latest/metrics/event/speech_question_context/csv/speech_question_context.csv')

          speeches['speech_id']=speeches.speech_id.astype(str)
          speeches['debate_section_id']=speeches.debate_section_id.fillna('').astype(str)
          speeches['debate_date_dt']=pd.to_datetime(speeches.debate_date,errors='coerce')
          sections['debate_section_id']=sections.debate_section_id.astype(str)
          heading_col=next((c for c in ['show_as','heading','title','section_heading'] if c in sections.columns),None)
          sections['heading']=sections[heading_col].fillna('').astype(str).str.strip() if heading_col else ''
          secmap=sections.drop_duplicates('debate_section_id').set_index('debate_section_id')['heading'].to_dict()
          speeches['heading']=speeches.debate_section_id.map(secmap).fillna('')

          billdeb['debate_section_id']=billdeb.debate_section_id.fillna('').astype(str)
          bill_sections=set(billdeb.loc[billdeb.debate_section_id.ne(''),'debate_section_id'])
          speechq['speech_id']=speechq.speech_id.astype(str)
          oral_ids=set(speechq.loc[speechq.speech_context.astype(str).eq('oral_question_exchange'),'speech_id'])

          patterns={
            'leaders_questions':[
              r"^leaders'? questions?$",
              r"leaders'? questions?",
            ],
            'motions':[
              r'^motion(?:s)?\b',
              r'\bmotion(?:s)?\b',
              r'confidence in the government',
              r'no confidence',
            ],
            'statements':[
              r'^statements?\b',
              r'\bstatements? on\b',
            ],
            'procedural_business':[
              r'order of business',
              r'business of the dáil',
              r'business of the house',
              r'questions? on promised legislation',
              r'weekly division',
              r'preliminary business',
              r'ceisteanna? ar reachtaíocht',
            ],
          }
          compiled={k:[re.compile(p,re.I) for p in ps] for k,ps in patterns.items()}
          candidate_flags={}
          for name,rxs in compiled.items():
              candidate_flags[name]=speeches.heading.map(lambda h:any(rx.search(str(h)) for rx in rxs))
          candidate_flags['bill_or_legislation']=speeches.debate_section_id.isin(bill_sections)
          candidate_flags['oral_question_exchange']=speeches.speech_id.isin(oral_ids)

          flags=pd.DataFrame(candidate_flags,index=speeches.index)
          overlap_count=flags.sum(axis=1)
          overlap_rows=speeches.loc[overlap_count.gt(1),['speech_id','debate_date','debate_section_id','heading']].copy()
          overlap_rows['contexts']=[sorted(flags.columns[flags.loc[i]].tolist()) for i in overlap_rows.index]

          # Precedence proposal: oral question > bill/legislation > leaders > motion > statement > procedural > other.
          precedence=['oral_question_exchange','bill_or_legislation','leaders_questions','motions','statements','procedural_business']
          def assign(i):
              for c in precedence:
                  if bool(flags.at[i,c]): return c
              return 'other'
          speeches['candidate_context']=[assign(i) for i in speeches.index]

          context_counts=speeches.candidate_context.value_counts().to_dict()
          section_counts=speeches.groupby('candidate_context').debate_section_id.nunique().to_dict()

          heading_profiles={}
          for ctx in precedence:
              g=speeches[speeches.candidate_context.eq(ctx)]
              heading_profiles[ctx]=g.heading.value_counts().head(40).to_dict()

          # Bill coverage quality.
          bill_speeches=speeches[speeches.debate_section_id.isin(bill_sections)]
          bill_heading_sample=bill_speeches.heading.value_counts().head(30).to_dict()
          bill_sections_without_speeches=len(bill_sections-set(speeches.debate_section_id))
          bill_debate_ids_with_section=int(billdeb.debate_section_id.ne('').sum())

          # Heading-only rule quality samples: top and rare headings.
          manual_samples={}
          for ctx in ['leaders_questions','motions','statements','procedural_business']:
              g=speeches[speeches.candidate_context.eq(ctx)]
              bysec=g.groupby(['debate_section_id','heading'],dropna=False).size().reset_index(name='speech_count').sort_values(['speech_count','heading'],ascending=[False,True])
              manual_samples[ctx]=bysec.head(25).to_dict(orient='records')

          # Context coverage by year.
          speeches['year']=speeches.debate_date_dt.dt.year
          by_year=speeches.groupby(['year','candidate_context']).speech_id.nunique().unstack(fill_value=0).reset_index().to_dict(orient='records')

          # Overlap matrix.
          overlap_matrix=[]
          cols=list(flags.columns)
          for i,a in enumerate(cols):
              for b in cols[i+1:]:
                  n=int((flags[a]&flags[b]).sum())
                  if n:
                      overlap_matrix.append({'context_a':a,'context_b':b,'speech_overlap':n})

          out={
            'production_batch_id':str(pointer.get('batch_id') or pointer.get('mode')),
            'resolved_keys':{'speeches':skey,'sections':seckey,'bill_debates':bkey,'speech_question_context':qctxkey},
            'source_inventory':{
              'speech_rows':int(len(speeches)),
              'section_rows':int(len(sections)),
              'bill_debate_rows':int(len(billdeb)),
              'bill_debate_rows_with_section':bill_debate_ids_with_section,
              'distinct_bill_sections':int(len(bill_sections)),
              'bill_sections_without_speeches':int(bill_sections_without_speeches),
            },
            'candidate_context_counts':{k:int(v) for k,v in context_counts.items()},
            'candidate_context_section_counts':{k:int(v) for k,v in section_counts.items()},
            'coverage_share_non_other':float((speeches.candidate_context!='other').mean()),
            'precedence_proposal':precedence+['other'],
            'overlap_speech_count':int(overlap_count.gt(1).sum()),
            'overlap_matrix':overlap_matrix,
            'overlap_examples':overlap_rows.head(60).to_dict(orient='records'),
            'heading_profiles':heading_profiles,
            'bill_heading_sample':bill_heading_sample,
            'manual_samples':manual_samples,
            'by_year':by_year,
            'guardrails':[
              'oral_question_exchange is already certified through exact debate_section_id linkage from Oral question records.',
              'bill_or_legislation is anchored only by silver_bill_debates.debate_section_id, not by heading text.',
              'leaders_questions, motions, statements and procedural_business are heading-rule candidates and require source/manual validation before production use.',
              'overlaps must be resolved by explicit precedence; do not allow one speech to count in multiple top-level contexts.',
              'other remains the default where deterministic evidence is insufficient.'
            ]
          }
          Path('analysis').mkdir(exist_ok=True)
          Path('analysis/broader_speech_context_profile.json').write_text(json.dumps(out,indent=2,sort_keys=True,default=str)+'\n')
          digest={k:v for k,v in out.items() if k not in ['overlap_examples','manual_samples','heading_profiles']}
          digest['heading_profiles']={k:list(v.items())[:15] for k,v in heading_profiles.items()}
          digest['overlap_examples']=out['overlap_examples'][:20]
          digest['manual_samples']={k:v[:10] for k,v in manual_samples.items()}
          Path('analysis/broader_speech_context_profile_digest.json').write_text(json.dumps(digest,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(digest,indent=2,sort_keys=True,default=str))
          PY
      - name: Persist analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/broader_speech_context_profile*.json
          git commit -m "Capture broader speech context profile ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}
