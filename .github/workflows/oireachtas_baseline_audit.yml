name: Oireachtas baseline audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3 pandas pyarrow pyyaml
      - name: Test political metrics foundation
        run: python -m unittest discover -s tests/political_metrics -p 'test_*.py'
