name: Speech Classifier Migration Finalizer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Patch normalized legacy migration paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('process/oireachtas_speech_issue_classifier.py')
          text = path.read_text(encoding='utf-8')

          new_func = '''def build_legacy_lookups(\n    legacy: pd.DataFrame,\n) -> tuple[\n    dict[tuple[str, str, str, str], str],\n    dict[tuple[str, str], str],\n    dict[tuple[str, str, str, str], str],\n    dict[tuple[str, str], str],\n    dict[str, int],\n]:\n    if legacy.empty:\n        return {}, {}, {}, {}, {\n            "legacy_rows": 0,\n            "legacy_valid_labels": 0,\n            "legacy_ambiguous_exact_keys": 0,\n            "legacy_ambiguous_date_hash_keys": 0,\n            "legacy_ambiguous_normalized_exact_keys": 0,\n            "legacy_ambiguous_normalized_date_hash_keys": 0,\n        }\n\n    working = pd.DataFrame(index=legacy.index)\n    speech_text = _col(legacy, "Speech Text", "speech_text")\n    working["text_hash"] = speech_text.map(text_hash)\n    working["normalized_text_hash"] = speech_text.map(lambda value: text_hash(normalize_text(value)))\n    working["debate_date"] = _col(legacy, "Debate Date", "debate_date", "date").map(normalize_date)\n    working["speech_order"] = _col(legacy, "Speech Order", "speech_order").map(normalize_order)\n    working["speaker_name"] = _col(legacy, "Speaker Name", "speaker_name", "member_name").map(normalize_name)\n    working["issue_label"] = _col(legacy, "PoliticalIssues", "political_issues", "issue_label").map(canonicalize_label)\n    working = working[working["issue_label"] != ""].copy()\n    working["exact_key"] = list(zip(working["debate_date"], working["speech_order"], working["speaker_name"], working["text_hash"]))\n    working["date_hash_key"] = list(zip(working["debate_date"], working["text_hash"]))\n    working["normalized_exact_key"] = list(zip(working["debate_date"], working["speech_order"], working["speaker_name"], working["normalized_text_hash"]))\n    working["normalized_date_hash_key"] = list(zip(working["debate_date"], working["normalized_text_hash"]))\n\n    def exact_lookup(column: str) -> tuple[dict[Any, str], int]:\n        lookup: dict[Any, str] = {}\n        ambiguous = 0\n        for key, group in working.groupby(column, sort=False):\n            labels = sorted(set(group["issue_label"].tolist()))\n            if len(labels) == 1:\n                lookup[key] = labels[0]\n            else:\n                ambiguous += 1\n        return lookup, ambiguous\n\n    def unique_lookup(column: str) -> tuple[dict[Any, str], int]:\n        lookup: dict[Any, str] = {}\n        ambiguous = 0\n        for key, group in working.groupby(column, sort=False):\n            labels = sorted(set(group["issue_label"].tolist()))\n            if len(group) == 1 and len(labels) == 1:\n                lookup[key] = labels[0]\n            else:\n                ambiguous += 1\n        return lookup, ambiguous\n\n    exact, ambiguous_exact = exact_lookup("exact_key")\n    date_hash, ambiguous_date_hash = unique_lookup("date_hash_key")\n    normalized_exact, ambiguous_normalized_exact = exact_lookup("normalized_exact_key")\n    normalized_date_hash, ambiguous_normalized_date_hash = unique_lookup("normalized_date_hash_key")\n\n    return exact, date_hash, normalized_exact, normalized_date_hash, {\n        "legacy_rows": int(len(legacy)),\n        "legacy_valid_labels": int(len(working)),\n        "legacy_ambiguous_exact_keys": int(ambiguous_exact),\n        "legacy_ambiguous_date_hash_keys": int(ambiguous_date_hash),\n        "legacy_ambiguous_normalized_exact_keys": int(ambiguous_normalized_exact),\n        "legacy_ambiguous_normalized_date_hash_keys": int(ambiguous_normalized_date_hash),\n    }\n\n\n'''
          text, count = re.subn(
              r'def build_legacy_lookups\([\s\S]*?\n\ndef build_legacy_lookup\(',
              new_func + 'def build_legacy_lookup(',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not replace build_legacy_lookups')

          text = text.replace(
              '    exact, _, stats = build_legacy_lookups(legacy)\n',
              '    exact, _, _, _, stats = build_legacy_lookups(legacy)\n',
              1,
          )
          text = text.replace(
              '    legacy_exact, legacy_date_hash, legacy_stats = build_legacy_lookups(legacy)\n',
              '    legacy_exact, legacy_date_hash, legacy_normalized_exact, legacy_normalized_date_hash, legacy_stats = build_legacy_lookups(legacy)\n',
              1,
          )
          text = text.replace(
              '        "migrated_legacy_date_hash_unique": 0,\n',
              '        "migrated_legacy_date_hash_unique": 0,\n        "migrated_legacy_normalized_exact": 0,\n        "migrated_legacy_normalized_date_hash_unique": 0,\n',
              1,
          )

          raw_date_block = '''        if not issue_label:\n            issue_label = legacy_date_hash.get((debate_date, source_hash), "")\n            if issue_label:\n                issue_label_source = "legacy_migration_date_hash_unique"\n                model_name = "legacy_unknown"\n                classification_status = "none" if issue_label == "NONE" else "classified"\n                stats["migrated_legacy_date_hash_unique"] += 1\n\n'''
          normalized_block = raw_date_block + '''        normalized_source_hash = text_hash(normalize_text(speech_text))\n        if not issue_label:\n            normalized_exact_key = (debate_date, speech_order, normalize_name(speaker_name), normalized_source_hash)\n            issue_label = legacy_normalized_exact.get(normalized_exact_key, "")\n            if issue_label:\n                issue_label_source = "legacy_migration_normalized_exact"\n                model_name = "legacy_unknown"\n                classification_status = "none" if issue_label == "NONE" else "classified"\n                stats["migrated_legacy_normalized_exact"] += 1\n\n        if not issue_label:\n            issue_label = legacy_normalized_date_hash.get((debate_date, normalized_source_hash), "")\n            if issue_label:\n                issue_label_source = "legacy_migration_normalized_date_hash_unique"\n                model_name = "legacy_unknown"\n                classification_status = "none" if issue_label == "NONE" else "classified"\n                stats["migrated_legacy_normalized_date_hash_unique"] += 1\n\n'''
          if raw_date_block not in text:
              raise SystemExit('Raw date-hash insertion point not found')
          text = text.replace(raw_date_block, normalized_block, 1)

          text = text.replace(
              '    stats["migrated_legacy"] = stats["migrated_legacy_exact"] + stats["migrated_legacy_date_hash_unique"]\n',
              '    stats["migrated_legacy"] = (\n        stats["migrated_legacy_exact"]\n        + stats["migrated_legacy_date_hash_unique"]\n        + stats["migrated_legacy_normalized_exact"]\n        + stats["migrated_legacy_normalized_date_hash_unique"]\n    )\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_oireachtas_speech_issue_classifier.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '    def test_existing_unified_label_reused_only_when_text_hash_matches(self) -> None:\n'
          additions = '''    def test_normalized_exact_legacy_match_recovers_whitespace_variant(self) -> None:\n        silver_text = "This sufficiently long speech discusses housing supply and planning reform across the country today for families."\n        legacy_text = "This   sufficiently long speech discusses housing supply\\n and planning reform across the country today for families."\n        silver = pd.DataFrame([silver_row("speech:norm-exact", silver_text, order="9")])\n        legacy = pd.DataFrame([{\n            "Debate Date": "2026-02-26",\n            "Speech Order": "9",\n            "Speaker Name": "Jane Doe",\n            "Speech Text": legacy_text,\n            "PoliticalIssues": "Housing and Community Development",\n        }])\n\n        plan = prepare_classification_plan(silver, legacy=legacy)\n\n        self.assertEqual(plan.rows.iloc[0]["issue_label"], "Housing and Community Development")\n        self.assertEqual(plan.rows.iloc[0]["issue_label_source"], "legacy_migration_normalized_exact")\n        self.assertEqual(plan.stats["migrated_legacy_normalized_exact"], 1)\n\n    def test_normalized_date_hash_match_requires_unique_legacy_text(self) -> None:\n        silver_text = "This sufficiently long speech discusses public transport capacity and bus services across the country for commuters."\n        legacy_text = "This sufficiently long speech discusses public  transport capacity and bus services across the country for commuters."\n        silver = pd.DataFrame([silver_row("speech:norm-date", silver_text, order="10", speaker="Current Parser Name")])\n        legacy = pd.DataFrame([{\n            "Debate Date": "2026-02-26",\n            "Speech Order": "99",\n            "Speaker Name": "Legacy Parser Name",\n            "Speech Text": legacy_text,\n            "PoliticalIssues": "Transportation",\n        }])\n\n        plan = prepare_classification_plan(silver, legacy=legacy)\n\n        self.assertEqual(plan.rows.iloc[0]["issue_label"], "Transportation")\n        self.assertEqual(plan.rows.iloc[0]["issue_label_source"], "legacy_migration_normalized_date_hash_unique")\n        self.assertEqual(plan.stats["migrated_legacy_normalized_date_hash_unique"], 1)\n\n'''
          if marker not in tests:
              raise SystemExit('Test insertion point not found')
          tests = tests.replace(marker, additions + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Run migration/classifier tests
        run: python -m unittest tests.test_oireachtas_speech_issue_classifier -v
      - name: Commit finalized migration matcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add process/oireachtas_speech_issue_classifier.py tests/test_oireachtas_speech_issue_classifier.py
          git commit -m "Add normalized legacy speech classification migration fallback"
          git push
