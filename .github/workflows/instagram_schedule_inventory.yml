name: Instagram schedule inventory

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: us-east-2

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Assume High Director AWS administrator role
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role \
            --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" \
            --role-session-name instagram-schedule-inventory-${GITHUB_RUN_ID} \
            --duration-seconds 3600 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"

      - name: List upcoming scheduled Instagram publications
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3
          function_arn="$(aws lambda get-function --function-name eirepolitic-instagram-publisher --query 'Configuration.FunctionArn' --output text)"
          role_arn="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerExecutionRoleArn'].OutputValue | [0]" --output text)"
          dlq_arn="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerDeadLetterQueueArn'].OutputValue | [0]" --output text)"
          FUNCTION_ARN="$function_arn" ROLE_ARN="$role_arn" DLQ_ARN="$dlq_arn" python - <<'PY'
          import json, os, boto3
          from dataclasses import asdict
          from pathlib import Path
          from publishing.schedule_inventory import list_upcoming_scheduled_publications
          from publishing.scheduler import SchedulerTarget

          table = boto3.resource('dynamodb', region_name='us-east-2').Table('eirepolitic-publications')
          items = list_upcoming_scheduled_publications(
              table=table,
              scheduler_client=boto3.client('scheduler', region_name='us-east-2'),
              scheduler_target=SchedulerTarget(
                  lambda_arn=os.environ['FUNCTION_ARN'],
                  role_arn=os.environ['ROLE_ARN'],
                  dlq_arn=os.environ['DLQ_ARN'],
              ),
          )
          value = [asdict(item) for item in items]
          Path('schedule_inventory.json').write_text(json.dumps(value, indent=2, default=str), encoding='utf-8')
          print(json.dumps(value, indent=2, default=str))
          PY

      - name: Record inventory in Director session branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONTENT_B64=$(base64 -w0 schedule_inventory.json)
          curl -sS -X PUT \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/director/sessions/2026-10-03-bill-tracker-first-stage/schedule_inventory_latest.json" \
            -d "{\"message\":\"Record live Instagram schedule inventory ${GITHUB_RUN_ID}\",\"content\":\"${CONTENT_B64}\",\"branch\":\"sly/session/2026-10-03-bill-tracker-first-stage\"}" \
            | python -c "import json,sys; d=json.load(sys.stdin); print('OK' if 'content' in d else f'FAILED: {d}')"
