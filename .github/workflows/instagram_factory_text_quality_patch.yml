name: Apply text quality wiring patch

on:
  workflow_dispatch:
  push:
    branches:
      - feature/instagram-content-factory-party-project
    paths:
      - ".github/workflows/instagram_factory_text_quality_patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-content-factory-party-project
          fetch-depth: 0
      - name: Patch generic validator
        shell: python
        run: |
          from pathlib import Path

          path = Path("instagram/factory/generic_tests.py")
          text = path.read_text(encoding="utf-8")
          old = '''            layout_quality = validate_slide_layout(
                template=layout,
                bindings=bindings,
                output_path=output_path,
            )
'''
          new = '''            layout_quality = validate_slide_layout(
                template=layout,
                bindings=bindings,
                output_path=output_path,
                element_metrics=result.element_metrics,
            )
'''
          if old in text:
              text = text.replace(old, new, 1)

          old_slide = '''                "warnings": [],
                "layout_quality": layout_quality,
                "visual_quality": visual_quality,
'''
          new_slide = '''                "warnings": [],
                "element_metrics": result.element_metrics,
                "layout_quality": layout_quality,
                "visual_quality": visual_quality,
'''
          if old_slide in text:
              text = text.replace(old_slide, new_slide, 1)

          old_gates = '''        "quality_gates": {
            "layout_utilization": True,
            "media_slot_fill": True,
            "visual_plot_utilization": True,
            "historical_real_data_fallback": True,
        },
'''
          new_gates = '''        "quality_gates": {
            "layout_utilization": True,
            "media_slot_fill": True,
            "visual_plot_utilization": True,
            "title_text_bounds": True,
            "chart_text_bounds": True,
            "dynamic_text_sizing": True,
            "historical_real_data_fallback": True,
        },
'''
          if old_gates in text:
              text = text.replace(old_gates, new_gates, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/factory/generic_tests.py
          git commit -m "feat(instagram): wire text-bound quality telemetry" || true
          git push origin HEAD:feature/instagram-content-factory-party-project
