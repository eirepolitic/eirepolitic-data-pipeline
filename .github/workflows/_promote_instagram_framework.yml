name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote-september-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'true'
      OIREACHTAS_PUBLISH_LATEST: 'true'
      BATCH_ID: scheduled-weekly-37154732444-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Promote validated September recovery candidate
        run: |
          set -euo pipefail
          python process/oireachtas_batch_control.py \
            --bucket "$S3_BUCKET" \
            --region "$AWS_REGION" \
            promote \
            --batch-id "$BATCH_ID" \
            | tee promotion.json
      - name: Verify production September coverage
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os
          import boto3, pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY, batch_key_for_production_key, read_json_required

          s3=boto3.client('s3'); bucket=os.environ['S3_BUCKET']; expected=os.environ['BATCH_ID']
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          assert pointer.get('mode')=='batch', pointer
          assert pointer.get('batch_id')==expected, pointer

          def load(table):
              key=batch_key_for_production_key(f'processed/oireachtas_unified/latest/csv/{table}.csv',expected)
              body=s3.get_object(Bucket=bucket,Key=key)['Body'].read()
              return pd.read_csv(io.BytesIO(body),dtype=str,keep_default_na=False,na_values=[''])

          speeches=load('silver_speeches'); labels=load('enrichment_speech_issue_labels')
          dates=pd.to_datetime(speeches['debate_date'],errors='coerce')
          sept=speeches[(dates>=pd.Timestamp('2026-09-01'))&(dates<=pd.Timestamp('2026-09-30'))].copy()
          ids=set(sept['speech_id'].astype(str)); sept_labels=labels[labels['speech_id'].astype(str).isin(ids)].copy()
          report={
            'production_batch_id':pointer['batch_id'],
            'promoted_at_utc':pointer.get('promoted_at_utc'),
            'previous_batch_id':pointer.get('previous_batch_id'),
            'latest_speech_date':dates.max().date().isoformat() if dates.notna().any() else None,
            'september_speech_rows':int(len(sept)),
            'september_unique_speech_ids':int(sept['speech_id'].astype(str).nunique()),
            'september_label_rows':int(len(sept_labels)),
            'september_unique_labelled_speech_ids':int(sept_labels['speech_id'].astype(str).nunique()) if len(sept_labels) else 0,
            'classification_status_counts':sept_labels['classification_status'].fillna('').value_counts().to_dict() if 'classification_status' in sept_labels.columns else {},
          }
          assert report['september_speech_rows']==2374, report
          assert report['september_unique_labelled_speech_ids']==2374, report
          print(json.dumps(report,indent=2))
          with open('production_verification.json','w',encoding='utf-8') as f: json.dump(report,f,indent=2)
          PY
      - name: Upload promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: september-production-promotion-${{ github.run_id }}
          path: |
            promotion.json
            production_verification.json
          if-no-files-found: error
          retention-days: 90
