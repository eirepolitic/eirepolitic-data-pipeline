name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-monthly-post-framework
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml pillow matplotlib boto3 pytest
      - name: Compile Instagram runtime sources
        run: |
          python -m compileall -q instagram political_metrics
          python -m py_compile extract/oireachtas/batch.py extract/oireachtas/normalize.py
      - name: Run approved-design regression suite
        run: python -m pytest -q tests/test_instagram_monthly_post_framework.py
