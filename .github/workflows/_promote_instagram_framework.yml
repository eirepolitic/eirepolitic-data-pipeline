name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-monthly-post-framework
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml pillow matplotlib boto3 pytest
      - name: Capture regression output
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_instagram_monthly_post_framework.py > /tmp/pytest.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/pytest.log
          if [ "$STATUS" -ne 0 ]; then
            mkdir -p instagram/commissioning_diagnostics
            cp /tmp/pytest.log instagram/commissioning_diagnostics/glossary_regression.log
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add instagram/commissioning_diagnostics/glossary_regression.log
            git commit -m 'chore: capture glossary regression failure'
            git push origin HEAD:feature/instagram-monthly-post-framework
            exit "$STATUS"
          fi
