name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_BATCH_ID: diagnostic-weekly-37153861195-1
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oireachtas-orchestrator-startup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas boto3
      - name: Read candidate checkpoint
        run: |
          python - <<'PY'
          import io, json, os
          from pathlib import Path
          import boto3, pandas as pd
          from extract.oireachtas.batch import batch_key_for_production_key
          from political_metrics.sources import canonical_speeches
          s3=boto3.client('s3'); bucket=os.environ['S3_BUCKET']; batch_id=os.environ['OIREACHTAS_BATCH_ID']
          def read(table):
              key=batch_key_for_production_key(f'processed/oireachtas_unified/latest/csv/{table}.csv',batch_id)
              obj=s3.get_object(Bucket=bucket,Key=key)
              return pd.read_csv(io.BytesIO(obj['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
          speeches=read('silver_speeches')
          canonical=canonical_speeches(speeches); dates=pd.to_datetime(canonical['debate_date'],errors='coerce')
          sept=canonical[(dates>=pd.Timestamp('2026-09-01'))&(dates<=pd.Timestamp('2026-09-30'))]
          report={'batch_id':batch_id,'latest_speech_date':dates.max().date().isoformat() if dates.notna().any() else None,'september_speech_rows':int(len(sept)),'september_unique_speech_ids':int(sept['speech_id'].astype(str).nunique())}
          try:
              labels=read('enrichment_speech_issue_labels')
              ids=set(sept['speech_id'].astype(str)); subset=labels[labels['speech_id'].astype(str).isin(ids)]
              report['september_label_rows']=int(len(subset))
              report['september_status_counts']=subset['classification_status'].fillna('').value_counts().to_dict() if 'classification_status' in subset.columns else {}
              report['all_status_counts']=labels['classification_status'].fillna('').value_counts().to_dict() if 'classification_status' in labels.columns else {}
          except Exception as exc:
              report['labels_checkpoint_error']=repr(exc)
          out=Path('diagnostics/september_classifier_checkpoint.json'); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,indent=2,default=str),encoding='utf-8')
          print(json.dumps(report,indent=2,default=str))
          PY
      - name: Commit checkpoint evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/september_classifier_checkpoint.json
          git commit -m 'chore: capture September classifier checkpoint'
          git push origin HEAD:fix/oireachtas-orchestrator-startup
