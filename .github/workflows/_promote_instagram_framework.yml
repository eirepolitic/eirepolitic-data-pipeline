name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare-vote-window:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      BATCH_ID: scheduled-weekly-37154732444-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oireachtas-orchestrator-startup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas boto3
      - name: Compare common vote date window
        run: |
          python - <<'PY'
          import io, json, os
          from pathlib import Path
          import boto3, pandas as pd
          from extract.oireachtas.batch import batch_key_for_production_key

          s3=boto3.client('s3'); bucket=os.environ['S3_BUCKET']; batch_id=os.environ['BATCH_ID']
          def read(key):
              return pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=key)['Body'].read()),dtype=str,keep_default_na=False)
          legacy=read('processed/votes/dail_vote_member_records.csv')
          candidate=read(batch_key_for_production_key('processed/oireachtas_unified/latest/csv/silver_member_votes.csv',batch_id))
          ld=pd.to_datetime(legacy['date'],errors='coerce'); cd=pd.to_datetime(candidate['division_date'],errors='coerce')
          start,end=ld.min(),ld.max(); scoped=candidate[(cd>=start)&(cd<=end)].copy()
          row_delta=abs(len(scoped)-len(legacy))/max(len(legacy),1)*100
          legacy_members=set(legacy['memberCode'].astype(str).str.strip())-{''}
          scoped_members=set(scoped['member_code'].astype(str).str.strip())-{''}
          report={
            'legacy_window_start':str(start.date()),'legacy_window_end':str(end.date()),
            'legacy_rows':len(legacy),'candidate_rows_in_legacy_window':len(scoped),
            'row_delta_pct_in_legacy_window':round(row_delta,4),
            'legacy_unique_vote_ids':int(legacy['unique_vote_id'].nunique()),
            'candidate_unique_divisions_in_legacy_window':int(scoped['division_id'].nunique()),
            'legacy_only_member_codes':sorted(legacy_members-scoped_members),
            'candidate_only_member_codes':sorted(scoped_members-legacy_members),
            'candidate_pk_duplicates_in_legacy_window':int(scoped.duplicated(['member_code','division_id']).sum()),
          }
          out=Path('diagnostics/oireachtas_validation/vote_compat_overlap.json')
          out.write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/oireachtas_validation/vote_compat_overlap.json
          git commit -m 'chore: record vote compatibility overlap analysis'
          git push origin HEAD:fix/oireachtas-orchestrator-startup
