name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-oireachtas-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oireachtas-orchestrator-startup
      - name: Fetch validation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/oireachtas_validation
          for table in compat_adapter_comparison member_code_mismatch_review; do
            for file in manifest.json sample.csv report.md; do
              aws s3 cp "s3://${S3_BUCKET}/processed/oireachtas_unified/review/${table}/latest/${file}" \
                "diagnostics/oireachtas_validation/${table}_${file}" --only-show-errors || true
            done
          done
      - name: Commit diagnostics
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/oireachtas_validation
          git commit -m 'chore: capture Oireachtas validation failure evidence'
          git push origin HEAD:fix/oireachtas-orchestrator-startup
