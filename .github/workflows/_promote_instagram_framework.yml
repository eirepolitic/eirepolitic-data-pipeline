name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-render-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-recurring-production-v2
      - name: Remove obsolete RenderResult text_metrics dependency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('instagram/projects/party_issue_monthly_profile_v2/adapter.py')
          text=path.read_text(encoding='utf-8')
          old='        "outer_text_metrics": rendered.text_metrics,\n'
          if old not in text:
              raise SystemExit('Expected obsolete outer_text_metrics field not found')
          path.write_text(text.replace(old,'',1),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add instagram/projects/party_issue_monthly_profile_v2/adapter.py
          git commit -m 'fix(instagram): remove obsolete outer text metrics metadata'
          git push origin HEAD:feature/instagram-recurring-production-v2
