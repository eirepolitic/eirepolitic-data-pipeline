name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_BATCH_ID: scheduled-weekly-37154732444-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oireachtas-orchestrator-startup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas boto3
      - name: Summarize candidate readiness
        run: |
          python - <<'PY'
          import io, json, os
          from pathlib import Path
          import boto3, pandas as pd
          from extract.oireachtas.batch import batch_manifest_key, batch_key_for_production_key, read_json_required
          s3=boto3.client('s3'); bucket=os.environ['S3_BUCKET']; batch_id=os.environ['OIREACHTAS_BATCH_ID']
          manifest=read_json_required(s3,bucket=bucket,key=batch_manifest_key(batch_id))
          def load(table):
              key=batch_key_for_production_key(f'processed/oireachtas_unified/latest/csv/{table}.csv',batch_id)
              body=s3.get_object(Bucket=bucket,Key=key)['Body'].read()
              return pd.read_csv(io.BytesIO(body),dtype=str,keep_default_na=False,na_values=['']), key
          speeches,skey=load('silver_speeches'); labels,lkey=load('enrichment_speech_issue_labels')
          dates=pd.to_datetime(speeches['debate_date'],errors='coerce')
          sept=speeches[(dates>=pd.Timestamp('2026-09-01'))&(dates<=pd.Timestamp('2026-09-30'))].copy()
          sept_ids=set(sept['speech_id'].astype(str)); sl=labels[labels['speech_id'].astype(str).isin(sept_ids)].copy()
          report={
            'batch_id':batch_id,'manifest_status':manifest.get('status'),'manifest_dq_status':manifest.get('dq_status'),
            'manifest_blockers':manifest.get('blockers') or manifest.get('validation_blockers') or [],
            'latest_speech_date':dates.max().date().isoformat() if dates.notna().any() else None,
            'september_speech_rows':int(len(sept)),'september_unique_speech_ids':int(sept['speech_id'].astype(str).nunique()),
            'september_label_rows':int(len(sl)),'september_unique_labelled_speech_ids':int(sl['speech_id'].astype(str).nunique()) if len(sl) else 0,
            'classification_status_counts':sl['classification_status'].fillna('').value_counts().to_dict() if 'classification_status' in sl.columns else {},
            'speech_key':skey,'label_key':lkey,
          }
          Path('diagnostics/september_candidate_summary.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - name: Commit summary
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/september_candidate_summary.json
          git commit -m 'chore: capture recovered September candidate summary'
          git push origin HEAD:fix/oireachtas-orchestrator-startup
