name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-august:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-monthly-post-framework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas boto3 requests
      - name: Compare immutable batch to public Oireachtas API
        run: |
          python - <<'PY'
          import io, json
          from collections import Counter
          import boto3, pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY, batch_key_for_production_key, read_json_required
          from extract.oireachtas.client import OireachtasClient
          from political_metrics.sources import canonical_speeches

          bucket='eirepolitic-data'
          s3=boto3.client('s3')
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          batch_id=pointer['batch_id']

          def load(table):
              logical=f'processed/oireachtas_unified/latest/csv/{table}.csv'
              key=batch_key_for_production_key(logical,batch_id)
              obj=s3.get_object(Bucket=bucket,Key=key)
              return pd.read_csv(io.BytesIO(obj['Body'].read()),dtype=str,keep_default_na=False,na_values=['']), key

          speeches, speeches_key=load('silver_speeches')
          labels, labels_key=load('enrichment_speech_issue_labels')
          debates, debates_key=load('silver_debate_records')
          canonical=canonical_speeches(speeches)

          def aug_rows(df, col):
              dates=pd.to_datetime(df[col],errors='coerce')
              return df[(dates>=pd.Timestamp('2026-08-01'))&(dates<=pd.Timestamp('2026-08-31'))].copy()

          aug=aug_rows(canonical,'debate_date')
          aug_debates=aug_rows(debates,'debate_date')
          aug_dates=pd.to_datetime(aug['debate_date'],errors='coerce').dt.strftime('%Y-%m-%d')
          by_date=Counter(aug_dates.dropna().tolist())
          label_aug=labels[labels['speech_id'].astype(str).isin(set(aug['speech_id'].astype(str)))].copy()

          client=OireachtasClient()
          summary=client.get_json_summary('/debates',params={
              'chamber_id':'/ie/oireachtas/house/dail/34',
              'lang':'en','date_start':'2026-08-01','date_end':'2026-08-31','limit':200,
          })
          if not summary.ok or not summary.payload:
              raise RuntimeError(f'Public Dáil API query failed: status={summary.status_code} error={summary.error}')
          payload=dict(summary.payload)
          public=[]
          for item in payload.get('results') or []:
              rec=(item or {}).get('debateRecord') or item or {}
              public.append({
                  'date':rec.get('date'), 'uri':rec.get('uri'),
                  'house_code':((rec.get('house') or {}).get('houseCode')),
                  'show_as':rec.get('showAs'), 'counts':rec.get('counts') or {},
                  'section_count':len(rec.get('debateSections') or []),
              })

          all_summary=client.get_json_summary('/debates',params={
              'lang':'en','date_start':'2026-08-01','date_end':'2026-08-31','limit':200,
          })
          if not all_summary.ok or not all_summary.payload:
              raise RuntimeError(f'Public all-debates API query failed: status={all_summary.status_code} error={all_summary.error}')
          all_payload=dict(all_summary.payload)
          all_public=[]
          for item in all_payload.get('results') or []:
              rec=(item or {}).get('debateRecord') or item or {}; house=rec.get('house') or {}; chamber=rec.get('chamber') or {}
              all_public.append({'date':rec.get('date'),'uri':rec.get('uri'),'house_code':house.get('houseCode'),'chamber':chamber.get('showAs'),'show_as':rec.get('showAs'),'counts':rec.get('counts') or {}})

          sample_cols=[c for c in ['speech_id','debate_id','debate_date','speech_order','speaker_name','speaker_member_code','speech_text','word_count'] if c in aug.columns]
          samples=[]
          for _,row in aug[sample_cols].head(20).iterrows():
              item={}
              for c in sample_cols:
                  v='' if pd.isna(row[c]) else str(row[c]); item[c]=v[:180] if c=='speech_text' else v
              samples.append(item)

          debate_cols=[c for c in ['debate_id','debate_uri','debate_date','chamber','house_code','show_as'] if c in aug_debates.columns]
          source_debates=aug_debates[debate_cols].fillna('').to_dict(orient='records')

          report={
              'batch_id':batch_id,
              'source_keys':{'silver_speeches':speeches_key,'labels':labels_key,'silver_debate_records':debates_key},
              'silver_speeches_total_rows':int(len(speeches)),
              'canonical_speeches_total_rows':int(len(canonical)),
              'august_canonical_rows':int(len(aug)),
              'august_speech_rows_by_date':dict(sorted(by_date.items())),
              'august_unique_dates':sorted(by_date),
              'august_unique_members':int(aug['member_code'].nunique()) if 'member_code' in aug.columns else None,
              'august_label_rows':int(len(label_aug)),
              'classification_status_counts':label_aug['classification_status'].fillna('').value_counts().to_dict() if 'classification_status' in label_aug.columns else {},
              'issue_label_counts':label_aug['issue_label'].fillna('').value_counts().to_dict() if 'issue_label' in label_aug.columns else {},
              'immutable_august_debate_record_count':int(len(aug_debates)),
              'immutable_august_debate_records':source_debates,
              'public_dail_pagination':summary.pagination,
              'public_dail_debate_count':len(public),
              'public_dail_debates':public,
              'public_all_pagination':all_summary.pagination,
              'public_all_debate_count':len(all_public),
              'public_all_debates':all_public,
              'source_sample_rows':samples,
          }
          out='instagram/reference/regression/august_2026_speech_validation.json'
          with open(out,'w',encoding='utf-8') as f: json.dump(report,f,indent=2,ensure_ascii=False)
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Commit validation evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add instagram/reference/regression/august_2026_speech_validation.json
          git commit -m 'docs: record August 2026 speech-count validation evidence'
          git push origin HEAD:feature/instagram-monthly-post-framework
