name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-september:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-monthly-post-framework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas boto3
      - name: Audit current production September speech readiness
        run: |
          python - <<'PY'
          import io, json
          from pathlib import Path
          import boto3, pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY, batch_key_for_production_key, read_json_required, batch_manifest_key
          from political_metrics.sources import canonical_speeches
          from political_metrics.issue_audit import audit_issue_classification

          bucket='eirepolitic-data'; s3=boto3.client('s3')
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          batch_id=str(pointer.get('batch_id') or '')
          manifest=read_json_required(s3,bucket=bucket,key=batch_manifest_key(batch_id))

          def load(table):
              key=batch_key_for_production_key(f'processed/oireachtas_unified/latest/csv/{table}.csv',batch_id)
              obj=s3.get_object(Bucket=bucket,Key=key)
              return pd.read_csv(io.BytesIO(obj['Body'].read()),dtype=str,keep_default_na=False,na_values=['']), key

          speeches,speeches_key=load('silver_speeches')
          labels,labels_key=load('enrichment_speech_issue_labels')
          canonical=canonical_speeches(speeches)
          dates=pd.to_datetime(canonical['debate_date'],errors='coerce')
          sept=canonical[(dates>=pd.Timestamp('2026-09-01'))&(dates<=pd.Timestamp('2026-09-30'))].copy()
          sept_ids=set(sept['speech_id'].astype(str))
          sept_labels=labels[labels['speech_id'].astype(str).isin(sept_ids)].copy()
          audit=audit_issue_classification(canonical,labels,period_start='2026-09-01',period_end='2026-09-30')
          report={
              'production_pointer':pointer,
              'production_batch_id':batch_id,
              'production_batch_status':manifest.get('status'),
              'production_manifest_generated_at':manifest.get('generated_at_utc') or manifest.get('generated_at'),
              'silver_speeches_key':speeches_key,
              'labels_key':labels_key,
              'silver_speeches_total_rows':int(len(speeches)),
              'latest_speech_date':dates.max().date().isoformat() if dates.notna().any() else None,
              'september_speech_rows':int(len(sept)),
              'september_unique_speech_ids':int(sept['speech_id'].astype(str).nunique()),
              'september_label_rows':int(len(sept_labels)),
              'september_unique_labelled_speech_ids':int(sept_labels['speech_id'].astype(str).nunique()) if not sept_labels.empty else 0,
              'september_classification_status_counts':sept_labels['classification_status'].fillna('').value_counts().to_dict() if 'classification_status' in sept_labels.columns else {},
              'classification_audit':audit,
          }
          path=Path('diagnostics/september_2026_readiness_audit.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(report,indent=2,default=str),encoding='utf-8')
          print(json.dumps(report,indent=2,default=str))
          PY
      - name: Commit audit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/september_2026_readiness_audit.json
          git commit -m 'chore: capture September 2026 production readiness audit'
          git push origin HEAD:feature/instagram-monthly-post-framework
