name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove-monthly-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      REVIEW_OUTPUT_ROOT: oireachtas_review_output
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'true'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oireachtas-orchestrator-startup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Resolve monthly inputs
        id: inputs
        run: |
          set -euo pipefail
          BATCH_ID="diagnostic-monthly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "batch_id=${BATCH_ID}" >> "$GITHUB_OUTPUT"
          echo "OIREACHTAS_BATCH_ID=${BATCH_ID}" >> "$GITHUB_ENV"
          python process/oireachtas_refresh_inputs.py \
            --refresh-type monthly --mode '' --tables '' --chamber dail --house-no 34 \
            --date-start '' --date-end '' --page-size '' --sample-rows 10 \
            --github-output "$GITHUB_OUTPUT" | tee oireachtas_refresh_inputs.json
      - name: Seed candidate from production
        run: |
          set -euo pipefail
          OIREACHTAS_PUBLISH_LATEST=false python process/oireachtas_seed_candidate.py \
            --batch-id "$OIREACHTAS_BATCH_ID" --bucket "$S3_BUCKET" --region "$AWS_REGION" \
            | tee oireachtas_seed_candidate.json
      - name: Build monthly refresh table set
        env:
          MODE: ${{ steps.inputs.outputs.mode }}
          TABLES: ${{ steps.inputs.outputs.tables }}
          CHAMBER: ${{ steps.inputs.outputs.chamber }}
          HOUSE_NO: ${{ steps.inputs.outputs.house_no }}
          DATE_START: ${{ steps.inputs.outputs.date_start }}
          DATE_END: ${{ steps.inputs.outputs.date_end }}
          PAGE_SIZE: ${{ steps.inputs.outputs.page_size }}
          SAMPLE_ROWS: ${{ steps.inputs.outputs.sample_rows }}
        run: |
          set -euo pipefail
          : > oireachtas_refresh.log
          IFS=',' read -ra table_list <<< "$TABLES"
          for table in "${table_list[@]}"; do
            table="${table//[[:space:]]/}"
            echo "===== TABLE ${table} =====" | tee -a oireachtas_refresh.log
            python -m extract.oireachtas.build_table \
              --table "$table" --mode "$MODE" --publish-latest true \
              --batch-id "$OIREACHTAS_BATCH_ID" --chamber "$CHAMBER" --house-no "$HOUSE_NO" \
              --date-start "$DATE_START" --date-end "$DATE_END" --limit "$PAGE_SIZE" \
              --sample-rows "$SAMPLE_ROWS" --write-review-sample \
              --s3-bucket "$S3_BUCKET" --aws-region "$AWS_REGION" --review-root "$REVIEW_OUTPUT_ROOT" \
              --github-repository "$GITHUB_REPOSITORY" 2>&1 | tee -a oireachtas_refresh.log
          done
      - name: Classify speech issues when monthly refresh changes speeches
        if: steps.inputs.outputs.changes_speeches == 'true'
        run: |
          set -euo pipefail
          python -m pip install 'openai>=3.6.0,<4'
          success=false
          for pass in 1 2 3 4; do
            echo "=== speech classifier pass ${pass} ==="
            if python -m process.oireachtas_speech_issue_backfill \
              --model "$OPENAI_MODEL" --concurrency 4 --checkpoint-every 100 \
              --bucket "$S3_BUCKET" --region "$AWS_REGION" \
              --report-path speech_issue_classifier_report.json; then
              success=true
              break
            fi
          done
          [[ "$success" == true ]]
      - name: Build candidate political metrics
        run: |
          set -euo pipefail
          python process/political_metrics_materialize_candidate.py \
            --batch-id "$OIREACHTAS_BATCH_ID" --bucket "$S3_BUCKET" --region "$AWS_REGION" \
            --report-path political_metrics_candidate_report.json
      - name: Audit September candidate coverage
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os
          from pathlib import Path
          import boto3, pandas as pd
          from extract.oireachtas.batch import batch_key_for_production_key
          from political_metrics.sources import canonical_speeches
          from political_metrics.issue_audit import audit_issue_classification
          s3=boto3.client('s3'); bucket=os.environ['S3_BUCKET']; batch_id=os.environ['OIREACHTAS_BATCH_ID']
          def load(table):
              key=batch_key_for_production_key(f'processed/oireachtas_unified/latest/csv/{table}.csv',batch_id)
              obj=s3.get_object(Bucket=bucket,Key=key)
              return pd.read_csv(io.BytesIO(obj['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
          speeches=load('silver_speeches'); labels=load('enrichment_speech_issue_labels')
          canonical=canonical_speeches(speeches); dates=pd.to_datetime(canonical['debate_date'],errors='coerce')
          sept=canonical[(dates>=pd.Timestamp('2026-09-01'))&(dates<=pd.Timestamp('2026-09-30'))]
          ids=set(sept['speech_id'].astype(str)); sept_labels=labels[labels['speech_id'].astype(str).isin(ids)]
          audit=audit_issue_classification(canonical,labels,period_start='2026-09-01',period_end='2026-09-30')
          report={
            'batch_id':batch_id,
            'latest_speech_date':dates.max().date().isoformat() if dates.notna().any() else None,
            'september_speech_rows':int(len(sept)),
            'september_unique_speech_ids':int(sept['speech_id'].astype(str).nunique()),
            'september_label_rows':int(len(sept_labels)),
            'september_unique_labelled_speech_ids':int(sept_labels['speech_id'].astype(str).nunique()) if not sept_labels.empty else 0,
            'classification_status_counts':sept_labels['classification_status'].fillna('').value_counts().to_dict() if 'classification_status' in sept_labels.columns else {},
            'classification_audit':audit,
            'changes_speeches':'${{ steps.inputs.outputs.changes_speeches }}',
            'tables':'${{ steps.inputs.outputs.tables }}'
          }
          Path('september_candidate_readiness.json').write_text(json.dumps(report,indent=2,default=str),encoding='utf-8')
          print(json.dumps(report,indent=2,default=str))
          assert report['september_speech_rows'] > 0, report
          assert report['september_unique_labelled_speech_ids'] > 0, report
          PY
      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-monthly-runtime-proof-${{ github.run_id }}
          path: |
            oireachtas_refresh_inputs.json
            oireachtas_seed_candidate.json
            oireachtas_refresh.log
            speech_issue_classifier_report.json
            political_metrics_candidate_report.json
            september_candidate_readiness.json
          if-no-files-found: warn
