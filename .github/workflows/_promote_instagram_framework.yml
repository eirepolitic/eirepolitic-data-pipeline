name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-xml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-monthly-post-framework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas boto3 requests
      - name: Validate raw debate XML parser coverage
        run: |
          python - <<'PY'
          import io, json, xml.etree.ElementTree as ET
          import boto3, pandas as pd, requests
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY, batch_key_for_production_key, read_json_required
          from extract.oireachtas.xml_debates import parse_debate_xml

          bucket='eirepolitic-data'; s3=boto3.client('s3')
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY); batch_id=pointer['batch_id']
          def load(table):
              key=batch_key_for_production_key(f'processed/oireachtas_unified/latest/csv/{table}.csv',batch_id)
              obj=s3.get_object(Bucket=bucket,Key=key)
              return pd.read_csv(io.BytesIO(obj['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
          debates=load('silver_debate_records'); speeches=load('silver_speeches')
          aug=debates[debates['debate_date'].astype(str).eq('2026-08-28')].copy()
          if len(aug)!=1: raise RuntimeError(f'Expected one 2026-08-28 debate, got {len(aug)}')
          row=aug.iloc[0]
          xml_url=str(row.get('source_xml_url') or row.get('source_xml_uri') or '')
          if not xml_url.startswith('http'): raise RuntimeError(f'No HTTP XML source URL: {xml_url!r}')
          response=requests.get(xml_url,timeout=60); response.raise_for_status(); xml_bytes=response.content
          root=ET.fromstring(xml_bytes)
          def local(tag): return tag.rsplit('}',1)[-1] if '}' in tag else tag
          raw_speech_elements=[el for el in root.iter() if local(el.tag)=='speech']
          raw_nonempty=0
          for el in raw_speech_elements:
              text=' '.join(' '.join(el.itertext()).split())
              if text: raw_nonempty += 1
          parsed, diagnostics=parse_debate_xml(xml_bytes=xml_bytes,debate_id=str(row['debate_id']),debate_date='2026-08-28')
          batch_rows=speeches[speeches['debate_id'].astype(str).eq(str(row['debate_id']))]
          report={
              'batch_id':batch_id,'debate_id':str(row['debate_id']),'source_xml_url':xml_url,
              'xml_byte_size':len(xml_bytes),'raw_speech_element_count':len(raw_speech_elements),
              'raw_nonempty_speech_element_count':raw_nonempty,'parser_output_count':len(parsed),
              'immutable_silver_speech_count_for_debate':int(len(batch_rows)),
              'parser_matches_raw_nonempty':len(parsed)==raw_nonempty,
              'batch_matches_parser':len(batch_rows)==len(parsed),
              'tag_counts':diagnostics.get('tag_counts'),
              'person_reference_count':diagnostics.get('person_reference_count'),
              'parsed_member_code_present':sum(1 for item in parsed if item.speaker_member_code),
              'parsed_member_code_missing':sum(1 for item in parsed if not item.speaker_member_code),
          }
          out='instagram/reference/regression/august_2026_xml_parser_validation.json'
          with open(out,'w',encoding='utf-8') as f: json.dump(report,f,indent=2,ensure_ascii=False)
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Commit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add instagram/reference/regression/august_2026_xml_parser_validation.json
          git commit -m 'docs: record August XML speech-parser validation'
          git push origin HEAD:feature/instagram-monthly-post-framework
