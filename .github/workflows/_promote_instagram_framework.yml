name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_BATCH_ID: scheduled-weekly-37154732444-1
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'true'
      REVIEW_OUTPUT_ROOT: oireachtas_review_output
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oireachtas-orchestrator-startup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run compatibility regression tests
        run: python -m pytest -q tests/test_oireachtas_compat_comparison.py
      - name: Run patched strict compatibility and mismatch validation
        run: |
          set -euo pipefail
          python -m extract.oireachtas.compat_comparison | tee oireachtas_compat_comparison.log
          python -m extract.oireachtas.mismatch_review | tee oireachtas_mismatch_review.log
      - name: Build year-aware member metrics
        run: |
          set -euo pipefail
          export TARGET_YEAR="$(date -u -d '1 year ago' +%Y)"
          python process/build_member_profile_metrics.py | tee member_profile_metrics.json
          echo "TARGET_YEAR=${TARGET_YEAR}" >> "$GITHUB_ENV"
      - name: Run candidate-only Instagram HTML smoke test
        run: |
          set -euo pipefail
          python process/oireachtas_consumer_smoke.py \
            --batch-id "$OIREACHTAS_BATCH_ID" \
            --target-year "$TARGET_YEAR" \
            --bucket "$S3_BUCKET" \
            --region "$AWS_REGION" \
            --output consumer_smoke \
            | tee oireachtas_consumer_smoke.log
      - name: Reassemble final candidate manifest
        run: |
          set -euo pipefail
          OIREACHTAS_PUBLISH_LATEST=false \
            python process/oireachtas_reassemble_candidate.py \
              --batch-id "$OIREACHTAS_BATCH_ID" \
              --bucket "$S3_BUCKET" \
              --region "$AWS_REGION" \
              --require compat_downstream_adapters \
              | tee oireachtas_final_batch_manifest.json
      - name: Commit compact proof
        if: always()
        run: |
          set -euo pipefail
          mkdir -p diagnostics/oireachtas_validation
          python - <<'PY'
          import json
          from pathlib import Path
          proof={
            'batch_id':'scheduled-weekly-37154732444-1',
            'compatibility_fix':'legacy_date_range',
            'regression_test':'tests/test_oireachtas_compat_comparison.py',
          }
          final=Path('oireachtas_final_batch_manifest.json')
          if final.exists():
            try: proof['final_manifest']=json.loads(final.read_text())
            except Exception: proof['final_manifest_text']=final.read_text()[-4000:]
          Path('diagnostics/oireachtas_validation/post_fix_validation.json').write_text(json.dumps(proof,indent=2,default=str),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/oireachtas_validation/post_fix_validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record post-fix candidate validation proof'
            git push origin HEAD:fix/oireachtas-orchestrator-startup
          fi
