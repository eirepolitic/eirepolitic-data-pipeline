name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-recurring-production-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyyaml pillow matplotlib boto3 pytest
      - name: Capture regression failure
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_instagram_monthly_post_framework.py --tb=short > /tmp/pytest.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/pytest.log
          mkdir -p diagnostics/instagram
          cp /tmp/pytest.log diagnostics/instagram/monthly_post_regression.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/instagram/monthly_post_regression.log
          git commit -m 'chore: capture monthly Instagram regression diagnostics'
          git push origin HEAD:feature/instagram-recurring-production-v2
          exit "$STATUS"
