name: Oireachtas batch control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to perform
        required: false
        type: choice
        options:
          - status
          - assemble
          - promote
          - rollback
          - rollback-previous
        default: status
      batch_id:
        description: Required for assemble, promote, and rollback; use legacy_direct for first-cutover rollback
        required: false
        type: string
      required_tables:
        description: Optional comma-separated required tables for assemble
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: oireachtas-production-promotion
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: ${{ vars.OIREACHTAS_PUBLISH_ENABLED || 'false' }}
      OIREACHTAS_PUBLISH_LATEST: ${{ (inputs.operation == 'promote' || inputs.operation == 'rollback' || inputs.operation == 'rollback-previous') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate inputs
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          BATCH_ID: ${{ inputs.batch_id }}
        run: |
          set -euo pipefail
          if [[ "${OPERATION}" =~ ^(assemble|promote|rollback)$ && -z "${BATCH_ID}" ]]; then
            echo 'batch_id is required for this operation' >&2
            exit 2
          fi
          if [[ -n "${BATCH_ID}" && ! "${BATCH_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo 'batch_id contains unsafe characters' >&2
            exit 2
          fi
      - name: Run batch control
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          BATCH_ID: ${{ inputs.batch_id }}
          REQUIRED_TABLES: ${{ inputs.required_tables }}
        run: |
          set -euo pipefail
          args=(--bucket "${S3_BUCKET}" --region "${AWS_REGION}" "${OPERATION}")
          if [[ "${OPERATION}" =~ ^(assemble|promote|rollback)$ ]]; then
            args+=(--batch-id "${BATCH_ID}")
          fi
          if [[ "${OPERATION}" == 'assemble' && -n "${REQUIRED_TABLES}" ]]; then
            IFS=',' read -ra tables <<< "${REQUIRED_TABLES}"
            for table in "${tables[@]}"; do
              table="${table//[[:space:]]/}"
              [[ -n "${table}" ]] && args+=(--required-table "${table}")
            done
          fi
          python process/oireachtas_batch_control.py "${args[@]}" | tee oireachtas-batch-control.json
      - name: Diagnose September PQ coverage
        if: inputs.operation == 'status'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import boto3
          import pandas as pd
          from instagram.factory.oireachtas_source import load_csv_tables, resolve_validated_production_batch
          from political_metrics.calculators.questions import prepare_eligible_td_questions

          s3 = boto3.client('s3', region_name='ca-central-1')
          batch = resolve_validated_production_batch(s3=s3)
          names = ['silver_questions','silver_member_memberships','silver_member_parties','silver_member_constituencies']
          frames, _ = load_csv_tables(batch, names, s3=s3)
          q = frames['silver_questions'].copy()
          q['question_date'] = pd.to_datetime(q['question_date'], errors='coerce')
          sep = q[(q['question_date'] >= '2026-09-01') & (q['question_date'] < '2026-10-01')].copy()
          dedupe_cols = [c for c in ['question_id','member_code','question_date'] if c in sep.columns]
          deduped = sep.drop_duplicates(subset=dedupe_cols) if dedupe_cols else sep.copy()
          eligible = prepare_eligible_td_questions(
              deduped,
              frames['silver_member_memberships'],
              frames['silver_member_parties'],
              frames['silver_member_constituencies'],
          ) if not deduped.empty else deduped.copy()
          dates = q['question_date'].dropna()
          result = {
              'production_batch_id': batch.batch_id,
              'all_question_rows': int(len(q)),
              'all_question_min_date': dates.min().isoformat() if not dates.empty else None,
              'all_question_max_date': dates.max().isoformat() if not dates.empty else None,
              'september_question_rows': int(len(sep)),
              'september_deduped_rows': int(len(deduped)),
              'september_eligible_rows': int(len(eligible)),
              'september_member_code_nonnull': int(sep['member_code'].notna().sum()) if 'member_code' in sep.columns else None,
          }
          Path('director/diagnostics').mkdir(parents=True, exist_ok=True)
          Path('director/diagnostics/pq-september-2026.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2))
          PY
      - name: Commit September diagnostic
        if: inputs.operation == 'status'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director/diagnostics/pq-september-2026.json
          git commit -m 'Record September PQ production diagnostic' || true
          git push origin HEAD:sly/data/september-2026-pq-refresh
      - name: Upload control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oireachtas-batch-control-${{ inputs.operation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            oireachtas-batch-control.json
            director/diagnostics/pq-september-2026.json
          if-no-files-found: warn
          retention-days: 90
