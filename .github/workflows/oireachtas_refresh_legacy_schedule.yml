name: Speech Classifier Rollout PR Ready Helper

on:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 40 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(curl --fail-with-body -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/40")
          node_id=$(printf '%s' "$pr" | python -c "import json,sys; print(json.load(sys.stdin)['node_id'])")
          curl --fail-with-body -sS -L -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            -d "{\"query\":\"mutation { markPullRequestReadyForReview(input: {pullRequestId: \\\"${node_id}\\\"}) { pullRequest { number isDraft } } }\"}" \
            | tee ready_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('ready_result.json').read_text())
          assert not d.get('errors'), d
          assert d['data']['markPullRequestReadyForReview']['pullRequest']['isDraft'] is False, d
          print('PR 40 marked ready')
          PY
