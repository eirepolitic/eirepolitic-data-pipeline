name: Instagram polling snapshot CI

on:
  pull_request:
    paths:
      - 'process/instagram_render_polling_snapshot.py'
      - 'instagram/campaigns/ipi_polling_snapshot_v1/**'
      - 'instagram/media_generators/horizontal_bar_chart/generator.py'
      - 'tests/test_instagram_polling_snapshot.py'
      - '.github/workflows/instagram_polling_snapshot*.yml'
  push:
    branches:
      - 'feature/ipi-first-instagram-post-*'
    paths:
      - 'process/instagram_render_polling_snapshot.py'
      - 'instagram/campaigns/ipi_polling_snapshot_v1/**'
      - 'instagram/media_generators/horizontal_bar_chart/generator.py'
      - 'tests/test_instagram_polling_snapshot.py'
      - '.github/workflows/instagram_polling_snapshot*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml pillow boto3 requests matplotlib

      - name: Compile polling campaign code
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall process/instagram_render_polling_snapshot.py instagram/media_generators/horizontal_bar_chart/generator.py tests/test_instagram_polling_snapshot.py

      - name: Run polling campaign regression test
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_instagram_polling_snapshot -v

      - name: Render fixture post as smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m process.instagram_render_polling_snapshot --campaign instagram/campaigns/ipi_polling_snapshot_v1/render_spec_fixture.yml
          test -s generated_posts/ipi_polling_snapshot_fixture/png/latest-party-support.png
          test -s generated_posts/ipi_polling_snapshot_fixture/caption.txt
          test -s generated_posts/ipi_polling_snapshot_fixture/review_manifest.json
