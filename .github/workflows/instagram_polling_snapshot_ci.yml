name: Instagram polling snapshot CI

on:
  pull_request:
    paths:
      - 'process/instagram_render_polling_snapshot.py'
      - 'process/instagram_build_polling_review_page.py'
      - 'instagram/campaigns/ipi_polling_snapshot_v1/**'
      - 'instagram/media_generators/horizontal_bar_chart/**'
      - 'instagram/media_generators/line_chart/**'
      - 'tests/test_instagram_polling_snapshot.py'
      - '.github/workflows/instagram_polling_snapshot*.yml'
  push:
    branches:
      - 'feature/ipi-web-preview-*'
    paths:
      - 'process/instagram_render_polling_snapshot.py'
      - 'process/instagram_build_polling_review_page.py'
      - 'instagram/campaigns/ipi_polling_snapshot_v1/**'
      - 'instagram/media_generators/horizontal_bar_chart/**'
      - 'instagram/media_generators/line_chart/**'
      - 'tests/test_instagram_polling_snapshot.py'
      - '.github/workflows/instagram_polling_snapshot*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml pillow boto3 requests matplotlib

      - name: Compile polling campaign code
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall process/instagram_render_polling_snapshot.py process/instagram_build_polling_review_page.py instagram/media_generators/horizontal_bar_chart instagram/media_generators/line_chart tests/test_instagram_polling_snapshot.py

      - name: Run polling carousel regression test
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_instagram_polling_snapshot -v

      - name: Render fixture carousel and browser review
        shell: bash
        run: |
          set -euo pipefail
          python -m process.instagram_render_polling_snapshot --campaign instagram/campaigns/ipi_polling_snapshot_v1/render_spec_fixture.yml
          for slide in \
            generated_posts/ipi_polling_snapshot_fixture/png/slide-01-latest-party-support.png \
            generated_posts/ipi_polling_snapshot_fixture/png/slide-02-change.png \
            generated_posts/ipi_polling_snapshot_fixture/png/slide-03-trend.png; do
            test -s "$slide"
          done
          python -m process.instagram_build_polling_review_page --output-root generated_posts/ipi_polling_snapshot_fixture
          test -s generated_posts/ipi_polling_snapshot_fixture/review/review_index.html
          python - <<'PY'
          from pathlib import Path
          page=Path('generated_posts/ipi_polling_snapshot_fixture/review/review_index.html').read_text(encoding='utf-8')
          assert page.count('data:image/png;base64,') == 3
          assert 'Source: Irish Polling Indicator (IPI)' in page
          assert 'Caption' in page
          print('Self-contained polling browser review validated.')
          PY
