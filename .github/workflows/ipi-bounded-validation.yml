name: Temporary IPI bounded validation

on:
  push:
    branches:
      - research/ipi-bounded-validation-20260903
    paths:
      - .github/workflows/ipi-bounded-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ipi-bounded-validation-20260903

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch pinned IPI files and detail anomalies
        run: |
          python - <<'PY'
          import csv
          import io
          import urllib.request
          from collections import Counter, defaultdict
          from datetime import date
          from pathlib import Path

          SHA = "09f77f03654bf66551a56fb02a11a242ae9bcf51"
          BASE = f"https://raw.githubusercontent.com/Irish-Polling-Indicator/ipi-data/{SHA}"

          def rows(name):
              with urllib.request.urlopen(f"{BASE}/{name}", timeout=30) as r:
                  text = r.read().decode("utf-8-sig")
              return list(csv.DictReader(io.StringIO(text)))

          def iso(s):
              return date.fromisoformat(s)

          raw = rows("data_polls.csv")
          ind = rows("data_pollingindicator.csv")
          out = [f"source_commit_sha={SHA}", "", "[raw_anomaly_details]"]

          full = defaultdict(list)
          for i, r in enumerate(raw, start=2):
              full[tuple(r.items())].append((i, r))
          for group in full.values():
              if len(group) > 1:
                  for line, r in group:
                      out.append(f"exact_duplicate=line:{line}|date:{r['date']}|pollster:{r['pollster']}|field:{r['date_start']}..{r['date_end']}|sample:{r['sample_size']}")

          keys = defaultdict(list)
          for i, r in enumerate(raw, start=2):
              k = (r["pollster"], r["date"], r["date_start"], r["date_end"], r["sample_size"])
              keys[k].append((i, r))
          for k, group in keys.items():
              if len(group) > 1:
                  out.append("candidate_key_duplicate=" + "|".join(map(str, k)) + "|lines:" + ",".join(str(x[0]) for x in group))

          for i, r in enumerate(raw, start=2):
              ds, de, dm, dp = map(iso, [r["date_start"], r["date_end"], r["date_middle"], r["date"]])
              if not (ds <= dm <= de):
                  out.append(f"midpoint_outside=line:{i}|date:{r['date']}|pollster:{r['pollster']}|start:{r['date_start']}|end:{r['date_end']}|middle:{r['date_middle']}")
              if de > dp:
                  out.append(f"field_end_after_publication=line:{i}|date:{r['date']}|pollster:{r['pollster']}|start:{r['date_start']}|end:{r['date_end']}|middle:{r['date_middle']}")

          out += ["", "[indicator_duplicate_dates]"]
          by_date = defaultdict(list)
          for i, r in enumerate(ind, start=2):
              by_date[r["date"]].append((i, r["cycle"]))
          for d, entries in by_date.items():
              if len(entries) > 1:
                  out.append(f"duplicate_date={d}|" + ";".join(f"line:{i},cycle:{cycle}" for i, cycle in entries))

          dates = sorted({iso(r["date"]) for r in ind})
          out += ["", "[indicator_calendar_gaps]"]
          for a, b in zip(dates, dates[1:]):
              days = (b-a).days
              if days > 1:
                  out.append(f"gap={a.isoformat()}|{b.isoformat()}|days:{days}")

          path = Path("tmp/ipi_validation_anomaly_details.txt")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text("\n".join(out) + "\n", encoding="utf-8")
          print(path.read_text())
          PY

      - name: Commit temporary anomaly details
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/ipi_validation_anomaly_details.txt
          git commit -m "research: record IPI anomaly details"
          git push
