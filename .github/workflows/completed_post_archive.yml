name: Completed post archive

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  POST_ID: 2026-10-03-bill-tracker-enacted-post2
  ASSET_REF: previews/bill-tracker-publication-post2
  ASSET_DIR: .
  SUMMARY_REF: main
  SUMMARY_PATH: completed_posts/summaries/2026-10-03-bill-tracker-enacted-post2.json
  BUCKET: eirepolitic-data
  PREFIX: instagram/previews/completed-posts/eirepolitic-data-pipeline

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out archive tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
      - name: Check out final assets
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSET_REF }}
          path: asset-source
      - name: Check out agent summary
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUMMARY_REF }}
          path: summary-source
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Validate and prepare immutable archive bundle
        run: |
          set -euo pipefail
          python tooling/tools/completed_post_archive.py prepare --source-dir "asset-source/${ASSET_DIR}" --summary "summary-source/${SUMMARY_PATH}" --out-dir archive-bundle --repo Eirepolitic-data-pipeline --post-id "$POST_ID"
      - name: Inspect existing completed archive
        id: existing
        run: |
          set -euo pipefail
          if aws s3 cp "s3://$BUCKET/$PREFIX/$POST_ID/provenance.json" existing-provenance.json --only-show-errors; then
            aws s3 cp "s3://$BUCKET/$PREFIX/$POST_ID/agent-summary.json" existing-summary.json --only-show-errors
            python - <<'PY'
          import json
          expected=json.load(open('archive-bundle/agent-summary.json', encoding='utf-8'))
          existing=json.load(open('existing-summary.json', encoding='utf-8'))
          assert existing == expected, 'completed archive exists with different agent summary'
          PY
            echo "completed=true" >> "$GITHUB_OUTPUT"
          else
            echo "completed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload recoverable archive content
        if: ${{ steps.existing.outputs.completed != 'true' }}
        run: aws s3 cp archive-bundle "s3://$BUCKET/$PREFIX/$POST_ID/" --recursive --exclude provenance.json --only-show-errors
      - name: Update repository archive index
        run: |
          set -euo pipefail
          aws s3 cp "s3://$BUCKET/$PREFIX/index.json" index.json --only-show-errors || printf '{"schema_version":1,"posts":[]}\n' > index.json
          python tooling/tools/completed_post_archive.py update-index --index index.json --summary archive-bundle/agent-summary.json --s3-uri "s3://$BUCKET/$PREFIX/$POST_ID/"
          aws s3 cp index.json "s3://$BUCKET/$PREFIX/index.json" --only-show-errors
      - name: Write completion marker
        if: ${{ steps.existing.outputs.completed != 'true' }}
        run: aws s3 cp archive-bundle/provenance.json "s3://$BUCKET/$PREFIX/$POST_ID/provenance.json" --only-show-errors
      - name: Verify completed archive
        run: |
          set -euo pipefail
          aws s3 cp "s3://$BUCKET/$PREFIX/$POST_ID/provenance.json" verify-provenance.json --only-show-errors
          aws s3 cp "s3://$BUCKET/$PREFIX/index.json" verify-index.json --only-show-errors
          POST_ID="$POST_ID" python - <<'PY'
          import json, os
          data=json.load(open('verify-index.json', encoding='utf-8'))
          assert any(x['post_id']==os.environ['POST_ID'] for x in data['posts'])
          print('completed archive and catalog verified')
          PY
