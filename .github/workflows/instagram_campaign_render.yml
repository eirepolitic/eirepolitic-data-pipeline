name: Instagram Campaign Render (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  first_stage_inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded analysis dependencies
        run: python -m pip install boto3 pandas
      - name: Resolve validated production batch and extract First Stage inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from instagram.factory.oireachtas_source import resolve_validated_production_batch, load_csv_tables

          batch = resolve_validated_production_batch()
          wanted = [
              'silver_bills', 'silver_bill_stages', 'silver_bill_sponsors',
              'silver_bill_debates', 'silver_speeches', 'silver_divisions', 'silver_member_votes'
          ]
          frames, lineage = load_csv_tables(batch, wanted)
          bills = frames['silver_bills'].copy()
          stages = frames['silver_bill_stages'].copy()

          def textcol(df, name):
              return df[name].fillna('').astype(str) if name in df.columns else pd.Series([''] * len(df), index=df.index)

          stages['_date'] = pd.to_datetime(textcol(stages, 'stage_date'), errors='coerce')
          stages['_order'] = pd.to_numeric(textcol(stages, 'order_in_bill'), errors='coerce').fillna(-1)
          latest = (stages.sort_values(['bill_id', '_date', '_order'], na_position='first')
                         .groupby('bill_id', as_index=False).tail(1))
          first = latest[textcol(latest, 'stage_name').str.contains('First Stage', case=False, na=False)].copy()
          first_ids = set(first['bill_id'].astype(str))
          bill_rows = bills[bills['bill_id'].astype(str).isin(first_ids)].copy()
          if 'bill_year' in bill_rows.columns:
              bill_rows = bill_rows[bill_rows['bill_year'].astype(str).eq('2026')]
              first_ids = set(bill_rows['bill_id'].astype(str))
              first = first[first['bill_id'].astype(str).isin(first_ids)]

          report = {
              'verified_at_utc': pd.Timestamp.utcnow().isoformat(),
              'source_batch_id': batch.batch_id,
              'source_pointer': batch.pointer,
              'batch_manifest_status': batch.manifest.get('status'),
              'lineage': lineage,
              'latest_first_stage_count_2026': len(first_ids),
              'bills': bill_rows.fillna('').to_dict(orient='records'),
              'latest_stage_rows': first.drop(columns=['_date','_order'], errors='ignore').fillna('').to_dict(orient='records'),
              'all_stage_rows': frames['silver_bill_stages'][frames['silver_bill_stages']['bill_id'].astype(str).isin(first_ids)].fillna('').to_dict(orient='records'),
              'sponsor_rows': frames['silver_bill_sponsors'][frames['silver_bill_sponsors']['bill_id'].astype(str).isin(first_ids)].fillna('').to_dict(orient='records'),
              'bill_debate_rows': frames['silver_bill_debates'][frames['silver_bill_debates']['bill_id'].astype(str).isin(first_ids)].fillna('').to_dict(orient='records'),
          }
          # Include divisions/member-vote table schemas and counts for procedural inspection without assuming a direct bill_id column.
          report['division_table'] = {'columns': list(frames['silver_divisions'].columns), 'row_count': len(frames['silver_divisions'])}
          report['member_vote_table'] = {'columns': list(frames['silver_member_votes'].columns), 'row_count': len(frames['silver_member_votes'])}
          report['speech_table'] = {'columns': list(frames['silver_speeches'].columns), 'row_count': len(frames['silver_speeches'])}

          out = Path('director/sessions/2026-10-03-bill-tracker-first-stage/production_inventory.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          print(json.dumps({
              'source_batch_id': batch.batch_id,
              'latest_first_stage_count_2026': len(first_ids),
              'titles': bill_rows.get('title', pd.Series(dtype=str)).tolist(),
          }, indent=2, ensure_ascii=False))
          PY
      - name: Commit inventory report to session branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director/sessions/2026-10-03-bill-tracker-first-stage/production_inventory.json
          git commit -m 'director: record live First Stage production inventory'
          git push origin HEAD:sly/session/2026-10-03-bill-tracker-first-stage
