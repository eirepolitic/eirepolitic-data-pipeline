name: Instagram Campaign Render (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  current_first_stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Extract unique current First Stage inventory from official API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from extract.oireachtas.client import OireachtasClient

          def deep_first(v, keys):
              if isinstance(v, dict):
                  for k in keys:
                      x=v.get(k)
                      if x is not None and not isinstance(x,(dict,list)) and str(x).strip(): return str(x).strip()
                  for x in v.values():
                      y=deep_first(x,keys)
                      if y:return y
              elif isinstance(v,list):
                  for x in v:
                      y=deep_first(x,keys)
                      if y:return y
              return ''

          client=OireachtasClient()
          unique={}
          for chamber,house_no in [('dail','34'),('seanad','27')]:
              r=client.get_json_summary('/legislation',params={'chamber':chamber,'house_no':house_no,'date_start':'2024-11-01','date_end':'2026-10-03','limit':200})
              if not r.ok or not r.payload: raise RuntimeError(r.error)
              for item in r.payload.get('results') or []:
                  b=item.get('bill') if isinstance(item,dict) and isinstance(item.get('bill'),dict) else item
                  if not isinstance(b,dict): continue
                  uri=b.get('uri') or b.get('billUri') or ''
                  recent=b.get('mostRecentStage')
                  stage=deep_first(recent,['showAs','stageName','name'])
                  status=str(b.get('status') or '')
                  if status.casefold()!='current' or 'first stage' not in stage.casefold(): continue
                  sponsors=[]
                  for sw in b.get('sponsors') or []:
                      s=sw.get('sponsor') if isinstance(sw,dict) and isinstance(sw.get('sponsor'),dict) else sw
                      n=deep_first(s,['showAs','name','roleName']) if isinstance(s,(dict,list)) else ''
                      if n and n not in sponsors:sponsors.append(n)
                  unique[uri]={
                      'bill_no':str(b.get('billNo') or b.get('billNumber') or ''),
                      'bill_year':str(b.get('billYear') or b.get('year') or ''),
                      'title':b.get('shortTitleEn') or b.get('longTitleEn') or b.get('showAs') or '',
                      'status':status,'origin_house':deep_first(b.get('originHouse'),['showAs','name']),
                      'sponsors':sponsors,'current_stage':stage,
                      'stage_date':deep_first(recent,['date']),
                      'last_updated':b.get('lastUpdated') or '', 'uri':uri,
                  }
          rows=sorted(unique.values(),key=lambda x:(int(x['bill_year'] or 0),int(x['bill_no'] or 0)))
          report={'verified_date':'2026-10-03','source':'https://api.oireachtas.ie/v1/legislation','count':len(rows),'bills':rows}
          p=Path('director/sessions/2026-10-03-bill-tracker-first-stage/current_first_stage_inventory.json')
          p.write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director/sessions/2026-10-03-bill-tracker-first-stage/current_first_stage_inventory.json
          git commit -m 'director: record filtered current First Stage inventory'
          git push origin HEAD:sly/session/2026-10-03-bill-tracker-first-stage
