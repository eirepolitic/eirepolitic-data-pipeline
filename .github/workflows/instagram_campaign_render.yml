name: Instagram Campaign Render (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  first_stage_live_verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded analysis dependencies
        run: python -m pip install requests
      - name: Fetch current official legislation state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from extract.oireachtas.client import OireachtasClient

          client = OireachtasClient()
          rows = []
          for chamber, house_no in [('dail','34'), ('seanad','27')]:
              summary = client.get_json_summary('/legislation', params={
                  'chamber': chamber,
                  'house_no': house_no,
                  'date_start': '2025-11-01',
                  'date_end': '2026-10-03',
                  'limit': 200,
              })
              if not summary.ok or not summary.payload:
                  raise RuntimeError(f'Official Oireachtas API failed for {chamber}/{house_no}: {summary.error}')
              for item in summary.payload.get('results') or []:
                  bill = item.get('bill') if isinstance(item, dict) and isinstance(item.get('bill'), dict) else item
                  if not isinstance(bill, dict):
                      continue
                  title = bill.get('shortTitleEn') or bill.get('longTitleEn') or bill.get('showAs') or bill.get('title')
                  bill_no = bill.get('billNo') or bill.get('billNumber')
                  bill_year = bill.get('billYear') or bill.get('year')
                  status = bill.get('status')
                  uri = bill.get('uri') or bill.get('billUri')
                  recent = bill.get('mostRecentStage')
                  stages = bill.get('stages') if isinstance(bill.get('stages'), list) else []
                  rows.append({
                      'query_chamber': chamber,
                      'query_house_no': house_no,
                      'bill_no': bill_no,
                      'bill_year': bill_year,
                      'title': title,
                      'status': status,
                      'uri': uri,
                      'most_recent_stage': recent,
                      'stages': stages,
                      'sponsors': bill.get('sponsors'),
                      'origin_house': bill.get('originHouse'),
                      'last_updated': bill.get('lastUpdated'),
                  })

          def texts(value):
              if isinstance(value, dict):
                  for k,v in value.items():
                      if str(k).lower() in {'showas','stagename','name','stageoutcome','outcome'} and not isinstance(v,(dict,list)):
                          yield str(v)
                      yield from texts(v)
              elif isinstance(value, list):
                  for v in value:
                      yield from texts(v)

          first_stage = []
          for row in rows:
              recent_text = ' | '.join(texts(row.get('most_recent_stage')))
              if 'first stage' in recent_text.lower():
                  first_stage.append(row)

          report = {
              'verified_date': '2026-10-03',
              'source': 'https://api.oireachtas.ie/v1/legislation',
              'queries': [
                  {'chamber':'dail','house_no':'34','date_start':'2025-11-01','date_end':'2026-10-03'},
                  {'chamber':'seanad','house_no':'27','date_start':'2025-11-01','date_end':'2026-10-03'},
              ],
              'first_stage_count': len(first_stage),
              'first_stage_bills': first_stage,
              'production_candidate_checks': [r for r in rows if str(r.get('bill_year')) == '2026' and str(r.get('bill_no')) in {'26','40','44','63','65','76','82'}],
          }
          out = Path('director/sessions/2026-10-03-bill-tracker-first-stage/official_live_inventory.json')
          out.write_text(json.dumps(report, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          print(json.dumps({'first_stage_count': len(first_stage), 'first_stage': [(r['bill_no'],r['title'],r['query_chamber']) for r in first_stage]}, indent=2, ensure_ascii=False))
          PY
      - name: Commit official verification report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director/sessions/2026-10-03-bill-tracker-first-stage/official_live_inventory.json
          git commit -m 'director: record current official First Stage inventory'
          git push origin HEAD:sly/session/2026-10-03-bill-tracker-first-stage
