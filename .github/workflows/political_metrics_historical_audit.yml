name: Political metrics historical audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/instagram-candidates-all-data-20260903
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run temporary Instagram research probe
        run: |
          mkdir -p diagnostics
          python process/tmp_instagram_research.py | tee diagnostics/tmp_instagram_research_output.txt
      - name: Persist probe output on analysis branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/tmp_instagram_research_output.txt diagnostics/pointer_member_check.json
          git commit -m "analysis: persist Instagram research output" || exit 0
          git push origin HEAD:analysis/instagram-candidates-all-data-20260903
