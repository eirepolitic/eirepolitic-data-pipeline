name: Political metrics historical audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bill-content-snapshot-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Render Bill Tracker prototype
        run: python process/render_bill_tracker_prototype.py

      - name: Persist prototype previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/campaigns/bill_tracker_v1/previews
          git commit -m "design: render Bill Tracker prototype previews" || exit 0
          git push origin HEAD:feature/bill-content-snapshot-v1
