name: Political metrics historical audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: political-metrics-historical-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      POLITICAL_METRICS_AUDIT_DIR: artifacts/political-metrics-audit
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test political metrics foundation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/political_metrics -p 'test_*.py'

      - name: Run read-only historical metrics audit
        shell: bash
        run: |
          set -euo pipefail
          python process/political_metrics_audit.py

      - name: Audit parliamentary-question / speech relationships
        shell: bash
        run: |
          set -euo pipefail
          python process/political_metrics_question_context_audit.py

      - name: Add plain-language audit summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/political-metrics-audit/summary.md ]; then
            cat artifacts/political-metrics-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/political-metrics-audit/question_context_summary.md ]; then
            cat artifacts/political-metrics-audit/question_context_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: political-metrics-historical-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/political-metrics-audit/
          if-no-files-found: error
          retention-days: 30
