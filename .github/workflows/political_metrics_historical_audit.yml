name: Political metrics historical audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bill-content-snapshot-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run focused Bill tracker tests
        run: |
          python -m unittest tests.political_metrics.test_bill_content_snapshot
          python -m unittest tests.political_metrics.test_bill_editorial_series

      - name: Build read-only Bill tracker and capture diagnostics
        run: |
          rm -rf diagnostics/bill-content-snapshot-test
          mkdir -p diagnostics/bill-content-snapshot-test
          set +e
          python process/build_bill_content_snapshot.py --batch-size 6 --lookback-days 180 --output-dir diagnostics/bill-content-snapshot-test > diagnostics/bill-content-snapshot-test/build.log 2>&1
          echo $? > diagnostics/bill-content-snapshot-test/exit_code.txt
          set -e

      - name: Persist validation output on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diagnostics/bill-content-snapshot-test
          git commit -m "test: persist scoped Bill tracker validation" || exit 0
          git push origin HEAD:feature/bill-content-snapshot-v1
