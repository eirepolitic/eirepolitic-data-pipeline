name: Political metrics historical audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-vote-visual-options
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run vote visual probe and capture output
        shell: bash
        run: |
          mkdir -p diagnostics/bill-vote-visual
          set +e
          python process/tmp_bill_vote_visual_probe.py > diagnostics/bill-vote-visual/output.txt 2>&1
          echo $? > diagnostics/bill-vote-visual/exit_code.txt
          set -e
      - name: Persist diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/bill-vote-visual
          git commit -m "analysis: persist bill vote visual probe" || exit 0
          git push origin HEAD:analysis/bill-vote-visual-options
