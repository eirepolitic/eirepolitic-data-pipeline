name: Political metrics historical audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/instagram-candidates-all-data-20260903
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run temporary Instagram research probe
        id: probe
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          python process/tmp_instagram_research.py > "diagnostics/probe_log_${GITHUB_RUN_ID}.txt" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist diagnostics through contents API
        shell: bash
        run: |
          set -euo pipefail
          for file in "diagnostics/probe_log_${GITHUB_RUN_ID}.txt" "diagnostics/member_speech_metrics_run_${GITHUB_RUN_ID}.json"; do
            [ -f "$file" ] || continue
            content="$(base64 -w0 "$file")"
            payload="$(jq -n --arg message "analysis: persist diagnostics ${GITHUB_RUN_ID}" --arg content "$content" --arg branch "analysis/instagram-candidates-all-data-20260903" '{message:$message,content:$content,branch:$branch}')"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${file}" --input - <<<"$payload"
          done
      - name: Fail if probe failed
        if: steps.probe.outputs.status != '0'
        run: exit 1
