name: Political metrics historical audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: 'false'
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/instagram-candidates-all-data-20260903
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run speech carousel evidence probe
        run: python process/tmp_instagram_research.py
      - name: Persist evidence through contents API
        shell: bash
        run: |
          set -euo pipefail
          file="diagnostics/speech_carousel_evidence_${GITHUB_RUN_ID}.json"
          content="$(base64 -w0 "$file")"
          payload="$(jq -n --arg message "analysis: persist speech carousel evidence ${GITHUB_RUN_ID}" --arg content "$content" --arg branch "analysis/instagram-candidates-all-data-20260903" '{message:$message,content:$content,branch:$branch}')"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${file}" --input - <<<"$payload"
