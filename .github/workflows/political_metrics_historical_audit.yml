name: Political metrics historical audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/member-reference-pointer-guard-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run batch pointer regression tests
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_oireachtas_batch_control
