name: Deploy Instagram Publisher Lambda

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reschedule-gate5-canary:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure bootstrap AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Assume High Director AWS administrator role
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          role_arn="arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin"
          credentials="$(aws sts assume-role \
            --role-arn "$role_arn" \
            --role-session-name github-high-director-${GITHUB_RUN_ID} \
            --duration-seconds 3600 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"
          echo "::add-mask::$secret_key"
          echo "::add-mask::$session_token"
          {
            echo "AWS_ACCESS_KEY_ID=$access_key"
            echo "AWS_SECRET_ACCESS_KEY=$secret_key"
            echo "AWS_SESSION_TOKEN=$session_token"
          } >> "$GITHUB_ENV"

      - name: Reschedule Gate 5 ledger record to 5:30 PM PDT
        run: |
          python -m pip install --quiet boto3
          python - <<'PY'
          import boto3
          from publishing.control import PublicationControlService
          from publishing.dynamodb_ledger import DynamoDBPublicationLedger

          table = boto3.resource('dynamodb', region_name='us-east-2').Table('eirepolitic-publications')
          control = PublicationControlService(DynamoDBPublicationLedger(table))
          record = control.reschedule(
              'instagram-scheduled-canary-20260926',
              scheduled_local='2026-09-26T17:30:00',
              timezone_name='America/Vancouver',
          )
          assert record.state == 'scheduled', record
          assert record.schedule is not None, record
          assert record.schedule.scheduled_at_utc == '2026-09-27T00:30:00Z', record.schedule
          print(record.schedule.scheduled_at_utc)
          PY

      - name: Recreate and verify EventBridge schedule at 5:30 PM PDT
        run: |
          set -euo pipefail
          function_arn="$(aws lambda get-function --function-name eirepolitic-instagram-publisher --query 'Configuration.FunctionArn' --output text)"
          role_arn="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerExecutionRoleArn'].OutputValue | [0]" --output text)"
          dlq_arn="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerDeadLetterQueueArn'].OutputValue | [0]" --output text)"
          schedule_name="instagram-instagram-scheduled-canary-20260926-v1"
          payload='{"expected_version":1,"publication_id":"instagram-scheduled-canary-20260926"}'

          aws scheduler delete-schedule --name "$schedule_name" --group-name eirepolitic-instagram --no-cli-pager 2>/dev/null || true
          target="$(FUNCTION_ARN="$function_arn" ROLE_ARN="$role_arn" DLQ_ARN="$dlq_arn" PAYLOAD="$payload" python - <<'PY'
          import json, os
          print(json.dumps({
              'Arn': os.environ['FUNCTION_ARN'],
              'RoleArn': os.environ['ROLE_ARN'],
              'Input': os.environ['PAYLOAD'],
              'DeadLetterConfig': {'Arn': os.environ['DLQ_ARN']},
              'RetryPolicy': {'MaximumEventAgeInSeconds': 3600, 'MaximumRetryAttempts': 3},
          }, separators=(',', ':')))
          PY
          )"

          aws scheduler create-schedule \
            --name "$schedule_name" \
            --group-name eirepolitic-instagram \
            --schedule-expression 'at(2026-09-27T00:30:00)' \
            --flexible-time-window '{"Mode":"OFF"}' \
            --action-after-completion DELETE \
            --target "$target" \
            --description 'Eirepolitic Instagram Gate 5 scheduled canary - rescheduled to 5:30 PM PDT' \
            --no-cli-pager

          aws scheduler get-schedule --name "$schedule_name" --group-name eirepolitic-instagram --no-cli-pager > schedule.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('schedule.json').read_text())
          assert value['ScheduleExpression'] == 'at(2026-09-27T00:30:00)', value
          assert value['State'] == 'ENABLED', value
          assert value['ActionAfterCompletion'] == 'DELETE', value
          print(json.dumps({
              'schedule_name': value['Name'],
              'state': value['State'],
              'schedule_expression': value['ScheduleExpression'],
              'action_after_completion': value['ActionAfterCompletion'],
              'verified': True,
          }, indent=2))
          PY
