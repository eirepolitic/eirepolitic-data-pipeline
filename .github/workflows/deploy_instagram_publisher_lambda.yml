name: Deploy Instagram Publisher Lambda

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Controlled AWS operation. Leave blank to use HIGH_DIRECTOR_AWS_OPERATION.
        required: false
        type: choice
        options:
          - deploy-lambda
          - deploy-ledger
          - deploy-scheduler-support
          - healthcheck
          - infrastructure-status

permissions:
  contents: read

env:
  OPERATION: ${{ inputs.operation || vars.HIGH_DIRECTOR_AWS_OPERATION || 'infrastructure-status' }}

jobs:
  operate:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure bootstrap AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Assume High Director AWS administrator role
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          role_arn="arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin"
          credentials="$(aws sts assume-role \
            --role-arn "$role_arn" \
            --role-session-name github-high-director-${GITHUB_RUN_ID} \
            --duration-seconds 3600 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)"

          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"
          echo "::add-mask::$secret_key"
          echo "::add-mask::$session_token"
          {
            echo "AWS_ACCESS_KEY_ID=$access_key"
            echo "AWS_SECRET_ACCESS_KEY=$secret_key"
            echo "AWS_SESSION_TOKEN=$session_token"
          } >> "$GITHUB_ENV"

      - name: Verify High Director AWS session
        run: |
          echo "operation=$OPERATION"
          aws sts get-caller-identity \
            --query '{Account:Account,Arn:Arn}' \
            --no-cli-pager

      - name: Build Lambda package
        if: ${{ env.OPERATION == 'deploy-lambda' }}
        run: |
          rm -rf lambda-package lambda-package.zip
          mkdir -p lambda-package/publishing
          cp publishing/__init__.py lambda-package/publishing/
          cp publishing/lambda_handler.py lambda-package/publishing/
          cd lambda-package
          zip -r ../lambda-package.zip publishing

      - name: Deploy Lambda code
        if: ${{ env.OPERATION == 'deploy-lambda' }}
        run: |
          aws lambda update-function-code \
            --function-name eirepolitic-instagram-publisher \
            --zip-file fileb://lambda-package.zip \
            --no-cli-pager
          aws lambda wait function-updated \
            --function-name eirepolitic-instagram-publisher

      - name: Configure repository Lambda handler
        if: ${{ env.OPERATION == 'deploy-lambda' }}
        run: |
          aws lambda update-function-configuration \
            --function-name eirepolitic-instagram-publisher \
            --handler publishing.lambda_handler.lambda_handler \
            --no-cli-pager
          aws lambda wait function-updated \
            --function-name eirepolitic-instagram-publisher

      - name: Verify deployed Lambda configuration
        if: ${{ env.OPERATION == 'deploy-lambda' }}
        run: |
          aws lambda get-function-configuration \
            --function-name eirepolitic-instagram-publisher \
            --query '{FunctionName:FunctionName,Runtime:Runtime,Handler:Handler,LastUpdateStatus:LastUpdateStatus}' \
            --no-cli-pager

      - name: Validate ledger template
        if: ${{ env.OPERATION == 'deploy-ledger' }}
        run: aws cloudformation validate-template --template-body file://infra/publishing/dynamodb.yml --no-cli-pager

      - name: Deploy publication ledger
        if: ${{ env.OPERATION == 'deploy-ledger' }}
        run: |
          aws cloudformation deploy \
            --stack-name eirepolitic-instagram-publication-ledger \
            --template-file infra/publishing/dynamodb.yml \
            --no-fail-on-empty-changeset \
            --no-cli-pager
          aws cloudformation describe-stacks \
            --stack-name eirepolitic-instagram-publication-ledger \
            --query 'Stacks[0].{Status:StackStatus,Outputs:Outputs}' \
            --no-cli-pager

      - name: Validate scheduler-support template
        if: ${{ env.OPERATION == 'deploy-scheduler-support' }}
        run: aws cloudformation validate-template --template-body file://infra/publishing/scheduler_support.yml --no-cli-pager

      - name: Deploy scheduler support
        if: ${{ env.OPERATION == 'deploy-scheduler-support' }}
        run: |
          aws cloudformation deploy \
            --stack-name eirepolitic-instagram-scheduler-support \
            --template-file infra/publishing/scheduler_support.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --no-cli-pager
          aws cloudformation describe-stacks \
            --stack-name eirepolitic-instagram-scheduler-support \
            --query 'Stacks[0].{Status:StackStatus,Outputs:Outputs}' \
            --no-cli-pager

      - name: Invoke read-only publisher healthcheck
        if: ${{ env.OPERATION == 'healthcheck' }}
        run: |
          aws lambda invoke \
            --function-name eirepolitic-instagram-publisher \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"healthcheck"}' \
            --query StatusCode \
            --output text \
            healthcheck-response.json
          python - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path('healthcheck-response.json').read_text(encoding='utf-8'))
          expected = {
              'meta_connected': True,
              'instagram_id_matches': True,
              'username_present': True,
              'publishing_enabled': False,
          }
          assert response.get('statusCode') == 200, response
          assert response.get('body') == expected, response
          print(json.dumps({'statusCode': 200, 'body': expected}, indent=2))
          PY

      - name: Show infrastructure status
        if: ${{ env.OPERATION == 'infrastructure-status' }}
        run: |
          for stack in \
            eirepolitic-instagram-publication-ledger \
            eirepolitic-instagram-scheduler-support
          do
            if aws cloudformation describe-stacks --stack-name "$stack" --no-cli-pager >/tmp/stack.json 2>/dev/null; then
              aws cloudformation describe-stacks \
                --stack-name "$stack" \
                --query 'Stacks[0].{StackName:StackName,Status:StackStatus,Outputs:Outputs}' \
                --no-cli-pager
            else
              echo "$stack: NOT_CREATED"
            fi
          done
