name: Temporary CSO PxStat bounded validation

on:
  push:
    branches:
      - docs/cso-pxstat-validation-20260903
    paths:
      - .github/workflows/cso-pxstat-bounded-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/cso-pxstat-validation-20260903

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch F4061 JSON-stat and CSV and calculate diagnostics
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import urllib.request
          from pathlib import Path

          URLS = {
              'jsonstat2': 'https://ws.cso.ie/public/api.restful/PxStat.Data.Cube_API.ReadDataset/F4061/JSON-stat/2.0/en',
              'jsonstat1': 'https://ws.cso.ie/public/api.restful/PxStat.Data.Cube_API.ReadDataset/F4061/JSON-stat/1.0/en',
              'csv': 'https://ws.cso.ie/public/api.restful/PxStat.Data.Cube_API.ReadDataset/F4061/CSV/1.0/en',
          }

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 EirePolitic research validation','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  body=r.read(); ctype=r.headers.get('Content-Type','')
              return body,ctype

          report=[]; bodies={}
          for name,url in URLS.items():
              try:
                  body,ctype=fetch(url); bodies[name]=body
                  report += [f'[{name}]',f'url={url}',f'bytes={len(body)}',f'content_type={ctype}',f'sha256={hashlib.sha256(body).hexdigest()}']
              except Exception as e:
                  report += [f'[{name}]',f'error={type(e).__name__}:{e}']

          if 'jsonstat2' in bodies:
              obj=json.loads(bodies['jsonstat2'].decode('utf-8-sig'))
              report += ['', '[jsonstat2_structure]', f'class={obj.get('class')}', f'label={obj.get('label')}', 'id='+('|'.join(obj.get('id',[]))), 'size='+('|'.join(str(x) for x in obj.get('size',[]))), f'value_count={len(obj.get('value',[])) if isinstance(obj.get('value'),list) else len(obj.get('value',{}))}', f'status_present={'status' in obj}']
              dims=obj.get('dimension',{})
              for dim_id in obj.get('id',[]):
                  d=dims.get(dim_id,{})
                  cat=d.get('category',{})
                  idx=cat.get('index',{})
                  if isinstance(idx,dict):
                      codes=sorted(idx,key=idx.get)
                  elif isinstance(idx,list):
                      codes=idx
                  else:
                      codes=[]
                  labels=cat.get('label',{})
                  report += [f'dimension={dim_id}',f'dimension_label={d.get("label")}',f'category_count={len(codes)}','category_code_sample='+'|'.join(str(x) for x in codes[:20]),'category_label_sample='+'|'.join(str(labels.get(x,'')) for x in codes[:20])]
              vals=obj.get('value',[])
              if isinstance(vals,list):
                  nulls=sum(v is None for v in vals)
                  numeric=[v for v in vals if isinstance(v,(int,float))]
                  report += [f'null_values={nulls}',f'numeric_values={len(numeric)}',f'numeric_min={min(numeric) if numeric else None}',f'numeric_max={max(numeric) if numeric else None}','value_sample='+'|'.join(str(v) for v in vals[:30])]

          if 'csv' in bodies:
              text=bodies['csv'].decode('utf-8-sig')
              reader=csv.DictReader(io.StringIO(text)); rows=list(reader); cols=reader.fieldnames
              report += ['', '[csv_structure]', f'rows={len(rows)}', f'columns={len(cols)}', 'header='+'|'.join(cols), f'exact_duplicate_extra_rows={len(rows)-len({tuple(r.get(c,'') for c in cols) for r in rows})}']
              for c in cols:
                  missing=sum((r.get(c) or '').strip()=='' for r in rows)
                  vals=[]; invalid=0
                  for r in rows:
                      s=(r.get(c) or '').strip()
                      if not s: continue
                      try: vals.append(float(s))
                      except ValueError: invalid+=1
                  report.append(f'column={c}|missing={missing}|numeric={len(vals)}|nonnumeric={invalid}|distinct={len(set(r.get(c,'') for r in rows))}')
              report += ['sample_rows='+json.dumps(rows[:5],ensure_ascii=False)]

          # Bounded cross-format value check using CSV numeric observation column vs JSON-stat populated values.
          if 'jsonstat2' in bodies and 'csv' in bodies:
              obj=json.loads(bodies['jsonstat2'].decode('utf-8-sig'))
              vals=obj.get('value',[])
              numeric_json=[float(v) for v in vals if isinstance(v,(int,float))] if isinstance(vals,list) else []
              text=bodies['csv'].decode('utf-8-sig'); rr=list(csv.DictReader(io.StringIO(text)))
              numeric_cols=[]
              for c in rr[0].keys() if rr else []:
                  good=[]; bad=0
                  for r in rr:
                      s=(r.get(c) or '').strip()
                      if not s: continue
                      try: good.append(float(s))
                      except ValueError: bad+=1
                  if good and bad==0: numeric_cols.append((c,good))
              report += ['', '[cross_format]', 'all_numeric_csv_columns='+'|'.join(c for c,_ in numeric_cols)]
              for c,good in numeric_cols:
                  if len(good)==len(numeric_json):
                      report.append(f'candidate_value_column={c}|length_match=True|sequence_equal={good==numeric_json}')

          out=Path('tmp/cso_pxstat_validation_report.txt')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text('\n'.join(report)+'\n',encoding='utf-8')
          print(out.read_text())
          PY

      - name: Commit temporary validation report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/cso_pxstat_validation_report.txt
          git commit -m 'research: record temporary CSO PxStat diagnostics' || exit 0
          git push