name: Completed post reference

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUCKET: eirepolitic-data
      PREFIX: instagram/previews/completed-posts/eirepolitic-data-pipeline/2026-09-06-ipi-polling-carousel/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-tracker-approved-reference
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: List approved bundle objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/completed-post-reference/selected
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$PREFIX" > diagnostics/completed-post-reference/selected/object-list.json
      - name: Persist object list
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/completed-post-reference/selected/object-list.json
          git commit -m "analysis: persist approved polling object list" || exit 0
          git push origin HEAD:analysis/bill-tracker-approved-reference
