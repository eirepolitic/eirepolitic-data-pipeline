name: Completed post reference

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUCKET: eirepolitic-data
      ROOT: instagram/previews/completed-posts/eirepolitic-data-pipeline/2026-09-06-ipi-polling-carousel/assets
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-tracker-approved-reference
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Fetch approved finished assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/completed-post-reference/selected/assets
          for f in slide-01.png slide-02.png slide-03.png slide-04.png contact-sheet.jpg caption.txt manifest.json; do
            aws s3 cp "s3://$BUCKET/$ROOT/$f" "diagnostics/completed-post-reference/selected/assets/$f" --only-show-errors
          done
      - name: Persist finished assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/completed-post-reference/selected/assets
          git commit -m "analysis: persist approved polling finished assets" || exit 0
          git push origin HEAD:analysis/bill-tracker-approved-reference
