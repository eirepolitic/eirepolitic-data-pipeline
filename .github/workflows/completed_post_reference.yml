name: Completed post reference

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUCKET: eirepolitic-data
      PREFIX: instagram/previews/completed-posts/eirepolitic-data-pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-tracker-approved-reference
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Fetch archive catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/completed-post-reference
          aws s3 cp "s3://$BUCKET/$PREFIX/index.json" diagnostics/completed-post-reference/index.json --only-show-errors
      - name: Persist catalog on analysis branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/completed-post-reference/index.json
          git commit -m "analysis: persist completed-post archive index" || exit 0
          git push origin HEAD:analysis/bill-tracker-approved-reference
