name: Publish Reviewed Party Assets v1

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Upload reviewed party asset v1 bundle to S3"
        required: true
        default: "false"

concurrency:
  group: party-assets-v1-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: eirepolitic-data
      PARTY_ASSET_PREFIX: processed/reference/party_assets/v1

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate registry and upload safeguards
        run: >-
          python -m unittest
          tests.test_party_assets
          tests.test_party_assets_upload
          -v

      - name: Build reviewed 11-party reference bundle
        run: python -m process.party_assets_finalize --output-root generated_party_assets_v1

      - name: Verify bundle contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('generated_party_assets_v1')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['success'] is True
          assert manifest['party_count'] == 11
          for party in manifest['parties']:
              key = party['party_key']
              for name in ('logo.png', 'logo_clean.png', 'display_square.png'):
                  path = root / 'assets' / key / name
                  assert path.is_file() and path.stat().st_size > 0, path
          assert (root / 'party_assets.csv').is_file()
          assert (root / 'party_assets.parquet').is_file()
          print('11-party bundle contract verified')
          PY

      - name: Dry-run S3 publication
        run: >-
          python process/party_assets_upload.py
          --build-root generated_party_assets_v1
          --bucket "${S3_BUCKET}"
          --prefix "${PARTY_ASSET_PREFIX}"
          > generated_party_assets_v1/upload_dry_run.json

      - name: Upload reviewed v1 bundle
        if: ${{ inputs.apply == 'true' }}
        run: >-
          python process/party_assets_upload.py
          --build-root generated_party_assets_v1
          --bucket "${S3_BUCKET}"
          --prefix "${PARTY_ASSET_PREFIX}"
          --apply
          > generated_party_assets_v1/upload_applied.json

      - name: Verify uploaded known objects
        if: ${{ inputs.apply == 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import boto3
          root = Path('generated_party_assets_v1')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          bucket = os.environ['S3_BUCKET']
          prefix = os.environ['PARTY_ASSET_PREFIX'].rstrip('/')
          s3 = boto3.client('s3', region_name=os.getenv('AWS_REGION', 'ca-central-1'))
          keys = [
              f'{prefix}/manifest.json',
              f'{prefix}/party_assets.csv',
              f'{prefix}/party_assets.parquet',
              f'{prefix}/contact_sheet.png',
              f'{prefix}/contact_sheet_green.png',
          ]
          for party in manifest['parties']:
              key = party['party_key']
              keys.extend([
                  f'{prefix}/assets/{key}/logo.png',
                  f'{prefix}/assets/{key}/logo_clean.png',
                  f'{prefix}/assets/{key}/display_square.png',
              ])
          for key in keys:
              response = s3.head_object(Bucket=bucket, Key=key)
              assert response['ContentLength'] > 0, key
          report = {'bucket': bucket, 'prefix': prefix, 'verified_count': len(keys), 'verified_keys': keys}
          (root / 'upload_verification.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          echo '## Party Assets v1' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Target: `s3://eirepolitic-data/processed/reference/party_assets/v1/`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Consumer asset: `assets/{party_key}/logo.png`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Display square: `assets/{party_key}/display_square.png`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Clean master: `assets/{party_key}/logo_clean.png`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canvas: `1600x1600`, white' >> "$GITHUB_STEP_SUMMARY"
          echo '- Green circle sheet is review-only.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Apply requested: `${{ inputs.apply }}`' >> "$GITHUB_STEP_SUMMARY"

      - name: Retain build and publication reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: party-assets-v1-publication
          path: generated_party_assets_v1/
          if-no-files-found: warn
          retention-days: 14
