name: Temporary recurring source ranking update

on:
  push:
    branches:
      - docs/official-recurring-data-validation-20260903
    paths:
      - .github/workflows/official-recurring-summary-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/official-recurring-data-validation-20260903

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update master political-data research summaries
        run: |
          python - <<'PY'
          from pathlib import Path

          master = Path('docs/research/irish_political_data_sources.md')
          text = master.read_text(encoding='utf-8')

          marker = '# Example recurring EirePolitic feature ideas\n'
          section = '''# Near-next recurring official sources — validated 2026-09-03\n\nTwo additional official recurring sources were validated after the original top-five programme. Durable findings are in `official_recurring_data_validation.md`.\n\n## eTenders procurement open data\n\n- **Readiness:** Ready for a bounded non-production prototype.\n- **Access:** Direct quarterly CSV, no authentication.\n- **Licence:** CC BY 4.0.\n- **Validated snapshot:** 87,427 rows, 31 columns, no exact duplicate rows, coverage through 30 June 2026.\n- **Main caveats:** sparse award/value/supplier fields; authority and supplier-name normalization; framework/mini-competition grain; Circular 05/2023 creates a historical completeness break.\n- **Editorial value:** High for procurement transparency, supplier concentration, award/public-body rankings and SME participation.\n\n## Department of Finance monthly tax receipts\n\n- **Readiness:** High editorial value, but machine access needs remediation before prototyping.\n- **Coverage:** official service still states January 1984 to present, monthly, published on the second working day of the next month.\n- **Licence:** CC BY 4.0.\n- **Access issue:** the advertised legacy databank CSV endpoint failed TLS certificate verification in automated validation; no certificate bypass was attempted.\n- **Decision:** keep high priority, but request/confirm a stable TLS-valid official machine endpoint before implementation.\n- **FIQ02:** retain as a useful structured historical Exchequer source, not as a verified replacement for the current monthly tax feed.\n\n## Revised next prototype tier\n\nAfter the already-validated top five, the next technical prototype order is:\n\n1. **eTenders procurement open data** — ready now.\n2. **Department of Finance monthly tax receipts** — only after stable machine access is confirmed.\n3. **FIQ02 historical Exchequer series** — supplementary fiscal-history source if a historical quarterly feature is desired.\n\nProduction changes: none.\n\n'''
          if section not in text and marker in text:
              text = text.replace(marker, section + marker, 1)

          old_near = '**Near-next choices:** eTenders procurement and Department of Finance monthly tax receipts are both strong, openly licensed recurring-data candidates after the top-five programme.\n'
          new_near = '**Near-next choices after exact validation:** eTenders procurement is ready for a bounded prototype. Department of Finance monthly tax receipts remains high-value but should wait for a stable official TLS-valid machine endpoint; FIQ02 is supplementary historical fiscal context, not a current monthly replacement.\n'
          text = text.replace(old_near, new_near)
          master.write_text(text, encoding='utf-8')

          feas = Path('docs/research/irish_political_data_ingestion_feasibility.md')
          f = feas.read_text(encoding='utf-8')
          marker2 = '# Evidence references\n'
          add = '''# Near-next validation update\n\nThe two previously noted near-next recurring sources were subsequently validated:\n\n| Source | Result | Main safeguard |\n| --- | --- | --- |\n| eTenders procurement | Ready for bounded prototype | Normalize authority/supplier entities in derived fields; account for missing awards and the 2023 publication-rule break |\n| Department of Finance monthly tax receipts | Defer prototype until access is fixed/confirmed | Legacy advertised CSV endpoint fails TLS validation in automation; require a stable official machine endpoint |\n| FIQ02 historical Exchequer | Ready as supplementary historical source | Do not treat as a current monthly tax-receipts replacement |\n\nSee `official_recurring_data_validation.md` for exact diagnostics.\n\n'''
          if add not in f and marker2 in f:
              f = f.replace(marker2, add + marker2, 1)
          feas.write_text(f, encoding='utf-8')
          PY

      - name: Commit summary updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/irish_political_data_sources.md docs/research/irish_political_data_ingestion_feasibility.md
          git commit -m 'docs: update recurring political data rankings' || exit 0
          git push