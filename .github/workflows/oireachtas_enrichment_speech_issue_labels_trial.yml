name: Oireachtas Speech Issue Labels Readiness (Legacy Alias)

on:
  workflow_dispatch:

concurrency:
  group: oireachtas-enrichment-speech-issue-labels-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unified classifier readiness inventory
        run: |
          set -euo pipefail
          python -m process.oireachtas_speech_issue_classifier \
            --mode readiness \
            --model gpt-5.6-luna \
            --report-path speech_issue_classifier_report.json
      - name: Explain migration
        run: |
          {
            echo '## Speech issue enrichment workflow migrated'
            echo
            echo 'This workflow is a read-only alias for the unified classifier readiness inventory.'
            echo 'It does not rebuild enrichment data from the legacy classified CSV.'
            echo 'Use `Unified Speech Issue Classifier (Manual)` for tests or complete candidate creation.'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: speech-issue-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: speech_issue_classifier_report.json
          if-no-files-found: error
          retention-days: 90
