name: Cancel Duplicate Speech Backfill Run

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate queued accelerator
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: '33430288283'
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/cancel" || true
          echo "cancel_requested=${TARGET_RUN_ID}"
