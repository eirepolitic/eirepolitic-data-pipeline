name: Speech Classifier Backfill Checkpoint Inspector

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_BATCH_ID: speech-classifier-backfill-2026-08-31
      OIREACHTAS_PUBLISH_LATEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install boto3 pandas
      - name: Inspect checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import boto3
          from process.oireachtas_speech_issue_classifier import ENRICHMENT_CSV_KEY, read_s3_csv
          s3 = boto3.client('s3', region_name='ca-central-1')
          df = read_s3_csv(s3, bucket='eirepolitic-data', key=ENRICHMENT_CSV_KEY)
          status = df['classification_status'].fillna('').value_counts().to_dict()
          sources = df['issue_label_source'].fillna('').value_counts().to_dict()
          report = {
              'rows': len(df),
              'status_counts': status,
              'source_counts': sources,
              'model_rows': int((df['issue_label_source'] == 'openai_model').sum()),
              'pending_rows': int((df['classification_status'] == 'pending').sum()),
              'failed_rows': int((df['classification_status'] == 'failed').sum()),
              'max_debate_date': str(df['debate_date'].max()),
          }
          Path('diagnostics/speech_classifier/backfill_checkpoint_status.json').write_text(json.dumps(report, indent=2, sort_keys=True)+'\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Commit compact status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/speech_classifier/backfill_checkpoint_status.json
          git commit -m "Record backfill checkpoint status" || true
          git push || true
