name: Speech Classifier Backfill Accelerator

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  accelerate:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
      OIREACHTAS_BATCH_ID: speech-classifier-backfill-2026-08-31
      OIREACHTAS_PUBLISH_LATEST: 'true'
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      PRIOR_RUN_ID: '33428853974'
    steps:
      - name: Cancel conservative rollout worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PRIOR_RUN_ID}/cancel" || true
          for i in $(seq 1 30); do
            status=$(curl --fail-with-body -sS -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PRIOR_RUN_ID}" \
              | python -c "import json,sys; print(json.load(sys.stdin)['status'])")
            echo "prior_run_status=${status}"
            [[ "$status" == 'completed' ]] && break
            sleep 2
          done
          [[ "$status" == 'completed' ]]
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'openai>=3.6.0,<4'
      - name: Resume classifier from checkpoint at higher concurrency
        run: |
          set -euo pipefail
          success=false
          for pass in 1 2 3 4; do
            echo "=== accelerated classifier pass ${pass} ==="
            if python -m process.oireachtas_speech_issue_backfill \
              --model "${OPENAI_MODEL}" \
              --concurrency 12 \
              --checkpoint-every 250 \
              --bucket "${S3_BUCKET}" \
              --region "${AWS_REGION}" \
              --report-path speech_issue_backfill_report.json; then
              success=true
              break
            fi
            echo "Accelerated pass ${pass} left failed rows; resuming checkpoint."
          done
          [[ "$success" == true ]]
      - name: Validate complete candidate
        run: |
          python -m process.oireachtas_speech_issue_validate_candidate \
            --bucket "${S3_BUCKET}" \
            --region "${AWS_REGION}" \
            --report-path speech_issue_candidate_validation.json
      - name: Assemble candidate
        run: |
          OIREACHTAS_PUBLISH_LATEST=false python process/oireachtas_batch_control.py \
            --bucket "${S3_BUCKET}" \
            --region "${AWS_REGION}" \
            assemble \
            --batch-id "${OIREACHTAS_BATCH_ID}" \
            --required-table enrichment_speech_issue_labels \
            | tee speech_issue_batch_manifest.json
      - name: Promote candidate
        run: |
          OIREACHTAS_PUBLISH_ENABLED=true OIREACHTAS_PUBLISH_LATEST=true \
            python process/oireachtas_batch_control.py \
              --bucket "${S3_BUCKET}" \
              --region "${AWS_REGION}" \
              promote \
              --batch-id "${OIREACHTAS_BATCH_ID}" \
              | tee speech_issue_promotion.json
      - name: Verify production
        run: |
          env -u OIREACHTAS_BATCH_ID -u OIREACHTAS_PUBLISH_LATEST -u OIREACHTAS_PUBLISH_ENABLED \
            python - <<'PY'
          import json
          import boto3
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY
          from process.oireachtas_speech_issue_classifier import ENRICHMENT_CSV_KEY, SILVER_SPEECHES_KEY, read_s3_csv
          s3 = boto3.client('s3', region_name='ca-central-1')
          pointer = json.loads(s3.get_object(Bucket='eirepolitic-data', Key=PRODUCTION_POINTER_KEY)['Body'].read())
          assert pointer.get('batch_id') == 'speech-classifier-backfill-2026-08-31', pointer
          silver = read_s3_csv(s3, bucket='eirepolitic-data', key=SILVER_SPEECHES_KEY)
          enrich = read_s3_csv(s3, bucket='eirepolitic-data', key=ENRICHMENT_CSV_KEY)
          assert len(silver) == len(enrich)
          assert not enrich['classification_status'].isin(['pending','failed']).any()
          assert enrich['issue_label'].astype(str).str.strip().ne('').all()
          print(json.dumps({'status':'pass','production_batch_id':pointer['batch_id'],'rows':len(enrich),'max_debate_date':str(enrich['debate_date'].max())}, indent=2))
          PY
      - name: Upload rollout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speech-classifier-accelerated-rollout-${{ github.run_id }}
          path: |
            speech_issue_backfill_report.json
            speech_issue_candidate_validation.json
            speech_issue_batch_manifest.json
            speech_issue_promotion.json
          if-no-files-found: warn
          retention-days: 365
