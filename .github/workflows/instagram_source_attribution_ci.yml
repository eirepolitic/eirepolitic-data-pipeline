name: Instagram source attribution CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'instagram/renderer/attribution.py'
      - 'instagram/renderer/render.py'
      - 'tests/test_instagram_source_attribution.py'
      - '.github/workflows/instagram_source_attribution_ci.yml'
  push:
    branches:
      - 'feature/ipi-mandatory-attribution-*'
    paths:
      - 'instagram/renderer/attribution.py'
      - 'instagram/renderer/render.py'
      - 'tests/test_instagram_source_attribution.py'
      - '.github/workflows/instagram_source_attribution_ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml pillow boto3 requests matplotlib

      - name: Compile attribution and renderer modules
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall instagram/renderer/attribution.py instagram/renderer/render.py tests/test_instagram_source_attribution.py

      - name: Run attribution regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_instagram_source_attribution -v
