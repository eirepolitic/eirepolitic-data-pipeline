name: Deploy Written PQ answer foundations

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ca-central-1
  AWS_REGION: ca-central-1
  S3_BUCKET: eirepolitic-data
  BATCH_ID: written-pq-answers-20260905-1
  PYTHONPATH: .

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run Written PQ answer tests
        run: |
          python -m py_compile political_metrics/written_question_answers.py
          python -m py_compile process/political_metrics_written_question_answers_candidate.py
          python -m pytest -q tests/political_metrics/test_written_question_answers.py tests/political_metrics/test_candidate_materialization.py
      - name: Seed complete candidate from current production
        run: python process/oireachtas_seed_candidate.py --batch-id "$BATCH_ID"
      - name: Build and audit full Written PQ answer history
        run: |
          python process/political_metrics_written_question_answers_candidate.py \
            --batch-id "$BATCH_ID" \
            --workers 4 \
            --document-chunk-size 4 \
            --report-path written_pq_answer_candidate_report.json
      - name: Assemble complete candidate manifest
        run: |
          python process/oireachtas_batch_control.py assemble \
            --batch-id "$BATCH_ID" \
            --required-table political_metrics_written_question_answer_sections \
            --required-table political_metrics_written_question_answer_bridge
      - name: Promote validated candidate atomically
        env:
          OIREACHTAS_PUBLISH_ENABLED: 'true'
          OIREACHTAS_PUBLISH_LATEST: 'true'
        run: python process/oireachtas_batch_control.py promote --batch-id "$BATCH_ID"
      - name: Post-promotion Written PQ answer audit
        run: |
          python - <<'PY'
          import io,json,os
          from pathlib import Path
          import boto3,pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY,read_json_required,resolve_production_key
          from political_metrics.written_question_answers import audit_written_answer_foundations

          s3=boto3.client('s3',region_name=os.environ['AWS_REGION']); bucket=os.environ['S3_BUCKET']; expected=os.environ['BATCH_ID']
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          if pointer.get('batch_id') != expected:
              raise RuntimeError(f"production pointer is {pointer.get('batch_id')!r}, expected {expected!r}")

          def read(logical):
              key=resolve_production_key(s3,bucket=bucket,production_key=logical)
              return pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=key)['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])

          questions=read('processed/oireachtas_unified/latest/csv/silver_questions.csv')
          written=questions[questions['question_type'].fillna('').astype(str).str.strip().str.lower().eq('written')].copy()
          sections=read('processed/oireachtas_unified/latest/metrics/event/written_question_answer_sections/csv/written_question_answer_sections.csv')
          bridge=read('processed/oireachtas_unified/latest/metrics/event/written_question_answer_bridge/csv/written_question_answer_bridge.csv')
          for col in ['grouped_answer','referred_or_direct_reply']:
              sections[col]=sections[col].fillna('').astype(str).str.lower().isin(['true','1','yes'])
          audit=audit_written_answer_foundations(written_questions=written,answer_sections=sections,question_bridge=bridge,parse_failures=[])
          if not audit.get('ready'):
              raise RuntimeError(f'post-promotion Written PQ answer audit failed: {audit}')
          if len(sections) != written['debate_section_id'].nunique(dropna=True):
              raise RuntimeError(f"answer-section count {len(sections)} != unique Written debate sections {written['debate_section_id'].nunique(dropna=True)}")
          if not sections['source_batch_id'].fillna('').eq(expected).all() or not bridge['source_batch_id'].fillna('').eq(expected).all():
              raise RuntimeError('source_batch_id mismatch in live Written PQ answer foundations')
          if sections['source_document_url'].fillna('').eq('').any():
              raise RuntimeError('blank source_document_url in live answer sections')
          if sections['source_document_sha256'].fillna('').eq('').any() or sections['source_section_sha256'].fillna('').eq('').any():
              raise RuntimeError('blank source hash in live answer sections')
          report={
            'production_batch_id':expected,
            'written_question_rows':int(len(written)),
            'answer_section_rows':int(len(sections)),
            'bridge_rows':int(len(bridge)),
            'unique_source_documents':int(sections['source_document_url'].nunique()),
            'section_file_fallback_rows':int(sections['source_document_url'].eq(sections['source_xml_url']).sum()),
            'audit':audit,
            'production_pointer':pointer,
          }
          Path('written_pq_answer_post_promotion_audit.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: written-pq-answer-foundation-deployment-${{ github.run_id }}
          path: |
            written_pq_answer_candidate_report.json
            written_pq_answer_post_promotion_audit.json
          if-no-files-found: error
          retention-days: 90
