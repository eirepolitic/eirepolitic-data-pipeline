name: Oireachtas reusable refresh

on:
  workflow_call:
    inputs:
      refresh_type: {required: true, type: string}
      mode: {required: false, type: string, default: ""}
      tables: {required: false, type: string, default: ""}
      chamber: {required: false, type: string, default: dail}
      house_no: {required: false, type: string, default: "34"}
      date_start: {required: false, type: string, default: ""}
      date_end: {required: false, type: string, default: ""}
      page_size: {required: false, type: string, default: ""}
      sample_rows: {required: false, type: string, default: "10"}
      batch_id: {required: true, type: string}
      publish_candidate: {required: false, type: boolean, default: false}
      seed_from_production: {required: false, type: boolean, default: false}
      classify_speeches: {required: false, type: boolean, default: false}
      speech_classifier_model: {required: false, type: string, default: gpt-5.6-luna}
    outputs:
      batch_id: {value: "${{ jobs.refresh.outputs.batch_id }}"}
      tables: {value: "${{ jobs.refresh.outputs.tables }}"}
      status: {value: "${{ jobs.refresh.outputs.status }}"}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: oireachtas-production-refresh
      cancel-in-progress: false
    outputs:
      batch_id: ${{ steps.result.outputs.batch_id }}
      tables: ${{ steps.inputs.outputs.tables }}
      status: ${{ steps.result.outputs.status }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      REVIEW_OUTPUT_ROOT: oireachtas_review_output
      OIREACHTAS_BATCH_ID: ${{ inputs.batch_id }}
      OIREACHTAS_PUBLISH_ENABLED: 'false'
      OIREACHTAS_PUBLISH_LATEST: ${{ inputs.publish_candidate && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Normalize and validate refresh inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.seed_from_production }}' == 'true' && '${{ inputs.publish_candidate }}' != 'true' ]]; then
            echo 'seed_from_production requires publish_candidate=true' >&2
            exit 2
          fi
          if [[ '${{ inputs.classify_speeches }}' == 'true' && '${{ inputs.publish_candidate }}' != 'true' ]]; then
            echo 'classify_speeches requires publish_candidate=true so outputs remain candidate-scoped' >&2
            exit 2
          fi
          python process/oireachtas_refresh_inputs.py \
            --refresh-type '${{ inputs.refresh_type }}' \
            --mode '${{ inputs.mode }}' \
            --tables '${{ inputs.tables }}' \
            --chamber '${{ inputs.chamber }}' \
            --house-no '${{ inputs.house_no }}' \
            --date-start '${{ inputs.date_start }}' \
            --date-end '${{ inputs.date_end }}' \
            --page-size '${{ inputs.page_size }}' \
            --sample-rows '${{ inputs.sample_rows }}' \
            --github-output "${GITHUB_OUTPUT}" \
            | tee oireachtas_refresh_inputs.json
      - name: Validate batch identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${OIREACHTAS_BATCH_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
      - name: Seed complete candidate from production
        if: inputs.seed_from_production
        shell: bash
        run: |
          set -euo pipefail
          OIREACHTAS_PUBLISH_LATEST=false \
            python process/oireachtas_seed_candidate.py \
              --batch-id "${OIREACHTAS_BATCH_ID}" \
              --bucket "${S3_BUCKET}" \
              --region "${AWS_REGION}" \
              | tee oireachtas_seed_candidate.json
      - name: Build refresh table set
        shell: bash
        env:
          MODE: ${{ steps.inputs.outputs.mode }}
          TABLES: ${{ steps.inputs.outputs.tables }}
          CHAMBER: ${{ steps.inputs.outputs.chamber }}
          HOUSE_NO: ${{ steps.inputs.outputs.house_no }}
          DATE_START: ${{ steps.inputs.outputs.date_start }}
          DATE_END: ${{ steps.inputs.outputs.date_end }}
          PAGE_SIZE: ${{ steps.inputs.outputs.page_size }}
          SAMPLE_ROWS: ${{ steps.inputs.outputs.sample_rows }}
        run: |
          set -euo pipefail
          : > oireachtas_refresh.log
          IFS=',' read -ra table_list <<< "${TABLES}"
          for table in "${table_list[@]}"; do
            table="${table//[[:space:]]/}"
            [[ -n "${table}" ]]
            echo "===== TABLE ${table} =====" | tee -a oireachtas_refresh.log
            python -m extract.oireachtas.build_table \
              --table "${table}" \
              --mode "${MODE}" \
              --publish-latest '${{ inputs.publish_candidate && 'true' || 'false' }}' \
              --batch-id "${OIREACHTAS_BATCH_ID}" \
              --chamber "${CHAMBER}" \
              --house-no "${HOUSE_NO}" \
              --date-start "${DATE_START}" \
              --date-end "${DATE_END}" \
              --limit "${PAGE_SIZE}" \
              --sample-rows "${SAMPLE_ROWS}" \
              --write-review-sample \
              --s3-bucket "${S3_BUCKET}" \
              --aws-region "${AWS_REGION}" \
              --review-root "${REVIEW_OUTPUT_ROOT}" \
              --github-repository "${GITHUB_REPOSITORY}" \
              2>&1 | tee -a oireachtas_refresh.log
          done
      - name: Classify unified speech issue enrichment
        if: inputs.publish_candidate && (inputs.classify_speeches || steps.inputs.outputs.changes_speeches == 'true')
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.speech_classifier_model }}
        run: |
          set -euo pipefail
          python -m pip install 'openai>=3.6.0,<4'
          success=false
          for pass in 1 2 3 4; do
            echo "=== speech classifier pass ${pass} ==="
            if python -m process.oireachtas_speech_issue_backfill \
              --model "${OPENAI_MODEL}" \
              --concurrency 4 \
              --checkpoint-every 100 \
              --bucket "${S3_BUCKET}" \
              --region "${AWS_REGION}" \
              --report-path speech_issue_classifier_report.json; then
              success=true
              break
            fi
            echo "Classifier pass ${pass} left failed rows; resuming from checkpoint."
          done
          [[ "$success" == true ]]
      - name: Build political metrics inside candidate batch
        if: inputs.publish_candidate
        shell: bash
        run: |
          set -euo pipefail
          python process/political_metrics_materialize_candidate.py \
            --batch-id "${OIREACHTAS_BATCH_ID}" \
            --bucket "${S3_BUCKET}" \
            --region "${AWS_REGION}" \
            --report-path political_metrics_candidate_report.json
      - name: Assemble candidate batch manifest
        if: inputs.publish_candidate
        shell: bash
        env:
          TABLES: ${{ steps.inputs.outputs.tables }}
        run: |
          set -euo pipefail
          args=(--bucket "${S3_BUCKET}" --region "${AWS_REGION}" assemble --batch-id "${OIREACHTAS_BATCH_ID}")
          IFS=',' read -ra table_list <<< "${TABLES}"
          for table in "${table_list[@]}"; do
            table="${table//[[:space:]]/}"
            args+=(--required-table "${table}")
          done
          if [[ '${{ inputs.classify_speeches }}' == 'true' || '${{ steps.inputs.outputs.changes_speeches }}' == 'true' ]]; then
            args+=(--required-table enrichment_speech_issue_labels)
          fi
          args+=(--required-table political_metrics_daily_activity_components)
          args+=(--required-table political_metrics_daily_issue_activity)
          args+=(--required-table political_metrics_division_party_vote_components)
          args+=(--required-table political_metrics_daily_question_dimensions)
          args+=(--required-table political_metrics_monthly_metric_results)
          OIREACHTAS_PUBLISH_LATEST=false python process/oireachtas_batch_control.py "${args[@]}" | tee oireachtas_batch_manifest.json
      - name: Record workflow result
        id: result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "batch_id=${OIREACHTAS_BATCH_ID}" >> "${GITHUB_OUTPUT}"
          echo "status=${{ job.status }}" >> "${GITHUB_OUTPUT}"
      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Oireachtas reusable refresh'
            echo
            echo "- Refresh type: `${{ inputs.refresh_type }}`"
            echo "- Batch ID: `${OIREACHTAS_BATCH_ID}`"
            echo "- Candidate publishing: `${{ inputs.publish_candidate }}`"
            echo "- Seeded from production: `${{ inputs.seed_from_production }}`"
            echo "- Speech data changed: `${{ steps.inputs.outputs.changes_speeches || 'unknown' }}`"
            echo "- Speech classification force-run: `${{ inputs.classify_speeches }}`"
            echo "- Speech classifier model: `${{ inputs.speech_classifier_model }}`"
            echo "- Political metrics required in candidate: `${{ inputs.publish_candidate }}`"
            echo "- Tables refreshed: `${{ steps.inputs.outputs.table_count || 'unknown' }}`"
            echo
            echo '```text'
            [[ -f oireachtas_refresh.log ]] && tail -n 120 oireachtas_refresh.log || echo 'No refresh log.'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oireachtas-${{ inputs.refresh_type }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            oireachtas_review_output/**
            oireachtas_seed_candidate.json
            oireachtas_refresh.log
            oireachtas_refresh_inputs.json
            oireachtas_batch_manifest.json
            speech_issue_classifier_report.json
            political_metrics_candidate_report.json
          if-no-files-found: warn
          retention-days: 90
