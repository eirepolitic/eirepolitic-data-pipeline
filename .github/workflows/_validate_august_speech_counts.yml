name: Validate August speech counts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-monthly-post-framework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas boto3 requests
      - name: Compare immutable batch to public Oireachtas API
        run: |
          python - <<'PY'
          import io, json
          from collections import Counter
          import boto3, pandas as pd, requests
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY, batch_key_for_production_key, read_json_required
          from political_metrics.sources import canonical_speeches

          bucket='eirepolitic-data'
          s3=boto3.client('s3')
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          batch_id=pointer['batch_id']

          def load(table):
              logical=f'processed/oireachtas_unified/latest/csv/{table}.csv'
              key=batch_key_for_production_key(logical,batch_id)
              obj=s3.get_object(Bucket=bucket,Key=key)
              return pd.read_csv(io.BytesIO(obj['Body'].read()),dtype=str,keep_default_na=False,na_values=['']), key

          speeches, speeches_key=load('silver_speeches')
          labels, labels_key=load('enrichment_speech_issue_labels')
          canonical=canonical_speeches(speeches)
          dates=pd.to_datetime(canonical['debate_date'],errors='coerce')
          aug=canonical[(dates>=pd.Timestamp('2026-08-01'))&(dates<=pd.Timestamp('2026-08-31'))].copy()
          aug_dates=pd.to_datetime(aug['debate_date'],errors='coerce').dt.strftime('%Y-%m-%d')
          by_date=Counter(aug_dates.dropna().tolist())

          label_aug=labels[labels['speech_id'].astype(str).isin(set(aug['speech_id'].astype(str)))].copy()
          status_col='classification_status' if 'classification_status' in label_aug.columns else None
          issue_col='issue_label' if 'issue_label' in label_aug.columns else None

          params={'chamber':'dail','date_start':'2026-08-01','date_end':'2026-08-31','limit':1000}
          r=requests.get('https://api.oireachtas.ie/v1/debates',params=params,timeout=60)
          r.raise_for_status()
          payload=r.json()
          public=[]
          for item in payload.get('results',[]):
              rec=item.get('debateRecord') or {}
              section_speech_count=0
              section_count=0
              for sec_wrap in rec.get('debateSections') or []:
                  sec=(sec_wrap or {}).get('debateSection') or {}
                  counts=sec.get('counts') or {}
                  section_speech_count += int(counts.get('speechCount') or 0)
                  section_count += 1
              public.append({
                  'date':rec.get('date'),
                  'uri':rec.get('uri'),
                  'house_code':((rec.get('house') or {}).get('houseCode')),
                  'debate_type':rec.get('debateType'),
                  'debate_section_count':section_count,
                  'section_speech_count_sum':section_speech_count,
                  'contributor_count':((rec.get('counts') or {}).get('contributorCount')),
              })

          all_params={'date_start':'2026-08-01','date_end':'2026-08-31','limit':1000}
          ar=requests.get('https://api.oireachtas.ie/v1/debates',params=all_params,timeout=60)
          ar.raise_for_status()
          all_payload=ar.json()
          house_counts=Counter()
          for item in all_payload.get('results',[]):
              rec=item.get('debateRecord') or {}
              house=rec.get('house') or {}
              house_counts[str(house.get('houseCode') or house.get('committeeCode') or house.get('chamberType') or 'unknown')] += 1

          cols=list(aug.columns)
          sample_cols=[c for c in ['speech_id','debate_date','debate_uri','debate_section_id','section_title','speaker_name','member_code','speech_type','text'] if c in cols]
          samples=[]
          for _, row in aug[sample_cols].head(10).iterrows():
              item={}
              for c in sample_cols:
                  value='' if pd.isna(row[c]) else str(row[c])
                  if c=='text': value=value[:140]
                  item[c]=value
              samples.append(item)

          report={
              'batch_id':batch_id,
              'source_keys':{'silver_speeches':speeches_key,'labels':labels_key},
              'silver_speeches_total_rows':int(len(speeches)),
              'canonical_speeches_total_rows':int(len(canonical)),
              'august_canonical_rows':int(len(aug)),
              'august_speech_rows_by_date':dict(sorted(by_date.items())),
              'august_unique_dates':sorted(by_date),
              'august_unique_members':int(aug['member_code'].nunique()) if 'member_code' in aug.columns else None,
              'august_label_rows':int(len(label_aug)),
              'classification_status_counts':label_aug[status_col].fillna('').value_counts().to_dict() if status_col else {},
              'issue_label_counts':label_aug[issue_col].fillna('').value_counts().to_dict() if issue_col else {},
              'public_dail_head_counts':payload.get('head',{}).get('counts',{}),
              'public_dail_debates':public,
              'public_all_debates_head_counts':all_payload.get('head',{}).get('counts',{}),
              'public_all_debate_house_counts':dict(house_counts),
              'source_sample_rows':samples,
          }
          out='instagram/reference/regression/august_2026_speech_validation.json'
          with open(out,'w',encoding='utf-8') as f: json.dump(report,f,indent=2,ensure_ascii=False)
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Commit validation evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add instagram/reference/regression/august_2026_speech_validation.json
          git commit -m 'docs: record August 2026 speech-count validation evidence'
          git push origin HEAD:feature/instagram-monthly-post-framework
