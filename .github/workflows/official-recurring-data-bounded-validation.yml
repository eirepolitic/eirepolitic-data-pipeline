name: Temporary official recurring data validation

on:
  workflow_dispatch:
  push:
    branches:
      - docs/official-recurring-data-validation-20260903
    paths:
      - .github/workflows/official-recurring-data-bounded-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/official-recurring-data-validation-20260903

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate sources independently
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, urllib.request
          from collections import Counter
          from pathlib import Path

          UA='Mozilla/5.0 EirePolitic research validation'
          out=[]

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return r.read(), r.headers.get('Content-Type',''), r.geturl()

          def decode(body):
              for enc in ('utf-8-sig','utf-8','cp1252','latin-1'):
                  try: return body.decode(enc),enc
                  except UnicodeDecodeError: pass
              raise RuntimeError('decode failed')

          # eTenders current resource.
          et_urls=[
              'https://assets.gov.ie/static/documents/4d482e0e/Public_Procurement_Opendata_Dataset.csv',
              'https://assets.gov.ie/static/documents/2fb1e069/Public_Procurement_Opendata_Dataset.csv',
          ]
          et_body=None
          for u in et_urls:
              try:
                  body,ctype,final=fetch(u)
                  out += ['[etenders_access]',f'requested={u}',f'final={final}',f'success=True',f'bytes={len(body)}',f'content_type={ctype}',f'sha256={hashlib.sha256(body).hexdigest()}']
                  et_body=body
                  break
              except Exception as e:
                  out += ['[etenders_access]',f'requested={u}',f'success=False',f'error={type(e).__name__}:{e}']

          if et_body:
              text,enc=decode(et_body); reader=csv.DictReader(io.StringIO(text)); rows=list(reader); cols=reader.fieldnames or []
              out += ['', '[etenders_csv]',f'encoding={enc}',f'rows={len(rows)}',f'columns={len(cols)}','header='+'|'.join(cols),f'exact_duplicate_extra_rows={len(rows)-len({tuple(r.get(c,"") for c in cols) for r in rows})}']
              for c in cols:
                  out.append(f'missing={c}|{sum(str(r.get(c,"")).strip()=="" for r in rows)}')
              for c in cols:
                  low=c.lower()
                  if any(k in low for k in ['procedure','notice','status','type','currency','authority','buyer','supplier','organisation','organization']):
                      vals=Counter(str(r.get(c,'')).strip() for r in rows if str(r.get(c,'')).strip())
                      out.append(f'distinct_sample={c}|count:{len(vals)}|top:'+json.dumps(vals.most_common(15),ensure_ascii=False))
              for c in cols:
                  vals=[]; bad=0
                  for r in rows:
                      s=str(r.get(c,'')).strip().replace(',','').replace('€','').replace('EUR','').strip()
                      if not s: continue
                      try: vals.append(float(s))
                      except ValueError: bad+=1
                  if vals and len(vals)>max(50,len(rows)*0.05):
                      out.append(f'numeric={c}|parsed:{len(vals)}|bad:{bad}|min:{min(vals)}|max:{max(vals)}|negative:{sum(v<0 for v in vals)}')
              for c in cols:
                  if any(k in c.lower() for k in ['date','deadline']):
                      vals=sorted(set(str(r.get(c,'')).strip() for r in rows if str(r.get(c,'')).strip()))
                      if vals: out.append(f'dates={c}|distinct:{len(vals)}|first:{vals[0]}|last:{vals[-1]}')

          # Department of Finance legacy/current access paths tested separately.
          fin_urls=[
              'https://databank.finance.gov.ie/FinDataBank.aspx?rep=OpenDataSourceCSV',
              'http://databank.finance.gov.ie/FinDataBank.aspx?rep=OpenDataSourceCSV',
          ]
          fin_body=None
          for u in fin_urls:
              try:
                  body,ctype,final=fetch(u)
                  out += ['', '[finance_access]',f'requested={u}',f'final={final}',f'success=True',f'bytes={len(body)}',f'content_type={ctype}',f'sha256={hashlib.sha256(body).hexdigest()}']
                  # Only accept if it looks like CSV/table data rather than an HTML error/landing page.
                  prefix=body[:500].lower()
                  if b'<html' not in prefix and b'<!doctype html' not in prefix:
                      fin_body=body
                      break
                  out.append('finance_access_note=response_looks_html_not_csv')
              except Exception as e:
                  out += ['', '[finance_access]',f'requested={u}',f'success=False',f'error={type(e).__name__}:{e}']

          if fin_body:
              text,enc=decode(fin_body); reader=csv.DictReader(io.StringIO(text)); rows=list(reader); cols=reader.fieldnames or []
              out += ['', '[finance_csv]',f'encoding={enc}',f'rows={len(rows)}',f'columns={len(cols)}','header='+'|'.join(cols),f'exact_duplicate_extra_rows={len(rows)-len({tuple(r.get(c,"") for c in cols) for r in rows})}']
              for c in cols:
                  out.append(f'missing={c}|{sum(str(r.get(c,"")).strip()=="" for r in rows)}')
              out.append('sample_rows='+json.dumps(rows[:10],ensure_ascii=False))
              for c in cols:
                  vals=[]; bad=0
                  for r in rows:
                      s=str(r.get(c,'')).strip().replace(',','').replace('€','').replace('EUR','').strip()
                      if not s: continue
                      try: vals.append(float(s))
                      except ValueError: bad+=1
                  if vals:
                      out.append(f'numeric={c}|parsed:{len(vals)}|bad:{bad}|min:{min(vals)}|max:{max(vals)}|negative:{sum(v<0 for v in vals)}')
          else:
              out += ['', '[finance_csv]', 'available=False', 'note=legacy advertised CSV endpoint did not return machine-readable CSV in this validation environment']

          path=Path('tmp/official_recurring_data_validation.txt')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text('\n'.join(out)+'\n',encoding='utf-8')
          print(path.read_text())
          PY

      - name: Commit temporary validation report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/official_recurring_data_validation.txt
          git commit -m 'research: record temporary recurring data diagnostics' || exit 0
          git push