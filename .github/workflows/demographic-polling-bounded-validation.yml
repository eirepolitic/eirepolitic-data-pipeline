name: Temporary demographic polling bounded validation

on:
  workflow_dispatch:
  push:
    branches:
      - docs/demographic-polling-validation-20260903
    paths:
      - .github/workflows/demographic-polling-bounded-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/demographic-polling-validation-20260903

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detail exact anomalies
        run: |
          python - <<'PY'
          import csv, io, urllib.request
          from pathlib import Path

          SHA = "c15fd6acfe0a161bccb0bfa3f3fbcdcf19d997ca"
          BASE = f"https://raw.githubusercontent.com/Irish-Dem-Polling/datasets/{SHA}"

          def rows(path):
              with urllib.request.urlopen(f"{BASE}/{path}", timeout=30) as response:
                  text = response.read().decode("utf-8-sig")
              reader = csv.DictReader(io.StringIO(text))
              return reader.fieldnames, list(reader)

          out = [f"source_commit_sha={SHA}", "", "[redc_proportion_values_over_1]"]
          cols, redc = rows("vote-intention/data_redc_firstpref_prop.csv")
          meta = {"date","date_start","date_end","date_middle","sample_size","party"}
          for line, r in enumerate(redc, start=2):
              for c in cols:
                  if c in meta or r[c] in {"", "NA"}:
                      continue
                  try:
                      v = float(r[c])
                  except ValueError:
                      continue
                  if v > 1:
                      out.append(f"line={line}|date={r['date']}|party={r['party']}|field={c}|value={v}")

          ccols, crows = rows("vote-intention/data_banda_firstpref_counts.csv")
          pcols, prows = rows("vote-intention/data_banda_firstpref_prop.csv")
          out += ["", "[banda_vote_schema_asymmetry]",
                  "counts_only=" + ",".join(c for c in ccols if c not in pcols),
                  "prop_only=" + ",".join(c for c in pcols if c not in ccols)]

          pairs = [
              ("government-satisfaction/data_banda_govsat_counts.csv", "government-satisfaction/data_banda_govsat_prop.csv", ["date","date_start","date_end","date_middle","sample_size","satisfaction_government"]),
              ("party-leaders/data_banda_leaders_counts.csv", "party-leaders/data_banda_leaders_prop.csv", ["date","date_start","date_end","date_middle","sample_size","leader_party","leader_name","satisfaction_leader"]),
              ("vote-intention/data_banda_firstpref_counts.csv", "vote-intention/data_banda_firstpref_prop.csv", ["date","date_start","date_end","date_middle","sample_size","party"]),
          ]
          out += ["", "[paired_missingness_asymmetry]"]
          for cpath, ppath, keys in pairs:
              ccols, cr = rows(cpath); pcols, pr = rows(ppath)
              cmap = {tuple(r[k] for k in keys): r for r in cr}
              pmap = {tuple(r[k] for k in keys): r for r in pr}
              shared = [c for c in ccols if c in pcols and c not in keys]
              count_present_prop_missing = 0
              count_missing_prop_present = 0
              details = []
              for k, crow in cmap.items():
                  prow = pmap[k]
                  for c in shared:
                      cm = crow[c] in {"", "NA"}
                      pm = prow[c] in {"", "NA"}
                      if not cm and pm:
                          count_present_prop_missing += 1
                          if len(details)<8: details.append(f"count_present_prop_missing|{k}|{c}|count={crow[c]}")
                      if cm and not pm:
                          count_missing_prop_present += 1
                          if len(details)<8: details.append(f"count_missing_prop_present|{k}|{c}|prop={prow[c]}")
              out.append(f"{cpath}|count_present_prop_missing={count_present_prop_missing}|count_missing_prop_present={count_missing_prop_present}")
              out.extend(details)

          path = Path("tmp/demographic_polling_anomaly_details.txt")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text("\n".join(out) + "\n", encoding="utf-8")
          print(path.read_text())
          PY

      - name: Commit temporary anomaly details
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/demographic_polling_anomaly_details.txt
          git commit -m "research: record demographic polling anomaly details" || exit 0
          git push
