name: Deploy context-aware voting foundations

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ca-central-1
  AWS_REGION: ca-central-1
  S3_BUCKET: eirepolitic-data
  BATCH_ID: contextual-vote-foundations-20260904-1
  PYTHONPATH: .

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install boto3 pandas pyarrow pyyaml pytest
      - name: Run contextual voting and contract tests
        run: python -m pytest -q tests/political_metrics/test_contextual_votes.py tests/political_metrics/test_downstream_contracts.py tests/political_metrics/test_candidate_materialization.py
      - name: Seed complete candidate from current production
        run: python process/oireachtas_seed_candidate.py --batch-id "$BATCH_ID"
      - name: Build and reconcile context-aware voting foundations
        run: |
          python process/political_metrics_contextual_votes_candidate.py \
            --batch-id "$BATCH_ID" \
            --report-path contextual_votes_candidate_report.json
      - name: Reassemble complete candidate manifest
        run: python process/oireachtas_batch_control.py assemble --batch-id "$BATCH_ID"
      - name: Promote validated candidate atomically
        env:
          OIREACHTAS_PUBLISH_ENABLED: 'true'
          OIREACHTAS_PUBLISH_LATEST: 'true'
        run: python process/oireachtas_batch_control.py promote --batch-id "$BATCH_ID"
      - name: Post-promotion reconciliation audit
        run: |
          python - <<'PY'
          import io,json,os
          from pathlib import Path
          import boto3,pandas as pd
          from extract.oireachtas.batch import PRODUCTION_POINTER_KEY,read_json_required,resolve_production_key
          from political_metrics.contextual_votes import audit_context_vote_reconciliation
          s3=boto3.client('s3',region_name=os.environ['AWS_REGION']); bucket=os.environ['S3_BUCKET']
          pointer=read_json_required(s3,bucket=bucket,key=PRODUCTION_POINTER_KEY)
          expected=os.environ['BATCH_ID']
          if pointer.get('batch_id') != expected:
              raise RuntimeError(f"production pointer is {pointer.get('batch_id')!r}, expected {expected!r}")
          def read(p):
              k=resolve_production_key(s3,bucket=bucket,production_key=p)
              return pd.read_csv(io.BytesIO(s3.get_object(Bucket=bucket,Key=k)['Body'].read()),dtype=str,keep_default_na=False,na_values=[''])
          daily_context=read('processed/oireachtas_unified/latest/metrics/daily/daily_context_vote_components/csv/daily_context_vote_components.csv')
          party_context=read('processed/oireachtas_unified/latest/metrics/event/context_division_party_vote_components/csv/context_division_party_vote_components.csv')
          daily_existing=read('processed/oireachtas_unified/latest/metrics/daily/daily_activity_components/csv/daily_activity_components.csv')
          party_existing=read('processed/oireachtas_unified/latest/metrics/event/division_party_vote_components/csv/division_party_vote_components.csv')
          audit=audit_context_vote_reconciliation(
              daily_context_vote_components=daily_context,
              context_division_party_vote_components=party_context,
              daily_activity_components=daily_existing,
              division_party_vote_components=party_existing,
          )
          if not audit.get('ready'):
              raise RuntimeError(f'post-promotion contextual voting reconciliation failed: {audit}')
          report={'production_batch_id':expected,'audit':audit,'production_pointer':pointer}
          Path('contextual_votes_post_promotion_audit.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: contextual-vote-foundations-deployment-${{ github.run_id }}
          path: |
            contextual_votes_candidate_report.json
            contextual_votes_post_promotion_audit.json
