name: Instagram polling snapshot render

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-polling-snapshot-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml pillow boto3 requests matplotlib

      - name: Render latest IPI polling carousel from S3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python -m process.instagram_render_polling_snapshot --campaign instagram/campaigns/ipi_polling_snapshot_v1/render_spec.yml
          for slide in \
            generated_posts/ipi_polling_snapshot_v1/png/slide-01-latest-party-support.png \
            generated_posts/ipi_polling_snapshot_v1/png/slide-02-change.png \
            generated_posts/ipi_polling_snapshot_v1/png/slide-03-trend.png; do
            test -s "$slide"
          done
          test -s generated_posts/ipi_polling_snapshot_v1/caption.txt
          test -s generated_posts/ipi_polling_snapshot_v1/review_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('generated_posts/ipi_polling_snapshot_v1/review_manifest.json').read_text(encoding='utf-8'))
          assert data['success'] is True
          assert data['slide_count'] == 3
          assert data['source_reference_in_caption'] is True
          assert data['visible_source_footer'] == 'Source: Irish Polling Indicator (IPI)'
          assert data['dimensions'] == [1080, 1350]
          print(json.dumps(data, indent=2))
          PY

      - name: Build self-contained browser review page
        shell: bash
        run: |
          set -euo pipefail
          python -m process.instagram_build_polling_review_page --output-root generated_posts/ipi_polling_snapshot_v1
          test -s generated_posts/ipi_polling_snapshot_v1/review/review_index.html

      - name: Upload private web preview bundle to S3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python -m process.instagram_upload_preview_to_s3 \
            --output-root generated_posts/ipi_polling_snapshot_v1 \
            --campaign-slug ipi_polling_snapshot_v1 \
            --run-label "${GITHUB_RUN_ID}" \
            --public-read false

      - name: Generate temporary private browser review link
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python -m process.instagram_generate_preview_links \
            --campaign-slug ipi_polling_snapshot_v1 \
            --output-root generated_posts/ipi_polling_snapshot_v1 \
            --expires-in 604800 \
            --output generated_posts/ipi_polling_snapshot_v1/preview_links.json

      - name: Publish single-page browser review
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: eirepolitic-data
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import boto3
          import requests

          bucket=os.getenv('S3_BUCKET','eirepolitic-data')
          region=os.getenv('AWS_REGION') or 'ca-central-1'
          run_id=os.environ['GITHUB_RUN_ID']
          page=Path('generated_posts/ipi_polling_snapshot_v1/review/review_index.html')
          s3=boto3.client('s3',region_name=region)
          keys=[
              f'instagram/public-previews/ipi_polling_snapshot_v1/{run_id}/index.html',
              'instagram/public-previews/ipi_polling_snapshot_v1/latest/index.html',
          ]
          for key in keys:
              s3.upload_file(
                  str(page), bucket, key,
                  ExtraArgs={
                      'ContentType':'text/html; charset=utf-8',
                      'CacheControl':'no-store, max-age=0',
                      'ACL':'public-read',
                  },
              )
          url=f'https://{bucket}.s3.{region}.amazonaws.com/{keys[0]}'
          latest=f'https://{bucket}.s3.{region}.amazonaws.com/{keys[1]}'
          response=requests.get(url,timeout=30)
          response.raise_for_status()
          if 'IPI polling carousel review' not in response.text:
              raise SystemExit('Public review URL did not return the expected review page')
          print(f'PUBLIC_REVIEW_URL={url}')
          print(f'LATEST_PUBLIC_REVIEW_URL={latest}')
          summary=os.getenv('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary,'a',encoding='utf-8') as f:
                  f.write(f'## IPI polling carousel review\n\n[Open web-hosted review page]({url})\n\nLatest alias: {latest}\n')
          PY

      - name: Upload carousel review bundle as backup
        uses: actions/upload-artifact@v4
        with:
          name: ipi-polling-carousel-${{ github.run_id }}
          path: generated_posts/ipi_polling_snapshot_v1/
          if-no-files-found: error
          retention-days: 30
