name: Instagram polling snapshot render

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-polling-snapshot-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml pillow boto3 requests matplotlib

      - name: Render latest IPI polling carousel from S3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python -m process.instagram_render_polling_snapshot --campaign instagram/campaigns/ipi_polling_snapshot_v1/render_spec.yml
          for slide in \
            generated_posts/ipi_polling_snapshot_v1/png/slide-01-latest-party-support.png \
            generated_posts/ipi_polling_snapshot_v1/png/slide-02-change.png \
            generated_posts/ipi_polling_snapshot_v1/png/slide-03-trend.png; do
            test -s "$slide"
          done
          test -s generated_posts/ipi_polling_snapshot_v1/caption.txt
          test -s generated_posts/ipi_polling_snapshot_v1/review_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('generated_posts/ipi_polling_snapshot_v1/review_manifest.json').read_text(encoding='utf-8'))
          assert data['success'] is True
          assert data['slide_count'] == 3
          assert data['source_reference_in_caption'] is True
          assert data['visible_source_footer'] == 'Source: Irish Polling Indicator (IPI)'
          assert data['dimensions'] == [1080, 1350]
          print(json.dumps(data, indent=2))
          PY

      - name: Build self-contained browser review page
        shell: bash
        run: |
          set -euo pipefail
          python -m process.instagram_build_polling_review_page --output-root generated_posts/ipi_polling_snapshot_v1
          test -s generated_posts/ipi_polling_snapshot_v1/review/review_index.html

      - name: Upload private web preview bundle to S3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python -m process.instagram_upload_preview_to_s3 \
            --output-root generated_posts/ipi_polling_snapshot_v1 \
            --campaign-slug ipi_polling_snapshot_v1 \
            --run-label "${GITHUB_RUN_ID}" \
            --public-read false

      - name: Generate temporary private browser review link
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python -m process.instagram_generate_preview_links \
            --campaign-slug ipi_polling_snapshot_v1 \
            --output-root generated_posts/ipi_polling_snapshot_v1 \
            --expires-in 604800 \
            --output generated_posts/ipi_polling_snapshot_v1/preview_links.json

      - name: Publish browser review to preview branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cp generated_posts/ipi_polling_snapshot_v1/review/review_index.html "$tmpdir/index.html"
          cd "$tmpdir"
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "preview: update IPI polling review ${GITHUB_RUN_ID}"
          git branch -M previews/ipi-polling
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/ipi-polling
          echo "PREVIEW_RAW_URL=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/previews/ipi-polling/index.html"
          echo "PREVIEW_WEB_URL=https://raw.githack.com/${GITHUB_REPOSITORY}/previews/ipi-polling/index.html"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '## IPI polling carousel review\n\n[Open web-hosted review page](https://raw.githack.com/%s/previews/ipi-polling/index.html)\n' "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload carousel review bundle as backup
        uses: actions/upload-artifact@v4
        with:
          name: ipi-polling-carousel-${{ github.run_id }}
          path: generated_posts/ipi_polling_snapshot_v1/
          if-no-files-found: error
          retention-days: 30
