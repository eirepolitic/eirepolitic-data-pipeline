# director/visuals.yml — renderers/templates/layouts/palettes + the
# feedback-phrase -> tunable-parameter mapping (plan §3.7).
# Hand-maintained.

feedback_to_knob:
  # Modify-from-feedback workflow (plan §6.3): parse feedback -> map to a
  # knob here -> decide one-off vs. reusable -> edit project.yml or
  # parameterise the renderer -> rerender.
  - feedback: "labels too small"
    target: MAX_CATEGORY_FONT_SIZE / MIN_CATEGORY_FONT_SIZE in instagram/visuals/renderers/horizontal_bar.py
    reusable_path: "promote to project.yml's render: block once touched more than once"
  - feedback: "legend underneath / legend placement wrong"
    target: legend_variant
  - feedback: "slide too crowded"
    target: metrics.max_items (project.yml), render.min_visual_rows (project.yml)
  - feedback: "title wrapping badly"
    target: render_primitives.fit_font bounds

feedback_to_knob_note: >
  Where a knob is currently a module constant rather than a project.yml
  field, the correct fix is to parameterise it once, not to hand-edit the
  module per render (plan §3.7).

