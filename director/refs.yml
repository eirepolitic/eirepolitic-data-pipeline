# director/refs.yml — the keystone capability → state map.
#
# Hand-maintained, human-reviewed. Do not let this drift from reality: when
# a PR merges, a branch is deleted, or a pin is lifted, update the entry in
# the same PR that changes the underlying thing.
#
# state values: merged | pinned | draft | experimental | superseded
#
# This file classifies every capability named in the implementation plan's
# §1.2 capability-state table, updated for what Phase 1 actually did.

- capability: recurring_instagram_factory
  state: merged
  ref: main
  version: v1
  frozen_from: 386b933
  merged_by: pull_request_143
  verified_by: .github/workflows/director_factory_v1_identity_ci.yml
  notes: >
    instagram/factory/, instagram/visuals/renderers/, party_asset_registry,
    render_primitives promoted to main 2026-09-17. CI hash-verifies these
    files against 386b933 on every push/PR. The four approved corner PNGs
    (instagram/templates/assets/corner_{tl,tr,bl,br}.png) are NOT on main —
    see the `corner_assets_pinned` entry below.

- capability: corner_assets_pinned
  state: pinned
  ref: 386b933
  notes: >
    instagram/templates/assets/corner_{tl,tr,bl,br}.png. Deliberately left
    off main: this sandbox's only GitHub write path (Sly_Director_GitHub
    MCP upsert_file/upsert_files) stores content as literal text and cannot
    carry binary data losslessly (proven by a probe test, see plan §1.8).
    Any renderer for party_issue_monthly_profile_v2 must worktree-pin to
    386b933 to read these files, exactly as
    instagram_polling_factory_render.yml already does for its own assets.
    Lift this pin (copy the PNGs onto main, shrink this entry into
    recurring_instagram_factory) only if a session ever gets real git push
    or a binary-safe write path to this repo.

