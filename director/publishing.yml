hard_gates_enforced_in_code:
  - "instagram/factory/recurring.py hard-fails any adapter that doesn't return {review_state: pending_human_review, publication_enabled: false}."
  - instagram/factory/review.py always sets publishing_allowed: false on every review-state write.
