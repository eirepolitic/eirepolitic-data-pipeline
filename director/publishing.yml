# director/publishing.yml — current Instagram publication capability.
# Hand-maintained. Factory rendering remains non-publishing; production
# publishing is a separate approved workflow.

status: enabled

canonical_runbook: docs/operations/instagram_publishing_standard.md
agent_quick_start: instagram/PUBLISHING.md
standard_workflow: .github/workflows/instagram_publish_standard.yml
factory_workflow: .github/workflows/instagram_factory_render.yml
maintenance_workflow: .github/workflows/deploy_instagram_publisher_lambda.yml

production_state:
  enabled_at: "2026-09-26"
  account: existing Eirepolitic Instagram Professional account
  meta_route: Facebook Login / Instagram Graph API
  aws_region: us-east-2
  immediate_publish_verified: true
  scheduled_publish_verified: true
  gate_4_canary: >-
    Real single-image canary published successfully through the production
    S3 -> DynamoDB -> Lambda -> Meta /media -> /media_publish path and was
    manually deleted after verification.
  gate_5_canary: >-
    Real one-time EventBridge Scheduler canary published successfully at the
    requested Pacific time and was manually deleted after verification.

factory_boundary:
  publication_enabled: false
  rule: >-
    The Instagram content factory never publishes directly. Successful generic
    renders emit publication_handoff.json and remain review artifacts. The
    separate standard publishing workflow records the human/operator approval
    fingerprint and promotes the exact reviewed assets into immutable production
    storage before immediate or scheduled execution.

standard_agent_contract:
  required_inputs:
    - factory_run_id
    - approved_by
    - mode
  scheduled_inputs:
    - scheduled_local
    - timezone
  optional_inputs:
    - caption_override
    - options_json
  rule: >-
    Agents should use Instagram publish (standard) and must not recreate the
    publication mechanism with manual S3 uploads, direct Meta calls, custom
    EventBridge schedules, or temporary Lambda actions.

runtime_guards:
  - Exact approved PublicationRequest + immutable AssetPackage fingerprint is validated before Meta calls.
  - Scheduled jobs contain only publication identity/version; content stays in DynamoDB/S3.
  - Meta credentials stay in Secrets Manager.
  - Durable execution attempts persist provider container/media IDs and protect retries from duplicate publication.
  - One-time EventBridge schedules use ActionAfterCompletion=DELETE and the dedicated SQS DLQ.
  - Unsupported Lambda actions return 403.

maintenance:
  note: >-
    Infrastructure deployment/status operations live in the maintenance workflow
    and are not the normal posting interface.
