AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One-time bootstrap for GitHub-managed Eirepolitic Instagram AWS infrastructure.
  Creates a restricted CloudFormation execution role and attaches a deployment
  policy to the existing GitHub IAM user. Does not enable Instagram publishing.

Parameters:
  GitHubDeployerUserName:
    Type: String
    Default: github-eirepolitic-instagram-deployer
  CloudFormationExecutionRoleName:
    Type: String
    Default: eirepolitic-instagram-cloudformation-execution
  PublisherFunctionName:
    Type: String
    Default: eirepolitic-instagram-publisher

Resources:
  InstagramCloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref CloudFormationExecutionRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: EirepoliticInstagramInfrastructureExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManagePublicationLedger
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:ListTagsOfResource
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/eirepolitic-publications
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/eirepolitic-publications/index/*
              - Sid: ManageInstagramScheduleGroup
                Effect: Allow
                Action:
                  - scheduler:CreateScheduleGroup
                  - scheduler:DeleteScheduleGroup
                  - scheduler:GetScheduleGroup
                  - scheduler:TagResource
                  - scheduler:UntagResource
                  - scheduler:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/eirepolitic-instagram
              - Sid: ManageInstagramSchedulerDlq
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                  - sqs:ListQueueTags
                Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:eirepolitic-instagram-scheduler-dlq
              - Sid: ManageInstagramSchedulerExecutionRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/eirepolitic-instagram-scheduler-execution
              - Sid: ManageSchedulerDlqAlarm
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:eirepolitic-instagram-scheduler-dlq-not-empty
      Tags:
        - Key: application
          Value: eirepolitic-instagram-publishing
        - Key: component
          Value: cloudformation-execution

  GitHubInstagramInfrastructureDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: EirepoliticInstagramInfrastructureDeploy
      Description: >-
        Allows the dedicated GitHub deployer to manage only Eirepolitic Instagram
        CloudFormation stacks through the dedicated execution role and invoke only
        the publisher healthcheck Lambda.
      Users:
        - !Ref GitHubDeployerUserName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ManageInstagramCloudFormationStacks
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResource
              - cloudformation:DescribeStackResources
              - cloudformation:ListStackResources
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
            Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/eirepolitic-instagram-*/*
          - Sid: ValidateCloudFormationTemplates
            Effect: Allow
            Action:
              - cloudformation:ValidateTemplate
            Resource: '*'
          - Sid: PassOnlyInstagramCloudFormationExecutionRole
            Effect: Allow
            Action:
              - iam:PassRole
            Resource: !GetAtt InstagramCloudFormationExecutionRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com
          - Sid: InvokePublisherHealthcheck
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${PublisherFunctionName}

Outputs:
  CloudFormationExecutionRoleArn:
    Description: Role GitHub workflows must pass to CloudFormation deployments.
    Value: !GetAtt InstagramCloudFormationExecutionRole.Arn
  GitHubInfrastructureDeployPolicyArn:
    Description: Managed policy attached to the existing GitHub deployer user.
    Value: !Ref GitHubInstagramInfrastructureDeployPolicy
