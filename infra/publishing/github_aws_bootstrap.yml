AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One-time bootstrap for broad High Director AWS operations through GitHub Actions.
  The existing dedicated GitHub IAM user retains long-lived access keys but is only
  permitted to assume the HighDirectorAwsAdmin role. The role uses temporary STS
  credentials and carries AWS AdministratorAccess. This template does not enable
  Instagram publishing by itself.

Parameters:
  GitHubDeployerUserName:
    Type: String
    Default: github-eirepolitic-instagram-deployer
  HighDirectorAdminRoleName:
    Type: String
    Default: HighDirectorAwsAdmin
  MaxSessionDurationSeconds:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 43200

Resources:
  HighDirectorAwsAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref HighDirectorAdminRoleName
      MaxSessionDuration: !Ref MaxSessionDurationSeconds
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowDedicatedGitHubDeployerToAssume
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${GitHubDeployerUserName}
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Tags:
        - Key: application
          Value: high-director
        - Key: component
          Value: aws-admin-role

  GitHubAssumeHighDirectorAdminPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: HighDirectorAssumeAwsAdmin
      Description: >-
        Allows the existing dedicated GitHub deployer user to assume the broad
        High Director AWS administrator role using temporary STS credentials.
      Users:
        - !Ref GitHubDeployerUserName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AssumeHighDirectorAwsAdmin
            Effect: Allow
            Action:
              - sts:AssumeRole
            Resource: !GetAtt HighDirectorAwsAdminRole.Arn

Outputs:
  HighDirectorAwsAdminRoleArn:
    Description: Role ARN that GitHub Actions should assume for broad AWS operations.
    Value: !GetAtt HighDirectorAwsAdminRole.Arn
  GitHubAssumeRolePolicyArn:
    Description: Managed policy attached to the existing GitHub deployer user.
    Value: !Ref GitHubAssumeHighDirectorAdminPolicy
