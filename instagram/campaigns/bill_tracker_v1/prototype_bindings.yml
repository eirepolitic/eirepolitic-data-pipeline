  bill_title: "Development (Strategic Gas Reserve) Bill 2026"
  sponsor_text: "Introduced by the Minister for Climate, Energy and the Environment"
  what_it_does: "Creates a project-specific approval process for a State-led strategic gas emergency reserve at Cahiracon, Co. Clare, intended as emergency backup if Ireland's normal gas supply is seriously disrupted."
  case_for: "The Government argued Ireland needs emergency gas storage to protect security of supply during the transition to renewable energy."
  concerns: "Deputies questioned the bespoke planning route and sought stronger guarantees on emergency-only use, public control, climate safeguards and cost."
