series:
  title_top: BILLS OF THE
  title_main: CURRENT SESSION
  status: FIRST STAGE
  source_footer: Houses of the Oireachtas + initiated Bills + explanatory memoranda
  glossary:
    process_subtitle: HOW A BILL MOVES THROUGH PARLIAMENT
    process_highlight: FIRST
    process_steps:
      - {number: 1, label: FIRST}
      - {number: 2, label: SECOND}
      - {number: 3, label: COMMITTEE}
      - {number: 4, label: REPORT}
      - {number: 5, label: FINAL}
      - {number: 6, label: OTHER HOUSE}
      - {number: 7, label: PRESIDENT}
      - {number: 8, label: ENACTED}
    process_copy: "First Stage is the formal initiation step. If a Bill proceeds, its general principles are normally debated at Second Stage before detailed examination and possible amendment at later stages."
    terms:
      - {term: BILL, body: "A proposed law. It is not law unless it completes the required parliamentary process and is enacted."}
      - {term: FIRST STAGE, body: "The Bill is formally initiated or presented. This is the starting point of the parliamentary process."}
      - {term: SECOND STAGE, body: "The House debates the Bill’s general principles and whether it should proceed to detailed scrutiny."}
      - {term: FIRST HOUSE, body: "The House where the Bill begins. A Bill normally completes its stages there before moving to the other House."}
      - {term: ENACTED, body: "After both Houses agree the text and the President signs it, the Bill becomes an Act."}
    first_stage_terms:
      - {term: FIRST STAGE, body: "The Bill is formally introduced or presented. This is not normally the main debate on whether its general principles should be accepted."}
      - {term: GOVERNMENT BILL, body: "A Bill introduced on behalf of the Government. Government Bills are initiated by presentation."}
      - {term: PRIVATE MEMBER’S BILL, body: "A Bill introduced by a TD or Senator who is not introducing it on behalf of the Government."}
      - {term: WHY THERE MAY BE NO VOTE, body: "Many First Stage introductions do not produce a recorded member-by-member division. That is normal and does not indicate a data failure."}
      - {term: WHAT HAPPENS NEXT, body: "If the Bill proceeds, Second Stage is normally where its general principles are debated. Introduction at First Stage does not itself show broad political support."}

