          - https://data.oireachtas.ie/ie/oireachtas/bill/2026/44
      - key: defence_amendment
        formal_title: Defence (Amendment) Bill 2026
        bill_number: 63/2026
        origin_house: Dáil Éireann
        introduction_date: 16 June 2026
        sponsors: Minister for Defence
        bill_type: Government Bill
        what: "Rewrites rules for sending Defence Forces personnel abroad, including removing the statutory requirement for a UN mandate for certain international-force deployments. It also changes Defence Forces suspension and criminal-charge procedures."
        effect: "For relevant international-force deployments, prior Government approval would still be required and a Dáil resolution would normally still be required, subject to exceptions. The Bill also raises the small-contingent exception from 12 to 50 personnel and creates new suspension procedures."
        why: "The explanatory memorandum says the Bill is intended to consolidate overseas-service rules, modify the existing ‘triple lock’ by removing the UN-mandate requirement, and implement recommendations on managing Defence Forces members charged with or convicted of serious criminal offences."
        where: "Official records list the Bill as current at First Stage in Dáil Éireann. Its general principles would normally be debated at Second Stage if it proceeds."
        sources:
          - https://data.oireachtas.ie/ie/oireachtas/bill/2026/63/eng/initiated/b6326d.pdf
          - https://data.oireachtas.ie/ie/oireachtas/bill/2026/63/eng/memo/b6326d-memo.pdf
          - https://data.oireachtas.ie/ie/oireachtas/bill/2026/63
      - key: railway_safety
        formal_title: Railway Safety Bill 2026
        bill_number: 82/2026
        origin_house: Dáil Éireann
        introduction_date: 24 July 2026
        sponsors: Minister for Transport
        bill_type: Government Bill
        what: "Places the Railway Accident Investigation Unit on a primary-legislation footing for investigating railway accidents and incidents, and updates the Railway Safety Act 2005, including rules on intoxicants and safety-critical railway workers."
        effect: "The RAIU would have a statutory basis and investigation powers covering prescribed railways, including light rail, metro and heritage railways. The Bill also updates testing, sampling and Garda enforcement provisions relating to intoxicants in railway work."
        why: "The explanatory memorandum says the existing 2020 arrangement was a stop-gap after EU railway-safety rules changed. The Bill is intended to provide a longer-term statutory basis for the RAIU and update older railway-safety provisions."
        where: "Official records list the Bill as current at First Stage in Dáil Éireann. Its general principles would normally be debated at Second Stage if it proceeds."
        sources:
          - https://data.oireachtas.ie/ie/oireachtas/bill/2026/82/eng/initiated/b8226d.pdf
          - https://data.oireachtas.ie/ie/oireachtas/bill/2026/82/eng/memo/b8226d-memo.pdf
          - https://data.oireachtas.ie/ie/oireachtas/bill/2026/82
