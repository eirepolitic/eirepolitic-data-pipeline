  bill:
    key: adult_safeguarding
    formal_title: Criminal Law (Adult Safeguarding) Bill 2026
    bill_number: 44/2026
    origin_house: Dáil Éireann
    introduction_date: 5 May 2026
    sponsors: David Cullinane · Matt Carthy · Natasha Newsome Drennan
    bill_type: Private Member’s Bill
    what: "Creates specific criminal offences concerning abuse, neglect, serious-risk exposure, coercive control and coercive exploitation of certain adults whose ability to protect themselves is significantly impaired."
    effect: "If enacted, the law would create new criminal liability in defined safeguarding situations. Courts could also prohibit certain offenders from working with protected adults, and the Bill provides for publicity orders, anonymity protections and related procedures."
    why: "The sponsors’ explanatory memorandum says the Bill is intended to create specific criminal-law protections for adults who require care and may be unable to protect themselves from abuse, neglect, exploitation or coercive control."
    where: "Official records list the Bill as current at First Stage in Dáil Éireann. First Stage formally initiates a Bill; the main debate on its general principles normally occurs at Second Stage."
    sources:
      - https://data.oireachtas.ie/ie/oireachtas/bill/2026/44/eng/initiated/b4426d.pdf
      - https://data.oireachtas.ie/ie/oireachtas/bill/2026/44/eng/memo/b4426d-memo.pdf
      - https://data.oireachtas.ie/ie/oireachtas/bill/2026/44

posts:
  first_stage_post2:
    edition_label: POST 2
    cover_intro: "These Bills are currently at First Stage — the point where a Bill is formally introduced or presented. Detailed debate on the Bill’s general principles normally comes at Second Stage."
    caption_draft: |
      Bills of the Current Session · First Stage · Post 2

      This post explains three Bills currently listed at First Stage and what that stage means in the Irish legislative process.

      • Criminal Law (Adult Safeguarding) Bill 2026
      • Defence (Amendment) Bill 2026
      • Railway Safety Bill 2026

      First Stage is the formal initiation step. It does not by itself show that the House supports the Bill’s general principles.

      #EirePolitic #Oireachtas #DáilÉireann #IrishPolitics #Legislation
    bills:
      - key: adult_safeguarding
        formal_title: Criminal Law (Adult Safeguarding) Bill 2026
        bill_number: 44/2026
        origin_house: Dáil Éireann
        introduction_date: 5 May 2026
        sponsors: David Cullinane · Matt Carthy · Natasha Newsome Drennan
        bill_type: Private Member’s Bill
        what: "Creates specific criminal offences concerning abuse, neglect, serious-risk exposure, coercive control and coercive exploitation of certain adults whose ability to protect themselves is significantly impaired."
        effect: "If enacted, the law would create new criminal liability in defined safeguarding situations. Courts could also prohibit certain offenders from working with protected adults, and the Bill provides for publicity orders, anonymity protections and related procedures."
        why: "The sponsors’ explanatory memorandum says the Bill is intended to create specific criminal-law protections for adults who require care and may be unable to protect themselves from abuse, neglect, exploitation or coercive control."
        where: "Official records list the Bill as current at First Stage in Dáil Éireann. First Stage formally initiates a Bill; the main debate on its general principles normally occurs at Second Stage."
        sources:
          - https://data.oireachtas.ie/ie/oireachtas/bill/2026/44/eng/initiated/b4426d.pdf
