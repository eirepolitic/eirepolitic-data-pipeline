posts:
  first_stage_post1:
    edition_label: POST 1
    cover_intro: "These Bills are currently at First Stage — the point where a Bill is formally introduced or presented. Detailed debate on the Bill’s general principles normally comes at Second Stage."
    caption_draft: |
      Bills of the Current Session · First Stage · Post 1

      This post explains three Bills currently listed at First Stage and what that stage means in the Irish legislative process.

      • Protection of Tenants' Deposits Bill 2025
      • Energy Poverty Reduction (Use of Surplus Renewable Energy) Bill 2025
      • Criminal Justice (Trespass on Land) Bill 2025

      First Stage is the formal initiation step. It does not by itself show that the House supports the Bill’s general principles.

      #EirePolitic #Oireachtas #DáilÉireann #IrishPolitics #Legislation
    bills:
      - key: tenants_deposits
        formal_title: Protection of Tenants' Deposits Bill 2025
        bill_number: 4/2025
        origin_house: Dáil Éireann
        introduction_date: 13 February 2025
        sponsors: Paul Murphy · Richard Boyd Barrett · Ruth Coppinger
        bill_type: Private Member’s Bill
        what: "Would bring the 2015 statutory tenant-deposit protection provisions into force, requiring the existing Residential Tenancies Board deposit-protection framework to be commenced within 90 days of enactment."
        effect: "If enacted, the deposit-protection provisions would move tenancy deposits into the statutory RTB scheme rather than leaving the 2015 framework uncommenced, with regulations governing how the scheme operates."
        why: "The sponsors’ explanatory memorandum says the aim is to protect tenants’ deposits. At First Stage, Deputy Paul Murphy argued that deposit retention causes serious hardship and that the existing 2015 deposit-protection provisions should finally be commenced."
        where: "Official Oireachtas records list the Bill at First Stage in Dáil Éireann. Its First Stage motion was agreed without opposition; substantive debate on the Bill’s general principles would normally occur at Second Stage."
        sources:
          - https://data.oireachtas.ie/ie/oireachtas/bill/2025/4/eng/initiated/b0425d.pdf
          - https://data.oireachtas.ie/ie/oireachtas/bill/2025/4/eng/memo/b0425d-memo.pdf
          - https://www.oireachtas.ie/en/debates/debate/dail/2025-02-13/35/
      - key: energy_poverty
        formal_title: Energy Poverty Reduction (Use of Surplus Renewable Energy) Bill 2025
        bill_number: 6/2025
        origin_house: Dáil Éireann
        introduction_date: 20 February 2025
        sponsors: Paul McAuliffe
        bill_type: Private Member’s Bill
        what: "Would require the Minister responsible for energy policy to publish, within six months of enactment, a strategy for using surplus renewable energy to reduce energy poverty, including implementation plans and time-bound targets."
        effect: "If enacted, the State would have to create a formal strategy for directing surplus renewable energy toward energy-poverty measures and set measurable targets for increasing how much surplus renewable energy is used for that purpose."
        why: "The explanatory memorandum says the Bill aims to use otherwise-curtailed or unused renewable energy to benefit households experiencing energy poverty. The sponsor linked that goal to managing surplus renewable generation."
        where: "Official Oireachtas records list the Bill at First Stage in Dáil Éireann. Its First Stage motion was agreed without opposition; the main debate on its general principles would normally come at Second Stage."
        sources:
          - https://data.oireachtas.ie/ie/oireachtas/bill/2025/6/eng/initiated/b0625d.pdf
          - https://data.oireachtas.ie/ie/oireachtas/bill/2025/6/eng/memo/b0625d-memo.pdf
          - https://www.oireachtas.ie/en/debates/debate/dail/2025-02-20/31/
      - key: trespass_land
        formal_title: Criminal Justice (Trespass on Land) Bill 2025
        bill_number: 55/2025
        origin_house: Dáil Éireann
        introduction_date: 24 September 2025
        sponsors: Carol Nolan
        bill_type: Private Member’s Bill
        what: "Would amend section 13 of the Criminal Justice (Public Order) Act 1994 so that the existing fear-causing trespass offence applies to trespass on any land, rather than being confined to a building and its curtilage."
        effect: "If enacted, the offence would cover relevant trespass on farm, agricultural and other land where the conduct causes, or is likely to cause, fear in another person. The Bill does not create a general offence for every unauthorised entry onto land."
        why: "The sponsor’s explanatory memorandum cites reports of trespass affecting farmers and rural communities, including lurching and unauthorised use of quads, scramblers and motorcycles on agricultural or community land."
        where: "Official Oireachtas records list the Bill at First Stage in Dáil Éireann. First Stage formally introduces the proposal; substantive consideration of its general principles would normally take place at Second Stage."
        sources:
          - https://data.oireachtas.ie/ie/oireachtas/bill/2025/55/eng/initiated/b5525d.pdf
          - https://data.oireachtas.ie/ie/oireachtas/bill/2025/55/eng/memo/b5525d-memo.pdf
          - https://data.oireachtas.ie/ie/oireachtas/debateRecord/dail/2025-09-24/debate/mul@/main.pdf

