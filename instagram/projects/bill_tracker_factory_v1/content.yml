  post2:
    edition_label: POST 2
    cover_intro: "These are the Bills that have been passed so far this session. These are the next three of six that we’re going to look at."
    caption_draft: |
      Bills of the Current Session — Enacted · Post 2.

      This carousel looks at three more Bills enacted during the current parliamentary session: Housing and Residential Tenancies, Pharmacy Contraception and Regulation of Artificial Intelligence.

      The Pharmacy Contraception Bill passed its Dáil stage without a recorded member-by-member division in the official vote data, so there is no party tally to display. The carousel explains how a question can be put and carried without a formal recorded division.

      Sources: Houses of the Oireachtas records, EirePolitic’s date-correct party-history reconstruction for recorded divisions, and relevant official departmental material.
    bills:
      - key: housing
        formal_title: Housing and Residential Tenancies (Miscellaneous Provisions) Bill 2026
        introduced_by: Government · Minister for Housing, Local Government and Heritage
        what: "Puts residency requirements for social-housing eligibility into legislation, creates a statutory appeals process for eligibility decisions, and also changes parts of residential-tenancy law."
        effect: "Local authorities get a clearer legal framework for deciding social-housing eligibility, and applicants get a formal route to challenge those decisions."
        backed: "Supporters said the Bill would create clearer and more consistent rules for social-housing eligibility across different local authorities."
        concerns_label: WHY SOME TDs RAISED CONCERNS
        concerns: "Critics said the interaction between housing, immigration and EU law was complex. They also warned that significant changes affecting vulnerable people needed closer scrutiny."
        vote_box_title: WHAT THE 8 JULY DÁIL VOTE MEANT
        vote_box_body: "The recorded division shown next was the concluding question during Report and Final Stages. It was carried by 80 votes to 67."
        result: "80 Tá · 67 Níl — carried"
        result_line: "The Bill completed its Dáil consideration and continued through the Seanad before enactment."
        vote:
          title: Housing & Tenancies · Party Split
          subtitle: Dáil Report and Final Stages · 8 July 2026
          date: 2026-07-08
          proposition: "Concluding question during Report and Final Stages"
          eligible: 174
          ta: 80
          nil: 67
          abstain: 0
          no_recorded_vote: 27
          context: "This was the recorded concluding question during Report and Final Stages; the motion carried."
          rows:
            - [Fianna Fáil, 48, 42, 0, 6]
            - [Sinn Féin, 39, 0, 38, 1]
            - [Fine Gael, 38, 32, 0, 6]
            - [Independent, 15, 6, 4, 5]
            - [Social Democrats, 12, 0, 10, 2]
            - [Labour, 11, 0, 9, 2]
            - [Independent Ireland, 4, 0, 2, 2]
            - [PBP-S, 3, 0, 1, 2]
          smaller_groups: "Aontú 0/2/0 · Green 0/1/0 · 100% Redress 0/0/1"
      - key: pharmacy
        formal_title: Health (Provision of Contraception Prescribing Service in Retail Pharmacy Businesses) Bill 2026
        introduced_by: Government · Minister for Health
        what: "Creates the legal basis for a community-pharmacy contraception service, including pharmacist repeat prescribing for specified contraception after an initial GP prescription."
        effect: "Eligible people could be able to renew certain contraception through trained pharmacists instead of always returning to a GP for every repeat prescription."
        backed: "Supporters said the Bill could make access quicker, easier and more convenient while expanding the role community pharmacies can play in routine care."
        concerns_label: WHY SOME TDs RAISED CONCERNS
        concerns: "Questions focused mainly on implementation: pharmacist training, clinical guidance, record-sharing, patient safety and how the service would work in practice."
        vote_box_title: WHY THERE IS NO PARTY BREAKDOWN
        vote_box_body: "The Bill completed its parliamentary stages and became law, but the official Oireachtas vote data contains no recorded member-by-member division linked to this Bill."
        result: "No recorded division"
        result_line: "Because there is no recorded division, there is no reliable Tá / Níl party split to display."
        procedure:
          title: Pharmacy Contraception · How This Passed
          subtitle: PASSED WITHOUT A RECORDED DIVISION
          steps:
            - {title: "1 · QUESTION PUT", body: "The Chair puts the question to the House. Members respond Tá or Níl aloud."}
            - {title: "2 · RESULT DECLARED", body: "The Chair judges the response and declares which side has carried the question."}
            - {title: "3 · DIVISION IF REQUIRED", body: "If the result is challenged and a formal division is taken, individual members’ votes are recorded. That is what produces the party tally used on our other slides."}
          result_title: WHAT HAPPENED HERE
          result_body: "This Bill passed its Dáil stage without a recorded division. The decision stood, but no member-by-member Tá / Níl tally was produced, so there is no party breakdown to show."
      - key: ai
        formal_title: Regulation of Artificial Intelligence Bill 2026
        introduced_by: Government · Minister for Enterprise, Tourism and Employment
        what: "Builds Ireland’s domestic enforcement system for the EU AI Act, including an AI Office of Ireland and powers for regulators to supervise, investigate and enforce the EU rules."
        effect: "AI providers and users in Ireland face national oversight and enforcement mechanisms under the EU framework, with a central office coordinating implementation."
        backed: "Supporters said Ireland needed the national infrastructure required to make the EU AI Act work in practice before key EU obligations took effect."
        concerns_label: WHY SOME TDs RAISED CONCERNS
        concerns: "Critics questioned the AI Office’s independence and resourcing, how regulators would coordinate, and whether protections around rights, privacy, children and work were strong enough."
        vote_box_title: WHAT THE 30 JUNE DÁIL VOTE MEANT
        vote_box_body: "The recorded division shown next was the concluding question during Committee and Remaining Stages. It was carried by 81 votes to 58."
        result: "81 Tá · 58 Níl — carried"
        result_line: "The Bill completed its Dáil consideration and continued through the Seanad before enactment."
        vote:
          title: AI Regulation · Party Split
          subtitle: Dáil Committee and Remaining Stages · 30 June 2026
          date: 2026-06-30
          proposition: "Concluding question during Committee and Remaining Stages"
          eligible: 174
          ta: 81
