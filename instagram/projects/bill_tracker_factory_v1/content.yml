edition:
  id: current-session-enacted-part-1
  cover_title: Bills of the Current Session
  cover_headline: Enacted · Part 1
  cover_subtitle: Six enacted Bills from the current parliamentary session, each explained in one page: what it does, who introduced it, and the main debate around it.
  source_footer: Houses of the Oireachtas + official departmental material

bills:
  - display_title: Strategic Gas Reserve
    formal_title: Development (Strategic Gas Reserve) Bill 2026
    status_line: Enacted • July 2026
    introduced_by: Minister for Climate, Energy and the Environment
    what_it_does: Creates a project-specific approval process for a State-led strategic gas emergency reserve at Cahiracon, Co. Clare, intended as emergency backup if Ireland's normal gas supply is seriously disrupted.
    case_label: CASE MADE FOR IT
    case_for: The Government argued Ireland needs emergency gas storage to protect security of supply during the transition to renewable energy.
    concern_label: CONCERNS RAISED
    concerns: Deputies questioned the bespoke planning route and sought stronger guarantees on emergency-only use, public control, climate safeguards and cost.
    record: 67 certified linked transcript interventions • 3 linked divisions
    source: Houses of the Oireachtas + Department of Climate, Energy and the Environment

  - display_title: Israeli Settlement Goods Ban
    formal_title: Israeli Settlements in the Occupied Palestinian Territory (Prohibition of Importation of Goods) Bill 2026
    status_line: Enacted • July 2026
    introduced_by: Minister for Foreign Affairs and Trade
    what_it_does: Prohibits importing goods into Ireland that originate in Israeli settlements in the occupied Palestinian territory. Importing those goods becomes an offence under the Customs Act 2015.
    case_label: CASE MADE FOR IT
    case_for: The Government framed the measure as part of Ireland's response to international-law obligations identified by the International Court of Justice.
    concern_label: SCOPE DEBATE
    concerns: A major question was whether the legislation should also cover services. The enacted Bill concerns goods; extending the measure to services raised additional legal issues.
    record: 97 certified linked transcript interventions • 1 linked division
    source: Houses of the Oireachtas + Department of Foreign Affairs and Trade

  - display_title: Criminal, Civil & Defence Changes
    formal_title: Criminal Law, Civil Law and Defence (Miscellaneous Provisions) Bill 2026
    status_line: Enacted • July 2026
    introduced_by: Minister for Justice, Home Affairs and Migration
    what_it_does: Makes changes across criminal law, courts, civil law and Defence, including community sanctions, criminal evidence, court administration, international cooperation and Defence Forces powers.
    case_label: CASE MADE FOR IT
    case_for: The Minister argued the Bill allowed a large number of needed legal changes to be progressed together and addressed practical gaps across several areas of law.
    concern_label: CONCERNS RAISED
    concerns: Senators and Deputies questioned the breadth and speed of the Bill, particularly significant Defence provisions and whether all parts received enough specialist scrutiny.
    record: 192 certified linked transcript interventions • 3 linked divisions
    source: Houses of the Oireachtas

  - display_title: Housing & Tenancies
    formal_title: Housing and Residential Tenancies (Miscellaneous Provisions) Bill 2026
    status_line: Enacted • July 2026
    introduced_by: Minister for Housing, Local Government and Heritage
    what_it_does: Puts residency requirements for social-housing eligibility into legislation, creates a statutory appeals process for eligibility decisions, and makes further changes to residential-tenancy law.
    case_label: CASE MADE FOR IT
    case_for: The Government said the changes would create clearer, more consistent rules for social-housing eligibility across local authorities.
    concern_label: CONCERNS RAISED
    concerns: Opposition members highlighted the complexity of housing, immigration and EU law and called for more scrutiny of significant amendments affecting housing and homelessness rules.
    record: 108 certified linked transcript interventions • 3 linked divisions
    source: Houses of the Oireachtas + Department of Housing

  - display_title: Pharmacy Contraception
    formal_title: Health (Provision of Contraception Prescribing Service in Retail Pharmacy Businesses) Bill 2026
    status_line: Enacted • July 2026
    introduced_by: Minister for Health
    what_it_does: Provides the primary legal basis for a community-pharmacy contraception service, including repeat prescribing for specified contraception following an initial GP prescription.
    case_label: WHAT CHANGES
    case_for: The legislation creates the legal basis for pharmacists to take a larger role in contraception prescribing through community pharmacies.
    concern_label: IMPLEMENTATION
    concerns: Clinical protocols, professional guidance and pharmacist training are also required before the service operates in pharmacies.
    record: 31 certified linked transcript interventions • no certified linked division
    source: Houses of the Oireachtas + Department of Health + PSI

  - display_title: AI Regulation
    formal_title: Regulation of Artificial Intelligence Bill 2026
    status_line: Enacted • July 2026
    introduced_by: Minister for Enterprise, Tourism and Employment
    what_it_does: Builds Ireland's domestic enforcement system for the EU AI Act, including an independent AI Office of Ireland and powers for regulators to supervise and enforce the EU rules.
    case_label: CASE MADE FOR IT
    case_for: Ireland needed the national regulatory structure required to make the EU AI Act work in practice while giving businesses and regulators clearer rules.
    concern_label: CONCERNS RAISED
    concerns: Deputies questioned the AI Office's independence and resourcing, regulator coordination, and protections around fundamental rights, children, privacy and work.
    record: 75 certified linked transcript interventions • 2 linked divisions
    source: Houses of the Oireachtas + Department of Enterprise, Tourism and Employment

methodology:
  title: About This Bill Tracker
  entries:
    - term: What this edition covers
      body: Six enacted Bills from the current parliamentary session. Each Bill gets one overview slide; detailed Bill posts can follow separately.
    - term: Bill status and stages
      body: Status, stage and House come from Oireachtas Bill records. The recurring tracker will compare snapshots so later editions can focus on Bills that are new, changed stage or became enacted.
    - term: Debate summaries
      body: Debate points are summarised only where the certified Bill-to-section relationship supports the relevant transcript context. A person speaking in a debate is not automatically treated as a supporter or opponent.
    - term: Recorded votes
      body: A Bill-linked division may concern an amendment or procedural proposition. Tá and Níl totals are described as support or opposition to the Bill only when the exact proposition supports that interpretation.
    - term: Sources
      body: Houses of the Oireachtas records, EirePolitic deterministic Bill links and relevant official departmental material. No classifier call is required for the tracker mechanics.
