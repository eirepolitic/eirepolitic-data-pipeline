            - [PBP-S, 3, 0, 3, 0]
          smaller_groups: "Aontú 0/0/2 · Green 0/1/0 · 100% Redress 0/1/0"
      - key: settlements
        formal_title: Israeli Settlements in the Occupied Palestinian Territory (Prohibition of Importation of Goods) Bill 2026
        introduced_by: Government · Minister for Foreign Affairs and Trade
        what: "Makes it unlawful to import goods into Ireland that originate in Israeli settlements in the occupied Palestinian territory. Those imports become enforceable under customs law."
        effect: "Businesses could not lawfully import those goods into Ireland. The enacted Bill is about goods only and does not extend the ban to services."
        backed: "Supporters said Ireland should not trade in goods from settlements they view as illegal and that the State should reflect international-law obligations in domestic law."
        concerns_label: WHY SOME TDs RAISED CONCERNS
        concerns: "A major debate was whether the Bill should also cover services. Others raised questions about trade law, enforceability and whether Ireland acting alone could face legal complications."
        vote_box_title: WHAT THE KEY DÁIL AMENDMENT VOTE MEANT
        vote_box_body: "The recorded vote shown next was on adding certain settlement-related services to the Bill. It was not a final yes-or-no vote on the whole Bill."
        result: "67 Tá · 79 Níl — amendment lost"
        result_line: "The proposal to add services did not pass, so the Bill continued in goods-only form."
        vote:
          title: Settlement Goods Ban · Party Split
          subtitle: Services amendment · 7 July 2026
          date: 2026-07-07
          proposition: "Services amendment"
          eligible: 174
          ta: 67
          nil: 79
          abstain: 0
          no_recorded_vote: 28
          context: "This division was on the services amendment, not final passage of the Bill. Tá = add the services provision; Níl = reject that amendment."
          rows:
            - [Fianna Fáil, 48, 0, 41, 7]
            - [Sinn Féin, 39, 37, 0, 2]
            - [Fine Gael, 38, 0, 32, 6]
            - [Independent, 15, 3, 6, 6]
            - [Social Democrats, 12, 11, 0, 1]
            - [Labour, 11, 9, 0, 2]
            - [Independent Ireland, 4, 2, 0, 2]
            - [PBP-S, 3, 2, 0, 1]
          smaller_groups: "Aontú 2/0/0 · Green 1/0/0 · 100% Redress 0/0/1"
      - key: criminal
        formal_title: Criminal Law, Civil Law and Defence (Miscellaneous Provisions) Bill 2026
        introduced_by: Government · Minister for Justice, Home Affairs and Migration
        what: "Bundles a wide range of legal changes into one Bill across criminal law, civil law, court procedure and Defence, including practical changes to evidence, administration and powers."
        effect: "Instead of changing these areas through many separate Bills, the legislation updates several parts of the justice and defence system together in one package."
        backed: "Supporters argued that a large number of practical legal fixes were needed and that progressing them together would address gaps more quickly."
        concerns_label: WHY SOME TDs RAISED CONCERNS
        concerns: "Critics said the Bill was too broad and moved too quickly. They questioned whether significant Defence and justice provisions got enough detailed scrutiny."
        vote_box_title: WHAT THE 10 JUNE DÁIL VOTE MEANT
        vote_box_body: "The recorded division shown next was the concluding question during Report and Final Stages. The Dáil’s agreed business arrangements provided for those stages to finish by one question from the Chair."
        result: "102 Tá · 45 Níl — carried"
        result_line: "The Bill completed its Dáil consideration and was sent to the Seanad."
        vote:
          title: Criminal, Civil & Defence · Party Split
          subtitle: Dáil Report and Final Stages · 10 June 2026
          date: 2026-06-10
