series:
  title_top: BILLS OF THE
  title_main: CURRENT SESSION
  status: ENACTED
  source_footer: Houses of the Oireachtas + relevant official departmental material
  glossary:
    process_subtitle: HOW A BILL MOVES THROUGH PARLIAMENT
    process_highlight: ENACTED
    process_steps:
      - {number: 1, label: FIRST}
      - {number: 2, label: SECOND}
      - {number: 3, label: COMMITTEE}
      - {number: 4, label: REPORT}
      - {number: 5, label: FINAL}
      - {number: 6, label: OTHER HOUSE}
      - {number: 7, label: PRESIDENT}
      - {number: 8, label: ENACTED}
    process_copy: "A Government Bill normally moves through stages in one House, then through the other House. Once both Houses agree the text and the President signs it, the Bill becomes law."
    terms:
      - {term: BILL, body: "A proposed law."}
      - {term: DÁIL ÉIREANN, body: "Ireland’s directly elected house; members are TDs."}
      - {term: SEANAD ÉIREANN, body: "Ireland’s second parliamentary chamber; members are Senators."}
      - {term: STAGE, body: "A formal step in considering, amending or approving a Bill."}
      - {term: ENACTED, body: "The Bill has completed the required process and become law."}
    vote_terms:
      - {term: TÁ / NÍL, body: "Tá means Yes. Níl means No. What “Yes” or “No” means depends on the exact proposition being voted on."}
      - {term: DIVISION, body: "A recorded vote where individual members’ votes are listed."}
      - {term: AMENDMENT, body: "A proposed change. A Tá on an amendment supports that change. It does not automatically mean support for the whole Bill."}
      - {term: NO RECORDED VOTE, body: "No vote is recorded for that TD in the division data. It does not automatically mean the TD was absent."}
    vote_rule: "We describe the exact proposition shown. Speaking about a Bill does not equal supporting it, and a linked vote may be about an amendment or procedure rather than the Bill itself."

posts:
  post1:
    edition_label: POST 1
    cover_intro: "These are the Bills that have been passed so far this session. These are the first three of six that we’re going to look at."
    caption_draft: |
      Bills of the Current Session — Enacted · Post 1.

      This carousel looks at three Bills enacted during the current parliamentary session: the Strategic Gas Reserve Bill, the Israeli Settlements goods Bill and the Criminal Law, Civil Law and Defence Bill.

      Where a recorded Dáil division is shown, the chart describes that exact proposition. In particular, the Israeli Settlements vote shown here was on a services amendment, not a final vote on the whole Bill.

      Sources: Houses of the Oireachtas records, EirePolitic’s date-correct party-history reconstruction for recorded divisions, and relevant official departmental material.
    bills:
      - key: gas
        formal_title: Development (Strategic Gas Reserve) Bill 2026
        introduced_by: Government · Minister for Climate, Energy and the Environment
        what: "Sets up a special legal route for approving a strategic gas reserve at Cahiracon, Co. Clare. It replaces the normal planning route for this project, but environmental assessments still apply."
        effect: "The Minister could decide the project directly under a faster process. The reserve is intended for emergencies if Ireland’s normal gas supplies are seriously disrupted."
        backed: "Supporters said Ireland relies heavily on imported gas and needs a back-up supply if imports are seriously disrupted. They described it as an energy-security measure while Ireland moves toward renewables."
        concerns_label: WHY SOME TDs OPPOSED IT
        concerns: "Critics said the project could prolong reliance on fossil fuels. They also objected to the special planning route, faster timetable and limited time for scrutiny."
        vote_box_title: WHAT THE 30 JUNE DÁIL VOTE MEANT
        vote_box_body: "TDs were voting on one combined question that completed the Bill’s remaining Dáil steps and passed it. A Tá meant pass the Bill and send it on. A Níl meant reject that passage motion."
        result: "90 Tá · 57 Níl — carried"
        result_line: "The Bill passed the Dáil and moved to the Seanad, Ireland’s second parliamentary chamber."
        vote:
          title: Strategic Gas Reserve · Party Split
          subtitle: Dáil passage vote · 30 June 2026
          date: 2026-06-30
          proposition: "Remaining sections and Title agreed; Fourth Stage completed; Bill passed"
          official_division_url: https://data.oireachtas.ie/ie/oireachtas/division/house/dail/34/2026-06-30/vote_162
          eligible: 174
          ta: 90
          nil: 57
          abstain: 0
          no_recorded_vote: 27
          context: "This was the combined final Dáil question completing the Bill’s remaining Dáil stages."
          rows:
            - [Fianna Fáil, 48, 42, 0, 6]
            - [Sinn Féin, 39, 0, 31, 8]
            - [Fine Gael, 38, 35, 0, 3]
            - [Independent, 15, 10, 2, 3]
            - [Social Democrats, 12, 0, 12, 0]
            - [Labour, 11, 0, 7, 4]
