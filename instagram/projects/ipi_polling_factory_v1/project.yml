project_id: ipi_polling_factory_v1
adapter_module: instagram.projects.ipi_polling_factory_v1.adapter
period:
  default: latest
source:
  polls_csv: s3://eirepolitic-data/processed/polling/irish_polling_indicator/latest/csv/polls.csv
  source_id: irish_polling_indicator
  source_label: Irish Polling Indicator (IPI) raw polls
  source_url: https://github.com/Irish-Polling-Indicator/ipi-data
render:
  outer_layout: instagram/templates/layouts/title_text_media_v1.json
  palette:
    background: '#0f2f24'
    text: '#f4ead7'
    muted: '#c8bda8'
    accent: '#d8b45f'
    grid: '#f4ead7'
  trend_colors:
    - '#d8b45f'
    - '#f4ead7'
    - '#79b8a4'
    - '#df8a72'
    - '#91a8d0'
  max_items: 8
  trend_party_limit: 5
  target_comparison_days: 30
  minimum_comparison_days: 28
  maximum_comparison_days: 45
  trend_window_days: 183
  trend_legend_variant: single_row
slides:
  definitions:
    - id: latest_support
      title: Latest Polling Percentages
      renderer: horizontal_bar
    - id: change_since_previous_poll
      title: Who's Up and Who's Down?
      renderer: diverging_bar
    - id: recent_trend
      title: Six Months of Polling
      renderer: line_trend
    - id: methodology
      title: About This Polling
      renderer: glossary_methodology
output:
  local_root: instagram/production/output/ipi_polling_factory_v1
publication:
  enabled: false
qa:
  expected_slide_count: 4
  expected_dimensions: [1080, 1350]
  require_source_footer: true
