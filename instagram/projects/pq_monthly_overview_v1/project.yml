project_id: pq_monthly_overview_v1
version: 1
status: prototype
purpose: >
  Monthly Questions Overview recurring Instagram post — a high-level picture of
  Dáil Parliamentary Questions asked and answered in the previous month. Warren
  picked the visual direction for the "Most questions submitted" slide on
  2026-09-22 (colored bars by party with a 3-column/2-row legend, chart enlarged
  into the freed space — horizontal_bar_grouped renderer) and asked to proceed to
  the remaining six slides in the agreed content spec
  (director/workflows_v1.md §6.1, session
  director/sessions/2026-09-21-monthly-questions-overview/). "Fewest questions
  submitted" now excludes office-holders (silver_member_offices) and lists every
  TD who asked no questions by name when that's under 25% of the eligible pool,
  per Warren's 2026-09-22 instructions. This build renders the full seven-slide
  carousel: headline, top_askers, fewest_askers, party_per_td, departments,
  answers, methodology. Still pending human review and final approval
  (workflows_v1.md §6.1 step 6) before this graduates past prototype status.
adapter_module: instagram.projects.pq_monthly_overview_v1.adapter

period:
  cadence: monthly
  mode: completed_calendar_month
  default: last_completed_month

source:
  provider: oireachtas_unified
  pointer: processed/oireachtas_unified/pointers/production.json
  require_immutable_batch: true
  required_tables:
    - silver_questions
    - silver_member_memberships
    - silver_member_parties
    - silver_member_constituencies
    - silver_members
    - silver_member_offices
  # written_question_answer_sections / written_question_answer_bridge are loaded
  # separately by the adapter, outside this hard-required list: they're a
  # contract-approved but separately-published dataset, and whether they've been
  # carried into the current production batch isn't guaranteed the way the core
  # silver_* tables are (director/data_products.yml known_drift_fact). A gap
  # there degrades the "answers" slide to a placeholder rather than failing the
  # whole render — see adapter.py's answer_tables_available handling.
  require_batch_status: validated

metrics:
  adapter: pq_monthly_overview_v1_top_askers
  max_items: 10
  denominator: none_this_slide_is_a_simple_ranking

slides:
  expected_count: 7
  definitions:
    - id: headline
      title: "Parliamentary Questions: <Month YYYY>"
      kind: text
      content: total questions, written/oral split, TDs asking, sitting days, change vs previous month
    - id: top_askers
      title: Most questions submitted
      kind: chart
      value_format: integer
      variant: colored_bars_with_legend_option_b
    - id: fewest_askers
      title: Fewest questions submitted
      kind: chart_or_text
      value_format: integer
      content: >-
        non-office-holder eligible TDs seated the full period (office-holders
        excluded via silver_member_offices; party leaders are not excluded —
        not tracked anywhere in the pipeline, see methodology). If under 25%
        of that pool asked zero questions, lists all of them by name as a
        text slide; otherwise a bottom-10-by-count chart.
    - id: party_per_td
      title: Questions per TD by party
      kind: chart
      value_format: decimal_2
      content: questions per TD by party, using the period-end TD roster as the denominator
    - id: departments
      title: Departments asked most
      kind: chart
      value_format: integer
      content: top departments/ministers by recorded question count
    - id: answers
      title: What happened to the answers
      kind: chart
      value_format: integer
      content: written questions by answer_status (reply received / not received / unresolved), from written_question_answer_bridge + written_question_answer_sections
    - id: methodology
      title: Methodology and sources
      kind: text
      content: sources, batch id, definitions, caveats

render:
  width: 1080
  height: 1350
  analytical_renderer: instagram.visuals.renderers.horizontal_bar
  analytical_renderer_grouped: instagram.visuals.renderers.horizontal_bar_grouped
  outer_layout: instagram/templates/layouts/title_text_media_v1.json
  text_layout: instagram/templates/layouts/text_block_v1.json
  min_visual_rows: 4
  palette:
    background: '#0f2f24'
    text: '#f4ead7'
    muted: '#c8bda8'
    accent: '#d8b45f'
    grid: '#f4ead7'

qa:
  expected_slide_count: 7
  require_publication_disabled: true
  require_review_state: pending_human_review

output:
  local_root: instagram/production/output/pq_monthly_overview_v1
  s3_prefix: processed/instagram/pq_monthly_overview_v1
  zip_prefix: pq-monthly-overview-v1

review:
  state: pending_human_review
  generation_and_publication_separate: true

publication:
  enabled: false
