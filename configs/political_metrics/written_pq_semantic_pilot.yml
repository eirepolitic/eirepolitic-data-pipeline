pilot_version: 2
purpose: Research-only first-pass semantic routing for Written Parliamentary Questions and official answers.
model_call_unit: answer_section
principles:
  - Known source metadata such as TD, department, date, party and answer status are not model-generated tags.
  - Classify each question text and the answer text separately.
  - Derive the combined exchange topic view deterministically as the union of question and answer tags.
  - Topic classification is multi-label.
  - The model selects leaf-level topic tags only; broad categories are derived deterministically from the taxonomy hierarchy.
  - Use only approved tags in `topic_tags`; genuinely missing concepts go to `proposed_new_tags`.
  - Do not infer support/opposition, truthfulness, effectiveness, evasiveness or political quality unless explicitly stated and separately researched.
  - Every semantic output should be grounded in the supplied text for that scope.
  - Grouped answer sections are classified once, with separate classifications returned for each linked question.

