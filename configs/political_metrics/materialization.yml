contract_version: 1
batch_root: processed/oireachtas_unified/batches

principles:
  - metric outputs belong to the same immutable Oireachtas batch as their canonical source data
  - daily foundations contain additive components, not presentation wording
  - completed-month results contain validated metric values and their calculation components
  - arbitrary date ranges are recalculated from foundations rather than summed from percentages or ranks
  - promotion must never mix a metric output with a different source_batch_id
  - parliamentary question records are distinct from transcript speech interventions
  - oral parliamentary questions may anchor debate sections containing separate speech interventions
  - oral-question exchange participation describes observed transcript participation and does not imply question-taker attribution
  - certified legislation context is attached only at exact debate-section grain, never at whole-debate grain
  - broader speech context is deterministic, one-row-per-speech and retains other as an explicit fallback
  - division context is deterministic, one-row-per-division and must not change vote denominators

reliability_values:
  - reliable
  - caution
  - insufficient_for_comparison
  - not_applicable

public_use_values:
  - suitable
  - suitable_with_context
  - internal_only
  - not_certified

common_provenance_columns:
  - source_batch_id
  - calculated_at_utc
  - contract_version

foundation_datasets:
  daily_activity_components:
    description: Additive daily counts and exposure components used for speech, parliamentary-question submission and recorded-voting activity metrics.
    cadence: daily
    formats: [csv, parquet]
    primary_key: [activity_date, grain, entity_id, component_id]
    columns: [activity_date, grain, entity_id, component_id, component_value, source_batch_id, component_version, calculated_at_utc, contract_version]
    allowed_grains: [member, party, constituency, national]
    allowed_components: [speech_count, policy_speech_count, speaking_day_count, debate_day_count, member_debate_day_exposure, question_count, recorded_vote_count, eligible_member_division_count, division_count]

  daily_issue_activity:
    description: Additive daily issue counts by supported political grain.
    cadence: daily
    formats: [csv, parquet]
    primary_key: [activity_date, grain, entity_id, issue_label]
    columns: [activity_date, grain, entity_id, issue_label, issue_speech_count, policy_speech_count, source_batch_id, component_version, calculated_at_utc, contract_version]
    allowed_grains: [member, party, constituency, national]

  division_party_vote_components:
    description: Division-level party vote distributions required to recompute party voting unity for arbitrary periods.
    cadence: event
    formats: [csv, parquet]
    primary_key: [division_id, party_uri, vote_code]
    columns: [division_id, division_date, party_uri, vote_code, recorded_vote_count, source_batch_id, component_version, calculated_at_utc, contract_version]
    allowed_vote_codes: [ta, nil, staon]

  daily_question_dimensions:
    description: Additive daily parliamentary-question submission counts by Oireachtas question type and recorded recipient. These count question records, not speech interventions in oral-question exchanges.
    cadence: daily
    formats: [csv, parquet]
    primary_key: [activity_date, grain, entity_id, dimension_name, dimension_value]
    columns: [activity_date, grain, entity_id, dimension_name, dimension_value, question_count, source_batch_id, component_version, calculated_at_utc, contract_version]
    allowed_grains: [member, party, constituency, national]
    allowed_dimension_names: [question_type, question_recipient]

  oral_question_sections:
    description: One deterministic record per debate section anchored by one or more Oireachtas oral parliamentary-question records, including exchange participation and transcript-volume components.
    cadence: event
    formats: [csv, parquet]
    primary_key: [debate_section_id]
    columns: [debate_section_id, debate_date, section_heading, oral_question_count, question_ids_json, asking_member_count, participating_submitting_member_count, participating_submitter_share, ordinary_non_submitter_td_count, grouped_exchange, related_speech_count, related_speaker_count, related_speech_word_count, ministerial_intervention_count, ministerial_word_count, ministerial_word_share, chair_intervention_count, chair_word_count, ordinary_member_intervention_count, ordinary_member_word_count, collective_or_unidentified_intervention_count, collective_or_unidentified_word_count, source_batch_id, component_version, calculated_at_utc, contract_version]

  oral_question_exchange_participants:
    description: Deterministic observed participation inside oral-question exchanges at exchange + participant + role grain. This does not assert who formally took a submitted question.
    cadence: event
    formats: [csv, parquet]
    primary_key: [debate_section_id, participant_key, participant_role]
    columns: [debate_section_id, debate_date, participant_key, member_code, speaker_name, participant_role, is_recorded_submitter, intervention_count, word_count, source_batch_id, component_version, calculated_at_utc, contract_version]
    allowed_participant_roles: [ministerial, chair, ordinary_member, collective_or_unidentified]

  speech_question_context:
    description: Deterministic speech-level relationship showing whether each transcript intervention belongs to a debate section anchored by one or more oral parliamentary questions.
    cadence: event
    formats: [csv, parquet]
    primary_key: [speech_id]
    columns: [speech_id, debate_date, debate_section_id, speech_context, is_oral_question_related, oral_question_count_in_section, related_question_ids_json, source_batch_id, component_version, calculated_at_utc, contract_version]
    allowed_speech_context_values: [oral_question_exchange, other]

  bill_debate_sections:
    description: Certified deterministic Bill-to-debate-section bridge. One row per Bill and canonical debate section; debate-wide co-occurrence, conflicting source records and multi-Bill section anomalies are excluded.
    cadence: event
    formats: [csv, parquet]
    primary_key: [bill_id, debate_section_id]
    columns: [bill_id, debate_section_id, debate_id, debate_date, source_section_eid, debate_show_as, evidence_method, source_bill_debate_count, source_bill_debate_ids_json, certification_version, source_batch_id, calculated_at_utc, contract_version]

  speech_context:
    description: One deterministic top-level parliamentary context per source speech using explicit precedence across certified question, legislation and source-heading rules, with other as the fallback.
    cadence: event
    formats: [csv, parquet]
    primary_key: [speech_id]
    columns: [speech_id, debate_date, debate_section_id, speech_context, evidence_method, linked_entity_type, linked_entity_id, context_version, source_batch_id, calculated_at_utc, contract_version]
    allowed_speech_context_values: [oral_question_exchange, bill_or_legislation, leaders_questions, statements, procedural_business, motion_proceeding, other]

  division_context:
    description: One deterministic parliamentary context per source division, derived from certified Bill relationships and section-level speech context without multiplying vote rows.
    cadence: event
    formats: [csv, parquet]
    primary_key: [division_id]
    columns: [division_id, division_date, debate_section_id, division_context, evidence_method, linked_entity_type, linked_entity_id, context_version, source_batch_id, calculated_at_utc, contract_version]
    allowed_division_context_values: [bill_or_legislation, motion_proceeding, procedural_business, other]

result_datasets:
  monthly_metric_results:
    description: Long-form completed-calendar-month metric results for dashboards, APIs, Appsmith, Power BI and other consumers.
    cadence: completed_month
    formats: [csv, parquet]
    primary_key: [metric_id, metric_version, period_start, period_end, grain, entity_id, dimension_name, dimension_value]
    columns: [metric_id, metric_version, period_type, period_start, period_end, grain, entity_id, entity_name, dimension_name, dimension_value, value, numerator, denominator, output_unit, reliability_status, public_use_status, warning_code, source_batch_id, calculated_at_utc, contract_version]
    period_type: calendar_month

storage:
  batch_key_template: processed/oireachtas_unified/batches/{batch_id}/metrics/{cadence}/{dataset}/{format}/{dataset}.{extension}
  entry_name_template: political_metrics_{dataset}
  monthly_results_are_rebuilt: true
  daily_foundations_are_rebuilt_from_batch_sources: true
