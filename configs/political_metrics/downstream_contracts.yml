question_semantics:
  parliamentary_question_record: A distinct Oireachtas question_id submitted by an eligible TD. Written and oral question records are both counted here.
  written_parliamentary_question: A question record with Oireachtas question_type Written. It does not imply a transcript speech exchange.
  oral_parliamentary_question: A question record with Oireachtas question_type Oral. Multiple oral question records can anchor the same debate_section_id.
  oral_question_section: One debate section linked to one or more oral parliamentary-question records. It is the container for the related transcript exchange.
  oral_question_related_speech: A normal silver_speeches transcript intervention whose debate_section_id is linked to at least one oral question record.
  oral_question_exchange_participant: An observed participant-role contribution inside an oral-question exchange. It does not assert who formally took a submitted question.
  participant_role_rule: A single identified member may have more than one participant role in one exchange, for example ordinary member and acting chair; preserve separate role rows.
  collective_speaker_rule: Collective or unidentified transcript speakers remain in exchange totals but are never counted as identified TD participants.
  counting_rule: Never multiply a section's speech interventions by the number of oral question records sharing that section.

legislation_semantics:
  bill_debate_section: A certified deterministic relationship between one Bill ID and one canonical debate section.
  certification_rule: The debate-scoped source section eid and unique exact source heading must identify the same canonical debate section; sections associated with multiple distinct Bills are excluded.
  output_grain: One row per bill_id and debate_section_id. Multiple raw Bill-debate source rows for the same pair are collapsed into provenance.
  speech_link_rule: A speech is Bill-linked only through exact debate_section_id membership in bill_debate_sections.
  division_link_rule: A division is Bill-linked only through exact debate_section_id membership in bill_debate_sections.
  debate_wide_rule: Never infer Bill context from shared debate_id, debate_uri or debate date alone.
  unresolved_rule: Conflicting, multi-Bill and currently uncovered Bill-debate rows are not emitted as certified links.

speech_context_semantics:
  output_grain: Exactly one row per source speech_id, including speeches classified as other.
  precedence: oral_question_exchange, then bill_or_legislation, then leaders_questions, then statements, then procedural_business, then motion_proceeding, then other.
  oral_question_exchange: Inherited exactly from the existing certified speech_question_context relationship.
  bill_or_legislation: Inherited only from exact debate_section_id membership in certified bill_debate_sections; linked_entity_id contains the Bill ID.
  leaders_questions: Assigned only from the certified exact Oireachtas Leaders' Questions heading allowlist.
  statements: Assigned only when the source heading ends in the certified Statements/Ráitis proceeding forms; this is a proceeding label, not semantic speech-text classification.
  procedural_business: Assigned only from the certified exact Order of Business, Questions on Promised Legislation and Business of Dáil heading allowlist.
  motion_proceeding: Assigned only from certified source heading forms ending in Motion/Motions variants; this describes parliamentary form, not one homogeneous substantive topic.
  other: Explicit fallback for any speech not covered by a certified deterministic rule. Do not fill other through semantic guessing.
  compatibility_rule: Keep speech_question_context as the dedicated Oral-question relationship; speech_context is additive and broader.
  overlap_rule: Future rule overlaps must be surfaced by audit and resolved by explicit precedence, never by incidental row ordering.

division_context_semantics:
  output_grain: Exactly one row per source division_id.
  bill_or_legislation: Assigned only from exact debate_section_id membership in certified bill_debate_sections; linked_entity_id contains the Bill ID.
  motion_proceeding: Projected only from a debate section with one certified non-other speech context of motion_proceeding.
  procedural_business: Projected only from a debate section with one certified non-other speech context of procedural_business.
  other: Explicit fallback for divisions not covered by the certified Bill, motion or procedural-business relationships.
  denominator_rule: division_context is a descriptive dimension only and must not change member participation or party-cohesion denominators.
  vote_join_rule: Join member votes to division_context by division_id only; the one-row-per-division grain must not multiply vote rows.
  bill_stage_rule: Do not infer Bill stage from Bill ID plus division date; stage attribution requires a separately certified relationship.
  motion_rule: motion_proceeding describes parliamentary form, not political importance, policy topic or effectiveness.

consumer_dataset: monthly_metric_results
consumer_rules:
  - resolve the logical key through the promoted Oireachtas production pointer; do not hard-code a batch ID
  - filter by metric_id and metric_version before interpreting value
  - filter by period_start and period_end; only completed calendar months are materialized
  - treat grain and entity_id as part of the result identity
  - for dimensional metrics also filter dimension_name and dimension_value
  - do not sum or average materialized proportions, percentage points, rates, or ranks across months
  - use numerator and denominator to recompute combined-period rates when needed
  - respect reliability_status, public_use_status, and warning_code before public display
  - never treat missing recorded votes as proof of attendance or absence
  - never replace historical party or constituency attribution with current affiliation
  - keep entity_id=dail and entity_id=eligible_tds as distinct national populations
  - interpret question_count as distinct submitted parliamentary-question records, not question-led debate sections or speech interventions
  - use oral_question_sections when the unit of analysis is the oral-question exchange rather than the submitted oral question record
  - use oral_question_exchange_participants for observed member/role participation, intervention counts and word counts inside an exchange
  - do not infer question-taker attribution from oral_question_exchange_participants
  - use speech_question_context to identify speech interventions occurring inside oral-question exchanges
  - use bill_debate_sections for certified Bill-to-section context; never infer Bill context from whole-debate co-occurrence
  - join speeches or divisions to bill_debate_sections only by exact debate_section_id
  - use speech_context for one deterministic top-level parliamentary context per speech; preserve other rather than guessing
  - interpret motion_proceeding as parliamentary form rather than political topic or importance
  - use division_context for one deterministic parliamentary context per division and join it to member votes by division_id only
  - keep existing participation and party-cohesion denominators unchanged when filtering or comparing by division context
  - do not infer Bill stage from division date coincidence

recommended_consumer_patterns:
  appsmith:
    default_format: csv
    use_for:
      - metric cards
      - public tables
      - simple filters by month, entity, issue, question type, recipient, speech context or division context
      - oral-question exchange drilldowns
      - oral-question participant drilldowns
      - certified Bill-section drilldowns
      - speech-context drilldowns
      - contextual division drilldowns
  power_bi:
    default_format: parquet
    use_for:
      - monthly trend models
      - party and constituency comparisons
      - issue dashboards
      - voting and question dashboards
      - oral-question section, participant and related-speech models
      - certified legislation-section, speech and division models
      - top-level speech-context models
      - division-context voting models
    modelling_note: build a metric dimension from metric_id/metric_version and do not infer additivity from numeric type
  api:
    default_format: parquet
    use_for:
      - precomputed completed-month endpoints
      - entity profiles
      - issue comparison endpoints
      - oral-question exchange endpoints
      - oral-question exchange participant endpoints
      - certified Bill-section endpoints
      - speech-context endpoints
      - division-context endpoints
    response_note: expose reliability/public-use metadata alongside value

primary_key:
  - metric_id
  - metric_version
  - period_start
  - period_end
  - grain
  - entity_id
  - dimension_name
  - dimension_value
